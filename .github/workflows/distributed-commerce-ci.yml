# CI for the commerce learning tree in Distributed/.
# Does not start Compose, kind, or the retention CronJob.
# Does not deploy a cluster or call the API. The load-scenario job only reads the scenario files.
# The failure-lab job only reads the lab scripts. It does not stop a service.
# The backup job only reads the backup scripts. It does not dump or restore a database.
# Does not use a secret, a private key, or a PEM.

name: Distributed commerce CI

on:
  pull_request:
    paths:
      - "Distributed/**"
      - ".github/workflows/distributed-commerce-ci.yml"
  push:
    branches:
      - main
    paths:
      - "Distributed/**"
      - ".github/workflows/distributed-commerce-ci.yml"

permissions:
  contents: read

concurrency:
  group: distributed-commerce-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            Distributed/services/order-service/pyproject.toml
            Distributed/services/reporting-service/pyproject.toml
            Distributed/services/odoo/pyproject.toml
      - name: Ruff check
        working-directory: Distributed
        run: |
          python -m pip install "ruff==0.16.10"
          ruff check services/order-service services/reporting-service services/odoo

  order-service:
    name: order-service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Distributed/services/order-service/pyproject.toml
      - name: Install
        working-directory: Distributed/services/order-service
        run: python -m pip install -e ".[dev]"
      - name: Test
        working-directory: Distributed/services/order-service
        run: python -m pytest

  reporting-service:
    name: reporting-service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Distributed/services/reporting-service/pyproject.toml
      - name: Install
        working-directory: Distributed/services/reporting-service
        run: python -m pip install -e ".[dev]"
      - name: Test
        working-directory: Distributed/services/reporting-service
        run: python -m pytest

  odoo:
    name: odoo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Distributed/services/odoo/pyproject.toml
      - name: Install
        working-directory: Distributed/services/odoo
        run: python -m pip install -e ".[dev]"
      - name: Test
        working-directory: Distributed/services/odoo
        run: python -m pytest

  gateway:
    name: gateway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Distributed/services/order-service/pyproject.toml
      - name: Install PyJWT
        run: python -m pip install "pyjwt[crypto]>=2.10"
      - name: Test
        working-directory: Distributed
        run: |
          python deploy/gateway/tests/test_public_routes.py
          python deploy/gateway/tests/test_jwt_check.py

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Distributed/services/frontend/package-lock.json
      - name: Install
        working-directory: Distributed/services/frontend
        run: npm ci
      - name: Test
        working-directory: Distributed/services/frontend
        run: npm test
      - name: Build
        working-directory: Distributed/services/frontend
        run: npm run build

  kind-manifests:
    name: kind-manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test manifests
        working-directory: Distributed
        run: python deploy/kind/test_manifests.py

  compose:
    name: compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Compose file
        working-directory: Distributed
        run: python deploy/compose/test_stack.py

  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            Distributed/services/order-service/pyproject.toml
            Distributed/services/reporting-service/pyproject.toml
            Distributed/services/odoo/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Distributed/services/frontend/package-lock.json
      - name: Audit Python runtime dependencies
        working-directory: Distributed
        run: |
          set -euo pipefail
          python -m pip install "pip-audit==2.10.1"
          pip-audit --progress-spinner off --strict --desc on services/order-service
          pip-audit --progress-spinner off --strict --desc on services/reporting-service
          pip-audit --progress-spinner off --strict --desc on services/odoo
      - name: Audit frontend production dependencies
        working-directory: Distributed/services/frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Audit frontend lockfile
        working-directory: Distributed/services/frontend
        run: |
          set -euo pipefail
          set +e
          npm audit --audit-level=high
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            echo "npm audit failed to run (exit ${status})"
            exit "$status"
          fi
          set +e
          npm audit --json > "${RUNNER_TEMP}/npm-audit.json"
          json_status=$?
          set -e
          if [ "$json_status" -gt 1 ]; then
            echo "npm audit --json failed to run (exit ${json_status})"
            exit "$json_status"
          fi
          python3 - "${RUNNER_TEMP}/npm-audit.json" package.json <<'PY'
          import json
          import sys
          from pathlib import Path

          report_path = Path(sys.argv[1])
          package_path = Path(sys.argv[2])
          try:
              report = json.loads(report_path.read_text(encoding="utf-8"))
          except json.JSONDecodeError:
              print("npm audit did not return JSON")
              sys.exit(1)
          package = json.loads(package_path.read_text(encoding="utf-8"))
          direct = set(package.get("dependencies") or {}) | set(package.get("devDependencies") or {})
          high = {"high", "critical"}
          failures = []
          recorded = []
          for name, info in sorted((report.get("vulnerabilities") or {}).items()):
              severity = str(info.get("severity") or "")
              if severity not in high:
                  continue
              own = []
              for via in info.get("via") or []:
                  if (
                      isinstance(via, dict)
                      and via.get("name") == name
                      and str(via.get("severity") or "") in high
                  ):
                      own.append(str(via.get("url") or via.get("title") or name))
              if name in direct and own:
                  failures.append(f"{name} ({severity}): {', '.join(own)}")
              elif name in direct:
                  recorded.append(
                      f"{name} is a direct dependency; npm marks it {severity} "
                      "because of another package, and its own advisory is not high or critical"
                  )
              else:
                  recorded.append(f"{name} ({severity}) is not a direct dependency")
          if recorded:
              print("Recorded high or critical findings outside a direct advisory:")
              for line in recorded:
                  print(f"  {line}")
          if failures:
              print("High or critical advisories on direct dependencies:")
              for line in failures:
                  print(f"  {line}")
              sys.exit(1)
          print("No high or critical advisory on a direct frontend dependency.")
          PY

  image-scan:
    name: image-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build order-service image
        working-directory: Distributed/services/order-service
        run: docker build --tag commerce/order-service:0.1.0 .
      - name: Scan order-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: commerce/order-service:0.1.0
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          version: v0.75.0

  load-scenario:
    name: load-scenario
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the load scenario
        working-directory: Distributed
        run: python deploy/load/test_scenario.py

  failure-lab:
    name: failure-lab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the failure lab
        working-directory: Distributed
        run: python deploy/failure-lab/test_lab.py

  backup:
    name: backup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check backup and restore scripts
        working-directory: Distributed
        run: python deploy/backup/test_backup.py
