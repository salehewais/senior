<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Software Engineering Master Roadmap — interactive learning site for senior software engineers."
    />
    <title>Software Engineering Master Roadmap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,650;8..60,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/themes.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />
    <style>
      .flash-target {
        animation: flashBg 1.2s ease;
      }
      @keyframes flashBg {
        0% {
          background: var(--accent-soft);
        }
        100% {
          background: transparent;
        }
      }
      .diagram-panel.expanded {
        box-shadow: var(--shadow-lg);
      }
    </style>
  </head>
  <body>
    <a class="sr-only" href="#content">Skip to content</a>

    <header class="site-header" role="banner">
      <button
        type="button"
        class="icon-btn menu-toggle"
        id="menu-toggle"
        aria-label="Open navigation"
        title="Menu"
      >
        ☰
      </button>
      <div class="header-brand">
        <h1 id="site-title">Software Engineering Master Roadmap</h1>
        <p class="subtitle" id="site-subtitle">
          A Structured Learning Path for Senior Software Engineers
        </p>
      </div>

      <div class="header-actions">
        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <label class="sr-only" for="global-search">Search roadmap</label>
          <input
            id="global-search"
            type="search"
            placeholder="Search topics &amp; patterns…"
            autocomplete="off"
            spellcheck="false"
          />
          <div
            id="search-results"
            class="search-results"
            role="listbox"
            aria-label="Search results"
          ></div>
        </div>

        <div class="progress-chip" title="Overall learning progress" aria-live="polite">
          <div class="bar" aria-hidden="true"><span id="progress-fill"></span></div>
          <span class="pct-label" id="progress-pct">0%</span>
        </div>

        <button
          type="button"
          class="icon-btn"
          id="study-toggle"
          aria-pressed="false"
          title="Study mode"
          aria-label="Toggle study mode"
        >
          ▤
        </button>
        <button type="button" class="icon-btn" id="theme-toggle" title="Toggle theme">☾</button>
      </div>
    </header>

    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="app-shell">
      <nav class="sidebar" id="sidebar" aria-label="Roadmap navigation">
        <div class="sidebar-filters" role="group" aria-label="Filter by completion">
          <button type="button" class="filter-chip active" data-filter="all">All</button>
          <button type="button" class="filter-chip" data-filter="not-started">Not started</button>
          <button type="button" class="filter-chip" data-filter="in-progress">In progress</button>
          <button type="button" class="filter-chip" data-filter="complete">Complete</button>
        </div>
        <ul class="nav-tree" id="nav-tree"></ul>
      </nav>

      <div class="main-area">
        <main class="content-wrap" id="main">
          <nav class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumb">
            <a href="#roadmap-overview">Home</a>
          </nav>
          <div id="content"></div>
        </main>

        <aside class="toc-panel" aria-label="On this page">
          <h3>On this page</h3>
          <ul class="toc-list" id="toc-list"></ul>
        </aside>
      </div>
    </div>

    <button type="button" class="back-to-top" id="back-to-top" title="Back to top" aria-label="Back to top">
      ↑
    </button>

    <!-- Content data (all original roadmap text) -->
    <script src="data/roadmap-content.js"></script>
    <script src="assets/js/progress.js"></script>
    <script src="assets/js/search.js"></script>
    <script src="assets/js/navigation.js"></script>
    <script src="assets/js/architecture-relationships.js"></script>
    <script src="assets/js/diagrams.js"></script>
    <script src="assets/js/app.js"></script>

    <!-- Mermaid CDN with graceful degradation (handled in diagrams.js) -->
    <script type="module">
      try {
        const { default: mermaid } = await import(
          "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs"
        );
        window.mermaid = mermaid;
        if (window.RoadmapDiagrams) {
          await window.RoadmapDiagrams.onMermaidReady();
        }
      } catch (err) {
        console.warn("Mermaid CDN unavailable:", err);
        document.querySelectorAll(".diagram-body").forEach((body) => {
          if (body.querySelector(".cdn-note")) return;
          const note = document.createElement("p");
          note.className = "cdn-note";
          note.textContent =
            "Mermaid.js could not be loaded from the CDN. Diagram source remains in the page; vendor Mermaid locally if offline.";
          body.appendChild(note);
        });
      }
    </script>
  </body>
</html>
