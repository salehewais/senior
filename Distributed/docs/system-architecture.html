ents are separate databases fed by events and commands. The handlers exist. The running saga worker does not observe Odoo’s success, so do not describe a live end-to-end ERP create as finished."}, "ar": {"title": "إسقاطات Django وOdoo", "lede": "Django يبني نماذج قراءة من الوسيط. Odoo ينشئ أمر بيع واحدًا من CreateErpOrder وينشر InventoryUpdated. عامل الـ Saga الحي لا يقود ذلك الإنشاء حتى الاكتمال.", "why": ["استعلام تقرير على order_db كان سيجلس على قاعدة إتمام الشراء. أمر بيع ERP يجب أن يعيش حيث يتفق المخزون والتسليم والفوترة أصلًا. هاتان قاعدتان أخريان."], "explain": ["نماذج reporting_db في projections/models.py: order_projections وorder_item_projections وproduct_projections وcustomer_projections وinventory_projections وpayment_projections وprocessed_events وprojection_versions. أمر المستهلك هو projections/management/commands/consume_events.py. مسارات التقرير هي GET /api/v1/reports/orders/summary و/orders و/inventory و/revenue.", "صف الإسقاط وprocessed_events يُثبَّتان معًا. event_id مكرر لا يضيف صفًا ثانيًا. إصدار كيان مفقود يستخدم مسار إعادة المحاولة.", "Odoo 18 Community هو services/odoo. الموصّل يسجّل OrderConfirmed ولا يدرج sale.order. CreateErpOrder ينشئ أمر بيع واحدًا لكل معرّف طلب تجاري. CancelErpOrder يلغيها. تغيّرات المخزون تخرج كـ InventoryUpdated على erp.events، عبر commerce_event_outbox. خدمة الطلبات تطبّق ذلك على inventory_snapshots. أزرار التنفيذ في الموصّل تنادي /api/v1/internal عبر HTTP."], "example": {"text": "دفتر المحل هو البيع. رسم على الحائط منسوخ من ملاحظات. حافظة المستودع هي عد المخزون. تحديث الرسم لا يغيّر الدفتر، وملاحظة تقول «مؤكد» لا تفتح وحدها عمل مستودع. تعليمة منفصلة تفعل.", "code": "", "caption": ""}, "how": ["التقارير تربط payment.* حتى يستطيع PaymentConfirmed وPaymentFailed الوصول إلى payment_projections. لا تربط commerce.commands. طابور الطلب المؤكد في Odoo بلا ربط لـ order.created. البحث عن الحجز بمعرّف طلب التجارة قبل الإدراج، فالأمر المكرر يبقي صفًا واحدًا.", "ما هو جزئي: معالجات الأوامر ومستهلك الإسقاط في الشجرة ولهما اختبارات. عامل الـ Saga المرفق لا يلاحظ رد Odoo الناجح، لذلك صف الـ Saga في مكدس شغّال لا ينتقل إلى ODOO_ORDER_CREATED بنفسه."], "files": [{"path": "docs/adr/ADR-002-why-django-for-reporting.md", "note": "لماذا ليست عروض SQL على order_db"}, {"path": "services/reporting-service/projections/models.py", "note": "نماذج القراءة"}, {"path": "services/reporting-service/projections/apply.py", "note": "التطبيق مع إزالة التكرار"}, {"path": "services/reporting-service/reporting/urls.py", "note": "HTTP التقارير"}, {"path": "services/odoo/src/commerce_erp/confirmed.py", "note": "تذكّر OrderConfirmed، ولا تنشئ أمر بيع"}, {"path": "services/odoo/src/commerce_erp/commands.py", "note": "CreateErpOrder وReserveInventory"}, {"path": "services/odoo/src/commerce_erp/fulfillment.py", "note": "معالم HTTP"}], "trace": [{"title": "النشر", "who": "ناشر outbox للطلبات", "what": "OrderCreated ثم OrderConfirmed يصلان إلى commerce.events.", "data": "q.reporting.projection، وللمؤكد فقط q.odoo.order-confirmed.", "fail": "إذا توقف الناشر، لا تتحرك أي قاعدة."}, {"title": "الإسقاط", "who": "reporting-consumer", "what": "أدرج أو حدّث الإسقاط وprocessed_events في معاملة reporting_db واحدة، ثم ack.", "data": "الإصدار على الإسقاط.", "fail": "إصدار سابق مفقود يعيد المحاولة، ثم قد يصبح رسالة ميتة."}, {"title": "تسجيل التأكيد", "who": "مستهلك Odoo", "what": "خزّن أن OrderConfirmed شُوهد. لا تدرج sale.order.", "data": "إزالة التكرار في odoo_db.", "fail": "وثيقة أقدم ما زالت تنشئ أمر بيع من هذا الحدث انحرفت عن confirmed.py."}, {"title": "الأمر", "who": "مستهلك أوامر Odoo", "what": "CreateErpOrder يدرج sale.order واحدًا. ReserveInventory يدرج حجزًا واحدًا.", "data": "مفتاح عدم التكرار ومعرّف الطلب.", "fail": "عامل الـ Saga في هذه الشجرة لا يتعلّم أن تلك الأوامر نجحت."}, {"title": "المخزون عائدًا", "who": "ناشر Odoo، ثم مستهلك المخزون", "what": "InventoryUpdated يُكتب في commerce_event_outbox ويُنشر على erp.events. خدمة الطلبات تخزّن inventory_snapshots.", "data": "q.order.inventory وأيضًا ربط التقارير.", "fail": "لقطة أقدم تُؤكَّد وتُتجاهل."}], "advantages": ["التقارير يمكن إعادة بناؤها من الأحداث.", "مخزون ERP يبقى داخل معاملة Odoo.", "OrderConfirmed يستطيع تحديث رسم من غير فتح أمر بيع ثانٍ."], "disadvantages": ["التقرير يتأخر.", "المنسّق الحي ومستهلك أوامر Odoo ليسا مغلقين في Saga مكتملة واحدة.", "التنفيذ قناة ثانية (HTTP)، ويسهل نسيانها عند رسم الوسيط فقط."], "alternatives": ["المزيد من FastAPI للتقارير، وعروض SQL على order_db، وClickHouse، وواجهة على order_db خسرت في ADR-002.", "إنشاء أمر البيع من OrderConfirmed كان العقد الأقدم. الـ Saga نقلت الإنشاء إلى CreateErpOrder."], "failures": [{"title": "إسقاط مكرر", "text": "إذا ثبّت المستهلك الإسقاط خارج processed_events، يتضاعف الإيراد. الاختبارات تتطلب صفًا واحدًا."}, {"title": "توقّف Odoo", "text": "التأكيد ما زال يُثبَّت. الأوامر تجلس على طوابير Odoo أو في outbox. عامل الـ Saga، حتى حين يكون Odoo شغّالًا، ما زال يرجع unknown."}], "tests": [{"path": "services/reporting-service/projections/tests/test_apply.py", "note": "التطبيق والتكرار"}, {"path": "services/reporting-service/projections/tests/test_consistency_lag.py", "note": "التأخر قبل OrderConfirmed وبعده"}, {"path": "services/odoo/tests/test_commands.py", "note": "حجز واحد وأمر بيع واحد"}, {"path": "services/odoo/tests/test_inventory.py", "note": "InventoryUpdated"}], "quiz": [{"q": "هل OrderConfirmed ينشئ sale.order؟", "a": "لا. confirmed.py يسجّل التسليم. CreateErpOrder ينشئ أمر البيع."}, {"q": "أين يظهر الدفع في تقرير؟", "a": "في payment_projections بعد أن يطبّق مستهلك التقارير payment.confirmed أو payment.failed. ليس في لحظة تثبيت الـ Saga."}, {"q": "كيف تصل حالة الشحن إلى خدمة الطلبات؟", "a": "Odoo ينادي POST /api/v1/internal/.../shipped مع X-Internal-Token. ليست رسالة وسيط."}], "summary": "إسقاطات Django ووثائق Odoo قاعدتان منفصلتان تتغذيان بالأحداث والأوامر. المعالجات موجودة. عامل الـ Saga الشغّال لا يلاحظ نجاح Odoo، فلا تصف إنشاء ERP حيًا من طرف إلى طرف كأنه اكتمل."}}, {"id": "notifications", "status": "partial", "en": {"title": "Flask notifications and React Native", "lede": "Mock email and mock push are implemented. FCM, SMTP, and a notification inbox API are not.", "limits": ["MockEmail and MockPush append notification_deliveries rows. They do not open a socket to SMTP or FCM. The phone app was not launched on a device or emulator. Session notes stay in the app. There is no inbox endpoint."], "why": ["Checkout should not wait for an email provider, and the notification process must not open order_db. A separate database keeps a failed push from becoming a failed order."], "explain": ["Flask listens on port 8002. The consumer exports metrics on port 9100. kind runs one HTTP replica and two consumer replicas. The queue q.notification.delivery is declared here. processed_events.event_id makes a duplicate ack safe.", "Tables: device_tokens, processed_events, order_contacts, notification_deliveries. OrderConfirmed carries customer_id, which is stored as a contact. Payloads that omit customer_id use that contact. OrderCancelled from PENDING never has a contact, so those deliveries retry and then dead-letter. Adding customer_id to that payload would change the order service. This service does not do that.", "HTTP: GET /health/live, GET /health/ready, GET /metrics, POST/GET/DELETE /api/v1/device-tokens. The caller is the JWT sub. The service verifies RS256 with the public key and does not issue tokens. The React Native screen reads the token list and in-app notices from mobile/react-native-app/src/notices.ts. The storefront has no notification inbox."], "example": {"text": "The shop writes 'order confirmed' in the ledger. A clerk later pins a note on a board that says the same thing. The pin is not the sale. If the pin falls off, the sale remains. A plan to send a real letter is not the same as the pin.", "code": "", "caption": ""}, "how": ["Email destination is account:\u003caccount_id> because the bound payloads do not include an address the service is allowed to look up. Push writes one row per device token, or destination no-device when the account has none. A raised adapter failure rolls the transaction back, so the event id is not marked processed, and the retry path runs.", "Planned, and absent: FCM credentials, a real push provider, SMTP, and an inbox API. Do not draw those as running components."], "files": [{"path": "docs/flask-notification-service.md", "note": "What the service owns"}, {"path": "services/notification-service/src/notification_service/consumer.py", "note": "Queue consumer"}, {"path": "services/notification-service/src/notification_service/adapters.py", "note": "MockEmail and MockPush"}, {"path": "services/notification-service/src/notification_service/http.py", "note": "Device-token routes"}, {"path": "services/notification-service/src/notification_service/models.py", "note": "notification_db tables"}, {"path": "mobile/react-native-app/src/screens/NotificationsScreen.tsx", "note": "Tokens plus session notes, no inbox"}, {"path": "mobile/react-native-app/README.md", "note": "Commands from this machine; app not launched on a device"}], "trace": [{"title": "Event", "who": "Order outbox, then the notification consumer", "what": "A bound routing key arrives on q.notification.delivery.", "data": "Envelope schema version 1.", "fail": "Unknown type or version is published to commerce.dlx and acked."}, {"title": "Contact", "who": "apply path", "what": "OrderConfirmed stores order_id to account_id. Later events reuse it.", "data": "order_contacts. Not a query to order_db.", "fail": "No contact yet: the handler retries and does not mark the event processed."}, {"title": "Mock delivery", "who": "MockEmail and MockPush", "what": "Insert notification_deliveries and processed_events in one transaction.", "data": "channel email or push.", "fail": "Adapter exception rolls back and the broker retry runs."}, {"title": "Device token", "who": "Phone, via the gateway", "what": "POST /api/v1/device-tokens stores the token for the JWT subject.", "data": "device_tokens. 201, or 200 if that account already stored the same token.", "fail": "This does not send a push. FCM is not read."}], "advantages": ["The order database stays closed to this process.", "Duplicates do not send a second mock row.", "The phone can register a token before a real provider exists."], "disadvantages": ["Nobody receives a real email or push.", "Cancel-from-pending cannot find a contact and ends on the DLQ.", "Dashboards do not yet graph this service's series, though Prometheus scrapes them."], "alternatives": ["A new NotificationRequested event was not added. The service consumes catalog events that already exist.", "Opening order_db to read an email address was refused by require_notification_database."], "failures": [{"title": "Duplicate delivery", "text": "The second apply sees processed_events and does not call the adapters again. test_duplicate_delivery_is_acked_once."}, {"title": "Failing adapter", "text": "test_failing_mock_adapter_retries_then_dead_letters. The event is not left marked processed."}], "tests": [{"path": "services/notification-service/tests/test_delivery.py", "note": "Mock delivery, duplicate, retry, DLQ"}, {"path": "services/notification-service/tests/test_boundaries.py", "note": "Refuses order_db, reporting_db, and odoo_db"}, {"path": "services/notification-service/tests/integration/test_live.py", "note": "Skips when 127.0.0.1:5435 or 5672 is closed"}], "quiz": [{"q": "Does the notification service send email?", "a": "It stores a mock row with destination account:\u003caccount_id>. It does not open SMTP."}, {"q": "What does the phone notifications screen show?", "a": "Device tokens from GET /api/v1/device-tokens, plus session notes kept in the app. There is no inbox endpoint."}, {"q": "Is FCM implemented?", "a": "No. Credentials are not read. Treat FCM as absent, not as a hidden setting."}], "summary": "Flask consumes order and payment events into notification_db and stores mock deliveries and device tokens. React Native can register a token. Real push, real email, and an inbox are not in the tree."}, "ar": {"title": "إشعارات Flask وReact Native", "lede": "البريد الوهمي والدفع الوهمي منفَّذان. FCM وSMTP وواجهة صندوق وارد ليست كذلك.", "limits": ["MockEmail وMockPush يلحقان صفوف notification_deliveries. لا يفتحان مقبسًا إلى SMTP أو FCM. تطبيق الهاتف لم يُشغَّل على جهاز أو محاكٍ. ملاحظات الجلسة تبقى في التطبيق. لا توجد نقطة صندوق وارد."], "why": ["إتمام الشراء لا ينبغي أن ينتظر مزوّد بريد، وعملية الإشعار يجب ألا تفتح order_db. قاعدة منفصلة تمنع أن يتحول إشعار دفع فاشل إلى طلب فاشل."], "explain": ["Flask يستمع على المنفذ 8002. المستهلك يصدّر المقاييس على المنفذ 9100. kind يشغّل نسخة HTTP واحدة ونسختين للمستهلك. الطابور q.notification.delivery يُعلَن هنا. processed_events.event_id يجعل ack المكرر آمنًا.", "الجداول: device_tokens وprocessed_events وorder_contacts وnotification_deliveries. OrderConfirmed يحمل customer_id، ويُخزَّن كجهة اتصال. الحمولات التي تحذف customer_id تستخدم تلك الجهة. OrderCancelled من PENDING لا يملك جهة اتصال، فتلك التسليمات تعيد المحاولة ثم تصبح رسالة ميتة. إضافة customer_id إلى تلك الحمولة كانت ستغيّر خدمة الطلبات. هذه الخدمة لا تفعل ذلك.", "HTTP:‏ GET /health/live وGET /health/ready وGET /metrics وPOST/GET/DELETE‏ /api/v1/device-tokens. المستدعي هو sub في JWT. الخدمة تتحقق من RS256 بالمفتاح العام ولا تصدر رموزًا. شاشة React Native تقرأ قائمة الرموز وملاحظات التطبيق من mobile/react-native-app/src/notices.ts. واجهة المتجر بلا صندوق وارد."], "example": {"text": "المحل يكتب «الطلب مؤكد» في الدفتر. موظف لاحقًا يعلّق ملاحظة على لوحة تقول الشيء نفسه. الدبوس ليس البيع. إذا سقط الدبوس، البيع يبقى. خطة إرسال خطاب حقيقي ليست الدبوس نفسه.", "code": "", "caption": ""}, "how": ["وجهة البريد هي account:\u003caccount_id> لأن الحمولات المربوطة لا تحمل عنوانًا يُسمح للخدمة بالبحث عنه. الدفع يكتب صفًا لكل رمز جهاز، أو الوجهة no-device حين لا يملك الحساب رمزًا. فشل محوّل يتراجع عن المعاملة، فلا يُعلَّم معرّف الحدث معالَجًا، ويجري مسار إعادة المحاولة.", "مخطط وغائب: اعتمادات FCM، ومزوّد دفع حقيقي، وSMTP، وواجهة صندوق وارد. لا ترسمها كمكونات شغّالة."], "files": [{"path": "docs/flask-notification-service.md", "note": "ما تملكه الخدمة"}, {"path": "services/notification-service/src/notification_service/consumer.py", "note": "مستهلك الطابور"}, {"path": "services/notification-service/src/notification_service/adapters.py", "note": "MockEmail وMockPush"}, {"path": "services/notification-service/src/notification_service/http.py", "note": "مسارات رمز الجهاز"}, {"path": "services/notification-service/src/notification_service/models.py", "note": "جداول notification_db"}, {"path": "mobile/react-native-app/src/screens/NotificationsScreen.tsx", "note": "رموز بالإضافة إلى ملاحظات الجلسة، بلا صندوق وارد"}, {"path": "mobile/react-native-app/README.md", "note": "أوامر هذا الجهاز؛ التطبيق لم يُشغَّل على جهاز"}], "trace": [{"title": "الحدث", "who": "outbox الطلبات، ثم مستهلك الإشعارات", "what": "مفتاح توجيه مربوط يصل إلى q.notification.delivery.", "data": "إصدار مخطط الظرف 1.", "fail": "نوع أو إصدار مجهول يُنشر إلى commerce.dlx ويُؤكَّد."}, {"title": "جهة الاتصال", "who": "مسار التطبيق", "what": "OrderConfirmed يخزّن order_id إلى account_id. الأحداث اللاحقة تعيد استخدامه.", "data": "order_contacts. ليس استعلامًا إلى order_db.", "fail": "لا جهة اتصال بعد: المعالج يعيد المحاولة ولا يعلّم الحدث معالَجًا."}, {"title": "تسليم وهمي", "who": "MockEmail وMockPush", "what": "أدرج notification_deliveries وprocessed_events في معاملة واحدة.", "data": "القناة email أو push.", "fail": "استثناء المحوّل يتراجع ومسار إعادة محاولة الوسيط يجري."}, {"title": "رمز الجهاز", "who": "الهاتف، عبر البوابة", "what": "POST /api/v1/device-tokens يخزّن الرمز لموضوع JWT.", "data": "device_tokens.‏ 201، أو 200 إذا كان الحساب خزّن الرمز نفسه.", "fail": "هذا لا يرسل دفعًا. FCM لا يُقرأ."}], "advantages": ["قاعدة الطلبات تبقى مغلقة أمام هذه العملية.", "التكرار لا يرسل صفًا وهميًا ثانيًا.", "الهاتف يستطيع تسجيل رمز قبل وجود مزوّد حقيقي."], "disadvantages": ["لا أحد يستلم بريدًا حقيقيًا أو دفعًا حقيقيًا.", "الإلغاء من PENDING لا يجد جهة اتصال وينتهي على DLQ.", "اللوحات لا ترسم سلاسل هذه الخدمة بعد، رغم أن Prometheus يقشطها."], "alternatives": ["لم يُضف حدث NotificationRequested جديد. الخدمة تستهلك أحداث الكتالوج الموجودة.", "فتح order_db لقراءة عنوان بريد رُفض عبر require_notification_database."], "failures": [{"title": "تسليم مكرر", "text": "التطبيق الثاني يرى processed_events ولا ينادي المحوّلات مرة أخرى. test_duplicate_delivery_is_acked_once."}, {"title": "محوّل فاشل", "text": "test_failing_mock_adapter_retries_then_dead_letters. الحدث لا يُترك معلَّمًا كمعالَج."}], "tests": [{"path": "services/notification-service/tests/test_delivery.py", "note": "تسليم وهمي وتكرار وإعادة محاولة وDLQ"}, {"path": "services/notification-service/tests/test_boundaries.py", "note": "يرفض order_db وreporting_db وodoo_db"}, {"path": "services/notification-service/tests/integration/test_live.py", "note": "يتخطى حين يكون 127.0.0.1:5435 أو 5672 مغلقًا"}], "quiz": [{"q": "هل ترسل خدمة الإشعارات بريدًا؟", "a": "تخزّن صفًا وهميًا بوجهة account:\u003caccount_id>. لا تفتح SMTP."}, {"q": "ماذا تُظهر شاشة إشعارات الهاتف؟", "a": "رموز الأجهزة من GET /api/v1/device-tokens، بالإضافة إلى ملاحظات جلسة محفوظة في التطبيق. لا توجد نقطة صندوق وارد."}, {"q": "هل FCM منفَّذ؟", "a": "لا. الاعتمادات لا تُقرأ. عامل FCM كغائب، لا كإعداد مخفي."}], "summary": "Flask يستهلك أحداث الطلب والدفع إلى notification_db ويخزّن تسليمات وهمية ورموز أجهزة. React Native يستطيع تسجيل رمز. الدفع الحقيقي والبريد الحقيقي وصندوق الوارد ليست في الشجرة."}}, {"id": "observability", "status": "implemented", "en": {"title": "Monitoring and failure signals", "lede": "Logs, metrics, and traces have separate jobs. Checkout does not wait on them. There is no retained log store.", "why": ["A dashboard outage must not be a paging outage, and a broken trace pipeline must not blind alerts. The four tools stay separate so a learner can stop one of them and still see what remains."], "explain": ["Logs are one JSON object per line on stdout, with correlation_id, the service name, and event_id when a message is in hand. A rotated container log is gone. Odoo and the Django ORM are not auto-instrumented.", "Prometheus scrapes. Grafana reads metrics and traces. Alertmanager routes alerts to a log webhook. Tempo stores traces that arrive through the OpenTelemetry collector. The traced path is the gateway span, the order-service server span, the Postgres span, the outbox publish span, and a reporting consumer span when the message carries traceparent.", "Business signals include outbox age, queue depth, DLQ depth, projection lag, and payment_circuit_state. Product-cache hit, miss, error, and duration are on the Dependencies and Platform overview boards. The notification series are scraped and are not graphed yet. The notification service does not export traces."], "example": {"text": "A shop keeps a bell for 'the oldest unsent note is too old', a notebook for one confused receipt, and a string tied from the counter to the back room for one slow walk. If the string is cut, the bell still rings. If the notebook is thrown out at closing, last month's argument is gone.", "code": "", "caption": ""}, "how": ["The gateway creates X-Correlation-Id when the caller did not send a UUID. Services copy it into logs, the event envelope, and the response. The publisher puts trace context on message headers. correlation_id and the trace id are not the same field.", "Compose services include otel-collector, tempo, prometheus, alert-webhook, alertmanager, grafana, and exporters for the order, reporting, and notification databases plus Redis. Dashboards live in deploy/observability/grafana/dashboards/. Alerts are deploy/observability/prometheus/alerts.yml. Phase 18 scripts stop RabbitMQ, Redis, the reporting consumer, and the inventory consumer. They do not stop Postgres, Odoo HTTP, or the order API. Those scripts were not run live for the failure-scenario page."], "files": [{"path": "docs/observability.md", "note": "Signals and what a down collector does"}, {"path": "docs/prometheus.md", "note": "Scrape"}, {"path": "docs/grafana.md", "note": "Boards"}, {"path": "docs/alerting.md", "note": "Alertmanager"}, {"path": "docs/failure-scenarios.md", "note": "Expected results, not a measured drill"}, {"path": "deploy/observability/otel/collector.yaml", "note": "Collector"}, {"path": "deploy/failure-lab/lib.sh", "note": "What the lab can stop"}], "trace": [{"title": "Request", "who": "Gateway and order service", "what": "A span and a correlation id are attached to the HTTP call.", "data": "X-Correlation-Id and traceparent.", "fail": "Without them, an Odoo document and a 500 cannot be tied together."}, {"title": "Commit", "who": "Order service", "what": "The log line and the outbox metric record the fact. The trace is optional.", "data": "outbox_unpublished_count and oldest pending age, as designed.", "fail": "If the only copy of the business fact were the span, sampling would delete the sale."}, {"title": "Consume", "who": "Reporting consumer", "what": "A child span when traceparent was on the message. The projection lag gauge is separate.", "data": "Consumer duplicate counter.", "fail": "A down collector drops traces. Scraped metrics remain."}, {"title": "Page", "who": "Prometheus rules, then Alertmanager", "what": "DLQ depth, broker down, outbox age, and similar rules notify the log webhook.", "data": "Not a paging provider.", "fail": "If Prometheus is down, history for the gap is lost. It is not backfilled."}], "advantages": ["You can tell a stuck outbox from a poison message.", "Stopping the collector does not stop alerts that scrape the process directly.", "correlation_id survives even if the trace is sampled away."], "disadvantages": ["Stdout logs disappear when they rotate.", "No request-per-pod number is recorded.", "The failure lab does not match every sentence that says it breaks Postgres or FastAPI."], "alternatives": ["Logs only, a vendor APM as the only store, and using OpenTelemetry as the metrics database lost in ADR-009 and ADR-011.", "A single vendor SDK lost because leaving it would be a rewrite."], "failures": [{"title": "Broker down", "text": "Checkout commits. Outbox age grows. RabbitDown then OutboxStale are the expected signals in failure-scenarios.md."}, {"title": "Poison message", "text": "The message retries, then sits in a DLQ. DeadLetterBacklog is the signal. Do not ack the DLQ to clear the alert."}, {"title": "Observability down", "text": "The business path keeps running. You lose the gap in metrics or traces. You do not lose the order row."}], "tests": [{"path": "services/order-service/tests/unit/test_observability.py", "note": "Order-service metrics and logs"}, {"path": "services/reporting-service/projections/tests/test_observability.py", "note": "Reporting signals"}, {"path": "deploy/failure-lab/test_lab.py", "note": "Reads the scripts. Does not stop a service."}], "quiz": [{"q": "Does checkout wait for Tempo?", "a": "No. A down collector drops traces. The order commit does not depend on it."}, {"q": "Where do alerts go in this learning setup?", "a": "Alertmanager posts to the log webhook. There is no paging provider."}, {"q": "What is not a retained log store?", "a": "Container stdout. A rotated log is gone. Do not claim you can investigate last month from this stack."}], "summary": "Prometheus, Grafana, Alertmanager, and Tempo watch the platform without sitting on the checkout path. Logs are stdout. Several failure results are specified and were not executed as a live drill on this machine."}, "ar": {"title": "المراقبة وإشارات العطل", "lede": "السجلات والمقاييس والتتبع لها أعمال منفصلة. إتمام الشراء لا ينتظرها. لا يوجد مخزن سجلات محتفظ به.", "why": ["انقطاع لوحة لا يجوز أن يكون انقطاع تنبيه، وخط تتبع مكسور لا يجوز أن يُعمي التنبيهات. الأدوات الأربع تبقى منفصلة حتى يستطيع المتعلّم إيقاف واحدة ويرى ما تبقّى."], "explain": ["السجلات كائن JSON واحد في السطر على stdout، مع correlation_id واسم الخدمة وevent_id حين تكون رسالة في اليد. سجل حاوية دارَ يضيع. Odoo وORM في Django ليسا مجهَّزين تلقائيًا.", "Prometheus يقشط. Grafana يقرأ المقاييس والتتبع. Alertmanager يوجّه التنبيهات إلى خطاف سجل. Tempo يخزّن التتبعات التي تصل عبر مجمّع OpenTelemetry. المسار المتتبَّع هو مدى البوابة ومدى خادم خدمة الطلبات ومدى Postgres ومدى نشر outbox ومدى مستهلك التقارير حين تحمل الرسالة traceparent.", "إشارات العمل تشمل عمر outbox وعمق الطابور وعمق DLQ وتأخر الإسقاط وpayment_circuit_state. إصابة ذاكرة المنتج وغيابها وخطأها ومدتها على لوحتي Dependencies وPlatform overview. سلاسل الإشعارات تُقشط ولا تُرسم بعد. خدمة الإشعارات لا تصدّر تتبعًا."], "example": {"text": "محل يحتفظ بجرس لـ«أقدم ملاحظة لم تُرسل صارت قديمة»، ودفتر لإيصال واحد مربك، وخيط من المنضدة إلى الغرفة الخلفية لمشية بطيئة واحدة. إذا قُطع الخيط، الجرس ما زال يرن. إذا رُمي الدفتر عند الإغلاق، يضيع جدال الشهر الماضي.", "code": "", "caption": ""}, "how": ["البوابة تنشئ X-Correlation-Id حين لا يرسل المتصل UUID. الخدمات تنسخه إلى السجلات وظرف الحدث والرد. الناشر يضع سياق التتبع على ترويسات الرسالة. correlation_id ومعرّف التتبع ليسا الحقل نفسه.", "خدمات Compose تشمل otel-collector وtempo وprometheus وalert-webhook وalertmanager وgrafana ومصدّرين لقواعد الطلبات والتقارير والإشعارات بالإضافة إلى Redis. اللوحات في deploy/observability/grafana/dashboards/. التنبيهات في deploy/observability/prometheus/alerts.yml. نصوص المرحلة 18 توقف RabbitMQ وRedis ومستهلك التقارير ومستهلك المخزون. لا توقف Postgres ولا HTTP في Odoo ولا API الطلبات. تلك النصوص لم تُشغَّل حيًا لصفحة سيناريوهات العطل."], "files": [{"path": "docs/observability.md", "note": "الإشارات وما يفعله مجمّع متوقف"}, {"path": "docs/prometheus.md", "note": "القشط"}, {"path": "docs/grafana.md", "note": "اللوحات"}, {"path": "docs/alerting.md", "note": "Alertmanager"}, {"path": "docs/failure-scenarios.md", "note": "النتائج المتوقعة، وليست تمرينًا مقيسًا"}, {"path": "deploy/observability/otel/collector.yaml", "note": "المجمّع"}, {"path": "deploy/failure-lab/lib.sh", "note": "ما يستطيع المختبر إيقافه"}], "trace": [{"title": "الطلب", "who": "البوابة وخدمة الطلبات", "what": "يُرفق مدى ومعرّف ارتباط بنداء HTTP.", "data": "X-Correlation-Id وtraceparent.", "fail": "من غيرهما، لا يمكن ربط وثيقة Odoo بخطأ 500."}, {"title": "التثبيت", "who": "خدمة الطلبات", "what": "سطر السجل ومقياس outbox يسجّلان الحقيقة. التتبع اختياري.", "data": "outbox_unpublished_count وعمر أقدم معلّق، كما صُمّم.", "fail": "لو كانت النسخة الوحيدة لحقيقة العمل هي المدى، لكان أخذ العينات يحذف البيع."}, {"title": "الاستهلاك", "who": "مستهلك التقارير", "what": "مدى ابن حين كان traceparent على الرسالة. مقياس تأخر الإسقاط منفصل.", "data": "عداد التكرار عند المستهلك.", "fail": "مجمّع متوقف يُسقط التتبع. المقاييس المقشوطة تبقى."}, {"title": "التنبيه", "who": "قواعد Prometheus ثم Alertmanager", "what": "عمق DLQ وتوقّف الوسيط وعمر outbox وما شابهها تُخطر خطاف السجل.", "data": "ليس مزوّد استدعاء.", "fail": "إذا توقف Prometheus، يضيع تاريخ الفجوة. لا يُملأ لاحقًا."}], "advantages": ["يمكنك تمييز outbox عالق من رسالة سامة.", "إيقاف المجمّع لا يوقف تنبيهات تقشط العملية مباشرة.", "correlation_id يبقى حتى لو اختفى التتبع بالعينة."], "disadvantages": ["سجلات stdout تختفي حين تدور.", "لا عدد طلبات لكل حاضنة مسجّل.", "مختبر الأعطال لا يطابق كل جملة تقول إنه يكسر Postgres أو FastAPI."], "alternatives": ["السجلات فقط، وAPM بائع كالمخزن الوحيد، واستخدام OpenTelemetry كقاعدة مقاييس خسرت في ADR-009 وADR-011.", "حزمة بائع واحدة خسرت لأن مغادرتها كانت ستكون إعادة كتابة."], "failures": [{"title": "توقّف الوسيط", "text": "إتمام الشراء يُثبَّت. عمر outbox يكبر. RabbitDown ثم OutboxStale هما الإشارتان المتوقعتان في failure-scenarios.md."}, {"title": "رسالة سامة", "text": "الرسالة تعيد المحاولة ثم تجلس في DLQ. DeadLetterBacklog هي الإشارة. لا تعمل ack لـ DLQ لمسح التنبيه."}, {"title": "توقّف المراقبة", "text": "مسار العمل يستمر. تفقد فجوة المقاييس أو التتبع. لا تفقد صف الطلب."}], "tests": [{"path": "services/order-service/tests/unit/test_observability.py", "note": "مقاييس وسجلات خدمة الطلبات"}, {"path": "services/reporting-service/projections/tests/test_observability.py", "note": "إشارات التقارير"}, {"path": "deploy/failure-lab/test_lab.py", "note": "يقرأ النصوص. لا يوقف خدمة."}], "quiz": [{"q": "هل ينتظر إتمام الشراء Tempo؟", "a": "لا. مجمّع متوقف يُسقط التتبع. تثبيت الطلب لا يعتمد عليه."}, {"q": "إلى أين تذهب التنبيهات في إعداد التعلّم هذا؟", "a": "Alertmanager يرسل إلى خطاف السجل. لا يوجد مزوّد استدعاء."}, {"q": "ما الذي ليس مخزن سجلات محتفظًا به؟", "a": "stdout للحاوية. السجل الذي دارَ يضيع. لا تدّعِ أنك تستطيع التحقيق في الشهر الماضي من هذا المكدس."}], "summary": "Prometheus وGrafana وAlertmanager وTempo يراقبون المنصة من غير أن يجلسوا على مسار إتمام الشراء. السجلات هي stdout. عدة نتائج عطل محددة ولم تُنفَّذ كتمرين حي على هذا الجهاز."}}, {"id": "testing", "status": "partial", "en": {"title": "Testing, troubleshooting, and review", "lede": "Unit suites for the extension behaviors were run on 9 October 2026. Live Compose, kind, Locust, the failure lab, and a timed restore were not.", "limits": ["order-service: 19 passed in 0.19s. reporting-service: 2 passed in 0.20s. odoo: 5 passed in 0.01s. notification-service: 7 passed in 0.20s. Commands are in docs/testing.md. docker info failed because the Docker socket was missing. kind is not installed. locust is not installed. Nothing accepted a connection on 127.0.0.1:5672 or 127.0.0.1:6379."], "why": ["A green click in the browser does not prove the state machine. A test that sleeps for 'eventual consistency' without a bound flakes. The suites that exist say which rule they hold, and a skip says the dependency was down."], "explain": ["Domain tests must not need a database. At least the design asks one integration test per critical write to use Postgres and assert that a rollback leaves no outbox row. HTTP idempotency keys are still not built. The 15 second Redis lock is not that test.", "Manifest tests and Compose tests read files. They do not start a cluster or a stack. deploy/load/RESULTS.md says the load run did not happen. Do not invent requests per second.", "When something looks           filters: [["all","الكل"],["services","الخدمات"],["databases","قواعد البيانات"],["messaging","الرسائل"],["infrastructure","البنية"],["clients","العملاء"]],
          mapLead: "اختر مكوّنًا. المرشحات تخفي المجموعات الأخرى. الاختيار يبقى عند تغيير اللغة.",
          emptyDetail: "اختر مكوّنًا من الخريطة.",
          responsibility: "المسؤولية",
          io: "المدخلات والمخرجات",
          inputs: "المدخلات",
          outputs: "المخرجات",
          stores: "قاعدة البيانات أو الطوابير",
          deps: "الاعتمادات",
          up: "ما قبله",
          down: "ما بعده",
          paths: "مسارات المستودع",
          docs: "الوثائق",
          decisions: "قرارات التصميم",
          flowLead: "اختر مسارًا ثم خطوة. الخطوة المخططة ليست مسارًا منفَّذًا.",
          noResults: "لا توجد نتائج بهذه اللغة.",
          results: "النتائج",
          tree: "متصفح المجلدات",
          limitsTitle: "حدود هذه الصفحة",
          chapterOf: (i, n) => "الفصل " + i + " من " + n
        }
      };

      const state = {
        lang: "en",
        view: "learn",
        chapter: "overview",
        workflow: "create-order",
        step: 0,
        node: "order-service",
        filters: new Set(["all"]),
        query: "",
        visited: new Set(["overview"]),
        revealed: new Set(),
        navOpen: true,
        treeOpen: new Set(["root", "services", "deploy", "docs"])
      };

      const $ = (id) => document.getElementById(id);

      function t() { return ui[state.lang]; }
      function pack(node) { return node[state.lang]; }
      function chapter() { return PORTAL.chapters.find((c) => c.id === state.chapter); }
      function workflow() { return PORTAL.workflows.find((w) => w.id === state.workflow); }

      function hrefFor(repoPath) {
        if (repoPath.startsWith("docs/")) return repoPath.slice(5);
        return "../" + repoPath;
      }

      function el(tag, attrs, children) {
        const node = document.createElement(tag);
        if (attrs) {
          Object.keys(attrs).forEach((key) => {
            if (attrs[key] == null) return;
            if (key === "text") node.textContent = attrs[key];
            else if (key === "html") node.innerHTML = attrs[key];
            else node.setAttribute(key, attrs[key]);
          });
        }
        (children || []).forEach((child) => { if (child) node.appendChild(child); });
        return node;
      }

      function rich(text) {
        const frag = document.createDocumentFragment();
        const re = /\[([^\]]+)\]\(([^)]+)\)/g;
        let last = 0;
        let match;
        while ((match = re.exec(text))) {
          frag.appendChild(document.createTextNode(text.slice(last, match.index)));
          const href = match[2];
          if (/^[a-z]+:/i.test(href)) {
            frag.appendChild(document.createTextNode(match[1]));
          } else {
            frag.appendChild(el("a", { href: href, text: match[1] }));
          }
          last = match.index + match[0].length;
        }
        frag.appendChild(document.createTextNode(text.slice(last)));
        return frag;
      }

      function para(text) {
        const p = el("p");
        p.appendChild(rich(text));
        return p;
      }

      function badge(status) {
        return el("span", { class: "badge " + (status === "implemented" ? "" : status), text: t().status[status] || status });
      }

      function copyBtn(value) {
        const button = el("button", { type: "button", class: "copy", text: t().copy });
        button.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(value);
            button.textContent = t().copied;
            setTimeout(() => { button.textContent = t().copy; }, 1200);
          } catch (err) {
            button.textContent = value;
          }
        });
        return button;
      }

      function fileList(items) {
        const ul = el("ul");
        items.forEach((item) => {
          const li = el("li");
          li.appendChild(el("a", { href: hrefFor(item.path), text: item.path }));
          li.appendChild(document.createTextNode(" — " + item.note));
          li.appendChild(document.createTextNode(" "));
          li.appendChild(copyBtn(item.path));
          ul.appendChild(li);
        });
        return ul;
      }

      function readHash() {
        const raw = location.hash.replace(/^#/, "");
        if (!raw) return;
        const params = new URLSearchParams(raw);
        const c = params.get("c");
        const w = params.get("w");
        const v = params.get("v");
        const n = params.get("n");
        const s = params.get("s");
        if (c && PORTAL.chapters.some((item) => item.id === c)) state.chapter = c;
        if (w && PORTAL.workflows.some((item) => item.id === w)) state.workflow = w;
        if (v === "learn" || v === "map" || v === "flow") state.view = v;
        if (n && PORTAL.nodes.some((item) => item.id === n)) state.node = n;
        if (s && /^\d+$/.test(s)) state.step = Number(s);
        state.visited.add(state.chapter);
      }

      function writeHash() {
        const params = new URLSearchParams();
        params.set("c", state.chapter);
        params.set("v", state.view);
        params.set("w", state.workflow);
        params.set("n", state.node);
        params.set("s", String(state.step));
        const next = "#" + params.toString();
        if (location.hash !== next) history.replaceState(null, "", next);
      }

      function loadLang() {
        try {
          const saved = localStorage.getItem("commerce-portal-lang");
          if (saved === "ar" || saved === "en") state.lang = saved;
        } catch (err) { /* language stays English when storage is blocked */ }
      }

      function saveLang() {
        try { localStorage.setItem("commerce-portal-lang", state.lang); } catch (err) { /* preference is not required */ }
      }

      function applyDir() {
        document.documentElement.lang = state.lang;
        document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
        document.title = pack(PORTAL.meta).title;
        $("skip").textContent = t().skip;
        $("search").setAttribute("aria-label", t().search);
        $("search").setAttribute("placeholder", t().search);
        $("menu").textContent = state.navOpen ? t().menuOpen : t().menuClosed;
        $("menu").setAttribute("aria-expanded", state.navOpen ? "true" : "false");
        const layout = $("layout");
        layout.classList.toggle("nav-collapsed", !state.navOpen && window.innerWidth > 800);
        layout.classList.toggle("nav-open", state.navOpen && window.innerWidth <= 800);
      }

      function renderChrome() {
        applyDir();
        const views = $("views");
        views.replaceChildren();
        t().views.forEach(([id, label]) => {
          const button = el("button", { type: "button", role: "tab", text: label, "aria-selected": state.view === id ? "true" : "false" });
          button.addEventListener("click", () => { state.view = id; render(); });
          views.appendChild(button);
        });
        const langBox = $("lang");
        langBox.querySelectorAll("button").forEach((button) => {
          button.setAttribute("aria-pressed", button.getAttribute("data-lang") === state.lang ? "true" : "false");
        });
        const nav = $("nav");
        nav.setAttribute("aria-label", state.lang === "ar" ? "الفصول" : "Chapters");
        nav.replaceChildren();
        nav.appendChild(el("p", { class: "progress", text: t().progress(state.visited.size, PORTAL.chapters.length) }));
        PORTAL.chapters.forEach((item) => {
          const link = el("a", { href: "#c=" + item.id, text: "" });
          const label = el("span", { text: pack(item).title });
          link.appendChild(label);
          link.appendChild(badge(item.status));
          if (item.id === state.chapter) link.setAttribute("aria-current", "true");
          link.addEventListener("click", (event) => {
            event.preventDefault();
            state.chapter = item.id;
            state.view = "learn";
            state.visited.add(item.id);
            if (window.innerWidth <= 800) state.navOpen = false;
            render();
            $("content").focus();
          });
          nav.appendChild(link);
        });
      }

      function renderSearchHits() {
        const query = state.query.trim().toLowerCase();
        if (!query) return null;
        const box = el("div", { class: "results" });
        box.appendChild(el("strong", { text: t().results }));
        let count = 0;
        PORTAL.chapters.forEach((item) => {
          const body = JSON.stringify(pack(item)).toLowerCase();
          if (body.includes(query) || item.id.includes(query)) {
            count += 1;
            const button = el("button", { type: "button", text: pack(item).title });
            button.addEventListener("click", () => {
              state.chapter = item.id;
              state.view = "learn";
              state.visited.add(item.id);
              render();
            });
            box.appendChild(button);
          }
        });
        PORTAL.workflows.forEach((item) => {
          const body = JSON.stringify(pack(item)).toLowerCase();
          if (body.includes(query)) {
            count += 1;
            const button = el("button", { type: "button", text: pack(item).title });
            button.addEventListener("click", () => {
              state.workflow = item.id;
              state.step = 0;
              state.view = "flow";
              render();
            });
            box.appendChild(button);
          }
        });
        if (!count) box.appendChild(para(t().noResults));
        return box;
      }

      function renderChapter() {
        const item = chapter();
        const text = pack(item);
        const index = PORTAL.chapters.findIndex((c) => c.id === item.id);
        const main = $("content");
        main.replaceChildren();
        const hits = renderSearchHits();
        if (hits) main.appendChild(hits);
        const mobile = el("div", { class: "views mobile", role: "tablist" });
        t().views.forEach(([id, label]) => {
          const button = el("button", { type: "button", role: "tab", text: label, "aria-selected": state.view === id ? "true" : "false" });
          button.addEventListener("click", () => { state.view = id; render(); });
          mobile.appendChild(button);
        });
        main.appendChild(mobile);
        main.appendChild(el("p", { class: "crumbs", text: t().crumbs + " / " + text.title }));
        main.appendChild(el("p", { class: "meta", text: t().chapterOf(index + 1, PORTAL.chapters.length) }));
        const heading = el("h1");
        heading.appendChild(document.createTextNode(text.title + " "));
        heading.appendChild(badge(item.status));
        main.appendChild(heading);
        main.appendChild(el("p", { class: "lede" }));
        main.lastChild.appendChild(rich(text.lede));
        const toc = el("nav", { class: "toc" });
        toc.setAttribute("aria-label", state.lang === "ar" ? "أقسام الفصل" : "Chapter sections");
        t().toc.forEach(([id, label]) => {
          toc.appendChild(el("a", { href: "#sec-" + id, text: label }));
        });
        main.appendChild(toc);
        if (text.limits) {
          const box = el("section", { class: "limits", id: "sec-limits" });
          box.appendChild(el("strong", { text: t().limitsTitle }));
          text.limits.forEach((line) => box.appendChild(para(line)));
          main.appendChild(box);
        }
        const sections = [
          ["why", t().why, text.why],
          ["explain", t().explain, text.explain]
        ];
        sections.forEach(([id, title, body]) => {
          const section = el("section", { id: "sec-" + id });
          section.appendChild(el("h2", { text: title }));
          body.forEach((line) => section.appendChild(para(line)));
          main.appendChild(section);
        });
        const example = el("section", { id: "sec-example" });
        example.appendChild(el("h2", { text: t().example }));
        example.appendChild(para(text.example.text));
        if (text.example.code) {
          const head = el("div", { class: "codehead" });
          head.appendChild(el("span", { class: "meta", text: text.example.caption || "" }));
          head.appendChild(copyBtn(text.example.code));
          example.appendChild(head);
          example.appendChild(el("pre", { text: text.example.code }));
        }
        main.appendChild(example);
        const how = el("section", { id: "sec-how" });
        how.appendChild(el("h2", { text: t().how }));
        text.how.forEach((line) => how.appendChild(para(line)));
        how.appendChild(el("h3", { text: t().files }));
        how.appendChild(para(t().openHint));
        how.appendChild(fileList(text.files));
        if (item.id === "repo") how.appendChild(renderTree());
        main.appendChild(how);
        const trace = el("section", { id: "sec-trace" });
        trace.appendChild(el("h2", { text: t().trace }));
        const ol = el("ol", { class: "trace" });
        text.trace.forEach((step) => {
          const li = el("li");
          li.appendChild(el("strong", { text: step.title }));
          li.appendChild(el("div", { text: t().who + ": " + step.who }));
          li.appendChild(para(step.what));
          li.appendChild(el("div", { class: "meta", text: t().data + ": " + step.data }));
          li.appendChild(el("div", { class: "meta", text: t().fail + ": " + step.fail }));
          ol.appendChild(li);
        });
        trace.appendChild(ol);
        main.appendChild(trace);
        const trade = el("section", { id: "sec-trade" });
        trade.appendChild(el("h2", { text: t().trade }));
        [["adv", t().adv, text.advantages], ["dis", t().dis, text.disadvantages], ["alt", t().alt, text.alternatives]].forEach(([, title, lines]) => {
          trade.appendChild(el("h3", { text: title }));
          const ul = el("ul");
          lines.forEach((line) => {
            const li = el("li");
            li.appendChild(rich(line));
            ul.appendChild(li);
          });
          trade.appendChild(ul);
        });
        main.appendChild(trade);
        const failures = el("section", { id: "sec-failures" });
        failures.appendChild(el("h2", { text: t().failures }));
        text.failures.forEach((line) => {
          failures.appendChild(el("h3", { text: line.title }));
          failures.appendChild(para(line.text));
        });
        main.appendChild(failures);
        const tests = el("section", { id: "sec-tests" });
        tests.appendChild(el("h2", { text: t().tests }));
        tests.appendChild(fileList(text.tests));
        main.appendChild(tests);
        const quiz = el("section", { id: "sec-quiz" });
        quiz.appendChild(el("h2", { text: t().quiz }));
        text.quiz.forEach((qa, i) => {
          const key = item.id + ":" + i;
          const block = el("div", { class: "quiz" });
          block.appendChild(para(qa.q));
          const button = el("button", { type: "button", text: state.revealed.has(key) ? t().hide : t().show, "aria-expanded": state.revealed.has(key) ? "true" : "false" });
          const answer = el("p", { class: state.revealed.has(key) ? "" : "hidden" });
          answer.appendChild(rich(qa.a));
          button.addEventListener("click", () => {
            if (state.revealed.has(key)) state.revealed.delete(key);
            else state.revealed.add(key);
            render();
            const again = document.querySelectorAll("#sec-quiz button")[i];
            if (again) again.focus();
          });
          block.appendChild(button);
          block.appendChild(answer);
          quiz.appendChild(block);
        });
        main.appendChild(quiz);
        const summary = el("section", { id: "sec-summary" });
        summary.appendChild(el("h2", { text: t().summary }));
        const both = el("div", { class: "both" });
        const en = el("article");
        en.lang = "en";
        en.dir = "ltr";
        en.appendChild(el("h3", { text: t().summaryEn }));
        en.appendChild(para(item.en.summary));
        const ar = el("article");
        ar.lang = "ar";
        ar.dir = "rtl";
        ar.appendChild(el("h3", { text: t().summaryAr }));
        ar.appendChild(para(item.ar.summary));
        both.appendChild(en);
        both.appendChild(ar);
        summary.appendChild(both);
        main.appendChild(summary);
        const pager = el("div", { class: "pager" });
        const prev = PORTAL.chapters[index - 1];
        const next = PORTAL.chapters[index + 1];
        const prevBtn = el("button", { type: "button", text: prev ? t().prev + ": " + pack(prev).title : t().prev });
        const nextBtn = el("button", { type: "button", text: next ? t().next + ": " + pack(next).title : t().next });
        if (!prev) prevBtn.disabled = true;
        if (!next) nextBtn.disabled = true;
        prevBtn.addEventListener("click", () => { if (!prev) return; state.chapter = prev.id; state.visited.add(prev.id); render(); $("content").focus(); });
        nextBtn.addEventListener("click", () => { if (!next) return; state.chapter = next.id; state.visited.add(next.id); render(); $("content").focus(); });
        pager.appendChild(prevBtn);
        pager.appendChild(nextBtn);
        main.appendChild(pager);
        main.appendChild(el("footer", { text: pack(PORTAL.meta).footer }));
      }

      function renderTree() {
        const wrap = el("section");
        wrap.appendChild(el("h3", { text: t().tree }));
        const root = el("div", { class: "tree" });
        root.appendChild(drawNode(PORTAL.tree));
        wrap.appendChild(root);
        return wrap;
      }

      function drawNode(node) {
        const li = el("li");
        if (node.children) {
          const open = state.treeOpen.has(node.id);
          const button = el("button", { type: "button", class: "fold", "aria-expanded": open ? "true" : "false", text: (open ? "▾ " : "▸ ") + node.name });
          button.addEventListener("click", () => {
            if (state.treeOpen.has(node.id)) state.treeOpen.delete(node.id);
            else state.treeOpen.add(node.id);
            render();
          });
          li.appendChild(button);
          if (node.en && node.en.note) li.appendChild(el("div", { class: "meta", text: pack(node).note }));
          if (open) {
            const ul = el("ul");
            node.children.forEach((child) => ul.appendChild(drawNode(child)));
            li.appendChild(ul);
          }
        } else {
          li.appendChild(el("span", { text: node.name }));
          if (node.en && node.en.note) li.appendChild(el("div", { class: "meta", text: pack(node).note }));
        }
        const ul = el("ul");
        ul.appendChild(li);
        return ul;
      }

      function renderMap() {
        const main = $("content");
        main.replaceChildren();
        const hits = renderSearchHits();
        if (hits) main.appendChild(hits);
        const text = pack(PORTAL.map);
        main.appendChild(el("p", { class: "crumbs", text: t().crumbs + " / " + text.title }));
        main.appendChild(el("h1", { text: text.title }));
        main.appendChild(para(t().mapLead));
        main.appendChild(para(text.intro));
        const filters = el("div", { class: "filters", role: "group" });
        t().filters.forEach(([id, label]) => {
          const pressed = state.filters.has(id);
          const button = el("button", { type: "button", text: label, "aria-pressed": pressed ? "true" : "false" });
          button.addEventListener("click", () => {
            if (id === "all") state.filters = new Set(["all"]);
            else {
              state.filters.delete("all");
              if (state.filters.has(id)) state.filters.delete(id);
              else state.filters.add(id);
              if (state.filters.size === 0) state.filters.add("all");
            }
            render();
          });
          filters.appendChild(button);
        });
        main.appendChild(filters);
        const map = el("div", { class: "map" });
        PORTAL.lanes.forEach((lane) => {
          map.appendChild(el("div", { class: "lane-label", text: pack(lane).label }));
          const row = el("div", { class: "lane" });
          PORTAL.nodes.filter((node) => node.lane === lane.id).forEach((node) => {
            const show = state.filters.has("all") || state.filters.has(node.category);
            const button = el("button", {
              type: "button",
              class: "node",
              "aria-pressed": state.node === node.id ? "true" : "false"
            });
            if (!show) button.hidden = true;
            button.appendChild(el("strong", { text: pack(node).name }));
            button.appendChild(el("span", { text: t().status[node.status] }));
            button.addEventListener("click", () => { state.node = node.id; render(); });
            row.appendChild(button);
          });
          map.appendChild(row);
        });
        main.appendChild(map);
        main.appendChild(renderNodeDetail());
      }

      function renderNodeDetail() {
        const node = PORTAL.nodes.find((item) => item.id === state.node);
        const box = el("article", { class: "detail" });
        if (!node) {
          box.appendChild(para(t().emptyDetail));
          return box;
        }
        const text = pack(node);
        const title = el("h2");
        title.appendChild(document.createTextNode(text.name + " "));
        title.appendChild(badge(node.status));
        box.appendChild(title);
        box.appendChild(el("h3", { text: t().responsibility }));
        box.appendChild(para(text.responsibility));
        box.appendChild(el("h3", { text: t().io }));
        box.appendChild(el("p", { class: "meta", text: t().inputs }));
        box.appendChild(para(text.inputs));
        box.appendChild(el("p", { class: "meta", text: t().outputs }));
        box.appendChild(para(text.outputs));
        box.appendChild(el("h3", { text: t().stores }));
        box.appendChild(para(text.stores));
        box.appendChild(el("h3", { text: t().deps }));
        box.appendChild(el("p", { text: t().up + ": " + text.upstream }));
        box.appendChild(el("p", { text: t().down + ": " + text.downstream }));
        box.appendChild(el("h3", { text: t().paths }));
        box.appendChild(para(t().openHint));
        box.appendChild(fileList(text.paths));
        box.appendChild(el("h3", { text: t().docs }));
        box.appendChild(fileList(text.docs));
        box.appendChild(el("h3", { text: t().failures }));
        text.failures.forEach((line) => box.appendChild(para(line)));
        box.appendChild(el("h3", { text: t().decisions }));
        text.decisions.forEach((line) => box.appendChild(para(line)));
        return box;
      }

      function renderFlow() {
        const main = $("content");
        main.replaceChildren();
        const hits = renderSearchHits();
        if (hits) main.appendChild(hits);
        const intro = pack(PORTAL.flows);
        main.appendChild(el("p", { class: "crumbs", text: t().crumbs + " / " + intro.title }));
        main.appendChild(el("h1", { text: intro.title }));
        main.appendChild(para(t().flowLead));
        main.appendChild(para(intro.intro));
        const pick = el("div", { class: "flow-pick", role: "group" });
        PORTAL.workflows.forEach((item) => {
          const button = el("button", { type: "button", "aria-pressed": item.id === state.workflow ? "true" : "false" });
          button.appendChild(document.createTextNode(pack(item).title + " "));
          button.appendChild(badge(item.status));
          button.addEventListener("click", () => { state.workflow = item.id; state.step = 0; render(); });
          pick.appendChild(button);
        });
        main.appendChild(pick);
        const item = workflow();
        const text = pack(item);
        const head = el("h2");
        head.appendChild(document.createTextNode(text.title + " "));
        head.appendChild(badge(item.status));
        main.appendChild(head);
        main.appendChild(para(text.summary));
        if (text.limit) {
          const box = el("div", { class: "limits" });
          box.appendChild(para(text.limit));
          main.appendChild(box);
        }
        const list = el("div", { class: "steps" });
        text.steps.forEach((step, i) => {
          const button = el("button", { type: "button" });
          if (i === state.step) button.setAttribute("aria-current", "step");
          button.appendChild(badge(step.status));
          button.appendChild(document.createTextNode(" " + (i + 1) + ". " + step.title));
          button.addEventListener("click", () => { state.step = i; render(); });
          list.appendChild(button);
        });
        main.appendChild(list);
        const step = text.steps[Math.min(state.step, text.steps.length - 1)];
        const detail = el("article", { class: "detail" });
        const title = el("h3");
        title.appendChild(document.createTextNode(step.title + " "));
        title.appendChild(badge(step.status));
        detail.appendChild(title);
        detail.appendChild(el("p", { text: t().who + ": " + step.who }));
        detail.appendChild(para(step.what));
        detail.appendChild(el("p", { class: "meta", text: t().data + ": " + step.data }));
        detail.appendChild(el("p", { class: "meta", text: t().fail + ": " + step.fail }));
        if (step.paths && step.paths.length) detail.appendChild(fileList(step.paths));
        main.appendChild(detail);
      }

      function render() {
        const max = workflow() ? pack(workflow()).steps.length - 1 : 0;
        if (state.step > max) state.step = 0;
        writeHash();
        renderChrome();
        if (state.view === "map") renderMap();
        else if (state.view === "flow") renderFlow();
        else renderChapter();
      }

      document.querySelectorAll("#lang button").forEach((button) => {
        button.addEventListener("click", () => {
          state.lang = button.getAttribute("data-lang");
          saveLang();
          render();
        });
      });
      $("menu").addEventListener("click", () => {
        state.navOpen = !state.navOpen;
        render();
      });
      $("search").addEventListener("input", (event) => {
        state.query = event.target.value;
        render();
        const input = $("search");
        input.focus();
        const pos = input.value.length;
        input.setSelectionRange(pos, pos);
      });
      document.addEventListener("keydown", (event) => {
        if (event.target.matches("input, textarea")) return;
        if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
          const dir = document.documentElement.dir === "rtl" ? -1 : 1;
          const forward = (event.key === "ArrowRight" ? 1 : -1) * dir;
          if (state.view !== "learn") return;
          const index = PORTAL.chapters.findIndex((c) => c.id === state.chapter);
          const next = PORTAL.chapters[index + forward];
          if (!next) return;
          state.chapter = next.id;
          state.visited.add(next.id);
          render();
        }
      });
      window.addEventListener("hashchange", () => { readHash(); render(); });
      window.addEventListener("resize", () => {
        const wide = window.innerWidth > 800;
        if (lastWide && !wide) state.navOpen = false;
        lastWide = wide;
        applyDir();
      });

      loadLang();
      readHash();
      state.visited.add(state.chapter);
      if (window.innerWidth <= 800) state.navOpen = false;
      let lastWide = window.innerWidth > 800;
      if (!PORTAL) {
        $("content").appendChild(el("p", { text: "Portal data missing." }));
        return;
      }
      render();
    }());
  </script>
</body>
</html>
