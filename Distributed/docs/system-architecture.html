يع وحدة عمل خدمة الطلبات تثبيتها؟", "a": "order_db فقط."}, {"q": "متى تُسجَّل مقاييس إنشاء outbox؟", "a": "بعد أن يرجع session.commit()، داخل SqlUnitOfWork.commit."}, {"q": "هل saga_instances تشارك معاملة التأكيد؟", "a": "نعم. التأكيد يثبّت الطلب وصف الـ Saga وOrderConfirmed معًا."}], "summary": "وحدة العمل هي حد معاملة order_db. صفوف العمل وصفوف outbox تُثبَّت معًا. القواعد الأخرى تثبّت لاحقًا، كل منها وحدها."}}, {"id": "outbox", "status": "implemented", "en": {"title": "Transactional outbox", "lede": "The HTTP handler writes the outbox row. A separate publisher sends the stored envelope. A failed outbox row is not a consumer dead letter.", "why": ["Commit-then-publish loses the message if the process dies, and the state machine blocks a second confirm. Publish-then-commit creates a ghost event for a rolled-back order. A distributed transaction would make checkout wait on the broker."], "explain": ["The outbox table stores id (the event_id), event_type, aggregate_type, aggregate_id, payload, created_at, published_at, retry_count, and status pending, published, or failed. The publisher treats payload as authoritative.", "python -m order_service.infrastructure.messaging.outbox_publisher selects pending rows with FOR UPDATE SKIP LOCKED, publishes with confirms and mandatory, then marks the row. A crash after the broker accepts and before the commit leaves the row pending, so it is sent again. That is at least once.", "kind keeps order-outbox-publisher at 1 replica so publish order follows created_at. SKIP LOCKED alone does not preserve order across two publishers. Odoo has commerce_event_outbox in odoo_db for InventoryUpdated only. The publisher in services/odoo/src/commerce_erp/publisher.py refuses any other type."], "example": {"text": "The shop writes 'order 18 exists' and 'please announce order 18' on one page. A runner copies the announcement to the notice board. If the runner trips, the page is still there to copy again. If the runner copies a sentence that was never written, the board lies. The page is the source. The board is not.", "code": "", "caption": ""}, "how": ["The handler does not publish and does not wait for published_at. Batch size in the design is on the order of 100, poll about one second, lock held across the broker confirm. There is no claim-then-publish status. A failed row means this publisher never got a broker confirm. The message may not be on any queue. A DLQ message is different: the broker accepted it, a consumer could not apply it, and the outbox row can already be published.", "Routing keys the order service can publish are ROUTING_KEYS in application/publishing.py, including payment.confirmed and payment.failed when the saga emits them."], "files": [{"path": "docs/outbox.md", "note": "The pattern and the publisher loop"}, {"path": "docs/adr/ADR-005-why-outbox.md", "note": "Why not two-phase commit or CDC as the first lesson"}, {"path": "services/order-service/src/order_service/infrastructure/messaging/outbox_publisher.py", "note": "SKIP LOCKED publisher"}, {"path": "services/order-service/src/order_service/application/publishing.py", "note": "ROUTING_KEYS"}, {"path": "services/odoo/src/commerce_erp/publisher.py", "note": "InventoryUpdated only"}, {"path": "services/odoo/addons/commerce_connector/models/inventory.py", "note": "commerce_event_outbox"}], "trace": [{"title": "Insert", "who": "Unit of work", "what": "The business transaction inserts the full envelope JSON.", "data": "outbox.status = pending, published_at null.", "fail": "If this insert is forgotten, no publisher can reconstruct a trustworthy payload later."}, {"title": "Claim", "who": "Publisher", "what": "SELECT pending rows ORDER BY created_at, id FOR UPDATE SKIP LOCKED.", "data": "Row lock.", "fail": "Two publishers without SKIP LOCKED can deadlock or double-send. With two publishers, version order across aggregates can invert."}, {"title": "Confirm", "who": "Publisher", "what": "Publish payload to the exchange. On broker confirm, set published.", "data": "message_id equals event_id. mandatory is on.", "fail": "Unroutable messages increment retry_count. At 5 the row becomes failed."}, {"title": "Crash window", "who": "Publisher", "what": "Broker accepted, database commit did not. The row stays pending and is published again.", "data": "Duplicate event_id.", "fail": "Consumers must treat the duplicate as already applied."}], "advantages": ["The user is not waiting on RabbitMQ.", "The payload is the historical fact, not a later read of the order row.", "A down broker pauses integration and does not roll back checkout."], "disadvantages": ["At least once delivery. Exactly once is not configured.", "One publisher is the learning default. Scaling it needs a partition by aggregate_id.", "A failed outbox row needs a human. Deleting it to silence a metric hides a missing message."], "alternatives": ["Publish after commit, publish before commit, two-phase commit, and polling other services' tables lost in ADR-005.", "Debezium-style CDC is recorded as a later replacement for the poller, not the first implementation. The insert still wants to be in the business commit."], "failures": [{"title": "Publisher stopped", "text": "Checkout looks fine. outbox rows pile up. Outbox age is the signal, not a log line someone might read. Recovery is to start the publisher."}, {"title": "Bad payload", "text": "retry_count reaches the max and status becomes failed. Fix the publisher or the payload on purpose, set the row back to pending, and record why."}], "tests": [{"path": "services/order-service/tests/unit/test_outbox.py", "note": "Order-service outbox"}, {"path": "services/odoo/tests/test_publisher.py", "note": "Odoo publisher refuses anything but InventoryUpdated"}], "quiz": [{"q": "Does the API wait until the broker acks?", "a": "No. Waiting would put the broker on the checkout path."}, {"q": "What is the difference between outbox status failed and a DLQ message?", "a": "failed means the publisher never got a broker confirm. A DLQ message was accepted by the broker and a consumer could not apply it. The outbox row for that fact can already be published."}, {"q": "Why is the kind outbox publisher one replica?", "a": "So publish order follows created_at. SKIP LOCKED does not by itself keep that order across two publishers."}], "summary": "The outbox row is the message. The publisher copies it to RabbitMQ after commit. Duplicates are expected. A failed outbox row and a dead letter are different problems."}, "ar": {"title": "صندوق الصادر في نفس المعاملة", "lede": "معالج HTTP يكتب صف outbox. ناشر منفصل يرسل الظرف المخزّن. صف outbox الفاشل ليس رسالة ميتة عند المستهلك.", "why": ["التثبيت ثم النشر يضيع الرسالة إذا ماتت العملية، وآلة الحالة تمنع تأكيدًا ثانيًا. النشر ثم التثبيت ينشئ حدثًا شبحًا لطلب تراجع. معاملة موزعة كانت ستجعل إتمام الشراء ينتظر الوسيط."], "explain": ["جدول outbox يخزّن id (وهو event_id) وevent_type وaggregate_type وaggregate_id وpayload وcreated_at وpublished_at وretry_count والحالة pending أو published أو failed. الناشر يعامل payload كالمرجع.", "python -m order_service.infrastructure.messaging.outbox_publisher يختار الصفوف المعلقة بـ FOR UPDATE SKIP LOCKED، وينشر مع التأكيد وmandatory، ثم يعلّم الصف. توقّف بعد قبول الوسيط وقبل تثبيت القاعدة يترك الصف pending، فيُرسل مرة أخرى. هذا مرة واحدة على الأقل.", "kind يبقي order-outbox-publisher على نسخة واحدة حتى يتبع ترتيب النشر created_at. SKIP LOCKED وحده لا يحفظ الترتيب عبر ناشرين. لدى Odoo commerce_event_outbox في odoo_db لـ InventoryUpdated فقط. الناشر في services/odoo/src/commerce_erp/publisher.py يرفض أي نوع آخر."], "example": {"text": "المحل يكتب «الطلب 18 موجود» و«أعلنوا الطلب 18» في صفحة واحدة. ساعي ينسخ الإعلان إلى لوحة. إذا تعثّر الساعي، الصفحة ما زالت هناك لنسخها مرة أخرى. إذا نسخ جملة لم تُكتب، اللوحة تكذب. الصفحة هي المصدر. اللوحة ليست كذلك.", "code": "", "caption": ""}, "how": ["المعالج لا ينشر ولا ينتظر published_at. حجم الدفعة في التصميم في حدود 100، والاستطلاع نحو ثانية، والقفل ممسوك عبر تأكيد الوسيط. لا توجد حالة «أُخذ ثم نُشر». الصف الفاشل يعني أن هذا الناشر لم يحصل على تأكيد وسيط. الرسالة قد لا تكون على أي طابور. رسالة DLQ مختلفة: الوسيط قبلها، والمستهلك لم يستطع تطبيقها، وصف outbox قد يكون published أصلًا.", "مفاتيح التوجيه التي تستطيع خدمة الطلبات نشرها هي ROUTING_KEYS في application/publishing.py، بما فيها payment.confirmed وpayment.failed حين تبثّها الـ Saga."], "files": [{"path": "docs/outbox.md", "note": "النمط وحلقة الناشر"}, {"path": "docs/adr/ADR-005-why-outbox.md", "note": "لماذا ليس التثبيت على مرحلتين أو CDC أول درس"}, {"path": "services/order-service/src/order_service/infrastructure/messaging/outbox_publisher.py", "note": "ناشر SKIP LOCKED"}, {"path": "services/order-service/src/order_service/application/publishing.py", "note": "ROUTING_KEYS"}, {"path": "services/odoo/src/commerce_erp/publisher.py", "note": "InventoryUpdated فقط"}, {"path": "services/odoo/addons/commerce_connector/models/inventory.py", "note": "commerce_event_outbox"}], "trace": [{"title": "الإدراج", "who": "وحدة العمل", "what": "معاملة العمل تدرج JSON الظرف كاملًا.", "data": "outbox.status = pending، وpublished_at فارغ.", "fail": "إذا نُسي هذا الإدراج، لا يستطيع ناشر لاحق بناء حمولة موثوقة."}, {"title": "الحجز", "who": "الناشر", "what": "SELECT للصفوف المعلقة ORDER BY created_at, id FOR UPDATE SKIP LOCKED.", "data": "قفل صف.", "fail": "ناشران من غير SKIP LOCKED قد يتعطلان أو يرسلان مرتين. مع ناشرين، ترتيب الإصدار عبر الكيانات قد ينعكس."}, {"title": "التأكيد", "who": "الناشر", "what": "انشر payload إلى التبادل. عند تأكيد الوسيط، اضبط published.", "data": "message_id يساوي event_id. mandatory مفعّل.", "fail": "الرسائل التي لا تجد مسارًا تزيد retry_count. عند 5 تصبح الحالة failed."}, {"title": "نافذة التوقّف", "who": "الناشر", "what": "الوسيط قبل، وتثبيت القاعدة لم يحدث. الصف يبقى pending ويُنشر مرة أخرى.", "data": "event_id مكرر.", "fail": "المستهلكون يجب أن يعاملوا التكرار كأنه طُبِّق."}], "advantages": ["المستخدم لا ينتظر RabbitMQ.", "الحمولة هي الحقيقة التاريخية، وليست قراءة لاحقة لصف الطلب.", "وسيط متوقف يوقف التكامل ولا يتراجع عن إتمام الشراء."], "disadvantages": ["تسليم مرة واحدة على الأقل. بالضبط مرة واحدة غير مضبوط.", "ناشر واحد هو الافتراض التعليمي. توسعته تحتاج تقسيمًا حسب aggregate_id.", "صف outbox الفاشل يحتاج إنسانًا. حذفه لإسكات مقياس يخفي رسالة ناقصة."], "alternatives": ["النشر بعد التثبيت، والنشر قبل التثبيت، والتثبيت على مرحلتين، واستطلاع جداول الخدمات الأخرى خسرت في ADR-005.", "CDC بأسلوب Debezium مسجّل كبديل لاحق للمستطلع، وليس أول تنفيذ. الإدراج ما زال يريد أن يكون داخل تثبيت العمل."], "failures": [{"title": "توقّف الناشر", "text": "إتمام الشراء يبدو سليمًا. صفوف outbox تتراكم. عمر outbox هو الإشارة، لا سطر سجل قد يقرأه أحد. الاستعادة هي تشغيل الناشر."}, {"title": "حمولة سيئة", "text": "retry_count يبلغ الحد والحالة تصبح failed. أصلح الناشر أو الحمولة عمدًا، وأعد الصف إلى pending، وسجّل السبب."}], "tests": [{"path": "services/order-service/tests/unit/test_outbox.py", "note": "outbox خدمة الطلبات"}, {"path": "services/odoo/tests/test_publisher.py", "note": "ناشر Odoo يرفض غير InventoryUpdated"}], "quiz": [{"q": "هل تنتظر API حتى يؤكد الوسيط؟", "a": "لا. الانتظار كان سيضع الوسيط على مسار إتمام الشراء."}, {"q": "ما الفرق بين حالة outbox‏ failed ورسالة DLQ؟", "a": "failed تعني أن الناشر لم يحصل على تأكيد وسيط. رسالة DLQ قبلها الوسيط ولم يستطع مستهلك تطبيقها. صف outbox لتلك الحقيقة قد يكون published أصلًا."}, {"q": "لماذا ناشر outbox في kind نسخة واحدة؟", "a": "حتى يتبع ترتيب النشر created_at. SKIP LOCKED وحده لا يحفظ ذلك الترتيب عبر ناشرين."}], "summary": "صف outbox هو الرسالة. الناشر ينسخها إلى RabbitMQ بعد التثبيت. التكرار متوقع. صف outbox الفاشل والرسالة الميتة مشكلتان مختلفتان."}}, {"id": "rabbitmq", "status": "implemented", "en": {"title": "RabbitMQ topology", "lede": "Producers publish to exchanges with a routing key. They do not publish to queue names. Delivery is at least once.", "why": ["If the order service published straight to a queue, every new consumer would need a producer release, and a typo in a queue name would drop the message. An exchange with mandatory returns an unroutable publish to the publisher, which leaves the outbox row pending."], "explain": ["Topology name commerce-platform-topology. Topic exchanges commerce.events, erp.events, commerce.retry, and commerce.dlx are durable. The direct exchange commerce.commands was added for saga commands. Queues are durable and messages are persistent.", "declare_topology in the order service binds q.reporting.projection to order.*, product.*, customer.*, and payment.* on commerce.events, and to inventory.updated on erp.events. q.odoo.order-confirmed binds only order.confirmed. q.order.inventory binds inventory.updated. Command queues are q.odoo.reserve-inventory, q.odoo.release-inventory, q.odoo.create-sales-order, and q.odoo.cancel-sales-order.", "q.notification.delivery is declared by the notification service, not by declare_topology. It binds order.confirmed, order.cancelled, order.shipped, order.delivered, payment.confirmed, and payment.failed. Reporting must not bind to commerce.commands.", "Retry delays are 5 seconds, 30 seconds, 2 minutes, 10 minutes, and 30 minutes. The sixth failure, or a permanent failure, is published to commerce.dlx. Workers publish to commerce.retry themselves and then ack. requeue=true is not the failure path. rabbitmq.md still says the broker dead-letters onto commerce.retry without application code. That sentence is stale. Follow retry.py and the consumer delivery paths."], "example": {"text": "A post office sorts by the address on the envelope, not by the name of the mailbox. A new mailbox can subscribe to 'all letters for this street' without telling every sender to learn the mailbox number. If the address matches nothing, the letter comes back instead of vanishing.", "code": "RETRY_DELAYS_MS = (5_000, 30_000, 120_000, 600_000, 1_800_000)", "caption": "Five delays, then the dead-letter exchange"}, "how": ["The inventory worker, the reporting consumer, the Odoo consumer, and the notification consumer use manual ack. A permanent failure (malformed body, unknown type, schema version the consumer does not understand) goes to commerce.dlx without spending the five delays. An older inventory snapshot is acked and ignored. Nothing consumes a DLQ automatically.", "Phase 14 runs two order-inventory-consumer pods and two reporting-consumer pods. Prefetch starts at 10. Competing consumers remove per-queue order, so handlers use aggregate_version. The outbox publisher stays one process."], "files": [{"path": "docs/rabbitmq.md", "note": "Exchanges, bindings, and the stale retry sentence"}, {"path": "docs/adr/ADR-003-why-rabbitmq.md", "note": "Why not Kafka or Redis as the bus"}, {"path": "services/order-service/src/order_service/infrastructure/messaging/topology.py", "note": "declare_topology"}, {"path": "services/order-service/src/order_service/infrastructure/messaging/retry.py", "note": "Publish to commerce.retry, then ack"}, {"path": "services/notification-service/src/notification_service/topology.py", "note": "q.notification.delivery"}, {"path": "docs/events.md", "note": "Envelope and aggregate_version"}], "trace": [{"title": "Publish", "who": "Outbox publisher or Odoo publisher", "what": "Send the stored body to commerce.events, erp.events, or commerce.commands.", "data": "Routing key, persistent message, publisher confirm.", "fail": "mandatory surfaces an unroutable key. The outbox row stays pending, then can become failed."}, {"title": "Queue", "who": "RabbitMQ", "what": "One matching consumer gets the message. Several workers on q.reporting.projection compete.", "data": "Durable queue.", "fail": "A down consumer leaves the queue to grow. Checkout has already finished."}, {"title": "Apply", "who": "Consumer", "what": "Write the local database and the processed event in one transaction, then ack.", "data": "processed_events.event_id.", "fail": "A crash after commit and before ack redelivers. The second apply must be a duplicate."}, {"title": "Retry", "who": "Worker", "what": "On a handled failure, publish to commerce.retry with x-retry-count and routing key {prefix}.retry.{attempt}, confirm, then ack the original.", "data": "TTL queue, then back to the original exchange.", "fail": "nack with requeue=false on a primary queue that has no dead-letter argument would drop the message. The workers do not do that."}, {"title": "Dead letter", "who": "Worker", "what": "After five delays, or immediately for a poison body, publish to commerce.dlx.", "data": "q.reporting.projection.dlq, q.odoo.order-confirmed.dlq, q.order.inventory.dlq, and the notification DLQ.", "fail": "Acking a DLQ to make an alert green drops the only copy of a poison message."}], "advantages": ["A new reader binds a queue. The order service does not change.", "Odoo down does not fail the HTTP confirm. Messages wait on Odoo's queue.", "Two exchanges split credentials: Odoo can publish erp.events and cannot forge OrderConfirmed on commerce.events."], "disadvantages": ["At least once. RabbitMQ will not dedupe by event_id.", "Competing consumers do not keep queue order.", "The retry description in rabbitmq.md and the code disagree. Readers must notice that."], "alternatives": ["Kafka lost in ADR-003 for this classroom size: partitions and retention before a single projection existed.", "Redis as the bus would blur the rule that Redis is not the source of truth.", "HTTP callbacks only would fail checkout when Odoo is down, or grow a private retry queue."], "failures": [{"title": "Broker down", "text": "Confirm still commits. Rows stay pending. When the volume was wiped, the topology must be declared from code before the drain, or publishes become unroutable and rows become failed."}, {"title": "Poison payload", "text": "Retries follow the backoff, then the message sits in that consumer's DLQ. Later messages continue. Recovery is fix, then replay with a written reason."}], "tests": [{"path": "services/order-service/tests/unit/test_reliability.py", "note": "Idempotent inventory apply, retry, DLQ"}, {"path": "services/reporting-service/projections/tests/test_apply.py", "note": "Duplicate event does not double-apply"}, {"path": "services/notification-service/tests/test_delivery.py", "note": "Failing adapter retries, then dead-letters"}], "quiz": [{"q": "Who publishes to commerce.retry?", "a": "The workers. They publish, confirm, and ack. It is not a broker dead-letter argument on the primary queue, despite the older sentence in rabbitmq.md."}, {"q": "Which binding stops Odoo from receiving OrderCreated?", "a": "q.odoo.order-confirmed is bound only to order.confirmed. There is no binding for order.created."}, {"q": "What makes two reporting consumers safe?", "a": "processed_events in the same transaction as the projection, plus aggregate_version. The broker does not dedupe."}], "summary": "Exchanges are the address. Queues belong to consumers. Five application retries lead to a dead letter. Duplicates are normal, and the code publishes retries itself."}, "ar": {"title": "طوبولوجيا RabbitMQ", "lede": "المنتجون ينشرون إلى التبادلات بمفتاح توجيه. لا ينشرون إلى أسماء الطوابير. التسليم مرة واحدة على الأقل.", "why": ["لو نشرت خدمة الطلبات مباشرة إلى طابور، كل مستهلك جديد كان سيحتاج إصدارًا من المنتج، وخطأ في اسم الطابور كان سيُسقط الرسالة. التبادل مع mandatory يعيد النشر الذي لا يجد مسارًا إلى الناشر، فيبقى صف outbox معلقًا."], "explain": ["اسم الطوبولوجيا commerce-platform-topology. تبادلات الموضوع commerce.events وerp.events وcommerce.retry وcommerce.dlx متينة. التبادل المباشر commerce.commands أُضيف لأوامر الـ Saga. الطوابير متينة والرسائل دائمة.", "declare_topology في خدمة الطلبات يربط q.reporting.projection بـ order.* وproduct.* وcustomer.* وpayment.* على commerce.events، وبـ inventory.updated على erp.events. q.odoo.order-confirmed يربط order.confirmed فقط. q.order.inventory يربط inventory.updated. طوابير الأوامر هي q.odoo.reserve-inventory وq.odoo.release-inventory وq.odoo.create-sales-order وq.odoo.cancel-sales-order.", "q.notification.delivery تعلنه خدمة الإشعارات، لا declare_topology. يربط order.confirmed وorder.cancelled وorder.shipped وorder.delivered وpayment.confirmed وpayment.failed. التقارير يجب ألا ترتبط بـ commerce.commands.", "تأخيرات إعادة المحاولة 5 ثوانٍ و30 ثانية ودقيقتان و10 دقائق و30 دقيقة. الفشل السادس، أو الفشل الدائم، يُنشر إلى commerce.dlx. العاملات تنشر إلى commerce.retry بنفسها ثم تعمل ack. requeue=true ليس مسار الفشل. rabbitmq.md ما زال يقول إن الوسيط يحوّل إلى commerce.retry من غير كود تطبيق. تلك الجملة قديمة. اتبع retry.py ومسارات التسليم."], "example": {"text": "مكتب بريد يفرز حسب العنوان على الظرف، لا حسب اسم الصندوق. صندوق جديد يستطيع الاشتراك في «كل رسائل هذا الشارع» من غير أن يتعلّم كل مرسل رقم الصندوق. إذا لم يطابق العنوان شيئًا، ترجع الرسالة بدل أن تختفي.", "code": "RETRY_DELAYS_MS = (5_000, 30_000, 120_000, 600_000, 1_800_000)", "caption": "خمسة تأخيرات، ثم تبادل الرسائل الميتة"}, "how": ["عامل المخزون ومستهلك التقارير ومستهلك Odoo ومستهلك الإشعارات يستخدمون ack يدويًا. الفشل الدائم (جسم مشوّه، أو نوع مجهول، أو إصدار مخطط لا يفهمه المستهلك) يذهب إلى commerce.dlx من غير صرف التأخيرات الخمسة. لقطة مخزون أقدم تُؤكَّد وتُتجاهل. لا شيء يستهلك DLQ تلقائيًا.", "المرحلة 14 تشغّل حاضنتين لـ order-inventory-consumer وحاضنتين لـ reporting-consumer. prefetch يبدأ من 10. المستهلكون المتنافسون يزيلون ترتيب الطابور، لذلك المعالجات تستخدم aggregate_version. ناشر outbox يبقى عملية واحدة."], "files": [{"path": "docs/rabbitmq.md", "note": "التبادلات والربط والجملة القديمة عن إعادة المحاولة"}, {"path": "docs/adr/ADR-003-why-rabbitmq.md", "note": "لماذا ليس Kafka أو Redis ناقلًا"}, {"path": "services/order-service/src/order_service/infrastructure/messaging/topology.py", "note": "declare_topology"}, {"path": "services/order-service/src/order_service/infrastructure/messaging/retry.py", "note": "انشر إلى commerce.retry ثم ack"}, {"path": "services/notification-service/src/notification_service/topology.py", "note": "q.notification.delivery"}, {"path": "docs/events.md", "note": "الظرف وaggregate_version"}], "trace": [{"title": "النشر", "who": "ناشر outbox أو ناشر Odoo", "what": "أرسل الجسم المخزّن إلى commerce.events أو erp.events أو commerce.commands.", "data": "مفتاح توجيه، رسالة دائمة، تأكيد ناشر.", "fail": "mandatory يُظهر مفتاحًا بلا مسار. صف outbox يبقى pending ثم قد يصبح failed."}, {"title": "الطابور", "who": "RabbitMQ", "what": "مستهلك مطابق واحد يأخذ الرسالة. عدة عاملات على q.reporting.projection تتنافس.", "data": "طابور متين.", "fail": "مستهلك متوقف يترك الطابور يكبر. إتمام الشراء انتهى أصلًا."}, {"title": "التطبيق", "who": "المستهلك", "what": "اكتب القاعدة المحلية والحدث المعالج في معاملة واحدة، ثم ack.", "data": "processed_events.event_id.", "fail": "توقّف بعد التثبيت وقبل ack يعيد التسليم. التطبيق الثاني يجب أن يكون تكرارًا."}, {"title": "إعادة المحاولة", "who": "العاملة", "what": "عند فشل معالَج، انشر إلى commerce.retry مع x-retry-count ومفتاح {prefix}.retry.{attempt}، وأكّد، ثم ack للأصل.", "data": "طابور TTL، ثم العودة إلى التبادل الأصلي.", "fail": "nack مع requeue=false على طابور أساسي بلا وسيطة رسالة ميتة كان سيُسقط الرسالة. العاملات لا تفعل ذلك."}, {"title": "رسالة ميتة", "who": "العاملة", "what": "بعد خمسة تأخيرات، أو فورًا لجسم سام، انشر إلى commerce.dlx.", "data": "q.reporting.projection.dlq وq.odoo.order-confirmed.dlq وq.order.inventory.dlq وDLQ الإشعارات.", "fail": "عمل ack لـ DLQ لتخضير تنبيه يُسقط النسخة الوحيدة من رسالة سامة."}], "advantages": ["قارئ جديد يربط طابورًا. خدمة الطلبات لا تتغير.", "توقّف Odoo لا يفشل تأكيد HTTP. الرسائل تنتظر على طابور Odoo.", "تبادلان يقسمان الصلاحيات: Odoo يستطيع نشر erp.events ولا يستطيع تزوير OrderConfirmed على commerce.events."], "disadvantages": ["مرة واحدة على الأقل. RabbitMQ لن يزيل التكرار حسب event_id.", "المستهلكون المتنافسون لا يحفظون ترتيب الطابور.", "وصف إعادة المحاولة في rabbitmq.md والكود يختلفان. على القارئ أن يلاحظ ذلك."], "alternatives": ["Kafka خسر في ADR-003 لهذا الحجم التعليمي: الأقسام والاحتفاظ قبل أن يوجد إسقاط واحد.", "Redis ناقلًا كان سيطمس قاعدة أن Redis ليس مصدر الحقيقة.", "نداءات HTTP فقط كانت ستفشل إتمام الشراء حين يكون Odoo متوقفًا، أو ستكبّر طابور إعادة محاولة خاصًا."], "failures": [{"title": "توقّف الوسيط", "text": "التأكيد ما زال يُثبَّت. الصفوف تبقى pending. إذا مُسح الحجم، يجب إعلان الطوبولوجيا من الكود قبل التفريغ، وإلا يصبح النشر بلا مسار وتصبح الصفوف failed."}, {"title": "حمولة سامة", "text": "إعادة المحاولة تتبع التأخير، ثم تجلس الرسالة في DLQ ذلك المستهلك. الرسائل اللاحقة تستمر. الاستعادة هي الإصلاح ثم إعادة التشغيل بسبب مكتوب."}], "tests": [{"path": "services/order-service/tests/unit/test_reliability.py", "note": "تطبيق مخزون بلا تكرار، وإعادة محاولة، وDLQ"}, {"path": "services/reporting-service/projections/tests/test_apply.py", "note": "حدث مكرر لا يُطبَّق مرتين"}, {"path": "services/notification-service/tests/test_delivery.py", "note": "محوّل فاشل يعيد المحاولة ثم يحوّل إلى الرسالة الميتة"}], "quiz": [{"q": "من ينشر إلى commerce.retry؟", "a": "العاملات. تنشر وتؤكّد وتعمل ack. ليست وسيطة رسالة ميتة على الطابور الأساسي، رغم الجملة الأقدم في rabbitmq.md."}, {"q": "أي ربط يمنع Odoo من استلام OrderCreated؟", "a": "q.odoo.order-confirmed مربوط بـ order.confirmed فقط. لا ربط لـ order.created."}, {"q": "ما الذي يجعل مستهلكَي تقارير آمنين؟", "a": "processed_events في نفس معاملة الإسقاط، مع aggregate_version. الوسيط لا يزيل التكرار."}], "summary": "التبادلات هي العنوان. الطوابير للمستهلكين. خمس إعادات محاولة من التطبيق تؤدي إلى رسالة ميتة. التكرار طبيعي، والكود هو الذي ينشر إعادات المحاولة."}}, {"id": "saga", "status": "partial", "en": {"title": "Saga orchestration", "lede": "The saga is a row in order_db, not a service. The orchestrator and the eight scenarios are implemented. The shipped worker does not reach COMPLETED against a running Odoo.", "limits": ["python -m order_service.infrastructure.saga.worker uses WaitingInventory and WaitingErp. Every lookup and command returns unknown('odoo-unavailable'). The first reserve still writes a ReserveInventory outbox row, then later loops look up and return without a second reserve. Status stays STARTED. Compose does not define a saga-worker service.", "The eight scenarios in test_saga_scenarios.py drive advance() with test ports. They are not a live Odoo reply."], "why": ["A database transaction in order_db cannot commit a reservation in odoo_db or a charge at a payment provider. The orchestrator records how far this order has gone, sends the next command, and compensates when a later step fails for certain. Compensation is a new local commit. It is not ROLLBACK of a transaction that already committed."], "explain": ["Confirm returns when order_db commits. The row starts at STARTED. Legal saga statuses: STARTED, INVENTORY_RESERVED, PAYMENT_CONFIRMED, ODOO_ORDER_CREATED, COMPLETED, COMPENSATING, COMPENSATED, FAILED, MANUAL_INTERVENTION_REQUIRED. An unknown outcome does not change status.", "COMPLETED means reserve, simulated payment, and ERP create finished. The order status stays CONFIRMED. A payment failure does not cancel the order. FAILED means reserve was rejected and nothing was held. Failed compensation becomes MANUAL_INTERVENTION_REQUIRED, not COMPENSATED.", "Commands on commerce.commands: ReserveInventory (inventory.reserve), ReleaseInventory (inventory.release), CreateErpOrder (erp.create-sales-order), CancelErpOrder (erp.cancel-sales-order). Each payload carries idempotency_key. SimulatedPayment lives in the order service. PaymentConfirmed and PaymentFailed go through the outbox. A recorded refund is not a guaranteed movement of money. payment_circuit_state is 0 closed, 1 half-open, 2 open. The worker copies the adapter into that gauge."], "example": {"text": "You book a hall, then pay, then tell the caterer. If payment is declined, you call the hall and cancel the booking. Cancelling the booking is a new phone call. It does not undo the ink on the booking form. If the hall does not answer the cancellation, you do not write 'all sorted' in the book. You write that a person must look.", "code": "", "caption": ""}, "how": ["advance() in application/saga/orchestrator.py moves at most one remote step, then the caller commits the saga, the order, and the outbox together. orders.saga_status is set from the saga row in that same call.", "Odoo applies the command bodies. A second ReserveInventory with the same order keeps one reservation. OrderConfirmed is still published for reporting. services/odoo/src/commerce_erp/confirmed.py records it and does not create a sales order. CreateErpOrder creates the sales order."], "files": [{"path": "docs/saga-pattern.md", "note": "States, commands, and the eight scenarios"}, {"path": "services/order-service/src/order_service/domain/entities/saga_status.py", "note": "ALLOWED_SAGA_TRANSITIONS"}, {"path": "services/order-service/src/order_service/application/saga/orchestrator.py", "note": "advance"}, {"path": "services/order-service/src/order_service/application/saga/payment.py", "note": "SimulatedPayment"}, {"path": "services/order-service/src/order_service/infrastructure/saga/worker.py", "note": "Live ports return unknown"}, {"path": "services/odoo/src/commerce_erp/commands.py", "note": "Idempotent reserve and create"}], "trace": [{"title": "Confirm", "who": "ConfirmOrder", "what": "Commit CONFIRMED, STARTED, and OrderConfirmed. Do not call Odoo.", "data": "order_db.", "fail": "This response is not saga COMPLETED.", "status": ""}, {"title": "Reserve", "who": "Orchestrator, then Odoo when a consumer is running", "what": "Write ReserveInventory to the outbox. On success the saga becomes INVENTORY_RESERVED. The shipped worker records unknown instead.", "data": "commerce.commands / q.odoo.reserve-inventory. One commerce.reservation per order id.", "fail": "A timeout is unknown. The next step looks the reservation up and does not send a second reserve while the lookup is unknown."}, {"title": "Pay", "who": "SimulatedPayment", "what": "Charge locally. Success emits PaymentConfirmed and moves to PAYMENT_CONFIRMED. Decline emits PaymentFailed and starts compensation. The order status stays CONFIRMED.", "data": "outbox payment event. Circuit gauge.", "fail": "circuit_open fails the charge and compensation runs. There is no card network."}, {"title": "ERP create", "who": "Odoo command consumer", "what": "CreateErpOrder inserts one sale.order, or a lookup finds it.", "data": "odoo_db.", "fail": "The shipped worker never reaches this step against live Odoo because reserve stays unknown."}, {"title": "Compensate", "who": "Orchestrator", "what": "Release inventory, simulated refund, or CancelErpOrder. Success ends COMPENSATED. A failed release or refund ends MANUAL_INTERVENTION_REQUIRED.", "data": "New outbox commands. Order still CONFIRMED.", "fail": "Do not mark COMPENSATED when the hold is still there."}], "advantages": ["The workflow and its failures are readable on one row.", "Process memory is not the record. A restart reads saga_instances.", "Idempotency keys stop a duplicate command from reserving twice."], "disadvantages": ["The live worker cannot finish the happy path until a command reply exists. That reply is not in this tree.", "Compensation is not a guaranteed refund.", "Orchestration puts the workflow in one service. A choreography would spread the next step across consumers and be harder to read here."], "alternatives": ["A separate saga service was refused in the extension decisions.", "Pretending the saga is ACID was rejected in ADR-006. ROLLBACK does not undo Odoo."], "failures": [{"title": "Odoo unavailable in the scenarios", "text": "Scenario 4 leaves the saga STARTED. The reserve outcome is unknown. The next step looks up and does not send a second reserve while the lookup is unknown."}, {"title": "Compensation fails", "text": "Scenario 7: release failed after a declined charge. Status is MANUAL_INTERVENTION_REQUIRED. The hold is still there."}, {"title": "Crash halfway", "text": "Scenario 6 restarts from INVENTORY_RESERVED, does not reserve again, and charges once. Scenario 8 looks up a reservation that already exists and continues without a second reserve."}], "tests": [{"path": "services/order-service/tests/unit/test_saga_scenarios.py", "note": "Eight scenarios plus refund failure and compensation resume"}, {"path": "services/odoo/tests/test_commands.py", "note": "Duplicate reserve, create, release, and cancel"}, {"path": "services/odoo/tests/test_confirmed.py", "note": "OrderConfirmed does not create a sales order"}], "quiz": [{"q": "What does the shipped worker do on the first reserve?", "a": "It writes the ReserveInventory outbox row, notes the step unknown, and leaves the saga STARTED. It does not mark the reservation succeeded."}, {"q": "Does a declined payment cancel the order?", "a": "No. The order stays CONFIRMED. The saga compensates. COMPENSATED still leaves the order CONFIRMED."}, {"q": "Who creates the sales order?", "a": "The Odoo consumer of CreateErpOrder. Not the OrderConfirmed consumer."}], "summary": "Saga state is a row committed with the order and the outbox. The test ports show all eight outcomes. The process you can run beside the API does not complete a live Odoo reservation."}, "ar": {"title": "تنسيق الـ Saga", "lede": "الـ Saga صف في order_db، وليست خدمة. المنسّق والسيناريوهات الثمانية منفَّذة. العامل المرفق لا يصل إلى COMPLETED مع Odoo شغّال.", "limits": ["python -m order_service.infrastructure.saga.worker يستخدم WaitingInventory وWaitingErp. كل بحث وأمر يرجع unknown('odoo-unavailable'). أول حجز ما زال يكتب صف outbox من نوع ReserveInventory، ثم الحلقات اللاحقة تبحث وترجع من غير حجز ثانٍ. الحالة تبقى STARTED. Compose لا يعرّف خدمة saga-worker.", "السيناريوهات الثمانية في test_saga_scenarios.py تقود advance() بمنافذ اختبار. ليست رد Odoo حيًا."], "why": ["معاملة في order_db لا تستطيع تثبيت حجز في odoo_db أو خصمًا عند مزوّد دفع. المنسّق يسجّل إلى أين وصل هذا الطلب، ويرسل الأمر التالي، ويعوّض حين تفشل خطوة لاحقة بشكل معلوم. التعويض تثبيت محلي جديد. ليس ROLLBACK لمعاملة ثُبّتت."], "explain": ["التأكيد يرجع حين تثبّت order_db. الصف يبدأ عند STARTED. حالات الـ Saga المسموحة: STARTED وINVENTORY_RESERVED وPAYMENT_CONFIRMED وODOO_ORDER_CREATED وCOMPLETED وCOMPENSATING وCOMPENSATED وFAILED وMANUAL_INTERVENTION_REQUIRED. النتيجة المجهولة لا تغيّر الحالة.", "COMPLETED تعني انتهاء الحجز والدفع المحاكى وإنشاء ERP. حالة الطلب تبقى CONFIRMED. فشل الدفع لا يلغي الطلب. FAILED تعني أن الحجز رُفض ولم يُمسك شيء. تعويض فاشل يصبح MANUAL_INTERVENTION_REQUIRED، لا COMPENSATED.", "الأوامر على commerce.commands: ReserveInventory‏ (inventory.reserve) وReleaseInventory‏ (inventory.release) وCreateErpOrder‏ (erp.create-sales-order) وCancelErpOrder‏ (erp.cancel-sales-order). كل حمولة تحمل idempotency_key. SimulatedPayment يعيش في خدمة الطلبات. PaymentConfirmed وPaymentFailed يمران عبر outbox. استرداد مسجّل ليس حركة مال مضمونة. payment_circuit_state هو 0 مغلق و1 نصف مفتوح و2 مفتوح. العامل ينسخ المحوّل إلى ذلك المقياس."], "example": {"text": "تحجز قاعة، ثم تدفع، ثم تخبر المطعّم. إذا رُفض الدفع، تتصل بالقاعة وتلغي الحجز. إلغاء الحجز مكالمة جديدة. لا يمسح الحبر على استمارة الحجز. إذا لم ترد القاعة على الإلغاء، لا تكتب «تم كل شيء» في الدفتر. تكتب أن شخصًا يجب أن ينظر.", "code": "", "caption": ""}, "how": ["advance() في application/saga/orchestrator.py يحرّك خطوة بعيدة واحدة على الأكثر، ثم المستدعي يثبّت الـ Saga والطلب وoutbox معًا. orders.saga_status يُضبط من صف الـ Saga في نفس النداء.", "Odoo يطبّق أجسام الأوامر. ReserveInventory ثانٍ لنفس الطلب يبقي حجزًا واحدًا. OrderConfirmed ما زال يُنشر للتقارير. services/odoo/src/commerce_erp/confirmed.py يسجّله ولا ينشئ أمر بيع. CreateErpOrder ينشئ أمر البيع."], "files": [{"path": "docs/saga-pattern.md", "note": "الحالات والأوامر والسيناريوهات الثمانية"}, {"path": "services/order-service/src/order_service/domain/entities/saga_status.py", "note": "ALLOWED_SAGA_TRANSITIONS"}, {"path": "services/order-service/src/order_service/application/saga/orchestrator.py", "note": "advance"}, {"path": "services/order-service/src/order_service/application/saga/payment.py", "note": "SimulatedPayment"}, {"path": "services/order-service/src/order_service/infrastructure/saga/worker.py", "note": "المنافذ الحية ترجع unknown"}, {"path": "services/odoo/src/commerce_erp/commands.py", "note": "حجز وإنشاء بلا تكرار"}], "trace": [{"title": "التأكيد", "who": "ConfirmOrder", "what": "ثبّت CONFIRMED وSTARTED وOrderConfirmed. لا تنادِ Odoo.", "data": "order_db.", "fail": "هذا الرد ليس COMPLETED."}, {"title": "الحجز", "who": "المنسّق، ثم Odoo حين يكون المستهلك شغّالًا", "what": "اكتب ReserveInventory في outbox. عند النجاح تصبح الـ Saga على INVENTORY_RESERVED. العامل المرفق يسجّل unknown بدل ذلك.", "data": "commerce.commands / q.odoo.reserve-inventory. حجز commerce.reservation واحد لكل معرّف طلب.", "fail": "المهلة نتيجة مجهولة. الخطوة التالية تبحث عن الحجز ولا ترسل حجزًا ثانيًا ما دام البحث مجهولًا."}, {"title": "الدفع", "who": "SimulatedPayment", "what": "خصم محلي. النجاح يبث PaymentConfirmed وينتقل إلى PAYMENT_CONFIRMED. الرفض يبث PaymentFailed ويبدأ التعويض. حالة الطلب تبقى CONFIRMED.", "data": "حدث دفع في outbox. مقياس القاطع.", "fail": "circuit_open يفشل الخصم ويجري التعويض. لا توجد شبكة بطاقات."}, {"title": "إنشاء ERP", "who": "مستهلك أوامر Odoo", "what": "CreateErpOrder يدرج sale.order واحدًا، أو البحث يجده.", "data": "odoo_db.", "fail": "العامل المرفق لا يصل إلى هذه الخطوة مع Odoo حي لأن الحجز يبقى unknown."}, {"title": "التعويض", "who": "المنسّق", "what": "تحرير المخزون، أو استرداد محاكى، أو CancelErpOrder. النجاح ينتهي COMPENSATED. تحرير أو استرداد فاشل ينتهي MANUAL_INTERVENTION_REQUIRED.", "data": "أوامر outbox جديدة. الطلب ما زال CONFIRMED.", "fail": "لا تعلّم COMPENSATED والحجز ما زال موجودًا."}], "advantages": ["سير العمل وأعطاله مقروءان على صف واحد.", "ذاكرة العملية ليست السجل. إعادة التشغيل تقرأ saga_instances.", "مفاتيح عدم التكرار تمنع أمرًا مكررًا من الحجز مرتين."], "disadvantages": ["العامل الحي لا يستطيع إنهاء المسار السعيد حتى يوجد رد للأمر. ذلك الرد ليس في هذه الشجرة.", "التعويض ليس استردادًا مضمونًا.", "التنسيق يضع سير العمل في خدمة واحدة. التصميم بالأحداث كان سينشر الخطوة التالية على المستهلكين ويصعب قراءته هنا."], "alternatives": ["خدمة Saga منفصلة رُفضت في قرارات الامتداد.", "ادّعاء أن الـ Saga هي ACID رُفض في ADR-006. ROLLBACK لا يتراجع عن Odoo."], "failures": [{"title": "Odoo غير متاح في السيناريوهات", "text": "السيناريو 4 يترك الـ Saga على STARTED. نتيجة الحجز مجهولة. الخطوة التالية تبحث ولا ترسل حجزًا ثانيًا ما دام البحث مجهولًا."}, {"title": "فشل التعويض", "text": "السيناريو 7: التحرير فشل بعد خصم مرفوض. الحالة MANUAL_INTERVENTION_REQUIRED. الحجز ما زال هناك."}, {"title": "توقّف في المنتصف", "text": "السيناريو 6 يعيد التشغيل من INVENTORY_RESERVED، ولا يحجز مرة أخرى، ويخصم مرة واحدة. السيناريو 8 يبحث عن حجز موجود ويستمر من غير حجز ثانٍ."}], "tests": [{"path": "services/order-service/tests/unit/test_saga_scenarios.py", "note": "ثمانية سيناريوهات بالإضافة إلى فشل الاسترداد واستئناف التعويض"}, {"path": "services/odoo/tests/test_commands.py", "note": "حجز وإنشاء وتحرير وإلغاء مكررة"}, {"path": "services/odoo/tests/test_confirmed.py", "note": "OrderConfirmed لا ينشئ أمر بيع"}], "quiz": [{"q": "ماذا يفعل العامل المرفق في أول حجز؟", "a": "يكتب صف outbox من نوع ReserveInventory، ويعلّم الخطوة unknown، ويترك الـ Saga على STARTED. لا يعلّم الحجز ناجحًا."}, {"q": "هل الدفع المرفوض يلغي الطلب؟", "a": "لا. الطلب يبقى CONFIRMED. الـ Saga تعوّض. COMPENSATED أيضًا تترك الطلب CONFIRMED."}, {"q": "من ينشئ أمر البيع؟", "a": "مستهلك Odoo لأمر CreateErpOrder. ليس مستهلك OrderConfirmed."}], "summary": "حالة الـ Saga صف يُثبَّت مع الطلب وoutbox. منافذ الاختبار تُظهر النتائج الثمانية. العملية التي يمكن تشغيلها بجانب API لا تكمل حجز Odoo حيًا."}}, {"id": "consistency", "status": "implemented", "en": {"title": "Strong and eventual consistency", "lede": "Strong consistency is one order_db transaction. reporting_db and odoo_db catch up. A reader can be stale on purpose.", "why": ["Calling Django and Odoo inside confirm would make checkout as slow as the slowest of them. The matrix says, for each fact, who is the authority and who is allowed to lag."], "explain": ["After create, GET on the order service returns PENDING. The report does not have the row until OrderCreated is applied. After confirm, GET returns CONFIRMED and saga_status STARTED. Django can still be missing, or PENDING at version 1, while the order row is CONFIRMED at version 2. as_of is the newest projection timestamp, not the order-service clock.", "Payment projections lag until payment.* is applied. The order status stays CONFIRMED. Stock on the product page is inventory_snapshots, a projection of InventoryUpdated. Odoo remains the stock authority. Django inventory_projections can lag both Odoo and the snapshot.", "The walkthrough uses the in-memory order unit of work and the reporting suite's SQLite database. It does not start Compose or kind. Applying OrderConfirmed again is a duplicate and does not add a second row."], "example": {"text": "The cashier's book says the sale is confirmed at 10:01. The accountant's book still shows yesterday until the note arrives at 10:04. Both books are doing their job. Quoting the accountant's book as the sale time is the mistake.", "code": "", "caption": ""}, "how": ["export_confirmed_order in the consistency test confirms an order at version 2 with saga STARTED and the OrderConfirmed envelope in that snapshot. The reporting test then finds no projection, applies only OrderCreated (PENDING version 1), then OrderConfirmed (CONFIRMED version 2).", "A completed saga in the export test leaves the order CONFIRMED at version 3, with PaymentConfirmed in the outbox and no OrderDelivered. The projection stays CONFIRMED after the payment event is applied. Saga commands are not projected as order status."], "files": [{"path": "docs/consistency-models.md", "note": "The matrix"}, {"path": "docs/adr/ADR-006-why-eventual-consistency.md", "note": "Why confirm does not wait"}, {"path": "services/reporting-service/projections/apply.py", "note": "Projection and processed_events commit together"}, {"path": "services/order-service/tests/unit/test_consistency_export.py", "note": "Order row ahead of any projection"}, {"path": "services/reporting-service/projections/tests/test_consistency_lag.py", "note": "Missing, then PENDING, then CONFIRMED"}], "trace": [{"title": "Authority", "who": "order_db", "what": "The create or confirm commit is the fact.", "data": "orders plus outbox.", "fail": "If this commit rolls back, no reader should invent the order."}, {"title": "Gap", "who": "Django", "what": "GET /api/v1/reports/orders can omit the order or show an older version.", "data": "order_projections.", "fail": "Treating the report as the checkout result will confuse a support call."}, {"title": "Catch-up", "who": "reporting-consumer", "what": "Apply OrderConfirmed. The projection version matches. A second delivery does not insert another row.", "data": "processed_events.", "fail": "Applying the business write outside the dedup transaction doubles revenue."}, {"title": "Stock", "who": "Odoo, then two projections", "what": "Odoo stock is authority. inventory_snapshots lags until InventoryUpdated. The report can lag the snapshot too.", "data": "odoo_db, order_db, reporting_db.", "fail": "A product page quantity is not a reservation."}], "advantages": ["Checkout stays available when reporting or Odoo is slow.", "The matrix makes the lag explicit instead of calling it a bug.", "Idempotent apply makes a replay after restore safe."], "disadvantages": ["Two screens can disagree for a while.", "There is no single timestamp across databases.", "Saga COMPLETED is easy to misread as delivery."], "alternatives": ["Synchronous calls inside confirm, blocking until consumers ack, and strong consistency for inventory only all lost in ADR-006.", "SQL views on order_db would keep reports consistent and would put a long query on the checkout database. ADR-002 refuses that."], "failures": [{"title": "Report missing after confirm", "text": "Expected until OrderConfirmed is applied. Do not confirm again. Look at the outbox row and the reporting consumer."}, {"title": "Payment row empty while the saga is PAYMENT_CONFIRMED", "text": "The payment projection waits for the reporting consumer. The order status is still CONFIRMED."}], "tests": [{"path": "services/order-service/tests/unit/test_consistency_export.py", "note": "Included in the 9 October 2026 run recorded in testing.md"}, {"path": "services/reporting-service/projections/tests/test_consistency_lag.py", "note": "Projection lag"}], "quiz": [{"q": "After confirm returns, what does GET on the order service show?", "a": "CONFIRMED and saga_status STARTED. That read is the order row, not the projection."}, {"q": "What can Django show at that same moment?", "a": "No row, or PENDING at version 1 if only OrderCreated was applied. It matches after OrderConfirmed is applied."}, {"q": "Is inventory_snapshots the stock authority?", "a": "No. It is a projection of InventoryUpdated. Odoo is the authority."}], "summary": "The order row is immediately consistent with its own commit. Reports, ERP documents, and stock snapshots catch up later. The lag is the design."}, "ar": {"title": "الاتساق القوي والاتساق النهائي", "lede": "الاتساق القوي معاملة واحدة في order_db. reporting_db وodoo_db يلحقان. القارئ قد يكون قديمًا عن قصد.", "why": ["نداء Django وOdoo داخل التأكيد كان سيجعل إتمام الشراء ببطء أبطأهما. المصفوفة تقول، لكل حقيقة، من السلطة ومن المسموح له أن يتأخر."], "explain": ["بعد الإنشاء، GET على خدمة الطلبات يرجع PENDING. التقرير لا يملك الصف حتى يُطبَّق OrderCreated. بعد التأكيد، GET يرجع CONFIRMED وsaga_status بقيمة STARTED. Django قد يبقى غائبًا، أو PENDING عند الإصدار 1، بينما صف الطلب CONFIRMED عند الإصدار 2. as_of هو أحدث طابع زمني للإسقاط، وليس ساعة خدمة الطلبات.", "إسقاطات الدفع تتأخر حتى يُطبَّق payment.*. حالة الطلب تبقى CONFIRMED. المخزون في صفحة المنتج هو inventory_snapshots، إسقاط لـ InventoryUpdated. Odoo يبقى سلطة المخزون. inventory_projections في Django قد تتأخر عن Odoo وعن اللقطة.", "الجولة تستخدم وحدة عمل الطلبات في الذاكرة وقاعدة SQLite لمجموعة التقارير. لا تشغّل Compose أو kind. تطبيق OrderConfirmed مرة أخرى تكرار ولا يضيف صفًا ثانيًا."], "example": {"text": "دفتر الكاشير يقول إن البيع تأكد في 10:01. دفتر المحاسب ما زال يُظهر الأمس حتى تصل الملاحظة في 10:04. الدفتران يؤديان عملهما. اقتباس دفتر المحاسب كوقت البيع هو الخطأ.", "code": "", "caption": ""}, "how": ["export_confirmed_order في اختبار الاتساق يؤكّد طلبًا عند الإصدار 2 مع STARTED وظرف OrderConfirmed في تلك اللقطة. اختبار التقارير يجد بعد ذلك بلا إسقاط، ويطبّق OrderCreated فقط (PENDING إصدار 1)، ثم OrderConfirmed‏ (CONFIRMED إصدار 2).", "Saga مكتملة في اختبار التصدير تترك الطلب CONFIRMED عند الإصدار 3، مع PaymentConfirmed في outbox ومن غير OrderDelivered. الإسقاط يبقى CONFIRMED بعد تطبيق حدث الدفع. أوامر الـ Saga لا تُسقط كحالة طلب."], "files": [{"path": "docs/consistency-models.md", "note": "المصفوفة"}, {"path": "docs/adr/ADR-006-why-eventual-consistency.md", "note": "لماذا لا ينتظر التأكيد"}, {"path": "services/reporting-service/projections/apply.py", "note": "الإسقاط وprocessed_events يُثبَّتان معًا"}, {"path": "services/order-service/tests/unit/test_consistency_export.py", "note": "صف الطلب يسبق أي إسقاط"}, {"path": "services/reporting-service/projections/tests/test_consistency_lag.py", "note": "غائب، ثم PENDING، ثم CONFIRMED"}], "trace": [{"title": "السلطة", "who": "order_db", "what": "تثبيت الإنشاء أو التأكيد هو الحقيقة.", "data": "orders مع outbox.", "fail": "إذا تراجع هذا التثبيت، لا ينبغي لقارئ أن يخترع الطلب."}, {"title": "الفجوة", "who": "Django", "what": "GET /api/v1/reports/orders قد يحذف الطلب أو يُظهر إصدارًا أقدم.", "data": "order_projections.", "fail": "معاملة التقرير كنتيجة إتمام الشراء ستربك مكالمة الدعم."}, {"title": "اللحاق", "who": "reporting-consumer", "what": "طبّق OrderConfirmed. إصدار الإسقاط يطابق. تسليم ثانٍ لا يدرج صفًا آخر.", "data": "processed_events.", "fail": "تطبيق كتابة العمل خارج معاملة إزالة التكرار يضاعف الإيراد."}, {"title": "المخزون", "who": "Odoo، ثم إسقاطان", "what": "مخزون Odoo هو السلطة. inventory_snapshots تتأخر حتى InventoryUpdated. التقرير قد يتأخر عن اللقطة أيضًا.", "data": "odoo_db وorder_db وreporting_db.", "fail": "كمية صفحة المنتج ليست حجزًا."}], "advantages": ["إتمام الشراء يبقى متاحًا حين تكون التقارير أو Odoo بطيئة.", "المصفوفة تجعل التأخر صريحًا بدل تسميته عطلًا.", "التطبيق بلا تكرار يجعل إعادة التشغيل بعد الاسترجاع آمنة."], "disadvantages": ["شاشتان قد تختلفان لفترة.", "لا يوجد طابع زمني واحد عبر القواعد.", "يسهل إساءة قراءة COMPLETED كتسليم."], "alternatives": ["النداءات المتزامنة داخل التأكيد، والحجب حتى يؤكد المستهلكون، والاتساق القوي للمخزون فقط، كلها خسرت في ADR-006.", "عروض SQL على order_db كانت ستبقي التقارير متسقة وكانت ستضع استعلامًا طويلًا على قاعدة إتمام الشراء. ADR-002 يرفض ذلك."], "failures": [{"title": "تقرير غائب بعد التأكيد", "text": "متوقع حتى يُطبَّق OrderConfirmed. لا تُعد التأكيد. انظر صف outbox ومستهلك التقارير."}, {"title": "صف دفع فارغ والـ Saga على PAYMENT_CONFIRMED", "text": "إسقاط الدفع ينتظر مستهلك التقارير. حالة الطلب ما زالت CONFIRMED."}], "tests": [{"path": "services/order-service/tests/unit/test_consistency_export.py", "note": "مجموعة 9 أكتوبر ضمّت هذا الملف: انظر testing.md لعدد النجاح في الأمر المجمّع"}, {"path": "services/reporting-service/projections/tests/test_consistency_lag.py", "note": "تأخر الإسقاط"}], "quiz": [{"q": "بعد أن يرجع التأكيد، ماذا يُظهر GET على خدمة الطلبات؟", "a": "CONFIRMED وsaga_status بقيمة STARTED. هذه القراءة صف الطلب، لا الإسقاط."}, {"q": "ماذا يمكن أن يُظهر Django في اللحظة نفسها؟", "a": "لا صف، أو PENDING عند الإصدار 1 إذا طُبِّق OrderCreated فقط. يطابق بعد تطبيق OrderConfirmed."}, {"q": "هل inventory_snapshots سلطة المخزون؟", "a": "لا. هي إسقاط لـ InventoryUpdated. Odoo هو السلطة."}], "summary": "صف الطلب متسق فورًا مع تثبيته. التقارير ووثائق ERP ولقطات المخزون تلحق لاحقًا. التأخر هو التصميم."}}, {"id": "cache", "status": "implemented", "en": {"title": "Redis cache and limits", "lede": "Product get and list are cache-aside with a 30 second TTL. Redis is not the catalog. Login and order create fail closed when Redis is down.", "why": ["Two order-service replicas must share one login budget. A per-process cache would multiply that budget by the replica count and would go cold on every deploy. Redis is the shared place. It is the wrong place to store an order."], "explain": ["GetProduct and ListProducts ask ProductCatalogCache first. A hit returns Redis and does not read order_db. A miss, or a payload that does not parse, reads Postgres and then SET. A Redis error is not a miss: the use case still reads Postgres, and the counter is product_cache_errors_total.", "Keys are catalog:product:{product_id} and catalog:list:{limit}:{offset}. TTL is product_cache_ttl_seconds, default 30. Create and update call invalidate after commit. invalidate deletes that product key and every catalog:list: key. Redis and Postgres are not one atomic update.", "There is no per-pod cache and no single-flight lock. Two misses can both read Postgres and both SET. The later SET wins. A fill that started before a delete can put an old price back until the TTL. Orders are not cached. The 15 second order-create lock is a different key."], "example": {"text": "A shop keeps a chalkboard of prices by the door and a ledger in the back. A customer may read the chalkboard. If the chalk is smudged, someone reads the ledger and rewrites the board. If the writer changes the ledger and is interrupted before wiping the board, the board lies until the chalk wears off. The ledger is still right.", "code": "", "caption": ""}, "how": ["Every order-service API replica uses the same Redis. Invalidation stays in the order service after commit. There is no RabbitMQ consumer whose job is to delete the key. Metrics product_cache_hits_total, product_cache_misses_total, product_cache_errors_total, and product_cache_duration_seconds use operation get or list. They are on the Dependencies and Platform overview dashboards. The Dependencies board still has the exporter keyspace ratio, which is a different series.", "Login is 5 per minute per IP and per email hash, register is 5 per minute per IP, order create is 10 per minute per IP and per account. Those routes do not fall through when Redis is down."], "files": [{"path": "docs/caching-strategy.md", "note": "Cache-aside, TTL, and the series"}, {"path": "docs/adr/ADR-007-why-redis.md", "note": "Why not process memory or Postgres counters"}, {"path": "services/order-service/src/order_service/infrastructure/redis/catalog_cache.py", "note": "Keys, TTL, invalidate"}, {"path": "services/order-service/src/order_service/application/use_cases/catalog.py", "note": "Read-through and invalidate after commit"}, {"path": "services/order-service/src/order_service/infrastructure/settings.py", "note": "product_cache_ttl_seconds"}, {"path": "deploy/observability/grafana/dashboards/dependencies.json", "note": "Product-cache panels and the keyspace ratio"}], "trace": [{"title": "Get", "who": "GetProduct", "what": "Read Redis. On a hit, return. On a miss or error, read order_db.", "data": "catalog:product:{id}.", "fail": "Redis down: the product still loads from Postgres. The error counter increments."}, {"title": "Fill", "who": "Catalog cache", "what": "SET the JSON with a 30 second TTL.", "data": "One complete document.", "fail": "Two concurrent misses both fill. There is no lock around the fill."}, {"title": "Write", "who": "CreateProduct or UpdateProduct", "what": "Commit the product row, then delete the product key and list keys.", "data": "order_db first, Redis second.", "fail": "A crash between them leaves the previous key until the TTL."}, {"title": "Limit", "who": "RateLimitPolicy", "what": "Increment a shared counter. Refuse when the budget is spent.", "data": "Redis, not the product keys.", "fail": "Redis down fails the login, register, and order-create routes."}], "advantages": ["A catalog read can skip Postgres on a hit.", "A Redis failure does not take product reads down.", "Replicas share one budget and one cache."], "disadvantages": ["A reader can see a stale price for up to 30 seconds, or longer if a late fill restores it.", "Invalidation is not atomic with the commit.", "The order-create lock is easy to confuse with idempotency. It is not."], "alternatives": ["Process memory lost in ADR-007 as soon as two replicas exist.", "Postgres for rate counters would put abuse traffic on the order database.", "Redis as the primary store for orders was refused: a flush would delete sales."], "failures": [{"title": "Stale key", "text": "After the Postgres price changes, a key that is still present is the value get returns until something deletes it or the TTL ends. Covered by test_stale_product_is_served_when_the_delete_has_not_happened."}, {"title": "Late fill", "text": "A reader that loaded the old row can SET it after invalidate. The TTL is the backstop."}], "tests": [{"path": "services/order-service/tests/unit/test_cache_behavior.py", "note": "Stale key, Redis down, concurrent misses, invalidate after commit. Uses FakeRedis."}, {"path": "services/order-service/tests/unit/test_redis_cache.py", "note": "Hit, delete, late fill, Redis error"}, {"path": "services/order-service/tests/api/test_redis_limits.py", "note": "Fail-closed limits"}], "quiz": [{"q": "Does a Redis error on product get fail the request?", "a": "No. The use case reads order_db. The series records an error, not a miss."}, {"q": "When is the cache key deleted?", "a": "After a successful catalog commit, not before, and not inside the Postgres transaction."}, {"q": "Are orders cached?", "a": "No. The price copied onto an order line is read from the product row in order_db."}], "summary": "Redis caches product documents for 30 seconds and counts login and create attempts. The product row remains the catalog. Cache failure is a miss-shaped read with a different metric. Limit failure is closed."}, "ar": {"title": "ذاكرة Redis والحدود", "lede": "جلب المنتج وقائمته cache-aside مع TTL ثلاثين ثانية. Redis ليس الكتالوج. الدخول وإنشاء الطلب يفشلان مغلقين حين يكون Redis متوقفًا.", "why": ["نسختان من خدمة الطلبات يجب أن تشتركا في ميزانية دخول واحدة. ذاكرة لكل عملية كانت ستضرب تلك الميزانية في عدد النسخ وكانت ستبرد عند كل نشر. Redis هو المكان المشترك. وهو المكان الخطأ لتخزين طلب."], "explain": ["GetProduct وListProducts يسألان ProductCatalogCache أولًا. الإصابة ترجع Redis ولا تقرأ order_db. الغياب، أو حمولة لا تُحلَّل، يقرأ Postgres ثم SET. خطأ Redis ليس غيابًا: حالة الاستخدام ما زالت تقرأ Postgres، والعداد هو product_cache_errors_total.", "المفاتيح catalog:product:{product_id} وcatalog:list:{limit}:{offset}. TTL هو product_cache_ttl_seconds، والافتراض 30. الإنشاء والتحديث يناديان invalidate بعد commit. invalidate يحذف مفتاح ذلك المنتج وكل مفتاح catalog:list:. Redis وPostgres ليسا تحديثًا ذريًا واحدًا.", "لا ذاكرة لكل حاضنة ولا قفل رحلة واحدة. غيابان يستطيعان قراءة Postgres وعمل SET. الـ SET الأخير يفوز. ملء بدأ قبل الحذف قد يعيد سعرًا قديمًا حتى TTL. الطلبات لا تُخزَّن مؤقتًا. قفل الإنشاء لخمس عشرة ثانية مفتاح مختلف."], "example": {"text": "محل يضع لوحة أسعار عند الباب ودفترًا في الخلف. الزبون قد يقرأ اللوحة. إذا تلطخت الطبشورة، أحدهم يقرأ الدفتر ويعيد كتابة اللوحة. إذا غيّر الكاتب الدفتر وانقطع قبل مسح اللوحة، اللوحة تكذب حتى تبلى الطبشورة. الدفتر ما زال صحيحًا.", "code": "", "caption": ""}, "how": ["كل نسخة API لخدمة الطلبات تستخدم Redis نفسه. الإبطال يبقى في خدمة الطلبات بعد commit. لا مستهلك RabbitMQ عمله حذف المفتاح. المقاييس product_cache_hits_total وproduct_cache_misses_total وproduct_cache_errors_total وproduct_cache_duration_seconds تستخدم operation بقيمة get أو list. هي على لوحتي Dependencies وPlatform overview. لوحة Dependencies ما زال فيها نسبة مساحة المفاتيح من المصدّر، وهي سلسلة مختلفة.", "الدخول 5 في الدقيقة لكل IP ولكل تجزئة بريد، والتسجيل 5 في الدقيقة لكل IP، وإنشاء الطلب 10 في الدقيقة لكل IP ولكل حساب. هذه المسارات لا تسقط إلى القاعدة حين يكون Redis متوقفًا."], "files": [{"path": "docs/caching-strategy.md", "note": "cache-aside وTTL والسلاسل"}, {"path": "docs/adr/ADR-007-why-redis.md", "note": "لماذا ليست ذاكرة العملية أو عدادات Postgres"}, {"path": "services/order-service/src/order_service/infrastructure/redis/catalog_cache.py", "note": "المفاتيح وTTL وinvalidate"}, {"path": "services/order-service/src/order_service/application/use_cases/catalog.py", "note": "القراءة ثم الإبطال بعد commit"}, {"path": "services/order-service/src/order_service/infrastructure/settings.py", "note": "product_cache_ttl_seconds"}, {"path": "deploy/observability/grafana/dashboards/dependencies.json", "note": "لوحات ذاكرة المنتج ونسبة مساحة المفاتيح"}], "trace": [{"title": "الجلب", "who": "GetProduct", "what": "اقرأ Redis. عند الإصابة، ارجع. عند الغياب أو الخطأ، اقرأ order_db.", "data": "catalog:product:{id}.", "fail": "Redis متوقف: المنتج ما زال يُحمَّل من Postgres. عداد الخطأ يزيد."}, {"title": "الملء", "who": "ذاكرة الكتالوج", "what": "SET لـ JSON مع TTL ثلاثين ثانية.", "data": "وثيقة كاملة واحدة.", "fail": "غيابان متزامنان يملآن كلاهما. لا قفل حول الملء."}, {"title": "الكتابة", "who": "CreateProduct أو UpdateProduct", "what": "ثبّت صف المنتج، ثم احذف مفتاح المنتج ومفاتيح القوائم.", "data": "order_db أولًا، وRedis ثانيًا.", "fail": "توقّف بينهما يترك المفتاح السابق حتى TTL."}, {"title": "الحد", "who": "RateLimitPolicy", "what": "زِد عدادًا مشتركًا. ارفض حين تُستنفد الميزانية.", "data": "Redis، وليس مفاتيح المنتج.", "fail": "Redis متوقف يفشل مسارات الدخول والتسجيل وإنشاء الطلب."}], "advantages": ["قراءة الكتالوج تستطيع تخطي Postgres عند الإصابة.", "فشل Redis لا يوقف قراءات المنتج.", "النسخ تشترك في ميزانية واحدة وذاكرة واحدة."], "disadvantages": ["القارئ قد يرى سعرًا قديمًا حتى 30 ثانية، أو أطول إذا أعاد ملء متأخر ذلك السعر.", "الإبطال ليس ذريًا مع commit.", "يسهل خلط قفل إنشاء الطلب مع عدم التكرار. ليس كذلك."], "alternatives": ["ذاكرة العملية خسرت في ADR-007 بمجرد وجود نسختين.", "Postgres لعدادات المعدل كان سيضع حركة الإساءة على قاعدة الطلبات.", "Redis مخزنًا أساسيًا للطلبات رُفض: التفريغ كان سيحذف المبيعات."], "failures": [{"title": "مفتاح قديم", "text": "بعد تغيّر سعر Postgres، المفتاح الذي ما زال حاضرًا هو القيمة التي يرجعها الجلب حتى يحذفه شيء أو ينتهي TTL. يغطيه test_stale_product_is_served_when_the_delete_has_not_happened."}, {"title": "ملء متأخر", "text": "قارئ حمّل الصف القديم يستطيع عمل SET بعد invalidate. TTL هو الحاجز الأخير."}], "tests": [{"path": "services/order-service/tests/unit/test_cache_behavior.py", "note": "مفتاح قديم، وRedis متوقف، وغياب متزامن، وإبطال بعد commit. يستخدم FakeRedis."}, {"path": "services/order-service/tests/unit/test_redis_cache.py", "note": "إصابة وحذف وملء متأخر وخطأ Redis"}, {"path": "services/order-service/tests/api/test_redis_limits.py", "note": "حدود تفشل مغلقة"}], "quiz": [{"q": "هل خطأ Redis عند جلب المنتج يفشل الطلب؟", "a": "لا. حالة الاستخدام تقرأ order_db. السلسلة تسجّل خطأً، لا غيابًا."}, {"q": "متى يُحذف مفتاح الذاكرة؟", "a": "بعد تثبيت كتالوج ناجح، لا قبله، وليس داخل معاملة Postgres."}, {"q": "هل الطلبات تُخزَّن مؤقتًا؟", "a": "لا. السعر المنسوخ على سطر الطلب يُقرأ من صف المنتج في order_db."}], "summary": "Redis يخزّن وثائق المنتج لثلاثين ثانية ويعد محاولات الدخول والإنشاء. صف المنتج يبقى الكتالوج. فشل الذاكرة قراءة بشكل الغياب بمقياس مختلف. فشل الحد مغلق."}}, {"id": "platform", "status": "implemented", "en": {"title": "Traefik, Services, probes, and autoscaling", "lede": "On kind, public HTTP is Ingress, then one Traefik, then another Traefik, then a ClusterIP Service, then ready pods. Compose is one container and is not that Service.", "limits": ["This description was read from the manifests. Docker and kind were not used. No request count per pod was collected. No equal split was measured."], "why": ["A browser that calls pod addresses breaks the moment a pod is replaced. A Service name is the stable address. Readiness keeps a pod that cannot reach its database out of that address."], "explain": ["kind runs two Traefik processes, both image traefik:v3.5.0. Ingress public, class traefik, path / Prefix, backend Service gateway port 80. The ingress controller Deployment is replicas 1 and does not load the commerce route file. The commerce gateway Deployment is replicas 1 and loads deploy/compose/dynamic.yaml. Its order upstream is one URL, http://order-service:8000. The route file does not list pod addresses.", "Service order-service is ClusterIP port 8000. The Deployment starts at 2 replicas, with no sessionAffinity. startupProbe GET /health/live period 2s, timeout 3s, failureThreshold 30. readinessProbe GET /health/ready period 5s, timeout 3s, failureThreshold 3. livenessProbe GET /health/live period 10s, timeout 3s, failureThreshold 3. terminationGracePeriodSeconds is 20. The container requests 100m CPU and 128Mi memory.", "HPA order-service targets CPU at 70 percent of the 100m request, minimum 2, maximum 4. order-inventory-consumer and reporting-consumer are fixed at 2. order-outbox-publisher is fixed at 1. notification-consumer is 2 in deploy/kind/notification.yaml. Gateway, ingress, frontend, Redis, RabbitMQ, and each Postgres are 1. There is no service mesh. metrics-server does not serve queue depth."], "example": {"text": "A building has one street door and a receptionist. The receptionist does not memorize which desk is occupied. A sign at the corridor says which desks are open. If a clerk's lamp is off, the sign skips that desk. Visitors still use the street door.", "code": "Ingress public → ingress Traefik → commerce gateway Traefik → Service order-service:8000 → ready order pods", "caption": "kind HTTP path for an order call"}, "how": ["GET /health/ready answers only when order_db accepts a query. GET /health/live answers even when Postgres is down. The gateway does not route those health paths or /api/v1/internal. Compose sets stop_grace_period 20s and a healthcheck on /health/ready for its single order-service container.", "Traefik's in-memory rate limit is per gateway replica. Shared login limits stay in Redis. CPU on the API is the wrong signal for a consumer whose queue is growing while the process looks idle. The queue metric is rabbitmq_detailed_queue_messages. KEDA is not installed."], "files": [{"path": "docs/load-balancing.md", "note": "The path, and the missing traffic measurement"}, {"path": "docs/kubernetes.md", "note": "Replicas, HPA, and why Compose comes first"}, {"path": "docs/adr/ADR-008-why-kubernetes.md", "note": "kind after Compose"}, {"path": "docs/adr/ADR-012-why-api-gateway.md", "note": "Why Traefik, and why the limit is not global"}, {"path": "deploy/kind/order.yaml", "note": "Replicas, probes, Service, HPA"}, {"path": "deploy/kind/ingress.yaml", "note": "Ingress public"}, {"path": "deploy/kind/gateway.yaml", "note": "Two Traefik deployments"}], "trace": [{"title": "Ingress", "who": "Ingress controller Traefik", "what": "Accept the host port and forward to Service gateway.", "data": "Namespace commerce. NodePort 30080 on the ingress Service.", "fail": "This process does not know /api/v1 routes."}, {"title": "Commerce gateway", "who": "Deployment gateway", "what": "Match the path and forward to http://order-service:8000 or the reporting, notification, or frontend service.", "data": "deploy/compose/dynamic.yaml mounted by apply.sh.", "fail": "One gateway replica. If it is down, public traffic is down."}, {"title": "Service", "who": "kube-proxy / Service", "what": "Select ready pods with the order-service label.", "data": "ClusterIP, no session affinity.", "fail": "A pod that fails readiness leaves the endpoints. The other ready pod can still serve."}, {"title": "Scale", "who": "HPA", "what": "Add pods between 2 and 4 when CPU utilization crosses the target.", "data": "metrics-server. Request 100m is required for a percentage.", "fail": "Queue depth does not move this HPA."}], "advantages": ["Replacing a pod does not change the client URL.", "Readiness ties traffic to order_db, not merely to a listening port.", "The same route file idea runs in Compose and in kind."], "disadvantages": ["Two Traefik processes are easy to confuse.", "The HPA watches CPU, which is a poor signal for consumers.", "No measured request split exists in the tree. Do not claim the pods share traffic evenly."], "alternatives": ["Compose forever misses probes and ingress as objects. It remains the first runtime.", "minikube, k3d, and a managed cluster lost in ADR-008 for this laptop project.", "A service mesh lost in the Kubernetes notes: three services do not repay sidecar cost."], "failures": [{"title": "order_db down", "text": "Readiness fails. The Service stops sending traffic to that pod. Create and confirm fail if no ready pod remains. Reporting still serves its own database."}, {"title": "kind node deleted", "text": "Local hostPath volumes go with the cluster. That is data loss for the laptop disks unless a backup was taken. Redis has no PVC."}], "tests": [{"path": "deploy/kind/test_manifests.py", "note": "Reads the objects. Does not create a cluster."}, {"path": "deploy/gateway/tests/test_public_routes.py", "note": "Route rules"}, {"path": "services/order-service/src/order_service/presentation/routes/health.py", "note": "Live versus ready"}], "quiz": [{"q": "How many Traefik processes does kind run?", "a": "Two. The Ingress controller and the commerce gateway. The controller does not load the commerce route file."}, {"q": "What is the order-service replica count at start, and the HPA range?", "a": "Deployment starts at 2. HPA minimum 2, maximum 4, on CPU."}, {"q": "Does Compose balance across order pods?", "a": "No. Compose runs one order-service container. The Service that selects pods is the kind Service."}], "summary": "Public kind traffic crosses two Traefik processes and a ClusterIP Service before it reaches a ready order pod. The HPA scales the API on CPU from 2 to 4. The publisher stays at one replica. No traffic split was measured."}, "ar": {"title": "Traefik والخدمات وفحوص الصحة والتوسع", "lede": "على kind، HTTP العام هو Ingress، ثم Traefik، ثم Traefik آخر، ثم Service من نوع ClusterIP، ثم الحاضنات الجاهزة. Compose حاوية واحدة وليس ذلك الـ Service.", "limits": ["هذا الوصف قُرئ من البيانات. لم يُستخدم Docker أو kind. لم يُجمع عدد طلبات لكل حاضنة. لم يُقس تقسيم متساوٍ."], "why": ["متصفح ينادي عناوين الحاضنات ينكسر لحظة استبدال حاضنة. اسم Service هو العنوان الثابت. الجاهزية تُبقي حاضنة لا تصل إلى قاعدتها خارج ذلك العنوان."], "explain": ["kind يشغّل عمليتي Traefik، كلتاهما الصورة traefik:v3.5.0. Ingress باسم public، والفئة traefik، والمسار / من نوع Prefix، والخلفية Service gateway المنفذ 80. نشر متحكم الدخول replicas بقيمة 1 ولا يحمّل ملف مسارات التجارة. نشر بوابة التجارة replicas بقيمة 1 ويحمّل deploy/compose/dynamic.yaml. منبع الطلبات عنوان واحد، http://order-service:8000. ملف المسار لا يسرد عناوين الحاضنات.", "Service باسم order-service هو ClusterIP المنفذ 8000. النشر يبدأ بنسختين، ومن غير sessionAffinity. startupProbe على GET /health/live كل 2 ثانية، والمهلة 3 ثوانٍ، وfailureThreshold بقيمة 30. readinessProbe على GET /health/ready كل 5 ثوانٍ، والمهلة 3، والفشل 3. livenessProbe على GET /health/live كل 10 ثوانٍ، والمهلة 3، والفشل 3. terminationGracePeriodSeconds هو 20. الحاوية تطلب 100m من المعالج و128Mi من الذاكرة.", "HPA باسم order-service يستهدف المعالج عند 70 بالمئة من طلب 100m، والحد الأدنى 2 والأقصى 4. order-inventory-consumer وreporting-consumer ثابتان عند 2. order-outbox-publisher ثابت عند 1. notification-consumer هو 2 في deploy/kind/notification.yaml. البوابة وingress والواجهة وRedis وRabbitMQ وكل Postgres عند 1. لا شبكة خدمات. metrics-server لا يقدّم عمق الطابور."], "example": {"text": "مبنى له باب شارع وموظف استقبال. الموظف لا يحفظ أي مكتب مشغول. لافتة في الممر تقول أي المكاتب مفتوحة. إذا انطفأ مصباح موظف، اللافتة تتخطى ذلك المكتب. الزوار ما زالوا يستخدمون باب الشارع.", "code": "Ingress public → Traefik الدخول → Traefik بوابة التجارة → Service order-service:8000 → حاضنات الطلبات الجاهزة", "caption": "مسار HTTP على kind لنداء طلب"}, "how": ["GET /health/ready يجيب فقط حين تقبل order_db استعلامًا. GET /health/live يجيب حتى حين يكون Postgres متوقفًا. البوابة لا توجّه مسارات الصحة هذه ولا /api/v1/internal. Compose يضبط stop_grace_period على 20 ثانية وفحص صحة على /health/ready لحاوية order-service الوحيدة.", "حد Traefik في الذاكرة لكل نسخة بوابة. حدود الدخول المشتركة تبقى في Redis. المعالج على API إشارة سيئة لمستهلك طابوره يكبر والعملية تبدو خاملة. مقياس الطابور هو rabbitmq_detailed_queue_messages. KEDA غير مثبّت."], "files": [{"path": "docs/load-balancing.md", "note": "المسار، وقياس الحركة الغائب"}, {"path": "docs/kubernetes.md", "note": "النسخ وHPA ولماذا Compose أولًا"}, {"path": "docs/adr/ADR-008-why-kubernetes.md", "note": "kind بعد Compose"}, {"path": "docs/adr/ADR-012-why-api-gateway.md", "note": "لماذا Traefik، ولماذا الحد ليس عامًا"}, {"path": "deploy/kind/order.yaml", "note": "النسخ والفحوص وService وHPA"}, {"path": "deploy/kind/ingress.yaml", "note": "Ingress public"}, {"path": "deploy/kind/gateway.yaml", "note": "نشرا Traefik"}], "trace": [{"title": "Ingress", "who": "Traefik متحكم الدخول", "what": "اقبل منفذ المضيف ومرّر إلى Service gateway.", "data": "فضاء الأسماء commerce. NodePort‏ 30080 على Service الدخول.", "fail": "هذه العملية لا تعرف مسارات /api/v1."}, {"title": "بوابة التجارة", "who": "نشر gateway", "what": "طابق المسار ومرّر إلى http://order-service:8000 أو خدمة التقارير أو الإشعارات أو الواجهة.", "data": "deploy/compose/dynamic.yaml الذي يركّبه apply.sh.", "fail": "نسخة بوابة واحدة. إذا توقفت، تتوقف الحركة العامة."}, {"title": "Service", "who": "Service", "what": "اختر الحاضنات الجاهزة بملصق order-service.", "data": "ClusterIP، ومن غير التصاق جلسة.", "fail": "حاضنة تفشل جاهزيتها تخرج من النهايات. الحاضنة الجاهزة الأخرى ما زالت تستطيع الخدمة."}, {"title": "التوسع", "who": "HPA", "what": "أضف حاضنات بين 2 و4 حين يتجاوز استخدام المعالج الهدف.", "data": "metrics-server. طلب 100m لازم لنسبة مئوية.", "fail": "عمق الطابور لا يحرّك هذا HPA."}], "advantages": ["استبدال حاضنة لا يغيّر عنوان العميل.", "الجاهزية تربط الحركة بـ order_db، لا بمجرد منفذ يستمع.", "فكرة ملف المسار نفسها تعمل في Compose وفي kind."], "disadvantages": ["عمليتا Traefik يسهل الخلط بينهما.", "HPA يراقب المعالج، وهي إشارة ضعيفة للمستهلكين.", "لا تقسيم حركة مقيس في الشجرة. لا تدّعِ أن الحاضنات تتقاسم الحركة بالتساوي."], "alternatives": ["Compose إلى الأبد يفوّت الفحوص وingress ككائنات. يبقى أول تشغيل.", "minikube وk3d وعنقود مُدار خسرت في ADR-008 لمشروع الحاسوب هذا.", "شبكة خدمات خسرت في ملاحظات Kubernetes: ثلاث خدمات لا تسدد كلفة الوكيل الجانبي."], "failures": [{"title": "توقّف order_db", "text": "الجاهزية تفشل. Service يتوقف عن إرسال الحركة إلى تلك الحاضنة. الإنشاء والتأكيد يفشلان إذا لم تبقَ حاضنة جاهزة. التقارير ما زالت تخدم قاعدتها."}, {"title": "حذف عقدة kind", "text": "أحجام hostPath المحلية تذهب مع العنقود. هذه خسارة بيانات لأقراص الحاسوب إلا إذا أُخذت نسخة احتياط. Redis بلا PVC."}], "tests": [{"path": "deploy/kind/test_manifests.py", "note": "يقرأ الكائنات. لا ينشئ عنقودًا."}, {"path": "deploy/gateway/tests/test_public_routes.py", "note": "قواعد المسار"}, {"path": "services/order-service/src/order_service/presentation/routes/health.py", "note": "الحي مقابل الجاهز"}], "quiz": [{"q": "كم عملية Traefik يشغّل kind؟", "a": "اثنتان. متحكم Ingress وبوابة التجارة. المتحكم لا يحمّل ملف مسار التجارة."}, {"q": "ما عدد نسخ order-service في البداية، وما مدى HPA؟", "a": "النشر يبدأ عند 2. الحد الأدنى لـ HPA هو 2 والأقصى 4، على المعالج."}, {"q": "هل يوازن Compose بين حاضنات الطلبات؟", "a": "لا. Compose يشغّل حاوية order-service واحدة. الـ Service الذي يختار الحاضنات هو Service في kind."}], "summary": "حركة kind العامة تعبر عمليتي Traefik وService من نوع ClusterIP قبل أن تصل إلى حاضنة طلبات جاهزة. HPA يوسّع API على المعالج من 2 إلى 4. الناشر يبقى نسخة واحدة. لم يُقس تقسيم الحركة."}}, {"id": "reporting", "status": "partial", "en": {"title": "Django projections and Odoo", "lede": "Django builds read models from the broker. Odoo creates one sales order from CreateErpOrder and publishes InventoryUpdated. The live saga worker does not drive that create to completion.", "why": ["A report query on order_db would sit on the checkout database. An ERP sales order has to live where stock, delivery, and invoicing already agree. Those are two other databases."], "explain": ["reporting_db models in projections/models.py: order_projections, order_item_projections, product_projections, customer_projections, inventory_projections, payment_projections, processed_events, projection_versions. The consumer command is projections/management/commands/consume_events.py. Report routes are GET /api/v1/reports/orders/summary, /orders, /inventory, and /revenue.", "The projection row and processed_events commit together. A duplicate event_id does not add a second row. A skipped aggregate version uses the retry path.", "Odoo 18 Community is services/odoo. The connector records OrderConfirmed and does not insert sale.order. CreateErpOrder creates one sales order per commerce order id. CancelErpOrder cancels it. Stock changes leave as InventoryUpdated on erp.events, through commerce_event_outbox. The order service applies that onto inventory_snapshots. Fulfillment buttons in the connector call /api/v1/internal over HTTP."], "example": {"text": "The shop ledger is the sale. A wall chart is copied from notes. The warehouse clipboard is the stock count. Updating the wall chart does not change the ledger, and a note that says 'confirmed' does not, by itself, open a warehouse job. A separate instruction does.", "code": "", "caption": ""}, "how": ["Reporting binds payment.* so PaymentConfirmed and PaymentFailed can land in payment_projections. It does not bind commerce.commands. Odoo’s confirmed-order queue has no binding for order.created. Reservation lookup is by commerce order id before insert, so a repeated command keeps one row.", "What is partial: the command handlers and the projection consumer are in the tree and have tests. The shipped saga worker never observes a successful Odoo reply, so a running stack’s saga row does not move to ODOO_ORDER_CREATED by itself."], "files": [{"path": "docs/adr/ADR-002-why-django-for-reporting.md", "note": "Why not SQL views on order_db"}, {"path": "services/reporting-service/projections/models.py", "note": "Read models"}, {"path": "services/reporting-service/projections/apply.py", "note": "Apply plus dedup"}, {"path": "services/reporting-service/reporting/urls.py", "note": "Report HTTP"}, {"path": "services/odoo/src/commerce_erp/confirmed.py", "note": "Remember OrderConfirmed, do not create a sales order"}, {"path": "services/odoo/src/commerce_erp/commands.py", "note": "CreateErpOrder and ReserveInventory"}, {"path": "services/odoo/src/commerce_erp/fulfillment.py", "note": "HTTP milestones"}], "trace": [{"title": "Publish", "who": "Order outbox publisher", "what": "OrderCreated and later OrderConfirmed reach commerce.events.", "data": "q.reporting.projection and, for confirmed only, q.odoo.order-confirmed.", "fail": "If the publisher is stopped, neither database moves."}, {"title": "Project", "who": "reporting-consumer", "what": "Insert or update the projection and processed_events in one reporting_db transaction, then ack.", "data": "Version on the projection.", "fail": "A missing earlier version retries, then can dead-letter."}, {"title": "Record confirm", "who": "Odoo consumer", "what": "Store that OrderConfirmed was seen. Do not insert sale.order.", "data": "odoo_db dedup.", "fail": "An older document that still creates a sales order from this event has drifted from confirmed.py."}, {"title": "Command", "who": "Odoo command consumer", "what": "CreateErpOrder inserts one sale.order. ReserveInventory inserts one reservation.", "data": "Idempotency key and order id.", "fail": "The saga worker in this tree does not learn that those commands succeeded."}, {"title": "Stock back", "who": "Odoo publisher, then inventory consumer", "what": "InventoryUpdated is written to commerce_event_outbox and published on erp.events. The order service stores inventory_snapshots.", "data": "q.order.inventory and also the reporting binding.", "fail": "An older snapshot is acked and ignored."}], "advantages": ["Reports can be rebuilt from events.", "ERP stock stays inside Odoo’s transaction.", "OrderConfirmed can update a chart without opening a second sales order."], "disadvantages": ["The report lags.", "The live orchestrator and the Odoo command consumer are not closed into one completed saga.", "Fulfillment is a second channel (HTTP), which is easy to forget when drawing only the broker."], "alternatives": ["More FastAPI for reports, SQL views on order_db, ClickHouse, and a GUI on order_db lost in ADR-002.", "Creating the sales order from OrderConfirmed was the earlier contract. The saga moved creation to CreateErpOrder."], "failures": [{"title": "Duplicate projection", "text": "If the consumer commits the projection outside processed_events, revenue doubles. The tests require one row."}, {"title": "Odoo down", "text": "Confirm still commits. Commands sit on Odoo’s queues or in the outbox. The saga worker, even when Odoo is up, still returns unknown."}], "tests": [{"path": "services/reporting-service/projections/tests/test_apply.py", "note": "Apply and duplicates"}, {"path": "services/reporting-service/projections/tests/test_consistency_lag.py", "note": "Lag before and after OrderConfirmed"}, {"path": "services/odoo/tests/test_commands.py", "note": "One reservation and one sales order"}, {"path": "services/odoo/tests/test_inventory.py", "note": "InventoryUpdated"}], "quiz": [{"q": "Does OrderConfirmed create sale.order?", "a": "No. confirmed.py records the delivery. CreateErpOrder creates the sales order."}, {"q": "Where does a payment show up on a report?", "a": "In payment_projections after the reporting consumer applies payment.confirmed or payment.failed. Not at the moment the saga commits."}, {"q": "How does a shipped status reach the order service?", "a": "Odoo calls POST /api/v1/internal/.../shipped with X-Internal-Token. It is not a broker message."}], "summary": "Django projections and Odoo docum
