<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commerce platform — architecture learning portal</title>
  <style>
    :root {
      --ink: #1c1915;
      --muted: #5c564c;
      --line: #d9d1c3;
      --paper: #f4f0e8;
      --card: #fffdf8;
      --accent: #1f4d3a;
      --accent-soft: #e5f0ea;
      --warn: #6b3a12;
      --warn-soft: #f6e6d4;
      --info: #1d3f66;
      --info-soft: #e7eef6;
      --side: #241f1a;
      --side-text: #f3ece2;
      --focus: #0b6b4a;
      --planned: #5c3d6e;
      --planned-soft: #f3eaf8;
      --partial: #6b3a12;
      --nav-w: 17.5rem;
      --top: 3.4rem;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { transition: none !important; }
    }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font: 17px/1.55 "Iowan Old Style", Palatino, Georgia, "Noto Naskh Arabic", "Noto Sans Arabic", "DejaVu Sans", serif;
    }
    html[lang="ar"] body {
      font-family: "Noto Naskh Arabic", "Noto Sans Arabic", "DejaVu Sans", Tahoma, sans-serif;
      line-height: 1.75;
    }
    a { color: var(--accent); }
    a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    .skip {
      position: absolute;
      inset-inline-start: 0.5rem;
      top: -3rem;
      background: #fff;
      color: var(--ink);
      padding: 0.4rem 0.7rem;
      z-index: 5;
    }
    .skip:focus { top: 0.4rem; }
    .top {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      min-height: var(--top);
      padding: 0.4rem 0.8rem;
      background: var(--side);
      color: var(--side-text);
    }
    .top button, .lang button, .filters button, .views button, .quiz button, .copy, .stepper button {
      font: 0.92rem/1.3 ui-sans-serif, "Noto Sans Arabic", "DejaVu Sans", system-ui, sans-serif;
      cursor: pointer;
    }
    .menu-btn, .lang button, .views button {
      background: transparent;
      color: var(--side-text);
      border: 1px solid #6d6256;
      border-radius: 4px;
      padding: 0.28rem 0.55rem;
    }
    .views { display: flex; gap: 0.3rem; }
    .views button[aria-selected="true"], .lang button[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .search {
      flex: 1;
      min-width: 8rem;
      background: #fffdf8;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0.35rem 0.55rem;
      font: 0.95rem/1.3 ui-sans-serif, "Noto Sans Arabic", "DejaVu Sans", system-ui, sans-serif;
    }
    .lang { display: flex; gap: 0.25rem; }
    .layout { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); min-height: calc(100vh - var(--top)); }
    .layout.nav-collapsed { grid-template-columns: minmax(0, 1fr); }
    .layout.nav-collapsed #nav { display: none; }
    #nav {
      position: sticky;
      top: var(--top);
      align-self: start;
      height: calc(100vh - var(--top));
      overflow: auto;
      background: #2c261f;
      color: var(--side-text);
      padding: 0.8rem 0.7rem 2rem;
    }
    #nav .progress {
      margin: 0 0.35rem 0.7rem;
      font: 0.78rem/1.4 ui-sans-serif, "Noto Sans Arabic", "DejaVu Sans", system-ui, sans-serif;
      color: #d9cfc3;
    }
    #nav a {
      display: flex;
      justify-content: space-between;
      gap: 0.4rem;
      color: var(--side-text);
      text-decoration: none;
      font: 0.9rem/1.35 ui-sans-serif, "Noto Sans Arabic", "DejaVu Sans", system-ui, sans-serif;
      padding: 0.32rem 0.4rem;
      border-radius: 4px;
    }
    #nav a:hover, #nav a[aria-current="true"] { background: #3a332c; }
    #nav a .badge { flex: none; }
    main { padding: 1.1rem 1.4rem 3rem; max-width: 62rem; }
    h1 { font-size: 1.7rem; line-height: 1.25; margin: 0.2rem 0 0.4rem; }
    h2 { font-size: 1.25rem; margin: 1.4rem 0 0.4rem; scroll-margin-top: 4.2rem; }
    h3 { font-size: 1.05rem; margin: 0.9rem 0 0.3rem; }
    p { margin: 0.4rem 0; }
    .crumbs {
      font: 0.85rem/1.4 ui-sans-serif, "Noto Sans Arabic", "DejaVu Sans", system-ui, sans-serif;
      color: var(--muted);
    }
    .lede { font-size: 1.08rem; }
    .note, .limits {
      background: var(--warn-soft);
      border-inline-start: 4px solid var(--warn);
      padding: 0.7rem 0.9rem;
      margin: 0.8rem 0;
    }
    .info {
      background: var(--info-soft);
      border-inline-start: 4px solid var(--info);
      padding: 0.7rem 0.9rem;
      margin: 0.8rem 0;
    }
    .badge {
      display: inline-block;
      font: 0.72rem/1.2 ui-sans-serif, "Noto Sans Arabic", "DejaVu Sans", system-ui, sans-serif;
      border-radius: 999px;
      padding: 0.1rem 0.45rem;
      border: 1px solid var(--line);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .badge.partial { background: var(--warn-soft); color: var(--partial); }
    .badge.planned { background: var(--planned-soft); color: var(--planned); }
    .toc { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.6rem 0 0.2rem; }
    .toc a {
      font: 0.82rem/1.2 ui-sans-serif, "Noto Sans Arabic", "DejaVu Sans", system-ui, sans-serif;
      text-decoration: none;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 999px;
      padding: 0.2rem 0.5rem;
    }
    pre {
      background: #241f1a;
      color: #f6f1e8;
      padding: 0.75rem 0.85rem;
      overflow: auto;
      border-radius: 4px;
      font: 0.86rem/1.45 ui-monospace, "Cascadia Code", "Source Code Pro", monospace;
    }
    code { font: 0.88em/1.45 ui-monospace, "Cascadia Code", "Source Code Pro", monospace; }
    .codehead { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; margin-top: 0.4rem; }
    .copy {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0.2rem 0.45rem;
    }
    ol.trace { padding-inline-start: 1.2rem; }
    ol.trace li { margin: 0.55rem 0; }
    .meta { color: var(--muted); font-size: 0.92rem; }
    ul { padding-inline-start: 1.2rem; }
    table { width: 100%; border-collapse: collapse; background: var(--card); font-size: 0.95rem; }
    th, td { border-bottom: 1px solid var(--line); text-align: start; vertical-align: top; padding: 0.4rem 0.45rem; }
    th { font: 0.75rem/1.3 ui-sans-serif, "Noto Sans Arabic", "DejaVu Sans", system-ui, sans-serif; color: var(--muted); }
    .filters, .flow-pick { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.4rem 0 0.7rem; }
    .filters button, .flow-pick button, .quiz button, .pager button {
      background: var(--card);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.28rem 0.65rem;
    }
    .filters button[aria-pressed="true"], .flow-pick button[aria-pressed="true"] {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .map { display: grid; gap: 0.45rem; }
    .lane {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: stretch;
    }
    .lane-label {
      font: 0.72rem/1.2 ui-sans-serif, "Noto Sans Arabic", "DejaVu Sans", system-ui, sans-serif;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 0.35rem;
    }
    html[lang="ar"] .lane-label { letter-spacing: 0; text-transform: none; font-size: 0.85rem; }
    .node {
      text-align: start;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0.4rem 0.55rem;
      min-width: 9rem;
      max-width: 16rem;
    }
    .node[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
    .node[hidden] { display: none; }
    .node strong { display: block; font-size: 0.95rem; }
    .node span { display: block; color: var(--muted); font-size: 0.8rem; }
    .detail { background: var(--card); border: 1px solid var(--line); padding: 0.8rem 0.9rem; margin-top: 0.7rem; }
    .steps { display: flex; flex-direction: column; gap: 0.35rem; margin: 0.5rem 0; }
    .steps button {
      text-align: start;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0.45rem 0.6rem;
    }
    .steps button[aria-current="step"] { border-color: var(--accent); background: var(--accent-soft); }
    .pager { display: flex; justify-content: space-between; gap: 0.6rem; margin-top: 1.4rem; }
    .pager button { border-radius: 4px; }
    .results { background: var(--card); border: 1px solid var(--line); padding: 0.5rem 0.7rem; margin: 0.5rem 0; }
    .results button { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; padding: 0.15rem 0; display: block; }
    .tree button.fold {
      background: none;
      border: 0;
      color: inherit;
      cursor: pointer;
      font: 0.95rem/1.4 ui-sans-serif, "Noto Sans Arabic", "DejaVu Sans", system-ui, sans-serif;
      padding: 0.1rem 0;
    }
    .tree ul { list-style: none; padding-inline-start: 1rem; margin: 0.1rem 0; }
    .hidden { display: none; }
    .both { display: grid; gap: 0.6rem; }
    @media (min-width: 800px) {
      .both { grid-template-columns: 1fr 1fr; }
    }
    .both article { background: var(--card); border: 1px solid var(--line); padding: 0.6rem 0.75rem; }
    footer { margin-top: 1.6rem; color: var(--muted); font-size: 0.92rem; }
    @media (max-width: 800px) {
      .layout, .layout.nav-collapsed { grid-template-columns: minmax(0, 1fr); }
      #nav { display: none; position: fixed; z-index: 4; inset-inline-start: 0; top: var(--top); width: min(20rem, 88vw); height: calc(100vh - var(--top)); box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); }
      .layout.nav-open #nav { display: block; }
      main { padding: 0.9rem 0.8rem 2.5rem; }
      .views { display: none; }
      .views.mobile { display: flex; margin: 0.4rem 0 0.6rem; }
      .views.mobile button { color: var(--ink); border-color: var(--line); background: var(--card); }
      .views.mobile button[aria-selected="true"] { background: var(--accent); color: #fff; }
    }
    @media (min-width: 801px) {
      .views.mobile { display: none; }
    }
  </style>

  <script>
    const PORTAL = {"meta": {"en": {"title": "Commerce platform — architecture learning portal", "footer": "Written from the repository tree. Compose, kind, Locust, and a restore were not started to produce this page. The only saved preference is the language choice in this browser."}, "ar": {"title": "منصة التجارة — بوابة تعلّم البنية", "footer": "كُتبت هذه الصفحة من شجرة المستودع. لم يُشغَّل Compose أو kind أو Locust أو استرجاع نسخة لإنتاجها. التفضيل الوحيد المحفوظ هو اختيار اللغة في هذا المتصفح."}}, "map": {"en": {"title": "System map", "intro": "Clients speak HTTP to Traefik only. Each service writes its own Postgres database. RabbitMQ carries events and saga commands. Redis is a cache and a set of counters, not the catalog."}, "ar": {"title": "خريطة النظام", "intro": "العملاء يتحدثون HTTP مع Traefik فقط. كل خدمة تكتب قاعدة Postgres الخاصة بها. RabbitMQ يحمل الأحداث وأوامر الـ Saga. Redis ذاكرة مؤقتة وعدادات، وليس الكتالوج."}}, "flows": {"en": {"title": "Workflow tracer", "intro": "These walks follow the code and the docs beside this file. A badge says whether that step is implemented, only partly implemented, or still planned."}, "ar": {"title": "متتبع مسارات العمل", "intro": "هذه الجولات تتبع الكود والوثائق بجانب هذا الملف. الشارة تقول إن كانت الخطوة منفَّذة أو جزئية أو ما زالت مخططة."}}, "lanes": [{"id": "clients", "en": {"label": "Clients"}, "ar": {"label": "العملاء"}}, {"id": "edge", "en": {"label": "Edge"}, "ar": {"label": "الحافة"}}, {"id": "services", "en": {"label": "Services and workers"}, "ar": {"label": "الخدمات والعاملات"}}, {"id": "data", "en": {"label": "Data and messaging"}, "ar": {"label": "البيانات والرسائل"}}, {"id": "ops", "en": {"label": "Operations"}, "ar": {"label": "التشغيل"}}], "chapters": [{"id": "overview", "status": "implemented", "en": {"title": "System overview", "lede": "A customer browses products and places an order. Four Postgres databases stay separate. They meet at Traefik and at RabbitMQ.", "limits": ["This page was written by reading the tree. Compose and kind were not started to produce it.", "The shipped saga worker has no command-result reply. Inventory and ERP calls in services/order-service/src/order_service/infrastructure/saga/worker.py return unknown, so that process does not reach COMPLETED against a running Odoo. The eight scenarios drive the orchestrator with test ports."], "why": ["Without a shared picture, a later change tends to query Odoo from the browser or let a payment call write the order row. Both hide a second writer. When that other system is slow, checkout becomes slow, and there is no single transaction to roll back."], "explain": ["The React storefront in services/frontend and the React Native client in mobile/react-native-app talk only to HTTP through the gateway. They do not open Postgres, RabbitMQ, Redis, or Odoo.", "The order service (FastAPI) is the only writer of order status. Django reporting builds read models in reporting_db. Odoo 18 Community owns stock and the ERP sales order in odoo_db. Flask notifications own notification_db. A transaction does not open more than one of those databases.", "Strong consistency stops at one order_db transaction. Everywhere else, readers catch up from events and commands. Saga COMPLETED means reserve, simulated payment, and ERP create finished. It does not mean the parcel was delivered."], "example": {"text": "Imagine a paper shop. The cashier's book is the only place an order can be marked confirmed. The accountant copies figures into a second book later. The warehouse has its own stock book. If the accountant's book is an hour behind, the cashier's book is still the truth for that order. That lag is the point of the split, not a bug in the cashier's book.", "code": "", "caption": ""}, "how": ["Compose runs four Postgres servers: postgres (order_db), reporting-postgres (reporting_db), notification-postgres (notification_db), and odoo-db (odoo_db), plus RabbitMQ, Redis, the application processes, and the observability stack. The public HTTP entry is the gateway service.", "kind is a second packaging of the same images under deploy/kind/. It is one node. Public HTTP enters the Ingress named public. There is no separate saga service, no payment provider, and no server-side cart."], "files": [{"path": "docs/current-architecture.md", "note": "The same tree in prose"}, {"path": "docs/architecture.md", "note": "Context, containers, and legal conversations"}, {"path": "docs/extension-gap-analysis.md", "note": "What is implemented, stale, or still absent"}, {"path": "deploy/compose/docker-compose.yml", "note": "Full local stack, one container per service"}, {"path": "deploy/kind/kustomization.yaml", "note": "kind manifests"}, {"path": "README.md", "note": "Phases 0–20 and Extension Phases 0–10"}], "trace": [{"title": "Client calls the gateway", "who": "Storefront or React Native", "what": "The cart stays on the device. Checkout posts one order. The client never sends a cart total as the price.", "data": "HTTP to Traefik. Browser cart key commerce.cart.", "fail": "If the gateway process is down, public traffic stops. The databases are unchanged."}, {"title": "Order row commits", "who": "Order service", "what": "POST /api/v1/orders writes the order as PENDING and an OrderCreated outbox row in one order_db transaction. The HTTP handler does not publish.", "data": "orders, order_items, outbox in order_db.", "fail": "A rolled-back transaction leaves no order and no outbox row."}, {"title": "Publisher sends the envelope", "who": "order-outbox-publisher", "what": "A separate process reads pending outbox rows and publishes the stored payload.", "data": "RabbitMQ exchange commerce.events, routing key order.created.", "fail": "If the broker is down, the HTTP call has already succeeded and the row stays pending."}, {"title": "Readers catch up", "who": "Reporting, and later other consumers", "what": "Django applies the event in its own transaction. The report can still be missing after the create response.", "data": "reporting_db projections and processed_events.", "fail": "A stuck consumer leaves reports stale. The order row does not roll back."}], "advantages": ["A report query does not lock the checkout tables.", "Odoo can be down while the order row still commits.", "Each database has one owner, so a migration in reporting does not rewrite orders."], "disadvantages": ["A reader can be behind the writer. The page must say so.", "Four databases and a broker are more to operate than one schema.", "A crash between commit and publish is normal and must be designed for."], "alternatives": ["One shared schema was rejected in [ADR-004](adr/ADR-004-why-database-per-service.md): a report migration could lock an order table.", "Calling Django and Odoo inside the confirm request was rejected in [ADR-006](adr/ADR-006-why-eventual-consistency.md): checkout would wait on the slowest participant."], "failures": [{"title": "order_db down", "text": "Create and confirm fail. Reporting still serves the last projections. Odoo still has documents it already stored. A transaction that did not commit leaves no row and no outbox message. See [failure-scenarios.md](failure-scenarios.md)."}, {"title": "Broker down", "text": "Confirm still commits in order_db. Publish attempts fail and rows stay pending. When RabbitMQ returns, the publisher drains. It does not invent messages for rows already published."}], "tests": [{"path": "services/order-service/tests/unit/test_order_state.py", "note": "Legal order transitions"}, {"path": "docs/testing.md", "note": "What was run on 9 October 2026, and what was not"}], "quiz": [{"q": "Which component is allowed to change order status?", "a": "The order service. Reporting and Odoo keep their own copies and do not update orders in order_db."}, {"q": "Does saga status COMPLETED mean the parcel was delivered?", "a": "No. COMPLETED means reserve, simulated payment, and ERP create finished. Delivery is the order status machine: PENDING, CONFIRMED, PROCESSING, SHIPPED, DELIVERED."}, {"q": "Why can a report be missing a moment after create returns 201?", "a": "The create transaction writes order_db only. Django applies OrderCreated later, in reporting_db."}], "summary": "Clients reach Traefik over HTTP. The order service owns orders in order_db. Reporting, Odoo, and notifications own the other three databases and catch up through RabbitMQ. Redis is not the catalog."}, "ar": {"title": "نظرة على النظام", "lede": "العميل يتصفح المنتجات وينشئ طلبًا. أربع قواعد Postgres تبقى منفصلة. تلتقي عند Traefik وعند RabbitMQ.", "limits": ["كُتبت هذه الصفحة بقراءة الشجرة. لم يُشغَّل Compose أو kind لإنتاجها.", "عامل الـ Saga المرفق ليس لديه رد بنتيجة الأمر. استدعاءات المخزون وERP في services/order-service/src/order_service/infrastructure/saga/worker.py تُرجع unknown، لذلك هذه العملية لا تصل إلى COMPLETED مع Odoo شغّال. السيناريوهات الثمانية تقود المنسّق بمنافذ اختبار."], "why": ["من غير صورة مشتركة، التعديل اللاحق يميل إلى سؤال Odoo من المتصفح أو ترك نداء الدفع يكتب صف الطلب. الاثنان يخفيان كاتبًا ثانيًا. إذا بطأ النظام الآخر، يبطأ إتمام الشراء، ولا توجد معاملة واحدة للتراجع."], "explain": ["واجهة React في services/frontend وعميل React Native في mobile/react-native-app يتحدثان HTTP عبر البوابة فقط. لا يفتحان Postgres ولا RabbitMQ ولا Redis ولا Odoo.", "خدمة الطلبات (FastAPI) هي الكاتب الوحيد لحالة الطلب. تقارير Django تبني نماذج القراءة في reporting_db. Odoo 18 Community يملك المخزون وأمر البيع في odoo_db. إشعارات Flask تملك notification_db. المعاملة لا تفتح أكثر من واحدة من هذه القواعد.", "الاتساق القوي يقف عند معاملة واحدة في order_db. في ما عدا ذلك، القرّاء يلحقون بالأحداث والأوامر. COMPLETED في الـ Saga يعني أن الحجز والدفع المحاكى وإنشاء أمر ERP انتهت. لا يعني أن الطرد سُلّم."], "example": {"text": "تخيّل محلًا دفاتره ورقية. دفتر الكاشير هو المكان الوحيد الذي يُعلَّم فيه الطلب مؤكدًا. المحاسب ينقل الأرقام إلى دفتر ثانٍ لاحقًا. المستودع له دفتر مخزون خاص. إذا تأخر دفتر المحاسب ساعة، دفتر الكاشير يبقى الحقيقة لذلك الطلب. هذا التأخر هو هدف الفصل، وليس عطلًا في دفتر الكاشير.", "code": "", "caption": ""}, "how": ["Compose يشغّل أربعة خوادم Postgres: postgres (order_db) وreporting-postgres (reporting_db) وnotification-postgres (notification_db) وodoo-db (odoo_db)، مع RabbitMQ وRedis وعمليات التطبيقات وحزمة المراقبة. مدخل HTTP العام هو خدمة gateway.", "kind تغليف ثانٍ لنفس الصور تحت deploy/kind/. عقدة واحدة. HTTP العام يدخل من Ingress باسم public. لا توجد خدمة Saga منفصلة، ولا مزوّد دفع، ولا سلة على الخادم."], "files": [{"path": "docs/current-architecture.md", "note": "نفس الشجرة نثرًا"}, {"path": "docs/architecture.md", "note": "السياق والحاويات والمحادثات المسموحة"}, {"path": "docs/extension-gap-analysis.md", "note": "ما هو منفَّذ أو قديم أو ما زال غائبًا"}, {"path": "deploy/compose/docker-compose.yml", "note": "المكدس المحلي، حاوية لكل خدمة"}, {"path": "deploy/kind/kustomization.yaml", "note": "بيانات kind"}, {"path": "README.md", "note": "المراحل 0–20 ومراحل الامتداد 0–10"}], "trace": [{"title": "العميل ينادي البوابة", "who": "واجهة المتجر أو React Native", "what": "السلة تبقى على الجهاز. إتمام الشراء يرسل طلبًا واحدًا. العميل لا يرسل مجموع السلة كسعر.", "data": "HTTP إلى Traefik. مفتاح سلة المتصفح commerce.cart.", "fail": "إذا توقفت عملية البوابة، تتوقف الحركة العامة. قواعد البيانات لا تتغير."}, {"title": "صف الطلب يُثبَّت", "who": "خدمة الطلبات", "what": "POST /api/v1/orders يكتب الطلب بحالة PENDING وصف outbox من نوع OrderCreated في معاملة واحدة على order_db. معالج HTTP لا ينشر.", "data": "orders وorder_items وoutbox في order_db.", "fail": "المعاملة التي تُرجع لا تترك طلبًا ولا صف outbox."}, {"title": "الناشر يرسل الظرف", "who": "order-outbox-publisher", "what": "عملية منفصلة تقرأ صفوف outbox المعلقة وتنشر الحمولة المخزّنة.", "data": "تبادل RabbitMQ باسم commerce.events، ومفتاح التوجيه order.created.", "fail": "إذا كان الوسيط متوقفًا، نداء HTTP نجح أصلًا والصف يبقى pending."}, {"title": "القرّاء يلحقون", "who": "التقارير، ثم مستهلكون آخرون", "what": "Django يطبّق الحدث في معاملته. التقرير قد يبقى ناقصًا بعد رد الإنشاء.", "data": "إسقاطات reporting_db وprocessed_events.", "fail": "مستهلك متوقف يترك التقارير قديمة. صف الطلب لا يتراجع."}], "advantages": ["استعلام التقرير لا يقفل جداول إتمام الشراء.", "يمكن أن يكون Odoo متوقفًا ويظل صف الطلب يُثبَّت.", "لكل قاعدة مالك واحد، فتهجير التقارير لا يعيد كتابة الطلبات."], "disadvantages": ["القارئ قد يتأخر عن الكاتب. يجب أن تقول الصفحة ذلك.", "أربع قواعد ووسيط أثقل في التشغيل من مخطط واحد.", "التوقف بين التثبيت والنشر أمر متوقع ويجب تصميمه."], "alternatives": ["مخطط مشترك واحد رُفض في [ADR-004](adr/ADR-004-why-database-per-service.md): تهجير تقرير قد يقفل جدول الطلبات.", "نداء Django وOdoo داخل تأكيد الطلب رُفض في [ADR-006](adr/ADR-006-why-eventual-consistency.md): إتمام الشراء كان سينتظر أبطأ مشارك."], "failures": [{"title": "توقّف order_db", "text": "الإنشاء والتأكيد يفشلان. التقارير ما زالت تخدم آخر الإسقاطات. Odoo يحتفظ بما خزّنه. معاملة لم تُثبَّت لا تترك صفًا ولا رسالة outbox. انظر [failure-scenarios.md](failure-scenarios.md)."}, {"title": "توقّف الوسيط", "text": "التأكيد ما زال يُثبَّت في order_db. محاولات النشر تفشل والصفوف تبقى pending. حين يعود RabbitMQ، الناشر يفرّغها. لا يخترع رسائل لصفوف حالتها published."}], "tests": [{"path": "services/order-service/tests/unit/test_order_state.py", "note": "انتقالات حالة الطلب المسموحة"}, {"path": "docs/testing.md", "note": "ما نُفِّذ في 9 أكتوبر 2026، وما لم يُنفَّذ"}], "quiz": [{"q": "أي مكوّن مسموح له بتغيير حالة الطلب؟", "a": "خدمة الطلبات. التقارير وOdoo يحتفظان بنسخهما ولا يحدّثان الطلبات في order_db."}, {"q": "هل COMPLETED في الـ Saga تعني أن الطرد سُلّم؟", "a": "لا. COMPLETED تعني انتهاء الحجز والدفع المحاكى وإنشاء أمر ERP. التسليم هو آلة حالة الطلب: PENDING ثم CONFIRMED ثم PROCESSING ثم SHIPPED ثم DELIVERED."}, {"q": "لماذا قد يغيب التقرير لحظة بعد أن يرجع الإنشاء 201؟", "a": "معاملة الإنشاء تكتب order_db فقط. Django يطبّق OrderCreated لاحقًا في reporting_db."}], "summary": "العملاء يصلون إلى Traefik عبر HTTP. خدمة الطلبات تملك الطلبات في order_db. التقارير وOdoo والإشعارات تملك القواعد الثلاث الأخرى وتلحق عبر RabbitMQ. Redis ليس الكتالوج."}}, {"id": "services", "status": "implemented", "en": {"title": "Service boundaries", "lede": "Each box owns one job and refuses the jobs next to it. The gateway is not a business service.", "why": ["Ownership is what stops a report view from updating an order, and what stops the notification process from opening order_db. If two services write the same row, a failure in one leaves the other half-updated with no single rollback."], "explain": ["The order service owns accounts, the catalog, orders, the outbox, inventory snapshots, and saga rows in order_db. The saga orchestrator is a process in this service, not a separate service. Simulated payment is an adapter here. There is no payment provider.", "Django owns projections in reporting_db. Odoo owns sale.order, reservations, and commerce_event_outbox in odoo_db. Flask owns device tokens and mock deliveries in notification_db, and it refuses a DSN whose database name is order_db, reporting_db, or odoo_db.", "Traefik routes, adds CORS and request IDs, checks JWT by forward-auth, and applies a coarse in-memory rate limit. It does not own a database. kind already runs a second Traefik as the Ingress controller."], "example": {"text": "A library desk checks out books. The reading room keeps a count of visits. The reading room is not allowed to mark a book returned, even if that would make its chart look finished. The desk is the only writer of the loan. The chart catches up from a note the desk already filed.", "code": "", "caption": ""}, "how": ["Compose runs one container of each process, plus workers that are the same images with different commands: order-outbox-publisher, order-inventory-consumer, reporting-consumer, notification-consumer, odoo-consumer, and odoo-publisher. There is no saga-worker service in deploy/compose/docker-compose.yml. The React Native client is not a Compose service.", "Warehouse milestones are HTTP calls from Odoo to /api/v1/internal, with header X-Internal-Token. They are not broker messages. The gateway file does not route /health/live, /health/ready, or /api/v1/internal."], "files": [{"path": "docs/services.md", "note": "What each component must refuse"}, {"path": "docs/api.md", "note": "HTTP surface. Idempotency-Key is documented and not enforced"}, {"path": "services/order-service/src/order_service/presentation/app.py", "note": "Routers mounted by the order service"}, {"path": "services/reporting-service/reporting/urls.py", "note": "Report routes"}, {"path": "services/notification-service/src/notification_service/settings.py", "note": "require_notification_database"}, {"path": "deploy/compose/dynamic.yaml", "note": "Who Traefik sends each prefix to"}], "trace": [{"title": "Public auth", "who": "Traefik", "what": "POST register, login, refresh, and logout go to the order service without JWT forward-auth.", "data": "Routers in deploy/compose/dynamic.yaml.", "fail": "A wrong prefix can send report traffic to FastAPI, which answers 404."}, {"title": "Catalog and orders", "who": "Order service", "what": "Other /api/v1 routes, except /api/v1/internal and device tokens, require the gateway JWT check.", "data": "Authorization: Bearer access token.", "fail": "A bad token stops at the edge. The order row is not written."}, {"title": "Reports", "who": "Django", "what": "Traefik sends /api/v1/reports to the reporting service.", "data": "Read models only.", "fail": "If the projection is behind, the report is behind. It does not read order_db to fill the gap."}, {"title": "Device tokens", "who": "Flask", "what": "Traefik sends /api/v1/device-tokens to the notification service.", "data": "device_tokens in notification_db.", "fail": "This route does not create an email or a push by itself."}], "advantages": ["A failure in Flask does not take checkout down.", "The illegal join is obvious because the other database is a different process.", "The gateway can refuse internal routes without each client knowing the pod address."], "disadvantages": ["You operate more processes than a single app.", "A route mistake at Traefik is a silent 404, not a compiler error.", "The in-memory gateway limit is per gateway replica. It is not the shared login budget."], "alternatives": ["No gateway, with the browser calling each service, lost in [ADR-012](adr/ADR-012-why-api-gateway.md) because CORS and auth would fork.", "Django for orders and reports lost in [ADR-001](adr/ADR-001-why-fastapi.md) because one framework hides the boundary."], "failures": [{"title": "Notification database name", "text": "If NOTIFICATION_DATABASE_URL names order_db, reporting_db, or odoo_db, the process raises before SQLAlchemy builds an engine."}, {"title": "Gateway down", "text": "Public HTTP stops. Data already committed stays where it was. This is the single public door in the learning setup."}], "tests": [{"path": "deploy/gateway/tests/test_public_routes.py", "note": "Public rules omit /api/v1/internal"}, {"path": "services/notification-service/tests/test_boundaries.py", "note": "Other database names are refused"}, {"path": "services/order-service/tests/api/test_auth_api.py", "note": "Register, login, refresh, logout"}], "quiz": [{"q": "Who creates the ERP sales order?", "a": "Odoo, from the command CreateErpOrder. OrderConfirmed is recorded and does not insert sale.order."}, {"q": "Is the saga a separate service?", "a": "No. State is a row in saga_instances inside order_db. The worker is python -m order_service.infrastructure.saga.worker. Compose does not define that process."}, {"q": "Does the notification service read the customer's email from order_db?", "a": "No. It refuses that database. Mock email stores destination account:\u003caccount_id>."}], "summary": "Order, reporting, Odoo, and notifications each own one database. Traefik only routes. The saga and the simulated payment adapter stay inside the order service."}, "ar": {"title": "حدود الخدمات", "lede": "كل صندوق يملك عملًا واحدًا ويرفض أعمال جاره. البوابة ليست خدمة أعمال.", "why": ["الملكية هي ما يمنع شاشة تقرير من تحديث طلب، وما يمنع عملية الإشعار من فتح order_db. إذا كتبت خدمتان الصف نفسه، فعطل في واحدة يترك الأخرى نصف محدَّثة من غير تراجع واحد."], "explain": ["خدمة الطلبات تملك الحسابات والكتالوج والطلبات وoutbox ولقطات المخزون وصفوف الـ Saga في order_db. منسّق الـ Saga عملية داخل هذه الخدمة، وليس خدمة مستقلة. الدفع المحاكى محوّل هنا. لا يوجد مزوّد دفع.", "Django يملك الإسقاطات في reporting_db. Odoo يملك sale.order والحجوزات وcommerce_event_outbox في odoo_db. Flask يملك رموز الأجهزة والتسليم الوهمي في notification_db، ويرفض DSN اسم قاعدته order_db أو reporting_db أو odoo_db.", "Traefik يوجّه، ويضيف CORS ومعرّفات الطلب، ويتحقق من JWT عبر forward-auth، ويطبّق حدًا خشنًا في الذاكرة. لا يملك قاعدة. kind يشغّل Traefik ثانيًا كمتحكم Ingress."], "example": {"text": "مكتب المكتبة يعير الكتب. قاعة القراءة تحفظ عدد الزيارات. القاعة غير مسموح لها أن تعلّم الكتاب مُعادًا، حتى لو أكمل ذلك رسمها. المكتب هو الكاتب الوحيد للإعارة. الرسم يلحق من ملاحظة سجّلها المكتب.", "code": "", "caption": ""}, "how": ["Compose يشغّل حاوية لكل عملية، بالإضافة إلى عاملات هي نفس الصور بأوامر مختلفة: order-outbox-publisher وorder-inventory-consumer وreporting-consumer وnotification-consumer وodoo-consumer وodoo-publisher. لا توجد خدمة saga-worker في deploy/compose/docker-compose.yml. عميل React Native ليس خدمة Compose.", "معالم المستودع نداءات HTTP من Odoo إلى /api/v1/internal مع الترويسة X-Internal-Token. ليست رسائل وسيط. ملف البوابة لا يوجّه /health/live ولا /health/ready ولا /api/v1/internal."], "files": [{"path": "docs/services.md", "note": "ما يجب أن ترفضه كل مكوّنة"}, {"path": "docs/api.md", "note": "سطح HTTP. Idempotency-Key موثّق وغير مُلزَم"}, {"path": "services/order-service/src/order_service/presentation/app.py", "note": "الموجّهات التي تركّبها خدمة الطلبات"}, {"path": "services/reporting-service/reporting/urls.py", "note": "مسارات التقارير"}, {"path": "services/notification-service/src/notification_service/settings.py", "note": "require_notification_database"}, {"path": "deploy/compose/dynamic.yaml", "note": "إلى أين يرسل Traefik كل بادئة"}], "trace": [{"title": "المصادقة العامة", "who": "Traefik", "what": "POST للتسجيل والدخول والتجديد والخروج تذهب إلى خدمة الطلبات من غير فحص JWT.", "data": "الموجّهات في deploy/compose/dynamic.yaml.", "fail": "بادئة خاطئة قد ترسل حركة التقارير إلى FastAPI فيرد 404."}, {"title": "الكتالوج والطلبات", "who": "خدمة الطلبات", "what": "بقية مسارات /api/v1، ما عدا /api/v1/internal ورموز الأجهزة، تتطلب فحص JWT عند البوابة.", "data": "Authorization: Bearer access token.", "fail": "رمز سيئ يتوقف عند الحافة. صف الطلب لا يُكتب."}, {"title": "التقارير", "who": "Django", "what": "Traefik يرسل /api/v1/reports إلى خدمة التقارير.", "data": "نماذج قراءة فقط.", "fail": "إذا تأخر الإسقاط، يتأخر التقرير. لا يقرأ order_db لسد الفجوة."}, {"title": "رموز الأجهزة", "who": "Flask", "what": "Traefik يرسل /api/v1/device-tokens إلى خدمة الإشعارات.", "data": "device_tokens في notification_db.", "fail": "هذا المسار وحده لا ينشئ بريدًا ولا إشعار دفع."}], "advantages": ["عطل في Flask لا يوقف إتمام الشراء.", "الربط غير المسموح واضح لأن القاعدة الأخرى عملية مختلفة.", "البوابة ترفض المسارات الداخلية من غير أن يعرف كل عميل عنوان الحاوية."], "disadvantages": ["تشغّل عمليات أكثر من تطبيق واحد.", "خطأ مسار في Traefik يصبح 404 صامتًا، وليس خطأ مترجم.", "حد البوابة في الذاكرة لكل نسخة بوابة. ليس ميزانية الدخول المشتركة."], "alternatives": ["عدم وجود بوابة، مع نداء المتصفح لكل خدمة، خسر في [ADR-012](adr/ADR-012-why-api-gateway.md) لأن CORS والمصادقة كانا سيتفرعان.", "Django للطلبات والتقارير خسر في [ADR-001](adr/ADR-001-why-fastapi.md) لأن إطارًا واحدًا يخفي الحد."], "failures": [{"title": "اسم قاعدة الإشعارات", "text": "إذا سمّى NOTIFICATION_DATABASE_URL القاعدة order_db أو reporting_db أو odoo_db، ترفع العملية استثناءً قبل أن يبني SQLAlchemy محركًا."}, {"title": "توقّف البوابة", "text": "HTTP العام يتوقف. البيانات المثبّتة تبقى حيث كانت. هذا هو الباب العام الوحيد في إعداد التعلّم."}], "tests": [{"path": "deploy/gateway/tests/test_public_routes.py", "note": "القواعد العامة تستثني /api/v1/internal"}, {"path": "services/notification-service/tests/test_boundaries.py", "note": "أسماء القواعد الأخرى تُرفض"}, {"path": "services/order-service/tests/api/test_auth_api.py", "note": "التسجيل والدخول والتجديد والخروج"}], "quiz": [{"q": "من ينشئ أمر بيع ERP؟", "a": "Odoo، من الأمر CreateErpOrder. OrderConfirmed يُسجَّل ولا يدرج sale.order."}, {"q": "هل الـ Saga خدمة منفصلة؟", "a": "لا. الحالة صف في saga_instances داخل order_db. العامل هو python -m order_service.infrastructure.saga.worker. Compose لا يعرّف هذه العملية."}, {"q": "هل تقرأ خدمة الإشعارات بريد العميل من order_db؟", "a": "لا. ترفض تلك القاعدة. البريد الوهمي يخزّن الوجهة account:\u003caccount_id>."}], "summary": "الطلبات والتقارير وOdoo والإشعارات يملك كل منها قاعدة واحدة. Traefik يوجّه فقط. الـ Saga ومحوّل الدفع المحاكى يبقيان داخل خدمة الطلبات."}}, {"id": "repo", "status": "implemented", "en": {"title": "Repository navigator", "lede": "The tree under Distributed is the source of truth. A path on this page is a path the walk found.", "why": ["A learning portal that invents folders teaches the wrong system. The navigator below is the layout recorded in project-structure.md on 9 October 2026, plus this HTML file."], "explain": ["services/ holds order-service, reporting-service, notification-service, odoo, and frontend. mobile/react-native-app is the phone client. deploy/ holds Compose, the gateway, kind, observability, the failure lab, backup scripts, and the Locust scenario. docs/ holds the Markdown and this page. docs/adr/ holds ADR-001 through ADR-012.", "CI is the parent workflow .github/workflows/distributed-commerce-ci.yml, one directory above Distributed. There is no scripts/ directory here. The planned-path table in project-structure.md is empty.", "Caches such as node_modules, virtualenvs, and __pycache__ were on disk and are omitted from the lesson. services/frontend/dist is a Vite build output, not a source of behavior."], "example": {"text": "If you are looking for the order state machine, do not start in the React page. Start in the domain package. HTTP routes call use cases. Use cases call the unit of work. The unit of work talks to order_db. That order is the folder order.", "code": "services/order-service/src/order_service/\n  domain/            entities, events, repository interfaces\n  application/       use cases, saga orchestrator, unit of work port\n  infrastructure/    SQLAlchemy, RabbitMQ, Redis, saga worker\n  presentation/      FastAPI routes\n  observability/     logs, metrics, tracing", "caption": "Order-service layers"}, "how": ["Open a folder below. The note says what the walk found. Relative links from this HTML file point at the repository. Python and Markdown open most reliably in the editor.", "Host commands for each service stay in the README phase sections and in docs/run-the-project.md. The notification service also has services/notification-service/README.md. The phone client commands are in mobile/react-native-app/README.md."], "files": [{"path": "docs/project-structure.md", "note": "The walked tree"}, {"path": "docs/run-the-project.md", "note": "Local dependencies, Compose, and kind"}, {"path": "services/order-service/pyproject.toml", "note": "Order service package"}, {"path": "services/frontend/src/App.tsx", "note": "Storefront routes"}, {"path": "mobile/react-native-app/App.tsx", "note": "Phone app root"}, {"path": "deploy/kind/apply.sh", "note": "kind sequence; exits non-zero if Docker, kind, or kubectl is missing"}], "trace": [{"title": "Find a behavior", "who": "Reader", "what": "Start from the service that owns the data, then the layer that is allowed to decide.", "data": "domain before presentation.", "fail": "Editing a route to change a legal transition skips the domain test."}, {"title": "Find a deploy shape", "who": "Reader", "what": "Compose is deploy/compose/docker-compose.yml. kind is deploy/kind/.", "data": "Same images, two packagings.", "fail": "Reading only the standalone gateway file deploy/gateway/dynamic.yaml shows host.docker.internal, which is the Phase 10 layout, not the full Compose DNS names."}, {"title": "Find a test", "who": "Reader", "what": "Unit and API tests sit beside each service. Manifest tests read YAML and do not create a cluster.", "data": "deploy/kind/test_manifests.py, deploy/compose/test_stack.py.", "fail": "A green file-reading test is not a running stack."}], "advantages": ["One tree for code, deploy, and the decision records.", "Workers are commands of an existing image, not a second codebase.", "The phone app is outside services/ so the storefront is not moved."], "disadvantages": ["Some older sentences in docs still describe an earlier layout. The code wins.", "There is no single README inside order-service, reporting, odoo, or the storefront.", "CI lives in the parent directory, so it is easy to miss."], "alternatives": ["A scripts/ directory was not added in Extension Phase 7. apply.sh and up.sh already exist and exit non-zero on failure."], "failures": [{"title": "Opening the wrong gateway file", "text": "deploy/gateway/dynamic.yaml points at the host. The kind and full Compose path use deploy/compose/dynamic.yaml, with order-service:8000."}, {"title": "Looking for a saga deployment", "text": "The worker module exists. deploy/compose/docker-compose.yml does not name a saga-worker service. Do not treat a missing Compose service as a missing module."}], "tests": [{"path": "deploy/compose/test_stack.py", "note": "Reads the Compose file; does not start it"}, {"path": "deploy/kind/test_manifests.py", "note": "Reads YAML; does not create a cluster"}], "quiz": [{"q": "Where does the saga worker live?", "a": "services/order-service/src/order_service/infrastructure/saga/worker.py. It is not a top-level service directory."}, {"q": "Which Compose file is the full stack?", "a": "deploy/compose/docker-compose.yml. Each service also has its own compose.yaml for that service's local dependencies."}, {"q": "Where is CI?", "a": "The parent of Distributed: .github/workflows/distributed-commerce-ci.yml."}], "summary": "services, mobile, deploy, and docs are the top of the tree. Behavior lives in the owning service. Compose and kind package the same images."}, "ar": {"title": "متصفح المستودع", "lede": "الشجرة تحت Distributed هي مصدر الحقيقة. المسار في هذه الصفحة مسار وجدته الجولة.", "why": ["بوابة تعلّم تخترع المجلدات تعلّم النظام الخطأ. المتصفح أدناه هو التخطيط المسجّل في project-structure.md في 9 أكتوبر 2026، بالإضافة إلى ملف HTML هذا."], "explain": ["services/ يحوي order-service وreporting-service وnotification-service وodoo وfrontend. mobile/react-native-app هو عميل الهاتف. deploy/ يحوي Compose والبوابة وkind والمراقبة ومختبر الأعطال ونسخ الاحتياط وسيناريو Locust. docs/ يحوي Markdown وهذه الصفحة. docs/adr/ يحوي ADR-001 حتى ADR-012.", "CI هو مسار الأب .github/workflows/distributed-commerce-ci.yml، بمجلد فوق Distributed. لا يوجد مجلد scripts/ هنا. جدول المسارات المخططة في project-structure.md فارغ.", "المخابئ مثل node_modules والبيئات الافتراضية و__pycache__ كانت على القرص وهي خارج الدرس. services/frontend/dist ناتج بناء Vite، وليس مصدر السلوك."], "example": {"text": "إذا كنت تبحث عن آلة حالة الطلب، لا تبدأ من صفحة React. ابدأ من حزمة النطاق. مسارات HTTP تنادي حالات الاستخدام. حالات الاستخدام تنادي وحدة العمل. وحدة العمل تتحدث إلى order_db. هذا الترتيب هو ترتيب المجلدات.", "code": "services/order-service/src/order_service/\n  domain/            الكيانات والأحداث وواجهات المستودعات\n  application/       حالات الاستخدام ومنسّق الـ Saga ومنفذ وحدة العمل\n  infrastructure/    SQLAlchemy وRabbitMQ وRedis وعامل الـ Saga\n  presentation/      مسارات FastAPI\n  observability/     السجلات والمقاييس والتتبع", "caption": "طبقات خدمة الطلبات"}, "how": ["افتح مجلدًا أدناه. الملاحظة تقول ما وجدته الجولة. الروابط النسبية من ملف HTML هذا تشير إلى المستودع. Python وMarkdown يُفتحان بأوثق شكل في المحرر.", "أوامر المضيف لكل خدمة تبقى في أقسام المراحل في README وفي docs/run-the-project.md. خدمة الإشعارات لها أيضًا services/notification-service/README.md. أوامر الهاتف في mobile/react-native-app/README.md."], "files": [{"path": "docs/project-structure.md", "note": "الشجرة التي مُشيت"}, {"path": "docs/run-the-project.md", "note": "اعتمادات محلية وCompose وkind"}, {"path": "services/order-service/pyproject.toml", "note": "حزمة خدمة الطلبات"}, {"path": "services/frontend/src/App.tsx", "note": "مسارات واجهة المتجر"}, {"path": "mobile/react-native-app/App.tsx", "note": "جذر تطبيق الهاتف"}, {"path": "deploy/kind/apply.sh", "note": "تسلسل kind؛ يخرج بغير صفر إذا غاب Docker أو kind أو kubectl"}], "trace": [{"title": "جد السلوك", "who": "القارئ", "what": "ابدأ من الخدمة التي تملك البيانات، ثم الطبقة المسموح لها أن تقرر.", "data": "domain قبل presentation.", "fail": "تعديل مسار لتغيير انتقال مسموح يتخطى اختبار النطاق."}, {"title": "جد شكل النشر", "who": "القارئ", "what": "Compose هو deploy/compose/docker-compose.yml. kind هو deploy/kind/.", "data": "نفس الصور، تغليفان.", "fail": "قراءة ملف البوابة المستقل deploy/gateway/dynamic.yaml تُظهر host.docker.internal، وهو تخطيط المرحلة 10، وليس أسماء DNS في Compose الكامل."}, {"title": "جد اختبارًا", "who": "القارئ", "what": "اختبارات الوحدة وAPI بجانب كل خدمة. اختبارات البيانات تقرأ YAML ولا تنشئ عنقودًا.", "data": "deploy/kind/test_manifests.py وdeploy/compose/test_stack.py.", "fail": "اختبار أخضر يقرأ ملفًا ليس مكدسًا شغّالًا."}], "advantages": ["شجرة واحدة للكود والنشر وسجلات القرار.", "العاملات أوامر لصورة موجودة، وليست قاعدة كود ثانية.", "تطبيق الهاتف خارج services/ حتى لا تُنقل واجهة المتجر."], "disadvantages": ["بعض الجمل الأقدم في docs ما زالت تصف تخطيطًا سابقًا. الكود يفوز.", "لا يوجد README واحد داخل order-service أو reporting أو odoo أو واجهة المتجر.", "CI يعيش في المجلد الأب، فيسهل أن يفوتك."], "alternatives": ["لم يُضف مجلد scripts/ في مرحلة الامتداد 7. apply.sh وup.sh موجودان ويخرجان بغير صفر عند الفشل."], "failures": [{"title": "فتح ملف البوابة الخطأ", "text": "deploy/gateway/dynamic.yaml يشير إلى المضيف. مسار kind وCompose الكامل يستخدم deploy/compose/dynamic.yaml، مع order-service:8000."}, {"title": "البحث عن نشر للـ Saga", "text": "وحدة العامل موجودة. deploy/compose/docker-compose.yml لا يسمّي خدمة saga-worker. لا تعامل غياب خدمة Compose كغياب للوحدة."}], "tests": [{"path": "deploy/compose/test_stack.py", "note": "يقرأ ملف Compose؛ لا يشغّله"}, {"path": "deploy/kind/test_manifests.py", "note": "يقرأ YAML؛ لا ينشئ عنقودًا"}], "quiz": [{"q": "أين يعيش عامل الـ Saga؟", "a": "services/order-service/src/order_service/infrastructure/saga/worker.py. ليس مجلد خدمة في أعلى الشجرة."}, {"q": "أي ملف Compose هو المكدس الكامل؟", "a": "deploy/compose/docker-compose.yml. لكل خدمة compose.yaml لاعتماداتها المحلية."}, {"q": "أين CI؟", "a": "أب Distributed: .github/workflows/distributed-commerce-ci.yml."}], "summary": "services وmobile وdeploy وdocs أعلى الشجرة. السلوك يعيش في الخدمة المالكة. Compose وkind يغلّفان الصور نفسها."}}, {"id": "lifecycle", "status": "implemented", "en": {"title": "Request lifecycle", "lede": "A checkout is several local commits, not one distributed transaction. The HTTP response does not wait for RabbitMQ.", "why": ["If confirm waited for Django and Odoo, a stuck consumer would stall the customer. The lifecycle separates the user's wait from the integration."], "explain": ["The browser cart is localStorage key commerce.cart. The phone cart is memory in mobile/react-native-app/src/cartStore.ts and is cleared in memory after checkout. Neither client owns saga state. Prices are read from order_db when the order is created. The client does not send the cart total as the price.", "POST /api/v1/orders also takes a Redis lock keyed by account and lines, TTL 15 seconds. A second in-flight create gets 409 IDEMPOTENCY_IN_PROGRESS. Two requests in sequence still insert two orders. The lock is not an idempotency record. docs/api.md says Idempotency-Key is required. The handlers do not read that header. http_idempotency_keys is not a table.", "Confirm is a second transaction: order CONFIRMED, saga_status STARTED, the saga_instances row, and OrderConfirmed. It does not call Odoo or the payment adapter. Create and confirm are not one transaction."], "example": {"text": "You hand a parcel slip to a counter and get a receipt immediately. A second desk later tells the warehouse. If the warehouse phone is busy, you still have the receipt. Asking the counter to wait for the warehouse would make every busy signal your problem.", "code": "", "caption": ""}, "how": ["Login is 5 per minute per IP and per email hash, register is 5 per minute per IP, and order create is 10 per minute per IP and per account. Those routes fail closed when Redis is down. Product get and list do not. The gateway adds a separate coarse limit: 30 requests per second per client IP, burst 60, in memory, on one gateway replica.", "Order status moves PENDING to CONFIRMED to PROCESSING to SHIPPED to DELIVERED. Cancel is legal only from PENDING. PROCESSING, SHIPPED, and DELIVERED are internal routes, not public broker messages."], "files": [{"path": "services/frontend/src/cartStore.ts", "note": "commerce.cart"}, {"path": "mobile/react-native-app/src/cartStore.ts", "note": "In-memory phone cart"}, {"path": "services/order-service/src/order_service/presentation/routes/orders.py", "note": "Create, get, confirm, cancel, internal milestones"}, {"path": "services/order-service/src/order_service/application/use_cases/orders.py", "note": "ConfirmOrder commits one order_db transaction"}, {"path": "services/order-service/src/order_service/infrastructure/redis/order_lock.py", "note": "15 second create lock"}, {"path": "services/order-service/src/order_service/domain/entities/order_status.py", "note": "ALLOWED_TRANSITIONS"}], "trace": [{"title": "Cart stays local", "who": "Browser or phone", "what": "Checkout posts lines. The server prices them from products.", "data": "No server cart table.", "fail": "A refreshed phone loses the in-memory cart. The browser cart survives in commerce.cart."}, {"title": "Edge and limits", "who": "Traefik, then the order service", "what": "JWT forward-auth for the order route. Redis rate limit and the short create lock.", "data": "429 when the budget is spent. 409 while the lock is held.", "fail": "Redis down: order create fails closed. It does not skip the limit."}, {"title": "Create commits", "who": "SqlUnitOfWork", "what": "Order PENDING plus OrderCreated in outbox. HTTP returns without publishing.", "data": "order_db.", "fail": "Rollback leaves neither row."}, {"title": "Confirm commits", "who": "ConfirmOrder", "what": "CONFIRMED, saga STARTED, OrderConfirmed. The worker is a later process.", "data": "orders, saga_instances, outbox.", "fail": "Confirm does not reach Odoo. A later worker step can still be unknown."}, {"title": "Readers", "who": "Publisher, then consumers", "what": "Reporting may still show nothing, or PENDING at version 1, after confirm already returned CONFIRMED at version 2.", "data": "reporting_db lags.", "fail": "Do not re-confirm to 'fix' a missing report. A second confirm hits the state machine."}], "advantages": ["The customer is not coupled to the broker.", "Prices cannot be chosen by the client.", "The short lock stops a double click from inserting two in-flight orders."], "disadvantages": ["The 15 second lock expires. A retry after a crash can insert another order.", "The API document and the handlers disagree on Idempotency-Key.", "The report is not part of the HTTP success."], "alternatives": ["Blocking the HTTP response until consumers ack was rejected in ADR-006. A stuck consumer would become a stuck checkout.", "A durable http_idempotency_keys table is named in the docs and is not implemented."], "failures": [{"title": "Second confirm", "text": "The state machine refuses it. If the event was lost because someone published outside the outbox, retrying confirm does not recreate the event. That is why the outbox row is in the same commit."}, {"title": "Redis down on create", "text": "The route fails closed. Catalog reads still fall through to Postgres."}], "tests": [{"path": "services/order-service/tests/unit/test_order_state.py", "note": "Illegal transitions"}, {"path": "services/order-service/tests/api/test_redis_limits.py", "note": "Rate limits"}, {"path": "services/order-service/tests/unit/test_consistency_export.py", "note": "Confirm snapshot includes the outbox row"}], "quiz": [{"q": "Does the create handler publish to RabbitMQ?", "a": "No. It writes the outbox row and commits. order-outbox-publisher sends the stored envelope later."}, {"q": "What does the 15 second Redis lock guarantee?", "a": "It suppresses a second in-flight create with the same account and lines. It does not replay a lost response, and two sequential requests still create two orders."}, {"q": "Where is cancel legal?", "a": "Only from PENDING. CONFIRMED to CANCELLED is rejected."}], "summary": "Checkout commits order_db and returns. The cart is on the client. The broker, the report, and Odoo move afterward. The create lock is not an idempotency store."}, "ar": {"title": "دورة الطلب", "lede": "إتمام الشراء عدة تثبيتات محلية، وليس معاملة موزعة واحدة. رد HTTP لا ينتظر RabbitMQ.", "why": ["لو انتظر التأكيد Django وOdoo، مستهلك متوقف كان سيوقف العميل. الدورة تفصل انتظار المستخدم عن التكامل."], "explain": ["سلة المتصفح مفتاح localStorage باسم commerce.cart. سلة الهاتف ذاكرة في mobile/react-native-app/src/cartStore.ts وتُمسح في الذاكرة بعد إتمام الشراء. لا عميل يملك حالة الـ Saga. الأسعار تُقرأ من order_db عند إنشاء الطلب. العميل لا يرسل مجموع السلة كسعر.", "POST /api/v1/orders يأخذ أيضًا قفل Redis بمفتاح الحساب والأسطر، وTTL خمس عشرة ثانية. إنشاء ثانٍ ما زال في الطريق يحصل على 409 IDEMPOTENCY_IN_PROGRESS. طلبان متتاليان ما زالا يدرجان طلبين. القفل ليس سجل عدم تكرار. docs/api.md يقول إن Idempotency-Key مطلوب. المعالجات لا تقرأ هذه الترويسة. http_idempotency_keys ليس جدولًا.", "التأكيد معاملة ثانية: الطلب CONFIRMED، وsaga_status بقيمة STARTED، وصف saga_instances، وOrderConfirmed. لا ينادي Odoo ولا محوّل الدفع. الإنشاء والتأكيد ليسا معاملة واحدة."], "example": {"text": "تسلّم إيصال طرد للموظف وتأخذ إيصالًا فورًا. مكتب ثانٍ يخبر المستودع لاحقًا. إذا كان هاتف المستودع مشغولًا، يبقى الإيصال معك. طلب الانتظار من الموظف حتى يرد المستودع يجعل كل إشارة انشغال مشكلتك.", "code": "", "caption": ""}, "how": ["الدخول 5 في الدقيقة لكل IP ولكل تجزئة بريد، والتسجيل 5 في الدقيقة لكل IP، وإنشاء الطلب 10 في الدقيقة لكل IP ولكل حساب. هذه المسارات تفشل مغلقة حين يكون Redis متوقفًا. جلب المنتج وقائمته لا يفشلان كذلك. البوابة تضيف حدًا خشنًا منفصلًا: 30 طلبًا في الثانية لكل IP عميل، دفعة 60، في الذاكرة، على نسخة بوابة واحدة.", "حالة الطلب تنتقل من PENDING إلى CONFIRMED إلى PROCESSING إلى SHIPPED إلى DELIVERED. الإلغاء مسموح من PENDING فقط. PROCESSING وSHIPPED وDELIVERED مسارات داخلية، وليست رسائل وسيط عامة."], "files": [{"path": "services/frontend/src/cartStore.ts", "note": "commerce.cart"}, {"path": "mobile/react-native-app/src/cartStore.ts", "note": "سلة الهاتف في الذاكرة"}, {"path": "services/order-service/src/order_service/presentation/routes/orders.py", "note": "الإنشاء والجلب والتأكيد والإلغاء والمعالم الداخلية"}, {"path": "services/order-service/src/order_service/application/use_cases/orders.py", "note": "ConfirmOrder يثبّت معاملة order_db واحدة"}, {"path": "services/order-service/src/order_service/infrastructure/redis/order_lock.py", "note": "قفل الإنشاء لخمس عشرة ثانية"}, {"path": "services/order-service/src/order_service/domain/entities/order_status.py", "note": "ALLOWED_TRANSITIONS"}], "trace": [{"title": "السلة تبقى محلية", "who": "المتصفح أو الهاتف", "what": "إتمام الشراء يرسل الأسطر. الخادم يسعّرها من products.", "data": "لا جدول سلة على الخادم.", "fail": "تحديث الهاتف يضيع السلة التي في الذاكرة. سلة المتصفح تبقى في commerce.cart."}, {"title": "الحافة والحدود", "who": "Traefik ثم خدمة الطلبات", "what": "فحص JWT لمسار الطلب. حد Redis والقفل القصير.", "data": "429 حين تُستنفد الميزانية. 409 ما دام القفل ممسوكًا.", "fail": "Redis متوقف: إنشاء الطلب يفشل مغلقًا. لا يتخطى الحد."}, {"title": "الإنشاء يُثبَّت", "who": "SqlUnitOfWork", "what": "الطلب PENDING مع OrderCreated في outbox. HTTP يرجع من غير نشر.", "data": "order_db.", "fail": "التراجع لا يترك أي صف."}, {"title": "التأكيد يُثبَّت", "who": "ConfirmOrder", "what": "CONFIRMED والـ Saga على STARTED وOrderConfirmed. العامل عملية لاحقة.", "data": "orders وsaga_instances وoutbox.", "fail": "التأكيد لا يصل إلى Odoo. خطوة عامل لاحقة قد تبقى unknown."}, {"title": "القرّاء", "who": "الناشر ثم المستهلكون", "what": "التقارير قد تُظهر لا شيء، أو PENDING عند الإصدار 1، بعد أن رجع التأكيد CONFIRMED عند الإصدار 2.", "data": "reporting_db يتأخر.", "fail": "لا تُعد التأكيد لـ«إصلاح» تقرير ناقص. تأكيد ثانٍ يصطدم بآلة الحالة."}], "advantages": ["العميل غير مربوط بالوسيط.", "الأسعار لا يختارها العميل.", "القفل القصير يمنع نقرة مزدوجة من إدراج طلبين ما زالا في الطريق."], "disadvantages": ["القفل الذي مدته خمس عشرة ثانية ينتهي. إعادة المحاولة بعد توقّف قد تدرج طلبًا آخر.", "وثيقة API والمعالجات تختلفان حول Idempotency-Key.", "التقرير ليس جزءًا من نجاح HTTP."], "alternatives": ["حجب رد HTTP حتى يؤكّد المستهلكون رُفض في ADR-006. مستهلك متوقف كان سيصبح إتمام شراء متوقفًا.", "جدول http_idempotency_keys الدائم مذكور في الوثائق وغير منفَّذ."], "failures": [{"title": "تأكيد ثانٍ", "text": "آلة الحالة ترفضه. إذا ضاعت الرسالة لأن أحدًا نشر خارج outbox، إعادة التأكيد لا تعيد إنشاء الحدث. لهذا صف outbox داخل نفس التثبيت."}, {"title": "Redis متوقف عند الإنشاء", "text": "المسار يفشل مغلقًا. قراءات الكتالوج ما زالت تسقط إلى Postgres."}], "tests": [{"path": "services/order-service/tests/unit/test_order_state.py", "note": "الانتقالات غير المسموحة"}, {"path": "services/order-service/tests/api/test_redis_limits.py", "note": "حدود المعدل"}, {"path": "services/order-service/tests/unit/test_consistency_export.py", "note": "لقطة التأكيد تشمل صف outbox"}], "quiz": [{"q": "هل ينشر معالج الإنشاء إلى RabbitMQ؟", "a": "لا. يكتب صف outbox ويثبّت. order-outbox-publisher يرسل الظرف المخزّن لاحقًا."}, {"q": "ماذا يضمن قفل Redis الذي مدته خمس عشرة ثانية؟", "a": "يكبت إنشاءً ثانيًا ما زال في الطريق لنفس الحساب والأسطر. لا يعيد تشغيل رد ضائع، وطلبان متتاليان ما زالا ينشئان طلبين."}, {"q": "من أين يُسمح بالإلغاء؟", "a": "من PENDING فقط. الانتقال من CONFIRMED إلى CANCELLED مرفوض."}], "summary": "إتمام الشراء يثبّت order_db ويرجع. السلة عند العميل. الوسيط والتقرير وOdoo يتحركون بعد ذلك. قفل الإنشاء ليس مخزن عدم تكرار."}}, {"id": "clean", "status": "implemented", "en": {"title": "Clean Architecture in the order service", "lede": "The state machine lives in the domain. HTTP is an adapter. A transition test must not boot FastAPI.", "why": ["If the rule 'cancel only from PENDING' is written inside a route, the next route will copy it slightly wrong. The domain is the one place that rule exists."], "explain": ["domain/ holds entities, domain events, and repository interfaces. application/ holds use cases, the saga orchestrator, and the UnitOfWork port. infrastructure/ implements SQLAlchemy, RabbitMQ, Redis, security, and the saga worker. presentation/ is FastAPI. observability/ is logs, metrics, and traces.", "MVC is only at the HTTP edge. The route parses the request and calls a use case. The use case does not import FastAPI. The domain does not import SQLAlchemy.", "Patterns that are actually in this code: repository interfaces, unit of work, transactional outbox, orchestrated saga, CQRS (the write model is the order service; the read model is Django), database per service, cache-aside, and a circuit breaker on the simulated payment adapter. There is no event-sourced order log as the source of truth. The order row is the truth."], "example": {"text": "A turnstile allows one direction. The rule is in the mechanism, not in the poster on the door. You can test the mechanism on a bench. You do not need the whole station.", "code": "class UnitOfWork(ABC):\n    def stage_events(self, *aggregates) -> None:\n        \"\"\"Insert one pending outbox row per domain event.\"\"\"\n    def commit(self) -> None:\n        \"\"\"Make every write in this unit visible.\"\"\"", "caption": "The port, shortened from application/unit_of_work.py"}, "how": ["Order transitions are ALLOWED_TRANSITIONS in domain/entities/order_status.py. Saga transitions are ALLOWED_SAGA_TRANSITIONS in domain/entities/saga_status.py. Use cases in application/use_cases/orders.py and catalog.py are what the routes call.", "SqlUnitOfWork in infrastructure/database/unit_of_work.py is the SQLAlchemy implementation. Tests use an in-memory unit of work so the domain cases do not need Postgres."], "files": [{"path": "services/order-service/src/order_service/domain/entities/order.py", "note": "Order aggregate"}, {"path": "services/order-service/src/order_service/domain/repositories.py", "note": "Repository interfaces"}, {"path": "services/order-service/src/order_service/application/unit_of_work.py", "note": "Transaction port"}, {"path": "services/order-service/src/order_service/application/saga/orchestrator.py", "note": "One saga step per call"}, {"path": "services/order-service/src/order_service/presentation/routes/orders.py", "note": "HTTP adapter"}, {"path": "docs/adr/ADR-001-why-fastapi.md", "note": "Why the domain is not in the routers"}], "trace": [{"title": "Route", "who": "presentation/routes/orders.py", "what": "Authenticate, parse the body, call the use case, map domain errors to status codes.", "data": "HTTP in, HTTP out.", "fail": "A domain rule copied into the route will drift."}, {"title": "Use case", "who": "application/use_cases", "what": "Load aggregates through the unit of work, call entity methods, stage events, commit.", "data": "One order_db transaction.", "fail": "Opening reporting_db here would break the boundary."}, {"title": "Entity", "who": "domain/entities/order.py", "what": "Refuse an illegal transition before any SQL runs.", "data": "Order status and version.", "fail": "InvalidStateTransition becomes 409 at the edge."}, {"title": "Adapter", "who": "SqlUnitOfWork", "what": "Flush rows, including outbox, on commit.", "data": "SQLAlchemy session.", "fail": "Commit raises and the caller does not see a partial order."}], "advantages": ["Transition tests stay fast and do not import the web framework.", "A new adapter (memory in tests, SQL in the process) does not rewrite the rule.", "The saga decision stays next to the order aggregate it is about."], "disadvantages": ["More files than a single router module.", "A developer can still bypass the entity by writing SQL in a route. Review has to catch that.", "The word Clean Architecture is not a second framework. The folders are the enforcement."], "alternatives": ["Putting the domain in routers lost in ADR-001: the first illegal transition gets reimplemented in a second route, and unit tests boot the app.", "A separate saga service was refused. State stays on the order row's database."], "failures": [{"title": "Importing FastAPI from a domain test", "text": "That means the layering already slipped. test_order_state.py should exercise the entity, not the app."}, {"title": "Two writers of status", "text": "If a projection updated orders, the state machine would no longer be the only door. The reporting models do not do that."}], "tests": [{"path": "services/order-service/tests/unit/test_order_state.py", "note": "Legal and illegal edges"}, {"path": "services/order-service/tests/unit/test_saga_scenarios.py", "note": "Orchestrator with test ports, no HTTP"}], "quiz": [{"q": "Where is cancel-from-PENDING enforced?", "a": "In the domain order status machine, ALLOWED_TRANSITIONS. The route maps the domain error. It should not reimplement the table."}, {"q": "What is CQRS in this repository?", "a": "The order service is the write model. Django projections are the read model in another database. It is not two models inside one Postgres schema."}, {"q": "Does the order service use event sourcing as its store of truth?", "a": "No. The order row is the truth. The outbox stores the message that was committed with that row. Consumers may dedupe. They do not rebuild the order as the authority."}], "summary": "Domain rules, application use cases, and infrastructure adapters are separate in the order service. HTTP and SQL sit at the edges. The saga orchestrator is an application service, not a new deployable product."}, "ar": {"title": "البنية النظيفة في خدمة الطلبات", "lede": "آلة الحالة تعيش في النطاق. HTTP محوّل. اختبار الانتقال يجب ألا يشغّل FastAPI.", "why": ["إذا كُتبت قاعدة «الإلغاء من PENDING فقط» داخل مسار، المسار التالي سينسخها بشكل مختلف قليلًا. النطاق هو المكان الوحيد لتلك القاعدة."], "explain": ["domain/ يحوي الكيانات وأحداث النطاق وواجهات المستودعات. application/ يحوي حالات الاستخدام ومنسّق الـ Saga ومنفذ UnitOfWork. infrastructure/ ينفّذ SQLAlchemy وRabbitMQ وRedis والأمان وعامل الـ Saga. presentation/ هو FastAPI. observability/ سجلات ومقاييس وتتبع.", "MVC عند حافة HTTP فقط. المسار يقرأ الطلب وينادي حالة استخدام. حالة الاستخدام لا تستورد FastAPI. النطاق لا يستورد SQLAlchemy.", "الأنماط الموجودة فعلًا: واجهات المستودع، ووحدة العمل، وoutbox في نفس المعاملة، وSaga بالتنسيق، وCQRS (نموذج الكتابة هو خدمة الطلبات؛ نموذج القراءة هو Django)، وقاعدة لكل خدمة، وcache-aside، وقاطع دائرة على محوّل الدفع المحاكى. لا يوجد سجل أحداث للطلب كمصدر للحقيقة. صف الطلب هو الحقيقة."], "example": {"text": "بوابة دوّارة تسمح باتجاه واحد. القاعدة في الآلية، لا في الملصق على الباب. يمكنك اختبار الآلية على طاولة. لا تحتاج المحطة كلها.", "code": "class UnitOfWork(ABC):\n    def stage_events(self, *aggregates) -> None:\n        \"\"\"Insert one pending outbox row per domain event.\"\"\"\n    def commit(self) -> None:\n        \"\"\"Make every write in this unit visible.\"\"\"", "caption": "المنفذ، مختصر من application/unit_of_work.py"}, "how": ["انتقالات الطلب هي ALLOWED_TRANSITIONS في domain/entities/order_status.py. انتقالات الـ Saga هي ALLOWED_SAGA_TRANSITIONS في domain/entities/saga_status.py. حالات الاستخدام في application/use_cases/orders.py وcatalog.py هي ما تناديه المسارات.", "SqlUnitOfWork في infrastructure/database/unit_of_work.py هو تنفيذ SQLAlchemy. الاختبارات تستخدم وحدة عمل في الذاكرة حتى لا تحتاج حالات النطاق إلى Postgres."], "files": [{"path": "services/order-service/src/order_service/domain/entities/order.py", "note": "كيان الطلب"}, {"path": "services/order-service/src/order_service/domain/repositories.py", "note": "واجهات المستودعات"}, {"path": "services/order-service/src/order_service/application/unit_of_work.py", "note": "منفذ المعاملة"}, {"path": "services/order-service/src/order_service/application/saga/orchestrator.py", "note": "خطوة Saga واحدة في كل نداء"}, {"path": "services/order-service/src/order_service/presentation/routes/orders.py", "note": "محوّل HTTP"}, {"path": "docs/adr/ADR-001-why-fastapi.md", "note": "لماذا النطاق ليس داخل الموجّهات"}], "trace": [{"title": "المسار", "who": "presentation/routes/orders.py", "what": "يصادق، ويقرأ الجسم، وينادي حالة الاستخدام، ويربط أخطاء النطاق برموز الحالة.", "data": "HTTP داخلًا وخارجًا.", "fail": "قاعدة نطاق منسوخة في المسار ستنحرف."}, {"title": "حالة الاستخدام", "who": "application/use_cases", "what": "تحمّل الكيانات عبر وحدة العمل، وتنادي دوال الكيان، وتجهّز الأحداث، وتثبّت.", "data": "معاملة order_db واحدة.", "fail": "فتح reporting_db هنا يكسر الحد."}, {"title": "الكيان", "who": "domain/entities/order.py", "what": "يرفض الانتقال غير المسموح قبل أي SQL.", "data": "حالة الطلب والإصدار.", "fail": "InvalidStateTransition يصبح 409 عند الحافة."}, {"title": "المحوّل", "who": "SqlUnitOfWork", "what": "يثبّت الصفوف، بما فيها outbox، عند commit.", "data": "جلسة SQLAlchemy.", "fail": "commit يرفع والاستدعاء لا يرى طلبًا جزئيًا."}], "advantages": ["اختبارات الانتقال تبقى سريعة ولا تستورد إطار الويب.", "محوّل جديد (ذاكرة في الاختبار، SQL في العملية) لا يعيد كتابة القاعدة.", "قرار الـ Saga يبقى بجانب كيان الطلب الذي يدور حوله."], "disadvantages": ["ملفات أكثر من وحدة موجّه واحدة.", "يمكن لمطوّر أن يتجاوز الكيان بكتابة SQL في مسار. المراجعة هي ما يمسك ذلك.", "عبارة البنية النظيفة ليست إطارًا ثانيًا. المجلدات هي الإلزام."], "alternatives": ["وضع النطاق في الموجّهات خسر في ADR-001: أول انتقال غير مسموح يُعاد تنفيذه في مسار ثانٍ، واختبارات الوحدة تشغّل التطبيق.", "خدمة Saga منفصلة رُفضت. الحالة تبقى على قاعدة صف الطلب."], "failures": [{"title": "استيراد FastAPI من اختبار نطاق", "text": "هذا يعني أن الطبقات انزلقت. test_order_state.py يجب أن يمارس الكيان، لا التطبيق."}, {"title": "كاتبان للحالة", "text": "لو حدّث إسقاط جدول الطلبات، لما عادت آلة الحالة الباب الوحيد. نماذج التقارير لا تفعل ذلك."}], "tests": [{"path": "services/order-service/tests/unit/test_order_state.py", "note": "الحواف المسموحة والمرفوضة"}, {"path": "services/order-service/tests/unit/test_saga_scenarios.py", "note": "المنسّق بمنافذ اختبار، من غير HTTP"}], "quiz": [{"q": "أين يُفرَض الإلغاء من PENDING؟", "a": "في آلة حالة الطلب داخل النطاق، ALLOWED_TRANSITIONS. المسار يربط خطأ النطاق. لا ينبغي أن يعيد تنفيذ الجدول."}, {"q": "ما CQRS في هذا المستودع؟", "a": "خدمة الطلبات نموذج الكتابة. إسقاطات Django نموذج القراءة في قاعدة أخرى. ليستا نموذجين داخل مخطط Postgres واحد."}, {"q": "هل تستخدم خدمة الطلبات event sourcing كمخزن للحقيقة؟", "a": "لا. صف الطلب هو الحقيقة. outbox يخزّن الرسالة التي ثُبّتت مع ذلك الصف. المستهلكون قد يزيلون التكرار. لا يعيدون بناء الطلب كسلطة."}], "summary": "قواعد النطاق وحالات استخدام التطبيق ومحوّلات البنية منفصلة في خدمة الطلبات. HTTP وSQL عند الأطراف. منسّق الـ Saga خدمة تطبيق، وليس منتجًا مستقلًا للنشر."}}, {"id": "transactions", "status": "implemented", "en": {"title": "PostgreSQL transactions and Unit of Work", "lede": "One unit of work touches order_db and nothing else. The outbox row is part of that transaction. The broker is not.", "why": ["A commit that saves the order and forgets the message cannot be repaired by a second confirm: the state machine refuses it. A message sent before commit can describe an order that never existed. The unit of work makes those two writes one commit."], "explain": ["UnitOfWork in application/unit_of_work.py exposes repositories for products, customers, orders, sagas, accounts, and refresh tokens. stage_events inserts one pending outbox row per domain event. stage_outbox inserts command rows. commit makes every write visible or leaves them invisible.", "SqlUnitOfWork holds one SQLAlchemy session. commit() calls session.commit() and only then records outbox-created metrics. close() rolls back if commit did not happen. The session is order_db.", "Compose runs four servers. A laptop note in database.md that puts the original three databases in one container does not match docker-compose.yml. notification_db is a fourth server. Tables in order_db include accounts, customers, products, orders, order_items, outbox, processed_events, inventory_snapshots, refresh_tokens, and saga_instances from Alembic revision 20261009_0005. No migration creates http_idempotency_keys."], "example": {"text": "You write the sale and the 'tell the warehouse' line in the same pen stroke, then you close the book. If you drop the pen before the stroke finishes, neither line is in the book. A clerk who copies the warehouse line later is a different job. Closing the book does not phone the warehouse.", "code": "def commit(self) -> None:\n    self._session.commit()\n    self._committed = True\n    for event_type in self._outbox_types:\n        record_outbox_created(event_type)", "caption": "SqlUnitOfWork.commit, metrics after the database commit"}, "how": ["The HTTP handler asks the use case to commit. It does not open a second connection to reporting_db or odoo_db. orders.saga_status mirrors the saga row and is set in the same unit of work as the saga update.", "Odoo has its own transaction in odoo_db. Django applies a projection and processed_events in one reporting_db transaction. Those commits are not joined to order_db. That is the consistency boundary, not an accident."], "files": [{"path": "services/order-service/src/order_service/application/unit_of_work.py", "note": "Port: one database, outbox included"}, {"path": "services/order-service/src/order_service/infrastructure/database/unit_of_work.py", "note": "SQLAlchemy implementation"}, {"path": "services/order-service/src/order_service/infrastructure/database/models.py", "note": "order_db tables"}, {"path": "services/order-service/alembic/versions/20261009_0005_saga_instances.py", "note": "saga_instances"}, {"path": "docs/database.md", "note": "Ownership. The single-container note is older than Compose"}, {"path": "docs/adr/ADR-004-why-database-per-service.md", "note": "Why the databases stay split"}], "trace": [{"title": "Open", "who": "Request or worker", "what": "A session is bound to order_db.", "data": "One connection.", "fail": "If order_db is down, commit fails and the handler returns an error."}, {"title": "Stage", "who": "Use case or saga advance", "what": "Mutate aggregates, add outbox rows on the same session.", "data": "Business rows plus outbox.", "fail": "Forgetting stage_events means a committed order with no message."}, {"title": "Commit", "who": "SqlUnitOfWork.commit", "what": "Postgres commits all of those rows or none.", "data": "status pending on the outbox row.", "fail": "A raised commit leaves the previous committed state. Metrics for outbox creation run only after commit."}, {"title": "Close", "who": "Unit of work", "what": "If commit was skipped, rollback and close.", "data": "No partial insert.", "fail": "An exception after commit does not unpublish a row that Postgres already kept. The publisher may still be pending, which is safe."}], "advantages": ["The message cannot exist without the business row, and the business row cannot commit without the message row.", "Tests can substitute an in-memory unit of work.", "Metrics do not count an event the database rejected."], "disadvantages": ["The unit of work cannot reserve stock in Odoo. That needs a later command.", "Holding the design to one database means cross-service reads are a bug.", "A long transaction still locks order_db rows. The broker wait is deliberately outside it."], "alternatives": ["Two-phase commit across Postgres and RabbitMQ was rejected in ADR-005. Checkout availability would become broker availability.", "One shared schema was rejected in ADR-004."], "failures": [{"title": "Commit then crash before publish", "text": "The order exists. The outbox row is pending. Restarting the publisher sends it. Do not confirm again."}, {"title": "Rollback", "text": "No order row and no outbox row. Consumers must not see a ghost event, because nothing was published by the handler."}], "tests": [{"path": "services/order-service/tests/unit/test_outbox.py", "note": "Outbox row with the business write"}, {"path": "services/order-service/tests/unit/test_consistency_export.py", "note": "Confirmed order and OrderConfirmed share one snapshot"}], "quiz": [{"q": "Which databases can one order-service unit of work commit?", "a": "order_db only."}, {"q": "When are outbox-created metrics recorded?", "a": "After session.commit() returns, inside SqlUnitOfWork.commit."}, {"q": "Does saga_instances share the confirm transaction?", "a": "Yes. Confirm commits the order, the saga row, and OrderConfirmed together."}], "summary": "The unit of work is the order_db transaction boundary. Business rows and outbox rows commit together. Other databases commit later, on their own."}, "ar": {"title": "معاملات PostgreSQL ووحدة العمل", "lede": "وحدة عمل واحدة تلمس order_db ولا شيء غيرها. صف outbox جزء من تلك المعاملة. الوسيط ليس كذلك.", "why": ["تثبيت يحفظ الطلب وينسى الرسالة لا يُصلح بتأكيد ثانٍ: آلة الحالة ترفضه. رسالة تُرسل قبل التثبيت قد تصف طلبًا لم يوجد. وحدة العمل تجعل الكتابتين تثبيتًا واحدًا."], "explain": ["UnitOfWork في application/unit_of_work.py يعرض مستودعات للمنتجات والعملاء والطلبات والـ Saga والحسابات ورموز التجديد. stage_events يدرج صف outbox معلقًا لكل حدث نطاق. stage_outbox يدرج صفوف الأوامر. commit يجعل كل الكتابة ظاهرة أو يتركها غير ظاهرة.", "SqlUnitOfWork يمسك جلسة SQLAlchemy واحدة. commit() ينادي session.commit() ثم يسجّل مقاييس إنشاء outbox. close() يتراجع إذا لم يحدث commit. الجلسة هي order_db.", "Compose يشغّل أربعة خوادم. ملاحظة في database.md عن وضع القواعد الثلاث الأصلية في حاوية واحدة لا تطابق docker-compose.yml. notification_db خادم رابع. جداول order_db تشمل accounts وcustomers وproducts وorders وorder_items وoutbox وprocessed_events وinventory_snapshots وrefresh_tokens وsaga_instances من تهجير Alembic‏ 20261009_0005. لا تهجير ينشئ http_idempotency_keys."], "example": {"text": "تكتب البيع وسطر «أخبر المستودع» في حركة قلم واحدة، ثم تغلق الدفتر. إذا سقط القلم قبل اكتمال الحركة، لا سطر في الدفتر. الموظف الذي ينسخ سطر المستودع لاحقًا عمل مختلف. إغلاق الدفتر لا يتصل بالمستودع.", "code": "def commit(self) -> None:\n    self._session.commit()\n    self._committed = True\n    for event_type in self._outbox_types:\n        record_outbox_created(event_type)", "caption": "SqlUnitOfWork.commit، المقاييس بعد تثبيت القاعدة"}, "how": ["معالج HTTP يطلب من حالة الاستخدام أن تثبّت. لا يفتح اتصالًا ثانيًا إلى reporting_db أو odoo_db. orders.saga_status يعكس صف الـ Saga ويُضبط في نفس وحدة العمل مع تحديث الـ Saga.", "لدى Odoo معاملته في odoo_db. Django يطبّق الإسقاط وprocessed_events في معاملة reporting_db واحدة. هذه التثبيتات ليست مربوطة بـ order_db. هذا حد الاتساق، وليس صدفة."], "files": [{"path": "services/order-service/src/order_service/application/unit_of_work.py", "note": "المنفذ: قاعدة واحدة، وoutbox داخلها"}, {"path": "services/order-service/src/order_service/infrastructure/database/unit_of_work.py", "note": "تنفيذ SQLAlchemy"}, {"path": "services/order-service/src/order_service/infrastructure/database/models.py", "note": "جداول order_db"}, {"path": "services/order-service/alembic/versions/20261009_0005_saga_instances.py", "note": "saga_instances"}, {"path": "docs/database.md", "note": "الملكية. ملاحظة الحاوية الواحدة أقدم من Compose"}, {"path": "docs/adr/ADR-004-why-database-per-service.md", "note": "لماذا تبقى القواعد منفصلة"}], "trace": [{"title": "الفتح", "who": "طلب أو عامل", "what": "جلسة مربوطة بـ order_db.", "data": "اتصال واحد.", "fail": "إذا كان order_db متوقفًا، يفشل commit ويرجع المعالج خطأ."}, {"title": "التجهيز", "who": "حالة الاستخدام أو تقدم الـ Saga", "what": "تعدّل الكيانات، وتضيف صفوف outbox على نفس الجلسة.", "data": "صفوف الأعمال مع outbox.", "fail": "نسيان stage_events يعني طلبًا مثبّتًا بلا رسالة."}, {"title": "التثبيت", "who": "SqlUnitOfWork.commit", "what": "Postgres يثبّت كل هذه الصفوف أو لا شيء.", "data": "حالة pending على صف outbox.", "fail": "commit الذي يرفع يترك الحالة المثبّتة السابقة. مقاييس إنشاء outbox تعمل بعد commit فقط."}, {"title": "الإغلاق", "who": "وحدة العمل", "what": "إذا تُخطّي commit، تراجع ثم إغلاق.", "data": "لا إدراج جزئي.", "fail": "استثناء بعد commit لا يلغي نشر صف احتفظ به Postgres. الناشر قد يبقى pending، وهذا آمن."}], "advantages": ["الرسالة لا توجد من غير صف العمل، وصف العمل لا يُثبَّت من غير صف الرسالة.", "الاختبارات تستطيع استبدال وحدة عمل في الذاكرة.", "المقاييس لا تحصي حدثًا رفضته القاعدة."], "disadvantages": ["وحدة العمل لا تستطيع حجز المخزون في Odoo. ذلك يحتاج أمرًا لاحقًا.", "حصر التصميم في قاعدة واحدة يعني أن القراءة عبر الخدمات خطأ.", "معاملة طويلة ما زالت تقفل صفوف order_db. انتظار الوسيط عمدًا خارجها."], "alternatives": ["التثبيت على مرحلتين عبر Postgres وRabbitMQ رُفض في ADR-005. توفّر إتمام الشراء كان سيصبح توفّر الوسيط.", "مخطط مشترك واحد رُفض في ADR-004."], "failures": [{"title": "تثبيت ثم توقّف قبل النشر", "text": "الطلب موجود. صف outbox حالته pending. إعادة تشغيل الناشر ترسله. لا تُعد التأكيد."}, {"title": "التراجع", "text": "لا صف طلب ولا صف outbox. المستهلكون يجب ألا يروا حدثًا شبحًا، لأن المعالج لم ينشر شيئًا."}], "tests": [{"path": "services/order-service/tests/unit/test_outbox.py", "note": "صف outbox مع كتابة العمل"}, {"path": "services/order-service/tests/unit/test_consistency_export.py", "note": "الطلب المؤكد وOrderConfirmed في لقطة واحدة"}], "quiz": [{"q": "أي قواعد تستط
