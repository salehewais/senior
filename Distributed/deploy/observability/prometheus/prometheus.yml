# Phase 12 scrape list. Retention is short. This process is not required for checkout.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: order-service
    metrics_path: /metrics
    static_configs:
      - targets: ["order-service:8000"]

  - job_name: order-outbox-publisher
    metrics_path: /metrics
    static_configs:
      - targets: ["order-outbox-publisher:9100"]

  - job_name: order-inventory-consumer
    metrics_path: /metrics
    static_configs:
      - targets: ["order-inventory-consumer:9100"]

  - job_name: reporting-service
    metrics_path: /metrics
    static_configs:
      - targets: ["reporting-service:8001"]

  - job_name: reporting-consumer
    metrics_path: /metrics
    static_configs:
      - targets: ["reporting-consumer:9100"]

  # Aggregated counters. No per-channel Erlang pid labels.
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Queue depth, unacked, and consumers. Families stay off channel pid series.
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family:
        - queue_coarse_metrics
        - queue_consumer_count
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: postgres-order
    static_configs:
      - targets: ["postgres-exporter-order:9187"]

  - job_name: postgres-reporting
    static_configs:
      - targets: ["postgres-exporter-reporting:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Traefik metrics entrypoint is :8082 on the commerce network. It is not published.
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8082"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
