# Public HTTP ends at the gateway. Fulfillment routes are not listed.
# The gateway file provider still drops /api/v1/internal. Postgres, Redis,
# and RabbitMQ have no Ingress.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
  labels:
    app.kubernetes.io/part-of: commerce
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public
  namespace: commerce
  labels:
    app.kubernetes.io/part-of: commerce
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 80
