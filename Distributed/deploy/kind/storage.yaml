# Static hostPath volumes on the kind node. kind does not ship a provisioner.
# A pod restart mounts the same claim. Deleting the cluster deletes the node
# disk, and these directories go with it.
# Redis has no volume. It is a cache.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: commerce-hostpath
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: Immediate
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: commerce-order-postgres
  labels:
    app.kubernetes.io/part-of: commerce
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: commerce-hostpath
  hostPath:
    path: /var/local/commerce/order-postgres
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: order-postgres
  namespace: commerce
  labels:
    app.kubernetes.io/part-of: commerce
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: commerce-hostpath
  volumeName: commerce-order-postgres
  resources:
    requests:
      storage: 1Gi
