# One-node kind cluster. Not a production cluster.
# Host port 8080 on 127.0.0.1 is the only published door. It lands on the
# ingress Service node port. Postgres, Redis, and RabbitMQ are not mapped.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: commerce
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
