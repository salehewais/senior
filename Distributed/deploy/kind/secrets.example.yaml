# Example only. Do not apply this file. Do not commit a filled copy.
# Create the real Secret with deploy/kind/create-secrets.sh, which reads the
# host PEM files and INTERNAL_SERVICE_TOKEN and does not write them back to git.
#
# Database passwords are not keys here. The Deployments use the laptop-only
# placeholders already printed in deploy/compose/docker-compose.yml
# (order_service, reporting_service, odoo). Those are not shared-environment
# credentials. A private key and a filled token must not be committed.
apiVersion: v1
kind: Secret
metadata:
  name: commerce-secrets
  namespace: commerce
  labels:
    app.kubernetes.io/part-of: commerce
type: Opaque
stringData:
  INTERNAL_SERVICE_TOKEN: ""
  jwt_private.pem: |
    REPLACE_WITH_HOST_PEM
  jwt_public.pem: |
    REPLACE_WITH_HOST_PEM
