<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Notifications</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; color: #1a1a1a; }
    h1 { font-size: 1.4rem; }
    form, section { margin: 1.5rem 0; }
    label { display: block; margin: 0.4rem 0; }
    table { border-collapse: collapse; width: 100%; margin-top: 0.5rem; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; vertical-align: top; }
    th { background: #f4f4f4; }
    .message { min-height: 1.2rem; }
  </style>
</head>
<body>
  <h1>Notifications</h1>
  <p>Read-only. Sign in with a staff account. The access token stays in this tab.</p>
  <form id="login">
    <label>Email <input id="email" type="email" name="email" value="admin@admin.com" autocomplete="username" required></label>
    <label>Password <input id="password" type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
    <button type="button" id="sign-out">Sign out</button>
  </form>
  <p id="message" class="message"></p>
  <section>
    <h2>Deliveries</h2>
    <table id="deliveries">
      <thead><tr><th>Channel</th><th>Summary</th><th>Account</th><th>Destination</th><th>Time</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
  <script>
    const TOKEN_KEY = "staff.access_token";
    const message = document.getElementById("message");

    function fill(rows) {
      const body = document.querySelector("#deliveries tbody");
      body.replaceChildren();
      if (!rows.length) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 5;
        td.textContent = "No rows.";
        tr.append(td);
        body.append(tr);
        return;
      }
      for (const row of rows) {
        const tr = document.createElement("tr");
        for (const value of [row.channel, row.summary, row.account_id, row.destination, row.created_at]) {
          const td = document.createElement("td");
          td.textContent = value == null ? "" : String(value);
          tr.append(td);
        }
        body.append(tr);
      }
    }

    async function readError(response) {
      try {
        const body = await response.json();
        if (body.error && body.error.message) return body.error.message;
      } catch (err) {
        return "Request failed (" + response.status + ").";
      }
      return "Request failed (" + response.status + ").";
    }

    async function load(token) {
      const response = await fetch("/api/v1/notifications", {
        headers: { Authorization: "Bearer " + token },
      });
      if (!response.ok) throw new Error(await readError(response));
      const body = await response.json();
      fill(body.notifications || []);
      message.textContent = "Signed in.";
    }

    document.getElementById("login").addEventListener("submit", async function (event) {
      event.preventDefault();
      message.textContent = "Signing in…";
      const response = await fetch("/api/v1/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        }),
      });
      if (!response.ok) {
        message.textContent = await readError(response);
        return;
      }
      const body = await response.json();
      sessionStorage.setItem(TOKEN_KEY, body.access_token);
      document.getElementById("password").value = "";
      try {
        await load(body.access_token);
      } catch (err) {
        message.textContent = err.message;
      }
    });

    document.getElementById("sign-out").addEventListener("click", function () {
      sessionStorage.removeItem(TOKEN_KEY);
      message.textContent = "Signed out.";
      fill([]);
    });

    const existing = sessionStorage.getItem(TOKEN_KEY);
    if (existing) {
      load(existing).catch(function (err) {
        message.textContent = err.message;
      });
    } else {
      fill([]);
    }
  </script>
</body>
</html>
