[project]
name = "notification-service"
version = "0.1.0"
description = "Flask notification service. Extension Phase 3: notification_db, mock email and push, device tokens."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "flask>=3.1,<4",
    "pika>=1.3,<2",
    "prometheus-client>=0.21",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.10",
    "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
notification_service = ["templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: live Postgres on 5435 and RabbitMQ on 5672",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
