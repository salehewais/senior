[project]
name = "reporting-service"
version = "0.1.0"
description = "Django reporting service. Phase 7: projections in reporting_db and report HTTP."
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6",
    "pika>=1.3,<2",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reporting*", "projections*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "reporting.settings_test"
pythonpath = ["."]
testpaths = ["projections/tests", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["reporting", "projections", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
