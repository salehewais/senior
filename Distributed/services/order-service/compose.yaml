# Phase 1 Postgres, Phase 4 RabbitMQ, Phase 9 Redis.
# The full stack is deploy/compose/docker-compose.yml. This file stays for the
# order service running on the host, with these ports on 127.0.0.1.
# The gateway is deploy/gateway/compose.yaml (Phase 10), not this file.
# Django is services/reporting-service/compose.yaml.
# Odoo is services/odoo/compose.yaml.
#
# Learning simplification: order_service owns this database because it is the only
# database on this server. Production would split a migration role from the runtime
# role and would not publish 5432 on the host.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: order_service
      POSTGRES_PASSWORD: order_service
      POSTGRES_DB: order_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_service -d order_db"]
      interval: 2s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: order_service
      RABBITMQ_DEFAULT_PASS: order_service
    ports:
      # Localhost only. Do not publish AMQP or the management UI on 0.0.0.0.
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - order_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    # No password. Local placeholder, not a committed secret.
    # Host publish is 127.0.0.1 only. Do not bind 0.0.0.0.
    # protected-mode is off because Docker NAT makes a laptop client look non-local
    # inside the container, and protected mode would refuse that connection.
    # Persistence is off: Redis is not a system of record.
    # If 6379 is already taken on the host, change the left-hand port and set
    # REDIS_URL=redis://127.0.0.1:<port>/0. 6379 was free when this was added.
    command: ["redis-server", "--protected-mode", "no", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  order_db_data:
  order_rabbitmq_data:
