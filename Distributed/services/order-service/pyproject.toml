[project]
name = "order-service"
version = "0.1.0"
description = "Order service for the commerce learning platform. Phase 9: domain, order_db, HTTP, authentication, RabbitMQ, reliable consumption, the transactional outbox, and Redis for the product cache and shared rate limits."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "pika>=1.3,<2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-sdk>=1.27",
    "prometheus-client>=0.21",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
