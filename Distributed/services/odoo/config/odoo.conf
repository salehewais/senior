[options]
# Odoo 18 Community. The image tag is pinned in compose.yaml, not here.
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
admin_passwd = admin
# db_host, db_port, db_user, and db_password are omitted on purpose.
# The image entrypoint reads HOST, PORT, USER, and PASSWORD from Compose and
# passes them to both the Postgres wait and the Odoo process. Putting them
# here would skip that wait and leave it pointed at the image default host.
db_name = odoo_db
dbfilter = ^odoo_db$
list_db = False
proxy_mode = False
workers = 0
# Backstop so one request cannot wait forever. The worker's own timeout is shorter.
limit_time_cpu = 30
limit_time_real = 30
http_interface = 0.0.0.0
http_port = 8069
without_demo = all
