[project]
name = "odoo-connector"
version = "0.1.0"
description = "Phase 8 Odoo connector. Confirmed orders in, inventory snapshots out. No database of its own."
requires-python = ">=3.12"
dependencies = [
    "pika>=1.3,<2",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src", "tests", "addons"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
