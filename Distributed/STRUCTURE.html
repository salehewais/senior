1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"notification_db\" data-ar=\"notification_db\" x=\"255.0\" y=\"148.0\" text-anchor=\"middle\">notification_db\u003c/text>\u003crect x=\"180\" y=\"168\" width=\"110\" height=\"32\" rx=\"8\" fill=\"#fbf1e4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"odoo_db\" data-ar=\"odoo_db\" x=\"235.0\" y=\"188.0\" text-anchor=\"middle\">odoo_db\u003c/text>\u003c/svg>"}, {"type": "diagram", "id": "otel", "en": "Telemetry paths that are configured", "ar": "مسارات القياس المضبوطة", "note": {"en": "Metrics skip the collector. Traces use it. Alerts end in container logs.", "ar": "المقاييس تتجاوز المجمّع. الآثار تستخدمه. التنبيهات تنتهي في سجلات الحاوية."}, "svg": "\u003csvg class=\"arch\" viewBox=\"0 0 668 182\" role=\"img\">\u003cdefs>\u003cmarker id=\"arrow-otel\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#0e4c5c\"/>\u003c/marker>\u003c/defs>\u003cline x1=\"136\" y1=\"48.0\" x2=\"190\" y2=\"48.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-otel)\"/>\u003ctext data-en=\"scrape\" data-ar=\"سحب\" x=\"163.0\" y=\"44.0\" text-anchor=\"middle\">scrape\u003c/text>\u003cline x1=\"320\" y1=\"48.0\" x2=\"360\" y2=\"34.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-otel)\"/>\u003ctext data-en=\"rules\" data-ar=\"قواعد\" x=\"340.0\" y=\"37.0\" text-anchor=\"middle\">rules\u003c/text>\u003cline x1=\"490\" y1=\"34.0\" x2=\"520\" y2=\"34.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-otel)\"/>\u003ctext data-en=\"webhook\" data-ar=\"خطاف\" x=\"505.0\" y=\"30.0\" text-anchor=\"middle\">webhook\u003c/text>\u003cline x1=\"320\" y1=\"48.0\" x2=\"360\" y2=\"88.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-otel)\"/>\u003ctext data-en=\"query\" data-ar=\"استعلام\" x=\"340.0\" y=\"64.0\" text-anchor=\"middle\">query\u003c/text>\u003cline x1=\"146\" y1=\"128.0\" x2=\"190\" y2=\"128.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-otel)\"/>\u003ctext data-en=\"traces\" data-ar=\"آثار\" x=\"168.0\" y=\"124.0\" text-anchor=\"middle\">traces\u003c/text>\u003cline x1=\"300\" y1=\"128.0\" x2=\"360\" y2=\"88.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-otel)\"/>\u003ctext data-en=\"datasource\" data-ar=\"مصدر\" x=\"330.0\" y=\"104.0\" text-anchor=\"middle\">datasource\u003c/text>\u003crect x=\"16\" y=\"30\" width=\"120\" height=\"36\" rx=\"8\" fill=\"#fffdf8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"App /metrics\" data-ar=\"مقاييس التطبيق\" x=\"76.0\" y=\"52.0\" text-anchor=\"middle\">App /metrics\u003c/text>\u003crect x=\"190\" y=\"30\" width=\"130\" height=\"36\" rx=\"8\" fill=\"#eef0f8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Prometheus\" data-ar=\"بروميثيوس\" x=\"255.0\" y=\"52.0\" text-anchor=\"middle\">Prometheus\u003c/text>\u003crect x=\"360\" y=\"16\" width=\"130\" height=\"36\" rx=\"8\" fill=\"#eef0f8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Alertmanager\" data-ar=\"ألرت مانجر\" x=\"425.0\" y=\"38.0\" text-anchor=\"middle\">Alertmanager\u003c/text>\u003crect x=\"520\" y=\"16\" width=\"120\" height=\"36\" rx=\"8\" fill=\"#eef0f8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"hook.py stdout\" data-ar=\"مخرج hook.py\" x=\"580.0\" y=\"38.0\" text-anchor=\"middle\">hook.py stdout\u003c/text>\u003crect x=\"360\" y=\"70\" width=\"130\" height=\"36\" rx=\"8\" fill=\"#eef0f8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Grafana\" data-ar=\"غرافانا\" x=\"425.0\" y=\"92.0\" text-anchor=\"middle\">Grafana\u003c/text>\u003crect x=\"16\" y=\"110\" width=\"130\" height=\"36\" rx=\"8\" fill=\"#e5f2f4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"OTLP collector\" data-ar=\"مجمّع OTLP\" x=\"81.0\" y=\"132.0\" text-anchor=\"middle\">OTLP collector\u003c/text>\u003crect x=\"190\" y=\"110\" width=\"110\" height=\"36\" rx=\"8\" fill=\"#fbf1e4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Tempo\" data-ar=\"تيمبو\" x=\"245.0\" y=\"132.0\" text-anchor=\"middle\">Tempo\u003c/text>\u003c/svg>"}]}, {"id": "failure", "title": {"en": "Failure lab and recovery", "ar": "مختبر الأعطال والاستعادة"}, "blocks": [{"type": "p", "en": "deploy/failure-lab contains four experiments plus lib.sh. Each experiment only stops or starts one Compose service. lib.sh rejects any other compose verb and any other service name. test_lab.py is static: it checks bash syntax, the service name, the observation text, and that the scripts do not wipe volumes, delete rows, or call /api/v1/internal. It does not stop a container. The scripts do not assert the running system. The expected behavior below is what the script text tells the operator to look for, matched to the application code that implements that behavior. A filename is not evidence.", "ar": "⁦deploy/failure-lab⁩ فيه أربع تجارب إضافة إلى ⁦lib.sh⁩. كل تجربة توقف أو تشغّل خدمة Compose واحدة فقط. ⁦lib.sh⁩ يرفض أي فعل compose آخر وأي اسم خدمة آخر. ⁦test_lab.py⁩ اختبار ثابت: يفحص صياغة bash واسم الخدمة ونص الملاحظة وأن السكربتات لا تمسح الأحجام ولا تحذف صفوفاً ولا تنادي ⁦/api/v1/internal⁩. لا يوقف حاوية. السكربتات لا تؤكد النظام وهو يعمل. السلوك المتوقع أدناه هو ما يطلب نص السكربت من المشغّل أن ينظر إليه، مطابق لكود التطبيق الذي ينفّذ ذلك السلوك. اسم الملف ليس دليلاً."}, {"type": "table", "headers": [{"en": "Scenario", "ar": "السيناريو"}, {"en": "Target", "ar": "الهدف"}, {"en": "Trigger", "ar": "المُطلِق"}, {"en": "Expected behavior", "ar": "السلوك المتوقع"}, {"en": "Evidence", "ar": "الدليل"}, {"en": "Recovery", "ar": "الاستعادة"}, {"en": "Limit", "ar": "الحد"}], "rows": [[{"en": "Broker stopped", "ar": "الوسيط متوقف"}, {"en": "rabbitmq", "ar": "rabbitmq"}, {"en": "bash deploy/failure-lab/rabbitmq.sh stop", "ar": "bash deploy/failure-lab/rabbitmq.sh stop"}, {"en": "Order HTTP still commits. Outbox stays pending. After 5 failed confirms the row becomes failed.", "ar": "طلب HTTP ما زال يُثبَّت. الصندوق يبقى pending. بعد 5 تأكيدات فاشلة يصبح الصف failed."}, {"en": "Script text plus outbox publisher and outbox_max_attempts = 5. test_lab.py checks the words, not a live order.", "ar": "نص السكربت مع ناشر الصندوق وoutbox_max_attempts = 5. test_lab.py يفحص الكلمات لا طلباً حياً."}, {"en": "rabbitmq.sh start. Pending rows drain. A failed row is not claimed until an operator sets it pending and retry_count 0. Do not delete the row.", "ar": "rabbitmq.sh start. الصفوف المعلقة تُفرَّغ. الصف الفاشل لا يُحجز حتى يعيده مشغّل إلى pending وretry_count صفر. لا تحذف الصف."}, {"en": "Does not stop Postgres, the API, or the publisher. Does not test a network partition.", "ar": "لا يوقف Postgres ولا الواجهة ولا الناشر. لا يختبر قطعاً شبكياً."}], [{"en": "Redis stopped", "ar": "ريديس متوقف"}, {"en": "redis", "ar": "redis"}, {"en": "bash deploy/failure-lab/redis.sh stop", "ar": "bash deploy/failure-lab/redis.sh stop"}, {"en": "Catalog reads still use order_db. Login, register, and order create return 503 DEPENDENCY_UNAVAILABLE. Confirm, read, refresh, and logout do not use Redis.", "ar": "قراءات الكتالوج ما زالت تستخدم order_db. الدخول والتسجيل وإنشاء الطلب تعيد 503 وDEPENDENCY_UNAVAILABLE. التأكيد والقراءة والتحديث والخروج لا تستخدم Redis."}, {"en": "Script text. jwt-check does not use Redis. Unit tests cover cache and limits separately.", "ar": "نص السكربت. jwt-check لا يستخدم Redis. اختبارات الوحدة تغطي الذاكرة والحدود بشكل منفصل."}, {"en": "redis.sh start. Limits apply again. A 429 RATE_LIMITED means the limiter is back.", "ar": "redis.sh start. الحدود تعود. 429 مع RATE_LIMITED يعني أن المحدد عاد."}, {"en": "Does not delete orders. Redis had no persistence in Compose, so keys are gone after a real process restart anyway.", "ar": "لا يحذف الطلبات. Redis بلا تخزين دائم في Compose، فالمفاتيح تختفي بعد إعادة تشغيل حقيقية للعملية على أي حال."}], [{"en": "Inventory consumer stopped", "ar": "مستهلِك المخزون متوقف"}, {"en": "order-inventory-consumer", "ar": "order-inventory-consumer"}, {"en": "bash deploy/failure-lab/inventory-consumer.sh stop", "ar": "bash deploy/failure-lab/inventory-consumer.sh stop"}, {"en": "Confirm still returns CONFIRMED. That event is not routed to q.order.inventory. The queue grows only when Odoo publishes InventoryUpdated.", "ar": "التأكيد ما زال يعيد CONFIRMED. ذلك الحدث لا يُوجَّه إلى q.order.inventory. الطابور ينمو فقط عندما ينشر أودو InventoryUpdated."}, {"en": "Binding in topology.py. Duplicate event_id is acked without a second snapshot. Unit test named in the script: test_duplicate_event_id_does_not_apply_twice.", "ar": "الربط في topology.py. تكرار event_id يُقر بدون لقطة ثانية. اختبار الوحدة المذكور في السكربت: test_duplicate_event_id_does_not_apply_twice."}, {"en": "inventory-consumer.sh start drains the queue.", "ar": "inventory-consumer.sh start يفرّغ الطابور."}, {"en": "Does not stop Odoo or the Odoo publisher. If nothing publishes inventory, depth does not grow.", "ar": "لا يوقف أودو ولا ناشر أودو. إذا لم يُنشر مخزون فالعمق لا ينمو."}], [{"en": "Reporting consumer stopped", "ar": "مستهلِك التقارير متوقف"}, {"en": "reporting-consumer", "ar": "reporting-consumer"}, {"en": "bash deploy/failure-lab/reporting-consumer.sh stop", "ar": "bash deploy/failure-lab/reporting-consumer.sh stop"}, {"en": "Confirm still returns 200 CONFIRMED. q.reporting.projection grows. Old report rows still answer. New facts are absent until the consumer starts.", "ar": "التأكيد ما زال يعيد 200 وCONFIRMED. q.reporting.projection ينمو. صفوف التقارير القديمة ما زالت تجيب. الحقائق الجديدة غائبة حتى يبدأ المستهلِك."}, {"en": "Script text and reporting consumer idempotency on event_id. reason=duplicate means no second apply.", "ar": "نص السكربت وتماثل مستهلِك التقارير على event_id. reason=duplicate يعني عدم تطبيق ثانٍ."}, {"en": "reporting-consumer.sh start.", "ar": "reporting-consumer.sh start."}, {"en": "Does not stop odoo-consumer. Does not prove lag numbers. Do not point Django at order_db.", "ar": "لا يوقف odoo-consumer. لا يثبت أرقام التأخر. لا توجّه Django إلى order_db."}]]}, {"type": "diagram", "id": "failure-map", "en": "Failure-lab targets", "ar": "أهداف مختبر الأعطال", "note": {"en": "Each script stops one box. The other boxes stay up. There is no script for Postgres or the order API.", "ar": "كل سكربت يوقف مربعاً واحداً. المربعات الأخرى تبقى. لا يوجد سكربت لـ Postgres أو واجهة الطلبات."}, "svg": "\u003csvg class=\"arch\" viewBox=\"0 0 718 162\" role=\"img\">\u003cdefs>\u003cmarker id=\"arrow-failure-map\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#0e4c5c\"/>\u003c/marker>\u003c/defs>\u003cline x1=\"156\" y1=\"38.0\" x2=\"180\" y2=\"108.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-failure-map)\"/>\u003ctext data-en=\"outbox waits\" data-ar=\"الصندوق ينتظر\" x=\"168.0\" y=\"69.0\" text-anchor=\"middle\">outbox waits\u003c/text>\u003cline x1=\"240.0\" y1=\"56\" x2=\"250.0\" y2=\"90\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-failure-map)\"/>\u003ctext data-en=\"limits fail\" data-ar=\"الحدود تفشل\" x=\"245.0\" y=\"69.0\" text-anchor=\"middle\">limits fail\u003c/text>\u003cline x1=\"330\" y1=\"38.0\" x2=\"320\" y2=\"108.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-failure-map)\"/>\u003ctext data-en=\"confirm ok\" data-ar=\"التأكيد ينجح\" x=\"325.0\" y=\"69.0\" text-anchor=\"middle\">confirm ok\u003c/text>\u003cline x1=\"520\" y1=\"38.0\" x2=\"320\" y2=\"108.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-failure-map)\"/>\u003ctext data-en=\"confirm ok\" data-ar=\"التأكيد ينجح\" x=\"420.0\" y=\"69.0\" text-anchor=\"middle\">confirm ok\u003c/text>\u003crect x=\"16\" y=\"20\" width=\"140\" height=\"36\" rx=\"8\" fill=\"#f3eee4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"rabbitmq.sh\" data-ar=\"سكربت الوسيط\" x=\"86.0\" y=\"42.0\" text-anchor=\"middle\">rabbitmq.sh\u003c/text>\u003crect x=\"180\" y=\"20\" width=\"120\" height=\"36\" rx=\"8\" fill=\"#fbf1e4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"redis.sh\" data-ar=\"سكربت ريديس\" x=\"240.0\" y=\"42.0\" text-anchor=\"middle\">redis.sh\u003c/text>\u003crect x=\"330\" y=\"20\" width=\"170\" height=\"36\" rx=\"8\" fill=\"#fffdf8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"inventory-consumer.sh\" data-ar=\"مستهلِك المخزون\" x=\"415.0\" y=\"42.0\" text-anchor=\"middle\">inventory-consumer.sh\u003c/text>\u003crect x=\"520\" y=\"20\" width=\"170\" height=\"36\" rx=\"8\" fill=\"#fffdf8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"reporting-consumer.sh\" data-ar=\"مستهلِك التقارير\" x=\"605.0\" y=\"42.0\" text-anchor=\"middle\">reporting-consumer.sh\u003c/text>\u003crect x=\"180\" y=\"90\" width=\"140\" height=\"36\" rx=\"8\" fill=\"#e7f3ec\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"order API stays\" data-ar=\"واجهة الطلبات تبقى\" x=\"250.0\" y=\"112.0\" text-anchor=\"middle\">order API stays\u003c/text>\u003c/svg>"}, {"type": "callout", "tone": "risk", "label": {"en": "Safe use", "ar": "استخدام آمن"}, "en": "These scripts change a running Compose project. Do not run them against a shared environment. They do not implement the README sentence that lists breaking PostgreSQL, Django, Odoo, and FastAPI pods. Those failures are not scripts in this directory. Recovery is the matching start command. There is no automatic chaos cleanup beyond starting the one service you stopped.", "ar": "هذه السكربتات تغيّر مشروع Compose يعمل. لا تشغّلها على بيئة مشتركة. لا تنفّذ جملة README التي تذكر كسر PostgreSQL وDjango وأودو وحجيرات FastAPI. تلك الأعطال ليست سكربتات في هذا المجلد. الاستعادة هي أمر start المطابق. لا يوجد تنظيف فوضى آلي غير تشغيل الخدمة الوحيدة التي أوقفتها."}, {"type": "code", "text": "bash deploy/failure-lab/redis.sh stop\nbash deploy/failure-lab/redis.sh start\npython -m unittest deploy/failure-lab/test_lab.py"}]}, {"id": "backup", "title": {"en": "Backup and restore", "ar": "النسخ والاستعادة"}, "blocks": [{"type": "p", "en": "dump.sh and restore.sh source deploy/backup/lib.sh. They refuse any database other than order_db, reporting_db, and odoo_db, mapped to Compose services postgres, reporting-postgres, and odoo-db. notification_db is not in that list. Redis is not dumped. RabbitMQ is not dumped. Application config, JWT keys, and Docker volumes are not archived. The file name is not the database name. The archive header from pg_restore --list must say the same dbname as the target.", "ar": "⁦dump.sh⁩ و⁦restore.sh⁩ يستوردان ⁦deploy/backup/lib.sh⁩. يرفضان أي قاعدة غير ⁦order_db⁩ و⁦reporting_db⁩ و⁦odoo_db⁩، المربوطة بخدمات Compose المسماة ⁦postgres⁩ و⁦reporting-postgres⁩ و⁦odoo-db⁩. ⁦notification_db⁩ ليست في القائمة. Redis لا يُنسخ. RabbitMQ لا يُنسخ. إعداد التطبيق ومفاتيح JWT وأحجام Docker لا تُؤرشف. اسم الملف ليس اسم القاعدة. ترويسة الأرشيف من ⁦pg_restore --list⁩ يجب أن تذكر نفس ⁦dbname⁩ كالهدف."}, {"type": "p", "en": "A dump is pg_dump custom format, --no-owner --no-acl, from inside the Postgres container over the local socket. The partial file is removed if the dump or the header check fails. The kept name is dumps/{db}-{UTC timestamp}.dump. That directory is gitignored. Restore requires --yes, prints the database it is about to replace, and runs pg_restore --clean --if-exists --single-transaction --exit-on-error. It does not drop the other databases and does not create a database (--create is forbidden by the test). A failed restore exits non-zero. The script does not claim the other databases were rolled back, because they were not the target.", "ar": "النسخة هي ⁦pg_dump⁩ بصيغة custom مع ⁦--no-owner --no-acl⁩ من داخل حاوية Postgres عبر المقبس المحلي. الملف الجزئي يُحذف إذا فشل النسخ أو فحص الترويسة. الاسم المحفوظ هو ⁦dumps/{db}-{UTC timestamp}.dump⁩. ذلك المجلد في gitignore. الاستعادة تتطلب ⁦--yes⁩ وتطبع القاعدة التي ستُستبدل وتشغّل ⁦pg_restore --clean --if-exists --single-transaction --exit-on-error⁩. لا تسقط القواعد الأخرى ولا تنشئ قاعدة (⁦--create⁩ ممنوع في الاختبار). الاستعادة الفاشلة تخرج بغير صفر. السكربت لا يدّعي أن القواعد الأخرى تراجعت، لأنها لم تكن الهدف."}, {"type": "callout", "tone": "risk", "label": {"en": "What is not proven", "ar": "ما لم يُثبت"}, "en": "test_backup.py does not dump or restore a database. It parses the scripts, refuses unknown names before Docker, checks the header helper, and skips the daemon-down path when Docker is up. pg_dump of one database is consistent for that database's snapshot. It is not a single snapshot across order_db, reporting_db, and odoo_db, and it does not quiesce RabbitMQ. A restored order_db can disagree with queues and with reporting until consumers catch up or are reconciled by hand. Nothing here restores notification_db.", "ar": "⁦test_backup.py⁩ لا ينسخ ولا يستعيد قاعدة. يحلّل السكربتات ويرفض الأسماء المجهولة قبل Docker ويفحص مساعد الترويسة ويتجاوز مسار توقف المحرك عندما يكون Docker يعمل. ⁦pg_dump⁩ لقاعدة واحدة متسق للقطة تلك القاعدة. ليس لقطة واحدة عبر ⁦order_db⁩ و⁦reporting_db⁩ و⁦odoo_db⁩، ولا يهدّئ RabbitMQ. قاعدة طلبات مستعادة يمكن أن تخالف الطوابير والتقارير حتى يلحق المستهلِكون أو تُسوّى يدوياً. لا شيء هنا يستعيد ⁦notification_db⁩."}, {"type": "diagram", "id": "backup", "en": "What one dump contains", "ar": "ماذا تحتوي نسخة واحدة", "note": {"en": "Run one database at a time. Restore is destructive for objects inside that database.", "ar": "شغّل قاعدة واحدة في كل مرة. الاستعادة مدمّرة للكائنات داخل تلك القاعدة."}, "svg": "\u003csvg class=\"arch\" viewBox=\"0 0 588 164\" role=\"img\">\u003cdefs>\u003cmarker id=\"arrow-backup\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#0e4c5c\"/>\u003c/marker>\u003c/defs>\u003cline x1=\"156\" y1=\"48.0\" x2=\"200\" y2=\"48.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-backup)\"/>\u003ctext data-en=\"pg_dump\" data-ar=\"pg_dump\" x=\"178.0\" y=\"44.0\" text-anchor=\"middle\">pg_dump\u003c/text>\u003cline x1=\"340\" y1=\"48.0\" x2=\"400\" y2=\"32.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-backup)\"/>\u003ctext data-en=\"excluded\" data-ar=\"مستبعد\" x=\"370.0\" y=\"36.0\" text-anchor=\"middle\">excluded\u003c/text>\u003crect x=\"16\" y=\"30\" width=\"140\" height=\"36\" rx=\"8\" fill=\"#fbf1e4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"One Postgres\" data-ar=\"بوستجريس واحدة\" x=\"86.0\" y=\"52.0\" text-anchor=\"middle\">One Postgres\u003c/text>\u003crect x=\"200\" y=\"30\" width=\"140\" height=\"36\" rx=\"8\" fill=\"#f3eee4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"custom dump\" data-ar=\"نسخة custom\" x=\"270.0\" y=\"52.0\" text-anchor=\"middle\">custom dump\u003c/text>\u003crect x=\"400\" y=\"16\" width=\"140\" height=\"32\" rx=\"8\" fill=\"#eef0f8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"not Redis\" data-ar=\"ليس ريديس\" x=\"470.0\" y=\"36.0\" text-anchor=\"middle\">not Redis\u003c/text>\u003crect x=\"400\" y=\"56\" width=\"140\" height=\"32\" rx=\"8\" fill=\"#eef0f8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"not RabbitMQ\" data-ar=\"ليس رابت\" x=\"470.0\" y=\"76.0\" text-anchor=\"middle\">not RabbitMQ\u003c/text>\u003crect x=\"400\" y=\"96\" width=\"160\" height=\"32\" rx=\"8\" fill=\"#f8e8e6\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"not notification_db\" data-ar=\"ليست notification_db\" x=\"480.0\" y=\"116.0\" text-anchor=\"middle\">not notification_db\u003c/text>\u003c/svg>"}, {"type": "code", "text": "bash deploy/backup/dump.sh order_db\n# destructive for that database only; requires a real dump file:\nbash deploy/backup/restore.sh order_db deploy/backup/dumps/\u003cfile>.dump --yes\npython -m unittest deploy/backup/test_backup.py"}, {"type": "p", "en": "Preconditions: Docker is up, the Compose Postgres service is running, and POSTGRES_DB inside that container matches the name you passed. The scripts read the password already in the container. They do not print it. Do not run restore unless you intend to replace objects in that one database.", "ar": "الشروط: Docker يعمل، وخدمة Postgres في Compose تعمل، وPOSTGRES_DB داخل تلك الحاوية يطابق الاسم الذي مررته. السكربتات تقرأ كلمة السر الموجودة أصلاً في الحاوية. لا تطبعها. لا تشغّل الاستعادة إلا إذا كنت تقصد استبدال الكائنات في تلك القاعدة الواحدة."}]}, {"id": "load", "title": {"en": "Load tests", "ar": "اختبارات الحمل"}, "blocks": [{"type": "p", "en": "deploy/load/scenario.py plans a customer browse and order-create flow. It does not open a socket. locustfile.py is what sends requests. Modes are gentle (2 users, 15 second wait) and flood (1 user, 0.2 second wait, 15 order attempts). Limits in the file are the ones already enforced: login and register 5 per minute, order create 10 per minute, Traefik 30 per second. The order body sends product_id and quantity only. Register does not send a role. Passwords are not stored in the file.", "ar": "⁦deploy/load/scenario.py⁩ يخطط تدفق تصفح عميل وإنشاء طلب. لا يفتح مقبساً. ⁦locustfile.py⁩ هو الذي يرسل الطلبات. الوضعان ⁦gentle⁩ (مستخدمان وانتظار 15 ثانية) و⁦flood⁩ (مستخدم واحد وانتظار 0.2 ثانية و15 محاولة طلب). الحدود في الملف هي المطبَّقة أصلاً: الدخول والتسجيل 5 في الدقيقة، وإنشاء الطلب 10 في الدقيقة، وTraefik ‏30 في الثانية. جسم الطلب يرسل ⁦product_id⁩ والكمية فقط. التسجيل لا يرسل دوراً. كلمات السر لا تُخزَّن في الملف."}, {"type": "p", "en": "RESULTS.md says this environment did not run the load test. Docker was down, Locust was not pointed at the API, and no latency was measured. There are no throughput, latency, or error-rate numbers to report. test_scenario.py checks the plan, the empty password defaults, the gentle pace against the order limit, the flood crossing that limit while staying under the Traefik sketch, and that the checked-in note says the run did not happen. It does not establish production capacity.", "ar": "⁦RESULTS.md⁩ يقول إن هذه البيئة لم تشغّل اختبار الحمل. كان Docker متوقفاً، ولم يُوجَّه Locust إلى الواجهة، ولم يُقس الكمون. لا توجد أرقام إنتاجية أو كمون أو معدل أخطاء تُذكر. ⁦test_scenario.py⁩ يفحص الخطة والقيم الافتراضية الفارغة لكلمة السر ووتيرة الوضع الهادئ مقابل حد الطلب، وأن الفيضان يتجاوز ذلك الحد مع بقائه تحت رسم Traefik، وأن الملاحظة المودعة تقول إن التشغيل لم يحدث. لا يثبت سعة إنتاج."}, {"type": "callout", "tone": "note", "label": {"en": "If you run it later", "ar": "إذا شغّلته لاحقاً"}, "en": "Point it at the local gateway only, with a catalog that already has a product, or set LOAD_PRODUCT_ID. The scenario does not create products. Replacing RESULTS.md is a later run's job. A hung laptop failing the 2000 ms gentle ceiling is a local bar in the source, not a capacity target.", "ar": "وجّهه إلى البوابة المحلية فقط، مع كتالوج فيه منتج، أو اضبط ⁦LOAD_PRODUCT_ID⁩. السيناريو لا ينشئ منتجات. استبدال ⁦RESULTS.md⁩ عمل تشغيل لاحق. فشل حاسوب معلق عند سقف 2000 ملي ثانية في الوضع الهادئ عتبة محلية في المصدر، وليست هدف سعة."}]}, {"id": "study", "title": {"en": "How to study this project", "ar": "إزاي تذاكر المشروع ده"}, "blocks": [{"type": "p", "en": "Read the running boundaries before the essays in docs/. When a design note and the code disagree, follow the code and the tests that lock it in.", "ar": "اقرأ حدود التشغيل قبل المقالات في docs/. إذا خالف مستند تصميمي الكود، اتبع الكود والاختبارات التي تثبّته."}, {"type": "h3", "en": "Stage 1 — Big picture", "ar": "المرحلة 1 — الصورة الكبيرة"}, {"type": "p", "en": "Read README.md through the architecture snapshot, then this overview, then docs/current-architecture.md. The directories are services/ (business code), mobile/ (HTTP client), deploy/ (runtime packaging), and docs/ (decisions). Recommended order after that: docs/services.md, docs/database.md, docs/events.md.", "ar": "اقرأ ⁦README.md⁩ حتى لقطة المعمارية، ثم هذه النظرة، ثم ⁦docs/current-architecture.md⁩. المجلدات هي ⁦services/⁩ لكود الأعمال و⁦mobile/⁩ لعميل HTTP و⁦deploy/⁩ لتغليف التشغيل و⁦docs/⁩ للقرارات. الترتيب المقترح بعد ذلك: ⁦docs/services.md⁩ ثم ⁦docs/database.md⁩ ثم ⁦docs/events.md⁩."}, {"type": "h3", "en": "Stage 2 — Infrastructure", "ar": "المرحلة 2 — البنية"}, {"type": "p", "en": "Read deploy/gateway/traefik.yaml and deploy/compose/dynamic.yaml together, then docker-compose.yml service names, then deploy/kind/kustomization.yaml and apply.sh. Notice which files are mounted rather than applied. Compare host ports. Do not treat depends_on as application readiness.", "ar": "اقرأ ⁦deploy/gateway/traefik.yaml⁩ و⁦deploy/compose/dynamic.yaml⁩ معاً، ثم أسماء الخدمات في ⁦docker-compose.yml⁩، ثم ⁦deploy/kind/kustomization.yaml⁩ و⁦apply.sh⁩. لاحظ أي الملفات تُركَّب بدل أن تُطبَّق. قارن منافذ المضيف. لا تعامل ⁦depends_on⁩ كجاهزية للتطبيق."}, {"type": "h3", "en": "Stage 3 — One business flow", "ar": "المرحلة 3 — تدفق عمل واحد"}, {"type": "p", "en": "Follow create and confirm. Start at services/frontend/src/pages/OrderPages.tsx and the API client, cross the gateway router order-api, then presentation/routes/orders.py, application/use_cases/orders.py, the unit of work, and infrastructure/database/models.py for the outbox table. Stop when the HTTP function returns. The publisher is the next process, not the next line.", "ar": "اتبع الإنشاء والتأكيد. ابدأ من ⁦services/frontend/src/pages/OrderPages.tsx⁩ وعميل الواجهة، واعبر موجه ⁦order-api⁩، ثم ⁦presentation/routes/orders.py⁩، و⁦application/use_cases/orders.py⁩، ووحدة العمل، و⁦infrastructure/database/models.py⁩ لجدول الصندوق. توقف عندما تعود دالة HTTP. الناشر عملية تالية، وليس السطر التالي."}, {"type": "h3", "en": "Stage 4 — Asynchronous work", "ar": "المرحلة 4 — العمل غير المتزامن"}, {"type": "p", "en": "Read topology.py, outbox_publisher.py, projections/consumer.py, notification_service/topology.py, and commerce_erp/commands.py plus publisher.py. Draw the queues from the table in the messaging section. Then read saga/orchestrator.py and notice the worker is outside Compose.", "ar": "اقرأ ⁦topology.py⁩ و⁦outbox_publisher.py⁩ و⁦projections/consumer.py⁩ و⁦notification_service/topology.py⁩ و⁦commerce_erp/commands.py⁩ مع ⁦publisher.py⁩. ارسم الطوابير من جدول قسم الرسائل. ثم اقرأ ⁦saga/orchestrator.py⁩ ولاحظ أن العامل خارج Compose."}, {"type": "h3", "en": "Stage 5 — Observability", "ar": "المرحلة 5 — المراقبة"}, {"type": "p", "en": "Open the dashboard JSON only after dashboards.yml and the Compose volume mounts. Pick one alert in prometheus/alerts.yml and find the metric name in the order service metrics module or the RabbitMQ scrape. Practice the four questions in the observability section on paper before you need them live.", "ar": "افتح JSON اللوحة فقط بعد ⁦dashboards.yml⁩ وربط الأحجام في Compose. اختر تنبيهاً واحداً في ⁦prometheus/alerts.yml⁩ وابحث عن اسم المقياس في وحدة مقاييس خدمة الطلبات أو سحب RabbitMQ. تدرّب على الأسئلة الأربعة في قسم المراقبة على الورق قبل أن تحتاجها حية."}, {"type": "h3", "en": "Stage 6 — Failure exercises", "ar": "المرحلة 6 — تمارين الأعطال"}, {"type": "p", "en": "With the Compose stack already up, run one failure-lab script, observe the SQL or queue command printed in that script, then run the matching start. Run unittest on test_lab.py without Docker if you only want the static checks. Do not invent a fifth scenario from a filename that is not in the directory.", "ar": "والمكدس يعمل، شغّل سكربت مختبر واحداً، ولاحظ أمر SQL أو الطابور المطبوع في ذلك السكربت، ثم شغّل start المطابق. شغّل unittest على test_lab.py بدون Docker إذا أردت الفحوص الثابتة فقط. لا تخترع سيناريو خامساً من اسم ملف غير موجود في المجلد."}, {"type": "h3", "en": "Stage 7 — Deploy and recovery practice", "ar": "المرحلة 7 — تمرين النشر والاستعادة"}, {"type": "p", "en": "Bring the local stack up with deploy/compose/up.sh. Validate manifests with python -m unittest deploy/kind/test_manifests.py and deploy/compose/test_stack.py. Read apply.sh before you create a cluster. For backup, run dump.sh against one database only after you accept that notification_db, Redis, and RabbitMQ are outside the archive. Do not run restore.sh except on a database you are willing to replace. This documentation did not execute those commands.", "ar": "ارفع المكدس المحلي بـ ⁦deploy/compose/up.sh⁩. تحقق من البيانات بـ ⁦python -m unittest deploy/kind/test_manifests.py⁩ و⁦deploy/compose/test_stack.py⁩. اقرأ ⁦apply.sh⁩ قبل إنشاء عنقود. للنسخ، شغّل ⁦dump.sh⁩ على قاعدة واحدة فقط بعد أن تقبل أن ⁦notification_db⁩ وRedis وRabbitMQ خارج الأرشيف. لا تشغّل ⁦restore.sh⁩ إلا على قاعدة تقبل استبدالها. هذا التوثيق لم ينفّذ تلك الأوامر."}, {"type": "h3", "en": "Stage 8 — Check yourself", "ar": "المرحلة 8 — اختبر فهمك"}, {"type": "p", "en": "Answer the questions in the next section from the files named there. If you need a sentence that is not in the code, mark it as unknown instead of borrowing it from an older diagram.", "ar": "أجب عن أسئلة القسم التالي من الملفات المسماة هناك. إذا احتجت جملة ليست في الكود، علّمها مجهولة بدل أن تستعيرها من رسم أقدم."}]}, {"id": "questions", "title": {"en": "Check your understanding", "ar": "اختبر فهمك"}, "blocks": [{"type": "h3", "en": "Architecture", "ar": "المعمارية"}, {"type": "p", "en": "Question: which process is allowed to write orders? Answer: the order service, into order_db. Reporting, notifications, and Odoo have their own databases. Evidence: README boundaries and the Compose database environment variables.", "ar": "سؤال: أي عملية يُسمح لها بكتابة الطلبات؟ الجواب: خدمة الطلبات، في order_db. التقارير والإشعارات وأودو لها قواعدها. الدليل: حدود README ومتغيرات بيئة قواعد البيانات في Compose."}, {"type": "h3", "en": "Routing", "ar": "التوجيه"}, {"type": "p", "en": "Question: why does a report not hit FastAPI? Answer: the reports router has priority 300, and the order router also excludes that prefix. Evidence: deploy/compose/dynamic.yaml.", "ar": "سؤال: لماذا لا يصل تقرير إلى FastAPI؟ الجواب: موجه التقارير أولويته 300، وموجه الطلبات يستبعد تلك البادئة أيضاً. الدليل: ⁦deploy/compose/dynamic.yaml⁩."}, {"type": "h3", "en": "Data ownership", "ar": "ملكية البيانات"}, {"type": "p", "en": "Question: is Redis a source of truth? Answer: no. Catalog reads fall back to order_db. Login and order create fail closed when Redis is down. Evidence: redis.sh and the cache-aside description in the order service Redis package.", "ar": "سؤال: هل Redis مصدر حقيقة؟ الجواب: لا. قراءات الكتالوج ترجع إلى order_db. الدخول وإنشاء الطلب يفشلان مغلقين إذا توقف Redis. الدليل: redis.sh وحزمة Redis في خدمة الطلبات."}, {"type": "h3", "en": "Transactions", "ar": "المعاملات"}, {"type": "p", "en": "Question: does creating an order publish to RabbitMQ inside the request? Answer: no. The outbox row commits with the order. A different process publishes. Evidence: outbox_publisher.py module docstring.", "ar": "سؤال: هل إنشاء الطلب ينشر إلى RabbitMQ داخل الطلب؟ الجواب: لا. صف الصندوق يُثبَّت مع الطلب. عملية أخرى تنشر. الدليل: ترويحة وحدة outbox_publisher.py."}, {"type": "h3", "en": "Retries", "ar": "إعادة المحاولة"}, {"type": "p", "en": "Question: how does a consumer delay a retry? Answer: it publishes to commerce.retry and then acks. It does not nack with requeue. Evidence: topology.py module docstring and RETRY_DELAYS_MS.", "ar": "سؤال: كيف يؤخر المستهلِك إعادة المحاولة؟ الجواب: ينشر إلى ⁦commerce.retry⁩ ثم يقر. لا يعمل nack مع إعادة إدراج. الدليل: ترويحة ⁦topology.py⁩ و⁦RETRY_DELAYS_MS⁩."}, {"type": "h3", "en": "Deployment", "ar": "النشر"}, {"type": "p", "en": "Question: what is the only host port on kind? Answer: 127.0.0.1:8080 mapped to container port 30080. Evidence: kind-config.yaml.", "ar": "سؤال: ما منفذ المضيف الوحيد على kind؟ الجواب: ⁦127.0.0.1:8080⁩ مربوط بمنفذ الحاوية 30080. الدليل: ⁦kind-config.yaml⁩."}, {"type": "h3", "en": "Security", "ar": "الأمان"}, {"type": "p", "en": "Question: does the gateway authorize roles? Answer: no. It checks an RS256 access token. The service checks the role. Evidence: jwt_check.py and test_role_claim_is_not_a_gateway_decision.", "ar": "سؤال: هل البوابة تفوض الأدوار؟ الجواب: لا. تفحص رمز وصول RS256. الخدمة تفحص الدور. الدليل: ⁦jwt_check.py⁩ و⁦test_role_claim_is_not_a_gateway_decision⁩."}, {"type": "h3", "en": "Observability", "ar": "المراقبة"}, {"type": "p", "en": "Question: does a dead collector hide HTTP errors? Answer: no. Prometheus scrapes /metrics directly. The collector pipeline is traces only. Evidence: otel/collector.yaml and prometheus.yml.", "ar": "سؤال: هل مجمّع ميت يخفي أخطاء HTTP؟ الجواب: لا. Prometheus يسحب ⁦/metrics⁩ مباشرة. خط المجمّع آثار فقط. الدليل: ⁦otel/collector.yaml⁩ و⁦prometheus.yml⁩."}, {"type": "h3", "en": "Recovery", "ar": "الاستعادة"}, {"type": "p", "en": "Question: does a dump restore the whole platform? Answer: no. One script invocation dumps one of three databases. notification_db, Redis, RabbitMQ, and keys are outside it. The tests do not perform a live restore. Evidence: lib.sh and test_backup.py.", "ar": "سؤال: هل النسخة تستعيد المنصة كلها؟ الجواب: لا. استدعاء واحد ينسخ واحدة من ثلاث قواعد. notification_db وRedis وRabbitMQ والمفاتيح خارجها. الاختبارات لا تنفّذ استعادة حية. الدليل: lib.sh وtest_backup.py."}, {"type": "h3", "en": "Performance", "ar": "الأداء"}, {"type": "p", "en": "Question: what capacity did the load test prove? Answer: none. RESULTS.md records that the run did not happen. Evidence: deploy/load/RESULTS.md.", "ar": "سؤال: أي سعة أثبتها اختبار الحمل؟ الجواب: لا شيء. ⁦RESULTS.md⁩ يسجّل أن التشغيل لم يحدث. الدليل: ⁦deploy/load/RESULTS.md⁩."}]}, {"id": "files", "title": {"en": "File catalog", "ar": "فهرس الملفات"}, "blocks": [{"type": "p", "en": "Every first-party file walked for this page is listed below. Curated notes are used where the behavior was read in detail. Other files use their module docstring or a short classification. Generated caches are excluded and counted in the coverage section. Expand a directory, then a file. The filter matches the path and the note in both languages.", "ar": "كل ملف طرف أول مُشي لهذه الصفحة مذكور أدناه. الملاحظات المحررة تُستخدم حيث قُرئ السلوك بالتفصيل. الملفات الأخرى تستخدم ترويحة الوحدة أو تصنيفاً قصيراً. الذاكرات المولَّدة مستبعدة ومعدودة في قسم التغطية. افتح مجلداً ثم ملفاً. المرشح يطابق المسار والملاحظة في اللغتين."}]}, {"id": "limits", "title": {"en": "Limits and unresolved points", "ar": "الحدود وما لم يُحسم"}, "blocks": [{"type": "ul", "items": [{"en": "This page did not start Docker, kind, Locust, or restore. Static unit tests were not re-run as part of writing the prose, except the validation of this HTML file itself.", "ar": "هذه الصفحة لم تشغّل Docker أو kind أو Locust أو الاستعادة. اختبارات الوحدة الثابتة لم تُعد تشغيلها كجزء من كتابة النص، باستثناء التحقق من ملف HTML نفسه."}, {"en": "notification_db has no backup script. That is an implementation gap, not an implied inclusion.", "ar": "notification_db بلا سكربت نسخ. هذه فجوة تنفيذ وليست تضميناً ضمنياً."}, {"en": "The saga worker, HTTP idempotency keys, and a real payment provider are not in the Compose or kind packaging.", "ar": "عامل الساجا ومفاتيح تماثل HTTP ومزود دفع حقيقي ليست في تغليف Compose أو kind."}, {"en": "Failure lab does not stop Postgres, the order API, reporting HTTP, or Odoo. Those names appear in the README phase list and do not have scripts here.", "ar": "مختبر الأعطال لا يوقف Postgres ولا واجهة الطلبات ولا HTTP التقارير ولا أودو. هذه الأسماء تظهر في قائمة مراحل README وليس لها سكربتات هنا."}, {"en": "Kind manifest comments describe intended probes and replicas. Runtime readiness still depends on images, secrets, and the node, which were not applied during this writing.", "ar": "تعليقات بيانات kind تصف المجسات والنسخ المقصودة. الجاهزية وقت التشغيل ما زالت تعتمد على الصور والأسرار والعقدة، ولم تُطبَّق أثناء هذه الكتابة."}, {"en": "Dashboard JSON is provisioned by dashboards.yml and the volume mounts. A panel proves a query was authored, not that the series is non-empty on a laptop.", "ar": "JSON اللوحات يُجهَّز عبر dashboards.yml وربط الأحجام. اللوحة تثبت أن الاستعلام كُتب، لا أن السلسلة غير فارغة على حاسوب محمول."}, {"en": "deploy/compose/.env and the PEM files exist on disk for local runs. Their values are not copied here. secrets.example.yaml is not a live Secret.", "ar": "ملف deploy/compose/.env وملفات PEM موجودة على القرص للتشغيل المحلي. قيمها غير منسوخة هنا. secrets.example.yaml ليس سراً حياً."}, {"en": "mobile/react-native-app/android and ios are the CLI platform trees. They are classified as generated platform projects and are not expanded file by file. node_modules, virtualenvs, bytecode, and frontend dist are excluded the same way.", "ar": "مجلدا android وios في تطبيق React Native هما شجرتا منصة من أداة الإنشاء. صُنفا كمشاريع منصة مولَّدة ولم يُفرد كل ملف. node_modules والبيئات الافتراضية والبايتكود ومخرج frontend مستبعدة بنفس الطريقة."}]}, {"type": "p", "en": "Open this file in a browser from the repository root. Use the language buttons for English or Arabic. Search matches both languages even when the other language is not on screen. The file catalog is the long section near the end.", "ar": "افتح هذا الملف في متصفح من جذر المستودع. استخدم أزرار اللغة للإنجليزية أو العربية. البحث يطابق اللغتين حتى لو لم تكن اللغة الأخرى على الشاشة. فهرس الملفات هو القسم الطويل قرب النهاية."}]}], "files": [{"id": "a5cc2925ca82", "path": ".gitignore", "kind": {"en": "other", "ar": "ملف"}, "summary": {"en": "Project file. Path .gitignore. No module docstring was extracted.", "ar": "ملف مشروع. المسار ⁦.gitignore⁩. لم تُستخرج ترويحة وحدة."}, "symbols": "", "depends": "", "tests": "", "next": "", "search": ".gitignore Project file. Path .gitignore. No module docstring was extracted. ملف مشروع. المسار ⁦.gitignore⁩. لم تُستخرج ترويحة وحدة.    "}, {"id": "8ec9a00bfd09", "path": "README.md", "kind": {"en": "markdown", "ar": "مستند"}, "summary": {"en": "Phase list and how to run each phase. The architecture snapshot matches the code boundaries. Some older docs disagree on Idempotency-Key; the handlers do not <script>
(function () {
  "use strict";

  const data = JSON.parse(document.getElementById("doc-data").textContent);
  const state = {
    lang: localStorage.getItem("structure-lang") === "ar" ? "ar" : "en",
    theme: localStorage.getItem("structure-theme") === "dark" ? "dark" : "light",
    query: "",
    active: "overview",
    openGroups: new Set(["deploy", "services", "docs"]),
    openFile: "",
    hits: [],
    hitIndex: -1,
  };

  const main = document.getElementById("main");
  const sidebar = document.getElementById("sidebar");
  const search = document.getElementById("search");
  const searchStatus = document.getElementById("search-status");
  const results = document.getElementById("search-results");

  function t(value) {
    if (value == null) return "";
    if (typeof value === "string") return value;
    return value[state.lang] || value.en || "";
  }

  function ui(key) {
    return t(data.ui[key]);
  }

  function sectionById(id) {
    return data.sections.find((section) => section.id === id) || data.sections[0];
  }

  function applyChrome() {
    const root = document.documentElement;
    root.lang = state.lang === "ar" ? "ar" : "en";
    root.dir = state.lang === "ar" ? "rtl" : "ltr";
    root.dataset.theme = state.theme;
    document.title = t(data.meta.title);
    document.getElementById("kicker").textContent = t(data.meta.kicker);
    document.getElementById("title").textContent = t(data.meta.title);
    document.getElementById("summary").textContent = t(data.meta.summary);
    search.placeholder = ui("searchPlaceholder");
    search.setAttribute("aria-label", ui("searchPlaceholder"));
    document.getElementById("lang-en").setAttribute("aria-pressed", String(state.lang === "en"));
    document.getElementById("lang-ar").setAttribute("aria-pressed", String(state.lang === "ar"));
    const themeButton = document.getElementById("theme");
    themeButton.setAttribute("aria-pressed", String(state.theme === "dark"));
    themeButton.textContent = state.theme === "dark" ? ui("themeLight") : ui("themeDark");
    document.getElementById("menu").setAttribute("aria-label", ui("menu"));
    document.getElementById("skip").textContent = ui("skip");
    document.getElementById("search-prev").textContent = ui("prev");
    document.getElementById("search-next").textContent = ui("nextHit");
    document.getElementById("search-prev").setAttribute("aria-label", ui("prev"));
    document.getElementById("search-next").setAttribute("aria-label", ui("nextHit"));
    const header = document.querySelector(".top");
    if (header) document.documentElement.style.setProperty("--header", header.offsetHeight + "px");
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null && text !== "") node.textContent = text;
    return node;
  }

  function ltrCode(text) {
    const code = el("code", "ltr", text);
    code.dir = "ltr";
    code.translate = false;
    return code;
  }

  function fillCell(td, cell) {
    if (cell && typeof cell === "object" && cell.ltr) {
      td.append(ltrCode(cell.ltr));
      const note = t(cell);
      if (note) td.append(el("div", "cellnote", note));
      return;
    }
    td.textContent = t(cell);
  }

  function renderBlock(block, parent) {
    if (block.type === "h3") {
      parent.append(el("h3", null, t(block)));
      return;
    }
    if (block.type === "p") {
      const p = el("p");
      appendRich(p, block);
      parent.append(p);
      return;
    }
    if (block.type === "callout") {
      const box = el("aside", "callout " + (block.tone || "note"));
      box.append(el("p", "callout-label", t(block.label)));
      const p = el("p");
      appendRich(p, block);
      box.append(p);
      parent.append(box);
      return;
    }
    if (block.type === "ul" || block.type === "ol") {
      const list = document.createElement(block.type);
      for (const item of block.items) {
        const li = document.createElement("li");
        appendRich(li, item);
        list.append(li);
      }
      parent.append(list);
      return;
    }
    if (block.type === "code") {
      parent.append(codeBlock(block.text));
      return;
    }
    if (block.type === "table") {
      const wrap = el("div", "tablewrap");
      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const headRow = document.createElement("tr");
      for (const header of block.headers) headRow.append(el("th", null, t(header)));
      thead.append(headRow);
      const body = document.createElement("tbody");
      for (const row of block.rows) {
        const tr = document.createElement("tr");
        for (const cell of row) {
          const td = document.createElement("td");
          fillCell(td, cell);
          tr.append(td);
        }
        body.append(tr);
      }
      table.append(thead, body);
      wrap.append(table);
      parent.append(wrap);
      return;
    }
    if (block.type === "diagram") {
      const figure = el("figure", "diagram");
      figure.id = "diagram-" + block.id;
      const caption = el("figcaption", null, t(block));
      const holder = el("div", "svgwrap");
      holder.innerHTML = block.svg;
      holder.querySelectorAll("[data-en]").forEach((node) => {
        const label = state.lang === "ar" ? node.getAttribute("data-ar") : node.getAttribute("data-en");
        node.textContent = label || "";
        node.setAttribute("direction", state.lang === "ar" ? "rtl" : "ltr");
      });
      figure.append(caption, holder);
      if (block.note) figure.append(el("p", "diagram-note", t(block.note)));
      parent.append(figure);
      return;
    }
    if (block.type === "cards") {
      const grid = el("div", "cards");
      for (const card of block.items) {
        const article = el("article", "card");
        article.append(el("h3", null, t(card.title)));
        const p = el("p");
        appendRich(p, card);
        article.append(p);
        if (card.path) article.append(ltrCode(card.path));
        grid.append(article);
      }
      parent.append(grid);
    }
  }

  function appendRich(node, item) {
    const parts = item.parts || null;
    if (!parts) {
      node.textContent = t(item);
      return;
    }
    const sequence = parts[state.lang] || parts.en || [];
    for (const part of sequence) {
      if (typeof part === "string") node.append(document.createTextNode(part));
      else if (part.ltr) node.append(ltrCode(part.ltr));
    }
  }

  function codeBlock(text) {
    const wrap = el("div", "codewrap");
    const pre = el("pre");
    pre.dir = "ltr";
    const code = el("code", "ltr", text);
    code.dir = "ltr";
    pre.append(code);
    const button = el("button", "copy", ui("copy"));
    button.type = "button";
    button.dataset.copy = text;
    button.setAttribute("aria-label", ui("copy"));
    wrap.append(pre, button);
    return wrap;
  }

  function renderFiles(parent) {
    const tools = el("div", "filetools");
    const filter = document.createElement("input");
    filter.type = "search";
    filter.id = "file-filter";
    filter.placeholder = ui("filterFiles");
    filter.setAttribute("aria-label", ui("filterFiles"));
    filter.dir = "ltr";
    tools.append(filter);
    parent.append(tools);
    const tree = el("div", "tree");
    tree.id = "file-tree";
    parent.append(tree);
    const groups = new Map();
    for (const file of data.files) {
      const top = file.path.split("/")[0];
      if (!groups.has(top)) groups.set(top, []);
      groups.get(top).push(file);
    }
    for (const [top, files] of groups) {
      const details = document.createElement("details");
      details.className = "group";
      details.dataset.group = top;
      details.open = state.openGroups.has(top);
      const summary = document.createElement("summary");
      summary.textContent = top + " (" + files.length + ")";
      summary.dir = "ltr";
      details.append(summary);
      details.addEventListener("toggle", () => {
        if (details.open) state.openGroups.add(top);
        else state.openGroups.delete(top);
      });
      for (const file of files) details.append(fileCard(file));
      tree.append(details);
    }
    filter.addEventListener("input", () => applyFileFilter(filter.value));
  }

  function fileCard(file) {
    const details = document.createElement("details");
    details.className = "file";
    details.id = "file-" + file.id;
    details.dataset.path = file.path.toLowerCase();
    details.dataset.blob = (file.search || "").toLowerCase();
    details.open = state.openFile === file.path;
    const summary = document.createElement("summary");
    summary.append(ltrCode(file.path));
    summary.append(el("span", "kind", t(file.kind)));
    details.append(summary);
    const body = el("div", "filebody");
    body.append(el("p", null, t(file.summary)));
    const dl = document.createElement("dl");
    const rows = [
      ["symbols", file.symbols],
      ["depends", file.depends],
      ["tests", file.tests],
      ["risk", file.risk],
      ["next", file.next],
    ];
    for (const [key, value] of rows) {
      if (!value) continue;
      dl.append(el("dt", null, ui(key)));
      const dd = document.createElement("dd");
      if (key === "next" || key === "symbols" || key === "depends" || key === "tests") {
        dd.append(ltrCode(typeof value === "string" ? value : t(value)));
        if (typeof value === "object") {
          const note = t(value);
          if (note && note !== value.ltr) dd.append(el("div", "cellnote", note));
        }
      } else dd.textContent = t(value);
      dl.append(dd);
    }
    body.append(dl);
    details.append(body);
    details.addEventListener("toggle", () => {
      if (details.open) state.openFile = file.path;
    });
    return details;
  }

  function applyFileFilter(raw) {
    const query = raw.trim().toLowerCase();
    document.querySelectorAll("#file-tree details.file").forEach((node) => {
      const match = !query || node.dataset.path.includes(query) || node.dataset.blob.includes(query);
      node.hidden = !match;
    });
    document.querySelectorAll("#file-tree details.group").forEach((group) => {
      const visible = [...group.querySelectorAll("details.file")].some((node) => !node.hidden);
      group.hidden = !visible;
      if (query && visible) group.open = true;
    });
  }

  function renderNav() {
    sidebar.replaceChildren();
    const home = el("button", "navlink home", ui("home"));
    home.type = "button";
    home.addEventListener("click", () => go("overview"));
    sidebar.append(home);
    for (const group of data.nav) {
      sidebar.append(el("h2", null, t(group.title)));
      for (const id of group.ids) {
        const section = sectionById(id);
        const button = el("button", "navlink", t(section.title));
        button.type = "button";
        button.dataset.target = id;
        if (id === state.active) button.setAttribute("aria-current", "true");
        button.addEventListener("click", () => go(id));
        sidebar.append(button);
      }
    }
    sidebar.append(el("h2", null, ui("diagrams")));
    for (const section of data.sections) {
      for (const block of section.blocks) {
        if (block.type !== "diagram") continue;
        const button = el("button", "navlink nested", t(block));
        button.type = "button";
        button.addEventListener("click", () => {
          go(section.id);
          const figure = document.getElementById("diagram-" + block.id);
          if (figure) figure.scrollIntoView({ behavior: "smooth", block: "start" });
        });
        sidebar.append(button);
      }
    }
  }

  function renderMain() {
    const current = state.active;
    main.replaceChildren();
    const crumbs = el("nav", "crumbs");
    crumbs.setAttribute("aria-label", ui("breadcrumbs"));
    const crumbHome = el("button", "linkish", ui("home"));
    crumbHome.type = "button";
    crumbHome.addEventListener("click", () => go("overview"));
    crumbs.append(crumbHome);
    crumbs.append(el("span", "sep", " / "));
    crumbs.append(el("span", null, t(sectionById(current).title)));
    main.append(crumbs);
    const jump = el("div", "search-jump");
    jump.id = "search-jump";
    jump.hidden = true;
    main.append(jump);
    for (const section of data.sections) {
      const article = el("article", "section");
      article.id = section.id;
      article.tabIndex = -1;
      article.append(el("h2", null, t(section.title)));
      for (const block of section.blocks) renderBlock(block, article);
      if (section.id === "files") renderFiles(article);
      main.append(article);
    }
    observe();
    const target = document.getElementById(current);
    if (target) target.scrollIntoView({ block: "start" });
  }

  let observer = null;
  function observe() {
    if (observer) observer.disconnect();
    observer = new IntersectionObserver(
      (entries) => {
        const visible = entries
          .filter((entry) => entry.isIntersecting)
          .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
        if (!visible) return;
        state.active = visible.target.id;
        document.querySelectorAll(".navlink[data-target]").forEach((button) => {
          if (button.dataset.target === state.active) button.setAttribute("aria-current", "true");
          else button.removeAttribute("aria-current");
        });
        const crumb = document.querySelector(".crumbs span:last-child");
        if (crumb) crumb.textContent = t(sectionById(state.active).title);
      },
      { rootMargin: "-20% 0px -60% 0px", threshold: [0.15, 0.4] }
    );
    document.querySelectorAll("article.section").forEach((article) => observer.observe(article));
  }

  function go(id) {
    state.active = id;
    document.body.classList.remove("nav-open");
    const node = document.getElementById(id);
    if (node) {
      node.scrollIntoView({ behavior: "smooth", block: "start" });
      node.focus({ preventScroll: true });
    }
    document.querySelectorAll(".navlink[data-target]").forEach((button) => {
      if (button.dataset.target === id) button.setAttribute("aria-current", "true");
      else button.removeAttribute("aria-current");
    });
  }

  function blob(value) {
    if (value == null) return "";
    if (typeof value === "string") return value;
    return [value.en, value.ar].filter(Boolean).join("\n");
  }

  function buildIndex() {
    const items = [];
    for (const section of data.sections) {
      const chunks = [blob(section.title)];
      for (const block of section.blocks) {
        chunks.push(blob(block), blob(block.note), blob(block.label));
        for (const item of block.items || []) chunks.push(blob(item), blob(item.title));
        for (const row of block.rows || []) for (const cell of row) chunks.push(blob(cell), cell && cell.ltr);
        if (block.text) chunks.push(block.text);
      }
      items.push({
        id: section.id,
        kind: "section",
        title: section.title,
        text: chunks.filter(Boolean).join("\n"),
      });
    }
    for (const file of data.files) {
      items.push({
        id: "file-" + file.id,
        kind: "file",
        title: { en: file.path, ar: file.path },
        path: file.path,
        text: [file.path, blob(file.summary), blob(file.kind), file.symbols || "", file.search || ""].join("\n"),
      });
    }
    return items;
  }

  const index = buildIndex();

  function runSearch() {
    const query = state.query.trim().toLowerCase();
    results.replaceChildren();
    if (!query) {
      state.hits = [];
      state.hitIndex = -1;
      searchStatus.textContent = "";
      results.hidden = true;
      return;
    }
    const tokens = query.split(/\s+/).filter(Boolean);
    state.hits = index.filter((item) => {
      const hay = item.text.toLowerCase();
      return tokens.every((token) => hay.includes(token));
    }).slice(0, 40);
    state.hitIndex = state.hits.length ? 0 : -1;
    results.hidden = state.hits.length === 0;
    searchStatus.textContent = state.hits.length
      ? state.hits.length + " " + ui("results")
      : ui("noResults");
    state.hits.forEach((hit, position) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "hit";
      if (position === state.hitIndex) button.classList.add("current");
      const kind = el("span", "hitkind", hit.kind === "file" ? ui("file") : ui("section"));
      const title = el("span", "hit-title ltr", t(hit.title));
      title.dir = "ltr";
      button.append(kind, title);
      button.addEventListener("click", () => openHit(position));
      results.append(button);
    });
  }

  function openHit(position) {
    const hit = state.hits[position];
    if (!hit) return;
    state.hitIndex = position;
    document.querySelectorAll(".hit").forEach((node, index) => {
      node.classList.toggle("current", index === position);
    });
    if (hit.kind === "section") {
      go(hit.id);
      return;
    }
    go("files");
    const card = document.getElementById(hit.id);
    if (!card) return;
    const group = card.closest("details.group");
    if (group) {
      group.open = true;
      state.openGroups.add(group.dataset.group);
    }
    card.open = true;
    state.openFile = hit.path;
    card.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function render() {
    applyChrome();
    renderNav();
    renderMain();
    runSearch();
  }

  document.getElementById("lang-en").addEventListener("click", () => {
    state.lang = "en";
    localStorage.setItem("structure-lang", "en");
    const filterValue = document.getElementById("file-filter") ? document.getElementById("file-filter").value : "";
    render();
    const filter = document.getElementById("file-filter");
    if (filter && filterValue) {
      filter.value = filterValue;
      applyFileFilter(filterValue);
    }
  });
  document.getElementById("lang-ar").addEventListener("click", () => {
    state.lang = "ar";
    localStorage.setItem("structure-lang", "ar");
    const filterValue = document.getElementById("file-filter") ? document.getElementById("file-filter").value : "";
    render();
    const filter = document.getElementById("file-filter");
    if (filter && filterValue) {
      filter.value = filterValue;
      applyFileFilter(filterValue);
    }
  });
  document.getElementById("theme").addEventListener("click", () => {
    state.theme = state.theme === "dark" ? "light" : "dark";
    localStorage.setItem("structure-theme", state.theme);
    applyChrome();
  });
  document.getElementById("menu").addEventListener("click", () => {
    document.body.classList.toggle("nav-open");
  });
  document.getElementById("backdrop").addEventListener("click", () => {
    document.body.classList.remove("nav-open");
  });
  search.addEventListener("input", () => {
    state.query = search.value;
    runSearch();
  });
  document.getElementById("search-next").addEventListener("click", () => {
    if (!state.hits.length) return;
    openHit((state.hitIndex + 1) % state.hits.length);
  });
  document.getElementById("search-prev").addEventListener("click", () => {
    if (!state.hits.length) return;
    openHit((state.hitIndex - 1 + state.hits.length) % state.hits.length);
  });
  search.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      if (state.hits.length) openHit(state.hitIndex < 0 ? 0 : state.hitIndex);
    } else if (event.key === "ArrowDown") {
      event.preventDefault();
      if (state.hits.length) openHit(Math.min(state.hitIndex + 1, state.hits.length - 1));
    } else if (event.key === "Escape") {
      search.value = "";
      state.query = "";
      runSearch();
    }
  });
  document.body.addEventListener("click", async (event) => {
    const button = event.target.closest("button.copy");
    if (!button) return;
    const text = button.dataset.copy || "";
    let copied = false;
    try {
      await navigator.clipboard.writeText(text);
      copied = true;
    } catch (error) {
      const area = document.createElement("textarea");
      area.value = text;
      area.dir = "ltr";
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.insetInlineStart = "0";
      area.style.top = "0";
      area.style.opacity = "0";
      document.body.append(area);
      area.select();
      try {
        copied = document.execCommand("copy");
      } catch (ignored) {
        copied = false;
      }
      area.remove();
    }
    button.textContent = copied ? ui("copied") : ui("copyFailed");
    setTimeout(() => {
      button.textContent = ui("copy");
    }, 1600);
  });
  window.addEventListener("resize", () => {
    const header = document.querySelector(".top");
    if (header) document.documentElement.style.setProperty("--header", header.offsetHeight + "px");
  });
  window.addEventListener("beforeprint", () => {
    document.querySelectorAll("details").forEach((node) => {
      node.dataset.wasOpen = node.open ? "1" : "0";
      node.open = true;
    });
  });
  window.addEventListener("afterprint", () => {
    document.querySelectorAll("details").forEach((node) => {
      if (node.dataset.wasOpen === "0") node.open = false;
    });
  });

  render();
})();

</script>
</body>
</html>
