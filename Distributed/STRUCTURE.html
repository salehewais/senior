<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commerce platform technical reference</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f1ea;
  --ink: #1c1915;
  --muted: #5c564c;
  --card: #fffdf8;
  --line: #ddd4c6;
  --accent: #0e4c5c;
  --accent-soft: #e5f2f4;
  --warn-bg: #fbf1e4;
  --warn: #6d3d12;
  --risk-bg: #f8e8e6;
  --risk: #6e2424;
  --ok-bg: #e7f3ec;
  --ok: #1c5b40;
  --code-bg: #f3eee4;
  --shadow: 0 1px 0 rgba(28, 25, 21, 0.05);
  --header: 7.5rem;
  --sidebar: 18.5rem;
  --mono: "DejaVu Sans Mono", ui-monospace, monospace;
  --sans: "Noto Sans Arabic", "Noto Naskh Arabic", "DejaVu Sans", sans-serif;
  --serif: "Noto Naskh Arabic", "Noto Sans Arabic", "DejaVu Sans", serif;
}
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141311;
  --ink: #f3efe6;
  --muted: #b7ad9e;
  --card: #1e1c19;
  --line: #3a342c;
  --accent: #8fd0cb;
  --accent-soft: #1c3336;
  --warn-bg: #3a2a1c;
  --warn: #f0c08a;
  --risk-bg: #3a2220;
  --risk: #f0b4ae;
  --ok-bg: #1a3328;
  --ok: #b7e0cb;
  --code-bg: #2a261f;
  --shadow: none;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.6;
}
html[lang="ar"] body { font-family: var(--serif); font-size: 18px; line-height: 1.75; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.skip {
  position: absolute;
  inset-inline-start: 0.5rem;
  top: -3rem;
  background: var(--card);
  color: var(--ink);
  padding: 0.4rem 0.7rem;
  z-index: 50;
}
.skip:focus { top: 0.4rem; }
.top {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem 1rem;
  align-items: flex-end;
  justify-content: space-between;
  padding: 0.7rem 1rem;
  background: #1c1915;
  color: #f4f0e6;
}
html[data-theme="dark"] .top { background: #0d0c0b; border-bottom: 1px solid var(--line); }
.brand { min-width: min(100%, 18rem); flex: 1 1 16rem; }
.brand p { margin: 0; }
.kicker { color: #c8bfb0; font-size: 0.78rem; letter-spacing: 0.04em; }
#title { margin: 0.1rem 0; font-size: 1.15rem; font-weight: 650; }
#summary { color: #d9d0c3; font-size: 0.86rem; max-width: 46rem; }
.controls { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
button, input { font: inherit; color: inherit; }
.controls button, .menu {
  border: 1px solid #8d8374;
  background: transparent;
  color: #f4f0e6;
  border-radius: 999px;
  padding: 0.28rem 0.7rem;
  cursor: pointer;
}
.controls button[aria-pressed="true"] { background: #f4f0e6; color: #1c1915; border-color: #f4f0e6; }
.menu { display: none; }
.searchbox { position: relative; flex: 1 1 16rem; min-width: min(100%, 16rem); }
#search {
  width: 100%;
  border: 1px solid #8d8374;
  background: #2a261f;
  color: #f4f0e6;
  border-radius: 8px;
  padding: 0.4rem 0.6rem;
}
#search-status { margin: 0.2rem 0 0; font-size: 0.78rem; color: #c8bfb0; }
.search-nav { display: flex; gap: 0.3rem; }
.search-nav button {
  border: 1px solid #8d8374;
  background: transparent;
  color: #f4f0e6;
  border-radius: 999px;
  padding: 0.2rem 0.55rem;
  cursor: pointer;
  font-size: 0.82rem;
}
#search-results {
  position: absolute;
  inset-inline: 0;
  top: calc(100% + 0.25rem);
  background: var(--card);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 8px;
  max-height: 18rem;
  overflow: auto;
  box-shadow: var(--shadow);
  z-index: 40;
}
.hit {
  display: flex;
  gap: 0.5rem;
  width: 100%;
  text-align: start;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--line);
  padding: 0.4rem 0.55rem;
  cursor: pointer;
}
.hit.current, .hit:hover { background: var(--accent-soft); }
.hitkind { color: var(--muted); font-size: 0.75rem; min-width: 4.5rem; }
.shell { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); align-items: start; }
.sidebar {
  position: sticky;
  top: var(--header);
  max-height: calc(100vh - var(--header));
  overflow: auto;
  padding: 0.8rem 0.8rem 2rem;
  border-inline-end: 1px solid var(--line);
}
.sidebar h2 {
  margin: 0.9rem 0 0.25rem;
  font-size: 0.72rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.navlink {
  display: block;
  width: 100%;
  text-align: start;
  background: transparent;
  border: 0;
  color: var(--ink);
  padding: 0.22rem 0.2rem;
  cursor: pointer;
  border-radius: 6px;
}
.navlink.nested { padding-inline-start: 0.8rem; color: var(--muted); font-size: 0.88rem; }
.navlink[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
main { padding: 1rem 1.3rem 4rem; min-width: 0; }
article.section {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 1rem 1.1rem 1.2rem;
  margin: 0 0 0.8rem;
  box-shadow: var(--shadow);
  scroll-margin-top: calc(var(--header) + 0.6rem);
}
h2 { margin: 0 0 0.55rem; font-size: 1.4rem; }
h3 { margin: 1rem 0 0.35rem; font-size: 1.05rem; }
p { margin: 0.4rem 0; }
ul, ol { margin: 0.35rem 0 0.6rem; padding-inline-start: 1.2rem; }
.crumbs { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; margin: 0 0 0.7rem; color: var(--muted); font-size: 0.9rem; }
.linkish { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }
.callout { border: 1px solid var(--line); border-inline-start: 4px solid var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 0.55rem 0.75rem; margin: 0.7rem 0; }
.callout.warn { border-inline-start-color: var(--warn); background: var(--warn-bg); }
.callout.risk { border-inline-start-color: var(--risk); background: var(--risk-bg); }
.callout.ok { border-inline-start-color: var(--ok); background: var(--ok-bg); }
.callout-label { margin: 0; font-weight: 700; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 0.6rem; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 0.7rem 0.8rem; background: var(--bg); }
.card h3 { margin-top: 0; }
.tablewrap { overflow-x: auto; margin: 0.6rem 0; }
table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
th, td { text-align: start; vertical-align: top; border-bottom: 1px solid var(--line); padding: 0.45rem; }
th { color: var(--muted); font-size: 0.75rem; letter-spacing: 0.04em; text-transform: uppercase; }
.cellnote { color: var(--muted); font-size: 0.86rem; margin-top: 0.15rem; }
code, pre, .ltr { font-family: var(--mono); font-size: 0.84em; }
code { background: var(--code-bg); padding: 0.05rem 0.25rem; border-radius: 4px; unicode-bidi: isolate; }
pre {
  margin: 0;
  padding: 0.7rem 0.8rem;
  overflow: auto;
  background: var(--code-bg);
  border-radius: 8px;
  unicode-bidi: isolate;
}
.codewrap { position: relative; margin: 0.6rem 0; }
.copy {
  position: absolute;
  inset-block-start: 0.35rem;
  inset-inline-end: 0.35rem;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.75rem;
  padding: 0.15rem 0.4rem;
}
.diagram { margin: 0.8rem 0; }
.svgwrap { overflow-x: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
svg.arch { width: 100%; height: auto; min-width: 42rem; display: block; }
svg.arch text { font-family: var(--sans); font-size: 12px; fill: var(--ink); }
.diagram-note { color: var(--muted); font-size: 0.92rem; }
.filetools { margin: 0.4rem 0 0.6rem; }
#file-filter { width: min(100%, 28rem); border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 0.4rem 0.55rem; }
.tree details { border-bottom: 1px solid var(--line); }
.tree summary { cursor: pointer; padding: 0.35rem 0; }
.kind { margin-inline-start: 0.5rem; color: var(--muted); font-size: 0.8rem; }
.filebody { padding: 0 0 0.7rem 0.2rem; }
dl { display: grid; grid-template-columns: 8rem minmax(0, 1fr); gap: 0.25rem 0.6rem; margin: 0.4rem 0; }
dt { color: var(--muted); }
dd { margin: 0; }
.backdrop { display: none; }
@media (max-width: 860px) {
  .menu { display: inline-block; }
  .shell { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed;
    z-index: 35;
    inset-block: var(--header) 0;
    inset-inline-start: 0;
    width: min(20rem, 88vw);
    background: var(--card);
    transform: translateX(-110%);
    transition: transform 0.15s linear;
  }
  html[dir="rtl"] .sidebar { transform: translateX(110%); }
  body.nav-open .sidebar { transform: none; }
  body.nav-open .backdrop { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 34; }
  svg.arch { min-width: 36rem; }
}
@media print {
  .top, .sidebar, .backdrop, .copy, .menu, .searchbox, .controls, .filetools { display: none !important; }
  .shell { display: block; }
  article.section { break-inside: avoid; box-shadow: none; }
  body { background: white; color: black; }
  a { color: black; text-decoration: none; }
}

</style>
</head>
<body>
<a class="skip" id="skip" href="#main">Skip to content</a>
<header class="top">
  <button class="menu" id="menu" type="button" aria-label="Menu">Menu</button>
  <div class="brand">
    <p class="kicker" id="kicker"></p>
    <h1 id="title"></h1>
    <p id="summary"></p>
  </div>
  <div class="controls" role="group" aria-label="Language">
    <button type="button" id="lang-en" aria-pressed="true">English</button>
    <button type="button" id="lang-ar" aria-pressed="false">العربية</button>
    <button type="button" id="theme" aria-pressed="false">Dark</button>
  </div>
  <div class="searchbox">
    <input id="search" type="search" placeholder="Search" autocomplete="off">
    <p id="search-status" role="status"></p>
    <div class="search-nav">
      <button type="button" id="search-prev">Previous</button>
      <button type="button" id="search-next">Next</button>
    </div>
    <div id="search-results" hidden></div>
  </div>
</header>
<div class="backdrop" id="backdrop"></div>
<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="Contents"></nav>
  <main id="main"></main>
</div>

TP لنفس البوابة. ليس خدمة Compose ولا يوجد ربط FCM في هذه الشجرة.", "path": "mobile/react-native-app"}, {"title": {"en": "Order service", "ar": "خدمة الطلبات"}, "en": "FastAPI. Owns accounts, catalog, and orders in order_db. Writes an outbox row in the same transaction. Does not publish to RabbitMQ inside the HTTP handler.", "ar": "FastAPI. تملك الحسابات والكتالوج والطلبات في order_db. تكتب صف صندوق الصادر في نفس المعاملة. معالج HTTP لا ينشر إلى RabbitMQ.", "path": "services/order-service"}, {"title": {"en": "Reporting", "ar": "التقارير"}, "en": "Django read models in reporting_db. A separate consumer applies the broker stream. Reports can answer from rows already stored while the consumer is stopped.", "ar": "نماذج قراءة Django في reporting_db. مستهلِك منفصل يطبّق تيار الوسيط. التقارير تجيب من الصفوف المخزنة حتى لو توقف المستهلِك.", "path": "services/reporting-service"}, {"title": {"en": "Odoo", "ar": "أودو"}, "en": "Odoo 18 Community plus commerce_connector. CreateErpOrder creates one sales order. The publisher emits InventoryUpdated only.", "ar": "أودو 18 المجتمعي مع commerce_connector. أمر CreateErpOrder ينشئ أمر بيع واحداً. الناشر يرسل InventoryUpdated فقط.", "path": "services/odoo"}, {"title": {"en": "Notifications", "ar": "الإشعارات"}, "en": "Flask. notification_db, device tokens, mock email and push. Consumer on q.notification.delivery, which the order-service topology function does not declare.", "ar": "Flask. قاعدة notification_db ورموز الأجهزة وبريد ودفع وهميان. المستهلِك على q.notification.delivery، وطوبولوجيا خدمة الطلبات لا تصرّح بهذا الطابور.", "path": "services/notification-service"}, {"title": {"en": "Gateway", "ar": "البوابة"}, "en": "Traefik v3.5 with a local Go plugin and a Python ForwardAuth process. Not a business service and not a database owner.", "ar": "Traefik v3.5 مع إضافة Go محلية وعملية ForwardAuth ببايثون. ليست خدمة أعمال ولا تملك قاعدة بيانات.", "path": "deploy/gateway"}, {"title": {"en": "Data plane", "ar": "مستوى البيانات"}, "en": "Four Postgres servers, RabbitMQ, and Redis. Redis is cache and shared limits, with persistence disabled in Compose.", "ar": "أربعة خوادم Postgres وRabbitMQ وRedis. ريديس ذاكرة وقيود مشتركة، والتخزين الدائم معطّل في Compose.", "path": "deploy/compose/docker-compose.yml"}]}, {"type": "h3", "en": "Consistency boundary", "ar": "حد الاتساق"}, {"type": "p", "en": "A transaction opens one database. order_db is authoritative for orders. reporting_db, notification_db, and odoo_db are separate. After the HTTP response, reporting, notifications, inventory snapshots, and the saga continue asynchronously. Confirm returns CONFIRMED without waiting for the reporting consumer or for the saga worker.", "ar": "المعاملة تفتح قاعدة واحدة. order_db هي مرجع الطلبات. reporting_db وnotification_db وodoo_db منفصلة. بعد استجابة HTTP تستمر التقارير والإشعارات ولقطات المخزون والساجا بشكل غير متزامن. التأكيد يعيد CONFIRMED دون انتظار مستهلِك التقارير أو عامل الساجا."}, {"type": "callout", "tone": "warn", "label": {"en": "Saga worker is not in Compose", "ar": "عامل الساجا ليس في Compose"}, "en": "deploy/compose/up.sh states that the saga worker is not a Compose service and that a live confirm does not reach saga COMPLETED against Odoo. The worker entry is python -m order_service.infrastructure.saga.worker. advance() in orchestrator.py moves one step per call and commits the saga, the order mirror, and the outbox together.", "ar": "⁦deploy/compose/up.sh⁩ يقول إن عامل الساجا ليس خدمة Compose وإن التأكيد الحي لا يصل إلى ⁦COMPLETED⁩ مقابل أودو. مدخل العامل هو ⁦python -m order_service.infrastructure.saga.worker⁩. الدالة ⁦advance()⁩ في ⁦orchestrator.py⁩ تحرّك خطوة واحدة في كل استدعاء وتثبّت الساجا ومرآة الطلب وصندوق الصادر معاً."}]}, {"id": "context", "title": {"en": "System context", "ar": "سياق النظام"}, "blocks": [{"type": "p", "en": "External clients are the browser storefront and the React Native app. Both are expected to call the gateway. Odoo fulfillment calls the order service directly on the private network at http://order-service:8000. Those internal routes are not on the public Traefik routers.", "ar": "العملاء الخارجيون هما واجهة المتصفح وتطبيق React Native. كلاهما يفترض أن ينادي البوابة. تنفيذ أودو ينادي خدمة الطلبات مباشرة على الشبكة الخاصة عند ⁦http://order-service:8000⁩. هذه المسارات الداخلية ليست على موجهات Traefik العامة."}, {"type": "diagram", "id": "context", "en": "System context", "ar": "سياق النظام", "note": {"en": "Solid arrows are paths present in Compose routing, service code, or the Odoo worker. The saga worker box is code that exists and is not a Compose service.", "ar": "الأسهم مسارات موجودة في توجيه Compose أو كود الخدمات أو عامل أودو. مربع عامل الساجا كود موجود وليس خدمة Compose."}, "svg": "\u003csvg class=\"arch\" viewBox=\"0 0 718 302\" role=\"img\">\u003cdefs>\u003cmarker id=\"arrow-context\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#0e4c5c\"/>\u003c/marker>\u003c/defs>\u003cline x1=\"136\" y1=\"38.0\" x2=\"180\" y2=\"64.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-context)\"/>\u003ctext data-en=\"HTTP\" data-ar=\"HTTP\" x=\"158.0\" y=\"47.0\" text-anchor=\"middle\">HTTP\u003c/text>\u003cline x1=\"136\" y1=\"88.0\" x2=\"180\" y2=\"64.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-context)\"/>\u003ctext data-en=\"HTTP\" data-ar=\"HTTP\" x=\"158.0\" y=\"72.0\" text-anchor=\"middle\">HTTP\u003c/text>\u003cline x1=\"310\" y1=\"64.0\" x2=\"360\" y2=\"34.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-context)\"/>\u003ctext data-en=\"/api/v1\" data-ar=\"/api/v1\" x=\"335.0\" y=\"45.0\" text-anchor=\"middle\">/api/v1\u003c/text>\u003cline x1=\"310\" y1=\"64.0\" x2=\"360\" y2=\"82.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-context)\"/>\u003ctext data-en=\"reports\" data-ar=\"تقارير\" x=\"335.0\" y=\"69.0\" text-anchor=\"middle\">reports 5.0\" y1=\"180\" x2=\"435.0\" y2=\"52\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-context)\"/>\u003ctext data-en=\"internal HTTP\" data-ar=\"HTTP داخلي\" x=\"435.0\" y=\"112.0\" text-anchor=\"middle\">internal HTTP\u003c/text>\u003cline x1=\"510\" y1=\"248.0\" x2=\"560\" y2=\"34.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-context)\"/>\u003ctext data-en=\"steps\" data-ar=\"خطوات\" x=\"535.0\" y=\"137.0\" text-anchor=\"middle\">steps\u003c/text>\u003crect x=\"16\" y=\"20\" width=\"120\" height=\"36\" rx=\"8\" fill=\"#e7f3ec\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Browser\" data-ar=\"المتصفح\" x=\"76.0\" y=\"42.0\" text-anchor=\"middle\">Browser\u003c/text>\u003crect x=\"16\" y=\"70\" width=\"120\" height=\"36\" rx=\"8\" fill=\"#e7f3ec\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"React Native\" data-ar=\"ريأكت نيتف\" x=\"76.0\" y=\"92.0\" text-anchor=\"middle\">React Native\u003c/text>\u003crect x=\"180\" y=\"44\" width=\"130\" height=\"40\" rx=\"8\" fill=\"#e5f2f4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Traefik\" data-ar=\"ترافيك\" x=\"245.0\" y=\"68.0\" text-anchor=\"middle\">Traefik\u003c/text>\u003crect x=\"360\" y=\"16\" width=\"150\" height=\"36\" rx=\"8\" fill=\"#fffdf8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Order API\" data-ar=\"واجهة الطلبات\" x=\"435.0\" y=\"38.0\" text-anchor=\"middle\">Order API\u003c/text>\u003crect x=\"360\" y=\"64\" width=\"150\" height=\"36\" rx=\"8\" fill=\"#fffdf8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Reporting\" data-ar=\"التقارير\" x=\"435.0\" y=\"86.0\" text-anchor=\"middle\">Reporting\u003c/text>\u003crect x=\"360\" y=\"112\" width=\"150\" height=\"36\" rx=\"8\" fill=\"#fffdf8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Notifications\" data-ar=\"الإشعارات\" x=\"435.0\" y=\"134.0\" text-anchor=\"middle\">Notifications\u003c/text>\u003crect x=\"180\" y=\"120\" width=\"130\" height=\"36\" rx=\"8\" fill=\"#fffdf8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Storefront\" data-ar=\"المتجر\" x=\"245.0\" y=\"142.0\" text-anchor=\"middle\">Storefront\u003c/text>\u003crect x=\"560\" y=\"16\" width=\"120\" height=\"36\" rx=\"8\" fill=\"#fbf1e4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"order_db\" data-ar=\"order_db\" x=\"620.0\" y=\"38.0\" text-anchor=\"middle\">order_db\u003c/text>\u003crect x=\"560\" y=\"64\" width=\"120\" height=\"36\" rx=\"8\" fill=\"#fbf1e4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Redis\" data-ar=\"ريديس\" x=\"620.0\" y=\"86.0\" text-anchor=\"middle\">Redis\u003c/text>\u003crect x=\"560\" y=\"140\" width=\"130\" height=\"36\" rx=\"8\" fill=\"#f3eee4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"RabbitMQ\" data-ar=\"رابت إم كيو\" x=\"625.0\" y=\"162.0\" text-anchor=\"middle\">RabbitMQ\u003c/text>\u003crect x=\"360\" y=\"180\" width=\"150\" height=\"36\" rx=\"8\" fill=\"#fffdf8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Odoo\" data-ar=\"أودو\" x=\"435.0\" y=\"202.0\" text-anchor=\"middle\">Odoo\u003c/text>\u003crect x=\"360\" y=\"230\" width=\"150\" height=\"36\" rx=\"8\" fill=\"#eef0f8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Saga worker\" data-ar=\"عامل الساجا\" x=\"435.0\" y=\"252.0\" text-anchor=\"middle\">Saga worker\u003c/text>\u003c/svg>"}, {"type": "h3", "en": "Runtime versus tools", "ar": "ما يعمل مقابل الأدوات"}, {"type": "table", "headers": [{"en": "Kind", "ar": "النوع"}, {"en": "Examples", "ar": "أمثلة"}, {"en": "Runs in the stack?", "ar": "هل يعمل داخل المكدس؟"}], "rows": [[{"en": "Runtime services", "ar": "خدمات تشغيل"}, {"en": "order-service, consumers, gateway, databases", "ar": "خدمة الطلبات والمستهلِكون والبوابة وقواعد البيانات"}, {"en": "Yes, when Compose or kind is up", "ar": "نعم عندما يعمل Compose أو kind"}], [{"en": "Config", "ar": "إعداد"}, {"en": "dynamic.yaml, prometheus.yml, dashboards", "ar": "dynamic.yaml وprometheus.yml ولوحات Grafana"}, {"en": "Mounted into those services", "ar": "تُركَّب داخل تلك الخدمات"}], [{"en": "Tests and helpers", "ar": "اختبارات ومساعدات"}, {"en": "echo_upstream.py, live_check.py, test_*.py", "ar": "echo_upstream.py وlive_check.py وtest_*.py"}, {"en": "No. The live check starts echo upstreams only when invoked.", "ar": "لا. الفحص الحي يشغّل منابع صدى فقط عند استدعائه."}], [{"en": "Operations scripts", "ar": "سكربتات تشغيل"}, {"en": "dump.sh, failure-lab/*.sh, apply.sh", "ar": "dump.sh وfailure-lab/*.sh وapply.sh"}, {"en": "Only when a person runs them", "ar": "فقط عندما يشغّلها شخص"}], [{"en": "Documentation", "ar": "توثيق"}, {"en": "docs/, README.md, this file", "ar": "docs/ وREADME.md وهذا الملف"}, {"en": "No", "ar": "لا"}]]}, {"type": "p", "en": "echo_upstream.py is a tiny header recorder used by deploy/gateway/live_check.py with deploy/gateway/compose.check.yaml. jwt_check.py is the process the gateway container actually calls. live_check.py is a test runner: it always runs the unit tests, and it starts Docker only when the daemon is up.", "ar": "⁦echo_upstream.py⁩ مسجّل ترويسات صغير يستخدمه ⁦deploy/gateway/live_check.py⁩ مع ⁦deploy/gateway/compose.check.yaml⁩. ⁦jwt_check.py⁩ هي العملية التي تناديها حاوية البوابة فعلاً. ⁦live_check.py⁩ مشغّل اختبارات: يشغّل اختبارات الوحدة دائماً، ويشغّل Docker فقط إذا كان المحرك يعمل."}]}, {"id": "lifecycle", "title": {"en": "Request and message lifecycles", "ar": "دورات الطلب والرسائل"}, "blocks": [{"type": "h3", "en": "Create an order", "ar": "إنشاء طلب"}, {"type": "ol", "items": [{"en": "The client sends POST /api/v1/orders to the gateway with a Bearer access token.", "ar": "العميل يرسل ⁦POST /api/v1/orders⁩ إلى البوابة مع رمز وصول Bearer."}, {"en": "edgeheaders prepare strips client identity headers and normalizes X-Correlation-Id. The coarse Traefik limiter counts this request in memory.", "ar": "وضع prepare في edgeheaders يحذف ترويسات الهوية القادمة من العميل ويطبّع ⁦X-Correlation-Id⁩. المحدد الخشن في Traefik يعدّ الطلب في الذاكرة."}, {"en": "jwt-check GET /verify accepts RS256 access tokens that have exp, iat, and sub, with token_type access. It does not read role. A failure is HTTP 401 and error.code UNAUTHENTICATED.", "ar": "⁦jwt-check⁩ على ⁦GET /verify⁩ يقبل رموز RS256 من نوع access التي تحمل ⁦exp⁩ و⁦iat⁩ و⁦sub⁩. لا يقرأ الدور. الفشل HTTP 401 و⁦error.code⁩ يساوي ⁦UNAUTHENTICATED⁩."}, {"en": "The order router excludes /api/v1/internal, reports, and device-tokens, then forwards to order-service:8000.", "ar": "موجه الطلبات يستبعد ⁦/api/v1/internal⁩ والتقارير ورموز الأجهزة، ثم يحوّل إلى ⁦order-service:8000⁩."}, {"en": "The order service checks the token again and enforces the role. Login and order-create limits use Redis and fail closed. The create lock is 15 seconds and is not an idempotency record.", "ar": "خدمة الطلبات تفحص الرمز مرة أخرى وتفرض الدور. حدود الدخول وإنشاء الطلب تستخدم Redis وتفشل مغلقة. قفل الإنشاء 15 ثانية وليس سجل تماثل."}, {"en": "CreateOrder writes the order and the outbox row in one order_db transaction. The HTTP handler returns 201 without waiting for RabbitMQ.", "ar": "إنشاء الطلب يكتب الطلب وصف صندوق الصادر في معاملة order_db واحدة. معالج HTTP يعيد 201 دون انتظار RabbitMQ."}, {"en": "order-outbox-publisher claims pending rows with SELECT … FOR UPDATE SKIP LOCKED, publishes, and waits for a broker confirm.", "ar": "⁦order-outbox-publisher⁩ يحجز الصفوف المعلقة بـ ⁦SELECT … FOR UPDATE SKIP LOCKED⁩ وينشر وينتظر تأكيد الوسيط."}, {"en": "Reporting, notification, and Odoo consumers apply their own databases later. The caller already has the HTTP response.", "ar": "مستهلِكو التقارير والإشعارات وأودو يطبّقون قواعدهم لاحقاً. المتصل حصل على استجابة HTTP مسبقاً."}]}, {"type": "diagram", "id": "order-create", "en": "Order create, then asynchronous delivery", "ar": "إنشاء الطلب ثم التسليم غير المتزامن", "note": {"en": "The HTTP response is step 6. Steps after the outbox publisher do not block that response.", "ar": "استجابة HTTP هي الخطوة 6. ما بعد ناشر صندوق الصادر لا يحبس تلك الاستجابة."}, "svg": "\u003csvg class=\"arch\" viewBox=\"0 0 778 202\" role=\"img\">\u003cdefs>\u003cmarker id=\"arrow-order-create\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#0e4c5c\"/>\u003c/marker>\u003c/defs>\u003cline x1=\"116\" y1=\"58.0\" x2=\"150\" y2=\"58.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-order-create)\"/>\u003ctext data-en=\"1\" data-ar=\"1\" x=\"133.0\" y=\"54.0\" text-anchor=\"middle\">1\u003c/text>\u003cline x1=\"260\" y1=\"58.0\" x2=\"300\" y2=\"58.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-order-create)\"/>\u003ctext data-en=\"2-4\" data-ar=\"2-4\" x=\"280.0\" y=\"54.0\" text-anchor=\"middle\">2-4\u003c/text>\u003cline x1=\"420\" y1=\"58.0\" x2=\"460\" y2=\"34.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-order-create)\"/>\u003ctext data-en=\"5 commit\" data-ar=\"5 تثبيت\" x=\"440.0\" y=\"42.0\" text-anchor=\"middle\">5 commit\u003c/text>\u003cline x1=\"525.0\" y1=\"70\" x2=\"515.0\" y2=\"52\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-order-create)\"/>\u003ctext data-en=\"claim\" data-ar=\"حجز\" x=\"520.0\" y=\"57.0\" text-anchor=\"middle\">claim\u003c/text>\u003cline x1=\"590\" y1=\"88.0\" x2=\"630\" y2=\"88.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-order-create)\"/>\u003ctext data-en=\"confirm\" data-ar=\"تأكيد\" x=\"610.0\" y=\"84.0\" text-anchor=\"middle\">confirm\u003c/text>\u003cline x1=\"685.0\" y1=\"106\" x2=\"690.0\" y2=\"130\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-order-create)\"/>\u003ctext data-en=\"later\" data-ar=\"لاحقاً\" x=\"687.5\" y=\"114.0\" text-anchor=\"middle\">later\u003c/text>\u003crect x=\"16\" y=\"40\" width=\"100\" height=\"36\" rx=\"8\" fill=\"#e7f3ec\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Client\" data-ar=\"العميل\" x=\"66.0\" y=\"62.0\" text-anchor=\"middle\">Client\u003c/text>\u003crect x=\"150\" y=\"40\" width=\"110\" height=\"36\" rx=\"8\" fill=\"#e5f2f4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Gateway\" data-ar=\"البوابة\" x=\"205.0\" y=\"62.0\" text-anchor=\"middle\">Gateway\u003c/text>\u003crect x=\"300\" y=\"40\" width=\"120\" height=\"36\" rx=\"8\" fill=\"#fffdf8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Order API\" data-ar=\"واجهة الطلبات\" x=\"360.0\" y=\"62.0\" text-anchor=\"middle\">Order API\u003c/text>\u003crect x=\"460\" y=\"16\" width=\"110\" height=\"36\" rx=\"8\" fill=\"#fbf1e4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"order_db\" data-ar=\"order_db\" x=\"515.0\" y=\"38.0\" text-anchor=\"middle\">order_db\u003c/text>\u003crect x=\"460\" y=\"70\" width=\"130\" height=\"36\" rx=\"8\" fill=\"#f3eee4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Outbox publisher\" data-ar=\"ناشر الصندوق\" x=\"525.0\" y=\"92.0\" text-anchor=\"middle\">Outbox publisher\u003c/text>\u003crect x=\"630\" y=\"70\" width=\"110\" height=\"36\" rx=\"8\" fill=\"#f3eee4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"RabbitMQ\" data-ar=\"رابت\" x=\"685.0\" y=\"92.0\" text-anchor=\"middle\">RabbitMQ\u003c/text>\u003crect x=\"630\" y=\"130\" width=\"120\" height=\"36\" rx=\"8\" fill=\"#fbf1e4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Reporting DB\" data-ar=\"قاعدة التقارير\" x=\"690.0\" y=\"152.0\" text-anchor=\"middle\">Reporting DB\u003c/text>\u003c/svg>"}, {"type": "h3", "en": "Confirm, saga, and payment", "ar": "التأكيد والساجا والدفع"}, {"type": "p", "en": "POST /api/v1/orders/{id}/confirm is confirm_order in presentation/routes/orders.py. It runs ConfirmOrder and increments orders_confirmed_total. Legal order transitions live only in domain/entities/order_status.py: PENDING to CONFIRMED or CANCELLED, then CONFIRMED to PROCESSING, PROCESSING to SHIPPED, SHIPPED to DELIVERED. Cancel is legal only from PENDING.", "ar": "⁦POST /api/v1/orders/{id}/confirm⁩ هي ⁦confirm_order⁩ في ⁦presentation/routes/orders.py⁩. تشغّل ⁦ConfirmOrder⁩ وتزيد ⁦orders_confirmed_total⁩. الانتقالات القانونية موجودة فقط في ⁦domain/entities/order_status.py⁩: من PENDING إلى CONFIRMED أو CANCELLED، ثم CONFIRMED إلى PROCESSING، ثم PROCESSING إلى SHIPPED، ثم SHIPPED إلى DELIVERED. الإلغاء قانوني من PENDING فقط."}, {"type": "p", "en": "Confirm starts the saga row. The worker's advance() then does at most one remote step: reserve inventory, simulated payment, create ERP order, then complete. Compensation runs from COMPENSATING. Payment is a simulated port inside the order service. payment_circuit_state is 0 closed, 1 half-open, 2 open, and the worker copies that gauge. There is no external payment provider in this tree.", "ar": "التأكيد يبدأ صف الساجا. ثم ⁦advance()⁩ في العامل تنفّذ خطوة بعيدة واحدة على الأكثر: حجز المخزون، ثم دفع محاكى، ثم إنشاء أمر ERP، ثم الإكمال. التعويض يعمل من COMPENSATING. الدفع منفذ محاكى داخل خدمة الطلبات. ⁦payment_circuit_state⁩ قيمته 0 مغلق و1 نصف مفتوح و2 مفتوح، والعامل ينسخ هذا المقياس. لا يوجد مزود دفع خارجي في هذه الشجرة."}, {"type": "callout", "tone": "risk", "label": {"en": "What confirm does not wait for", "ar": "ما لا ينتظره التأكيد"}, "en": "The public confirm call does not wait for q.reporting.projection, q.notification.delivery, or Odoo. Warehouse milestones (processing, shipped, delivered) are HTTP calls from Odoo to /api/v1/internal with X-Internal-Token. The gateway file does not route that prefix. If INTERNAL_SERVICE_TOKEN is empty, up.sh says Odoo fulfillment returns 503.", "ar": "نداء التأكيد العام لا ينتظر ⁦q.reporting.projection⁩ ولا ⁦q.notification.delivery⁩ ولا أودو. مراحل المستودع (معالجة وشحن وتسليم) نداءات HTTP من أودو إلى ⁦/api/v1/internal⁩ مع ⁦X-Internal-Token⁩. ملف البوابة لا يوجّه هذه البادئة. إذا كان ⁦INTERNAL_SERVICE_TOKEN⁩ فارغاً، يقول ⁦up.sh⁩ إن تنفيذ أودو يعيد 503."}, {"type": "diagram", "id": "saga", "en": "Saga steps after confirm", "ar": "خطوات الساجا بعد التأكيد", "note": {"en": "The HTTP confirm returns before these steps. The worker is not defined in docker-compose.yml.", "ar": "تأكيد HTTP يعود قبل هذه الخطوات. العامل غير معرّف في docker-compose.yml."}, "svg": "\u003csvg class=\"arch\" viewBox=\"0 0 748 112\" role=\"img\">\u003cdefs>\u003cmarker id=\"arrow-saga\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#0e4c5c\"/>\u003c/marker>\u003c/defs>\u003cline x1=\"126\" y1=\"58.0\" x2=\"160\" y2=\"58.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-saga)\"/>\u003ctext data-en=\"command\" data-ar=\"أمر\" x=\"143.0\" y=\"54.0\" text-anchor=\"middle\">command\u003c/text>\u003cline x1=\"280\" y1=\"58.0\" x2=\"310\" y2=\"58.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-saga)\"/>\u003ctext data-en=\"step\" data-ar=\"خطوة\" x=\"295.0\" y=\"54.0\" text-anchor=\"middle\">step\u003c/text>\u003cline x1=\"430\" y1=\"58.0\" x2=\"460\" y2=\"58.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-saga)\"/>\u003ctext data-en=\"step\" data-ar=\"خطوة\" x=\"445.0\" y=\"54.0\" text-anchor=\"middle\">step\u003c/text>\u003cline x1=\"580\" y1=\"58.0\" x2=\"610\" y2=\"58.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-saga)\"/>\u003ctext data-en=\"step\" data-ar=\"خطوة\" x=\"595.0\" y=\"54.0\" text-anchor=\"middle\">step\u003c/text>\u003crect x=\"16\" y=\"40\" width=\"110\" height=\"36\" rx=\"8\" fill=\"#fffdf8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"CONFIRMED\" data-ar=\"مؤكد\" x=\"71.0\" y=\"62.0\" text-anchor=\"middle\">CONFIRMED\u003c/text>\u003crect x=\"160\" y=\"40\" width=\"120\" height=\"36\" rx=\"8\" fill=\"#f3eee4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Reserve\" data-ar=\"حجز\" x=\"220.0\" y=\"62.0\" text-anchor=\"middle\">Reserve\u003c/text>\u003crect x=\"310\" y=\"40\" width=\"120\" height=\"36\" rx=\"8\" fill=\"#eef0f8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Simulated pay\" data-ar=\"دفع محاكى\" x=\"370.0\" y=\"62.0\" text-anchor=\"middle\">Simulated pay\u003c/text>\u003crect x=\"460\" y=\"40\" width=\"120\" height=\"36\" rx=\"8\" fill=\"#fffdf8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Create ERP\" data-ar=\"إنشاء ERP\" x=\"520.0\" y=\"62.0\" text-anchor=\"middle\">Create ERP\u003c/text>\u003crect x=\"610\" y=\"40\" width=\"110\" height=\"36\" rx=\"8\" fill=\"#e7f3ec\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"COMPLETED\" data-ar=\"مكتمل\" x=\"665.0\" y=\"62.0\" text-anchor=\"middle\">COMPLETED\u003c/text>\u003c/svg>"}, {"type": "h3", "en": "Catalog read", "ar": "قراءة الكتالوج"}, {"type": "p", "en": "Product get and list are cache-aside. A miss or a Redis error reads order_db. TTL is 30 seconds. After a committed catalog write, invalidate deletes that product key and cached list pages. Redis and Postgres are not one atomic update. Login is 5 per minute per IP and per email hash, register is 5 per minute per IP, and order create is 10 per minute per IP and per account.", "ar": "قراءة المنتج والقائمة بنمط cache-aside. الفشل أو خطأ Redis يقرأ order_db. مدة الحياة 30 ثانية. بعد تثبيت كتابة الكتالوج تحذف الإبطال مفتاح المنتج وصفحات القوائم المخزنة. Redis وPostgres ليسا تحديثاً ذرياً واحداً. الدخول 5 في الدقيقة لكل IP ولكل تجزئة بريد، والتسجيل 5 في الدقيقة لكل IP، وإنشاء الطلب 10 في الدقيقة لكل IP ولكل حساب."}]}, {"id": "messaging", "title": {"en": "Messaging and consistency", "ar": "الرسائل والاتساق"}, "blocks": [{"type": "p", "en": "Topology name commerce-platform-topology is declared in services/order-service/src/order_service/infrastructure/messaging/topology.py. Exchanges commerce.events, erp.events, commerce.retry, and commerce.dlx are durable topic exchanges. commerce.commands is a durable direct exchange. Primary queues are durable and do not set x-dead-letter-exchange, so a nack is not how retries are delayed.", "ar": "اسم الطوبولوجيا ⁦commerce-platform-topology⁩ يُصرَّح في ⁦services/order-service/src/order_service/infrastructure/messaging/topology.py⁩. التبادلات ⁦commerce.events⁩ و⁦erp.events⁩ و⁦commerce.retry⁩ و⁦commerce.dlx⁩ من نوع topic ودائمة. ⁦commerce.commands⁩ تبادل direct دائم. الطوابير الأساسية دائمة ولا تضع ⁦x-dead-letter-exchange⁩، لذا الـ nack ليس طريقة تأخير إعادة المحاولة."}, {"type": "table", "headers": [{"en": "Queue", "ar": "الطابور"}, {"en": "Bound to", "ar": "مربوط إلى"}, {"en": "Who applies it", "ar": "من يطبّقه"}], "rows": [[{"ltr": "q.reporting.projection", "en": "", "ar": ""}, {"en": "order.*, product.*, customer.*, payment.* and inventory.updated", "ar": "order.* وproduct.* وcustomer.* وpayment.* وinventory.updated"}, {"en": "reporting consumer", "ar": "مستهلِك التقارير"}], [{"ltr": "q.odoo.order-confirmed", "en": "", "ar": ""}, {"en": "order.confirmed on commerce.events", "ar": "order.confirmed على commerce.events"}, {"en": "Odoo confirmed path, not a second sales order", "ar": "مسار تأكيد أودو، وليس أمر بيع ثانياً"}], [{"ltr": "q.order.inventory", "en": "", "ar": ""}, {"en": "inventory.updated on erp.events", "ar": "inventory.updated على erp.events"}, {"en": "order inventory consumer", "ar": "مستهلِك مخزون الطلبات"}], [{"ltr": "q.odoo.reserve-inventory", "en": "", "ar": ""}, {"en": "inventory.reserve", "ar": "inventory.reserve"}, {"en": "Odoo command consumer", "ar": "مستهلِك أوامر أودو"}], [{"ltr": "q.odoo.release-inventory", "en": "", "ar": ""}, {"en": "inventory.release", "ar": "inventory.release"}, {"en": "Odoo command consumer", "ar": "مستهلِك أوامر أودو"}], [{"ltr": "q.odoo.create-sales-order", "en": "", "ar": ""}, {"en": "erp.create-sales-order", "ar": "erp.create-sales-order"}, {"en": "CreateErpOrder", "ar": "CreateErpOrder"}], [{"ltr": "q.odoo.cancel-sales-order", "en": "", "ar": ""}, {"en": "erp.cancel-sales-order", "ar": "erp.cancel-sales-order"}, {"en": "CancelErpOrder", "ar": "CancelErpOrder"}], [{"ltr": "q.notification.delivery", "en": "", "ar": ""}, {"en": "order.confirmed, cancelled, shipped, delivered, payment.confirmed, payment.failed", "ar": "تأكيد وإلغاء وشحن وتسليم ودفع"}, {"en": "notification consumer declares this queue", "ar": "مستهلِك الإشعارات يصرّح بهذا الطابور"}]]}, {"type": "h3", "en": "Retry, ack, and the outbox", "ar": "إعادة المحاولة والإقرار وصندوق الصادر"}, {"type": "p", "en": "A failed delivery is published to commerce.retry with routing key {prefix}.retry.{attempt} and header x-retry-count, then acked after a publisher confirm. TTLs are 5s, 30s, 2min, 10min, and 30min. The sixth failure is published to commerce.dlx and lands on {queue}.dlq. Consumers use manual ack and prefetch 10. They do not use requeue=true for poison messages. processed_events dedupes event_id.", "ar": "التسليم الفاشل يُنشر إلى ⁦commerce.retry⁩ بمفتاح ⁦{prefix}.retry.{attempt}⁩ وترويسة ⁦x-retry-count⁩، ثم يُقر بعد تأكيد الناشر. مدد الحياة 5 ثوانٍ و30 ثانية ودقيقتان و10 دقائق و30 دقيقة. الفشل السادس يُنشر إلى ⁦commerce.dlx⁩ ويصل إلى ⁦{queue}.dlq⁩. المستهلِكون يستخدمون إقراراً يدوياً وprefetch بقيمة 10. لا يستخدمون ⁦requeue=true⁩ للرسائل السامة. ⁦processed_events⁩ يمنع تكرار ⁦event_id⁩."}, {"type": "p", "en": "Publisher confirms exist on the order outbox publisher, the Odoo inventory publisher, and the retry publisher. The outbox gives a local atomic write of the business row and the event. It does not make RabbitMQ, reporting, and Odoo commit together. A crash after the broker confirm and before the published status commit can send the same event_id again. Consumers are expected to treat that as a duplicate.", "ar": "تأكيدات الناشر موجودة في ناشر صندوق الطلبات وناشر مخزون أودو وناشر إعادة المحاولة. صندوق الصادر يعطي كتابة ذرية محلية لصف العمل والحدث. لا يجعل RabbitMQ والتقارير وأودو تثبّت معاً. تعطل بعد تأكيد الوسيط وقبل تثبيت حالة published يمكن أن يرسل نفس event_id مرة أخرى. يُفترض أن يعامل المستهلِكون ذلك كمكرر."}, {"type": "diagram", "id": "broker", "en": "Broker path for a domain fact", "ar": "مسار الوسيط لحقيقة نطاق", "note": {"en": "Notification bindings are declared by the notification service, not by declare_topology in the order service.", "ar": "ارتباطات الإشعار يصرّح بها خدمة الإشعارات، لا الدالة declare_topology في خدمة الطلبات."}, "svg": "\u003csvg class=\"arch\" viewBox=\"0 0 698 232\" role=\"img\">\u003cdefs>\u003cmarker id=\"arrow-broker\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#0e4c5c\"/>\u003c/marker>\u003c/defs>\u003cline x1=\"136\" y1=\"48.0\" x2=\"180\" y2=\"48.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-broker)\"/>\u003ctext data-en=\"claim\" data-ar=\"حجز\" x=\"158.0\" y=\"44.0\" text-anchor=\"middle\">claim\u003c/text>\u003cline x1=\"300\" y1=\"48.0\" x2=\"340\" y2=\"48.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-broker)\"/>\u003ctext data-en=\"confirm\" data-ar=\"تأكيد\" x=\"320.0\" y=\"44.0\" text-anchor=\"middle\">confirm\u003c/text>\u003cline x1=\"480\" y1=\"48.0\" x2=\"520\" y2=\"24.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-broker)\"/>\u003ctext data-en=\"order.*\" data-ar=\"order.*\" x=\"500.0\" y=\"32.0\" text-anchor=\"middle\">order.*\u003c/text>\u003cline x1=\"480\" y1=\"48.0\" x2=\"520\" y2=\"64.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-broker)\"/>\u003ctext data-en=\"selected keys\" data-ar=\"مفاتيح\" x=\"500.0\" y=\"52.0\" text-anchor=\"middle\">selected keys\u003c/text>\u003cline x1=\"480\" y1=\"48.0\" x2=\"520\" y2=\"104.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-broker)\"/>\u003ctext data-en=\"order.confirmed\" data-ar=\"order.confirmed\" x=\"500.0\" y=\"72.0\" text-anchor=\"middle\">order.confirmed\u003c/text>\u003cline x1=\"520\" y1=\"24.0\" x2=\"480\" y2=\"128.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-broker)\"/>\u003ctext data-en=\"after failure\" data-ar=\"بعد الفشل\" x=\"500.0\" y=\"72.0\" text-anchor=\"middle\">after failure\u003c/text>\u003cline x1=\"410.0\" y1=\"146\" x2=\"410.0\" y2=\"160\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-broker)\"/>\u003ctext data-en=\"attempt 6\" data-ar=\"المحاولة 6\" x=\"410.0\" y=\"149.0\" text-anchor=\"middle\">attempt 6\u003c/text>\u003crect x=\"16\" y=\"30\" width=\"120\" height=\"36\" rx=\"8\" fill=\"#fbf1e4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"order_db outbox\" data-ar=\"صندوق order_db\" x=\"76.0\" y=\"52.0\" text-anchor=\"middle\">order_db outbox\u003c/text>\u003crect x=\"180\" y=\"30\" width=\"120\" height=\"36\" rx=\"8\" fill=\"#fffdf8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Publisher\" data-ar=\"الناشر\" x=\"240.0\" y=\"52.0\" text-anchor=\"middle\">Publisher\u003c/text>\u003crect x=\"340\" y=\"30\" width=\"140\" height=\"36\" rx=\"8\" fill=\"#f3eee4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"commerce.events\" data-ar=\"commerce.events\" x=\"410.0\" y=\"52.0\" text-anchor=\"middle\">commerce.events\u003c/text>\u003crect x=\"520\" y=\"8\" width=\"150\" height=\"32\" rx=\"8\" fill=\"#fffdf8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"q.reporting\" data-ar=\"q.reporting\" x=\"595.0\" y=\"28.0\" text-anchor=\"middle\">q.reporting\u003c/text>\u003crect x=\"520\" y=\"48\" width=\"150\" height=\"32\" rx=\"8\" fill=\"#fffdf8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"q.notification\" data-ar=\"q.notification\" x=\"595.0\" y=\"68.0\" text-anchor=\"middle\">q.notification\u003c/text>\u003crect x=\"520\" y=\"88\" width=\"150\" height=\"32\" rx=\"8\" fill=\"#fffdf8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"q.odoo.confirmed\" data-ar=\"q.odoo.confirmed\" x=\"595.0\" y=\"108.0\" text-anchor=\"middle\">q.odoo.confirmed\u003c/text>\u003crect x=\"340\" y=\"110\" width=\"140\" height=\"36\" rx=\"8\" fill=\"#f3eee4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"commerce.retry\" data-ar=\"commerce.retry\" x=\"410.0\" y=\"132.0\" text-anchor=\"middle\">commerce.retry\u003c/text>\u003crect x=\"340\" y=\"160\" width=\"140\" height=\"36\" rx=\"8\" fill=\"#eef0f8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"commerce.dlx\" data-ar=\"commerce.dlx\" x=\"410.0\" y=\"182.0\" text-anchor=\"middle\">commerce.dlx\u003c/text>\u003c/svg>"}, {"type": "callout", "tone": "note", "label": {"en": "Pattern versus guarantee", "ar": "النمط مقابل الضمان"}, "en": "The code implements a transactional outbox, at-least-once publish with confirms, consumer idempotency on event_id, delayed retries, and a dead-letter queue. It does not implement a distributed transaction, an HTTP Idempotency-Key requirement, or a guarantee that reporting matches order_db at the moment of the HTTP response. docs/api.md still mentions Idempotency-Key; the handlers do not enforce it.", "ar": "الكود ينفّذ صندوق صادر معاملات، ونشراً مرة-على-الأقل مع تأكيدات، وتماثل المستهلِك على ⁦event_id⁩، وإعادة محاولة مؤجلة، وطابور رسائل ميتة. لا ينفّذ معاملة موزعة، ولا يفرض ترويسة ⁦Idempotency-Key⁩، ولا يضمن أن التقارير تطابق ⁦order_db⁩ لحظة استجابة HTTP. ⁦docs/api.md⁩ ما زال يذكر ⁦Idempotency-Key⁩ والمعالجات لا تفرضها."}]}, {"id": "gateway", "title": {"en": "Gateway and security boundaries", "ar": "البوابة وحدود الأمان"}, "blocks": [{"type": "p", "en": "Traefik is the only public HTTP entry in the full Compose file (127.0.0.1:8080 to container port 80) and, on kind, the Ingress named public sends every path to the gateway Service. The static file deploy/gateway/traefik.yaml uses the file provider only. The Docker socket is not mounted. Dashboard and insecure API are off. Forwarded headers are not trusted (insecure: false), so a client-supplied X-Forwarded-For is not the client IP.", "ar": "Traefik هو مدخل HTTP العام الوحيد في ملف Compose الكامل (⁦127.0.0.1:8080⁩ إلى منفذ الحاوية 80)، وعلى kind يرسل Ingress المسمى ⁦public⁩ كل مسار إلى خدمة البوابة. الملف الثابت ⁦deploy/gateway/traefik.yaml⁩ يستخدم مزود الملفات فقط. مقبس Docker غير مركّب. لوحة التحكم وواجهة API غير الآمنة مطفأتان. ترويسات التوجيه غير موثوقة (⁦insecure: false⁩)، لذا ⁦X-Forwarded-For⁩ القادم من العميل ليس عنوان العميل."}, {"type": "table", "headers": [{"en": "Router", "ar": "الموجه"}, {"en": "Rule, short", "ar": "القاعدة باختصار"}, {"en": "Auth", "ar": "المصادقة"}, {"en": "Upstream in full Compose", "ar": "المنبع في Compose الكامل"}], "rows": [[{"ltr": "reports", "en": "", "ar": ""}, {"en": "/api/v1/reports priority 300", "ar": "/api/v1/reports أولوية 300"}, {"en": "JWT forward-auth", "ar": "JWT عبر forward-auth"}, {"en": "reporting-service:8001", "ar": "reporting-service:8001"}], [{"ltr": "notifications", "en": "", "ar": ""}, {"en": "/api/v1/device-tokens priority 300", "ar": "/api/v1/device-tokens أولوية 300"}, {"en": "JWT forward-auth", "ar": "JWT عبر forward-auth"}, {"en": "notification-service:8002", "ar": "notification-service:8002"}], [{"ltr": "auth-public", "en": "", "ar": ""}, {"en": "POST register, login, refresh, logout priority 250", "ar": "POST للتسجيل والدخول والتحديث والخروج أولوية 250"}, {"en": "No JWT middleware", "ar": "بدون وسيط JWT"}, {"en": "order-service:8000", "ar": "order-service:8000"}], [{"ltr": "order-api", "en": "", "ar": ""}, {"en": "other /api/v1 except internal, reports, tokens", "ar": "بقية /api/v1 عدا الداخلي والتقارير والرموز"}, {"en": "JWT forward-auth", "ar": "JWT عبر forward-auth"}, {"en": "order-service:8000", "ar": "order-service:8000"}], [{"ltr": "frontend", "en": "", "ar": ""}, {"en": "not /api and not /ping priority 1", "ar": "ليس /api وليس /ping أولوية 1"}, {"en": "No JWT middleware", "ar": "بدون وسيط JWT"}, {"en": "frontend:8080", "ar": "frontend:8080"}]]}, {"type": "h3", "en": "Who enforces which rule", "ar": "من يفرض أي قاعدة"}, {"type": "ul", "items": [{"en": "The Go plugin edgeheaders, mode prepare, deletes X-User-Id, X-User-Role, X-Internal-Token, and the other listed identity headers before the request continues. A client cannot become an admin by sending those headers through this router chain.", "ar": "إضافة Go المسماة edgeheaders في وضع prepare تحذف X-User-Id وX-User-Role وX-Internal-Token وبقية ترويسات الهوية المذكورة قبل أن يكمل الطلب. العميل لا يصبح مديراً بإرسال هذه الترويسات عبر سلسلة الموجهات هذه."}, {"en": "Mode cors answers OPTIONS with 204 so the preflight does not reach jwt-check. Allowed origins are the four localhost storefront origins, not a wildcard. CORS headers on the response are stamped by the prepare wrapper when the origin is allowed.", "ar": "وضع cors يرد على OPTIONS بـ 204 حتى لا يصل الطلب التمهيدي إلى jwt-check. الأصول المسموحة هي أربعة أصول محلية للمتجر، وليست نجمة. ترويسات CORS على الاستجابة يختمها غلاف prepare عندما يكون الأصل مسموحاً."}, {"en": "Traefik rateLimit is 30 requests per second average, burst 60, in memory, per gateway process. It is not the Redis login or order-create budget.", "ar": "محدد Traefik معدله 30 طلباً في الثانية مع دفعة 60، في الذاكرة، لكل عملية بوابة. ليس ميزانية الدخول أو إنشاء الطلب في Redis."}, {"en": "jwt_check.verify_authorization requires algorithm RS256, claims exp, iat, and sub, leeway 5 seconds, and token_type access. Role is ignored here. The order service and reporting service verify the token again.", "ar": "الدالة verify_authorization تشترط الخوارزمية RS256 والادعاءات exp وiat وsub وهامش 5 ثوانٍ وtoken_type بقيمة access. الدور يُتجاهل هنا. خدمة الطلبات وخدمة التقارير تفحصان الرمز مرة أخرى."}, {"en": "Authorization, prices, and stock are not decisions of the gateway. /api/v1/internal is excluded from public routers. Calling the order service on the Compose network bypasses Traefik. That is why the internal token exists and why the public file strips X-Internal-Token.", "ar": "التفويض والأسعار والمخزون ليست قرارات البوابة. المسار /api/v1/internal مستبعد من الموجهات العامة. مناداة خدمة الطلبات على شبكة Compose تتجاوز Traefik. لهذا يوجد الرمز الداخلي ولهذا يحذف الملف العام ترويسة X-Internal-Token."}]}, {"type": "diagram", "id": "gateway-route", "en": "Gateway router order", "ar": "ترتيب موجهات البوابة", "note": {"en": "Higher priority wins. Internal fulfillment is absent from this list on purpose.", "ar": "الأولوية الأعلى تفوز. التنفيذ الداخلي غائب من هذه القائمة عن قصد."}, "svg": "\u003csvg class=\"arch\" viewBox=\"0 0 468 196\" role=\"img\">\u003cdefs>\u003cmarker id=\"arrow-gateway-route\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#0e4c5c\"/>\u003c/marker>\u003c/defs>\u003cline x1=\"116\" y1=\"58.0\" x2=\"150\" y2=\"58.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-gateway-route)\"/>\u003ctext data-en=\"strip\" data-ar=\"حذف\" x=\"133.0\" y=\"54.0\" text-anchor=\"middle\">strip\u003c/text>\u003cline x1=\"270\" y1=\"58.0\" x2=\"310\" y2=\"24.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-gateway-route)\"/>\u003ctext data-en=\"250\" data-ar=\"250\" x=\"290.0\" y=\"37.0\" text-anchor=\"middle\">250\u003c/text>\u003cline x1=\"270\" y1=\"58.0\" x2=\"310\" y2=\"64.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-gateway-route)\"/>\u003ctext data-en=\"300\" data-ar=\"300\" x=\"290.0\" y=\"57.0\" text-anchor=\"middle\">300\u003c/text>\u003cline x1=\"270\" y1=\"58.0\" x2=\"310\" y2=\"104.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-gateway-route)\"/>\u003ctext data-en=\"200\" data-ar=\"200\" x=\"290.0\" y=\"77.0\" text-anchor=\"middle\">200\u003c/text>\u003cline x1=\"270\" y1=\"58.0\" x2=\"310\" y2=\"144.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-gateway-route)\"/>\u003ctext data-en=\"1\" data-ar=\"1\" x=\"290.0\" y=\"97.0\" text-anchor=\"middle\">1\u003c/text>\u003crect x=\"16\" y=\"40\" width=\"100\" height=\"36\" rx=\"8\" fill=\"#e7f3ec\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"HTTP :80\" data-ar=\"HTTP :80\" x=\"66.0\" y=\"62.0\" text-anchor=\"middle\">HTTP :80\u003c/text>\u003crect x=\"150\" y=\"40\" width=\"120\" height=\"36\" rx=\"8\" fill=\"#e5f2f4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"edgeheaders\" data-ar=\"ترويسات الحافة\" x=\"210.0\" y=\"62.0\" text-anchor=\"middle\">edgeheaders\u003c/text>\u003crect x=\"310\" y=\"8\" width=\"130\" height=\"32\" rx=\"8\" fill=\"#fffdf8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"auth public\" data-ar=\"مصادقة عامة\" x=\"375.0\" y=\"28.0\" text-anchor=\"middle\">auth public\u003c/text>\u003crect x=\"310\" y=\"48\" width=\"130\" height=\"32\" rx=\"8\" fill=\"#fffdf8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"reports + JWT\" data-ar=\"تقارير + JWT\" x=\"375.0\" y=\"68.0\" text-anchor=\"middle\">reports + JWT\u003c/text>\u003crect x=\"310\" y=\"88\" width=\"130\" height=\"32\" rx=\"8\" fill=\"#fffdf8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"orders + JWT\" data-ar=\"طلبات + JWT\" x=\"375.0\" y=\"108.0\" text-anchor=\"middle\">orders + JWT\u003c/text>\u003crect x=\"310\" y=\"128\" width=\"130\" height=\"32\" rx=\"8\" fill=\"#e7f3ec\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"storefront\" data-ar=\"المتجر\" x=\"375.0\" y=\"148.0\" text-anchor=\"middle\">storefront\u003c/text>\u003c/svg>"}, {"type": "p", "en": "deploy/gateway/dynamic.yaml is the Phase 10 layout: upstreams are host.docker.internal ports 8000, 8001, 8002, and the Vite port 5173. deploy/compose/dynamic.yaml is the full stack: Compose DNS names. Do not run deploy/gateway/compose.yaml at the same time as the full stack. Both publish 127.0.0.1:8080. compose.check.yaml replaces upstreams with echo_upstream.py so the live check can see which headers arrived. It does not boot Postgres or the order service.", "ar": "⁦deploy/gateway/dynamic.yaml⁩ تخطيط المرحلة 10: المنابع هي منافذ ⁦host.docker.internal⁩ أرقام 8000 و8001 و8002 ومنفذ Vite رقم 5173. ⁦deploy/compose/dynamic.yaml⁩ هو المكدس الكامل: أسماء DNS في Compose. لا تشغّل ⁦deploy/gateway/compose.yaml⁩ في نفس وقت المكدس الكامل. كلاهما ينشر ⁦127.0.0.1:8080⁩. ⁦compose.check.yaml⁩ يستبدل المنابع بـ ⁦echo_upstream.py⁩ حتى يرى الفحص الحي أي ترويسات وصلت. لا يشغّل Postgres ولا خدمة الطلبات."}, {"type": "callout", "tone": "risk", "label": {"en": "Keys", "ar": "المفاتيح"}, "en": "JWT private and public PEM files live under deploy/compose/secrets/ when generated. They are gitignored (*.pem). This page does not contain key material. create-secrets.sh and up.sh describe how they are created. The order service mounts the private key. jwt-check and reporting mount the public key. secrets.example.yaml is an example with empty placeholders and is not applied by kustomization.yaml.", "ar": "ملفا PEM الخاص والعام لـ JWT يعيشان تحت ⁦deploy/compose/secrets/⁩ عند توليدها. هما في gitignore عبر ⁦*.pem⁩. هذه الصفحة لا تحتوي مادة مفاتيح. ⁦create-secrets.sh⁩ و⁦up.sh⁩ يصفان كيفية إنشائها. خدمة الطلبات تركّب المفتاح الخاص. jwt-check والتقارير تركّبان المفتاح العام. ⁦secrets.example.yaml⁩ مثال بحقول فارغة ولا يطبّقه ⁦kustomization.yaml⁩."}]}, {"id": "compose", "title": {"en": "Docker Compose", "ar": "دوكر كومبوز"}, "blocks": [{"type": "p", "en": "The full local stack is deploy/compose/docker-compose.yml, project name commerce, one network named commerce. up.sh checks docker info, creates RSA JWT files only when missing, copies .env.example to .env when missing, fills an empty INTERNAL_SERVICE_TOKEN, then runs docker compose up -d --build. It does not delete volumes. Startup order uses healthchecks and service_completed_successfully for migrations. That still does not mean every worker is ready for traffic when the command returns.", "ar": "المكدس المحلي الكامل هو ⁦deploy/compose/docker-compose.yml⁩ باسم المشروع ⁦commerce⁩ وشبكة واحدة باسم ⁦commerce⁩. ⁦up.sh⁩ يفحص ⁦docker info⁩ وينشئ ملفات JWT من نوع RSA فقط إذا كانت مفقودة، وينسخ ⁦.env.example⁩ إلى ⁦.env⁩ إذا كان مفقوداً، ويملأ ⁦INTERNAL_SERVICE_TOKEN⁩ الفارغ، ثم يشغّل ⁦docker compose up -d --build⁩. لا يحذف الأحجام. ترتيب الإقلاع يستخدم فحوصات الصحة و⁦service_completed_successfully⁩ للهجرات. هذا لا يعني أن كل عامل جاهز للحركة عندما يعود الأمر."}, {"type": "p", "en": "Postgres services are postgres (order_db), reporting-postgres, notification-postgres, and odoo-db, all postgres:16-alpine, each with its own named volume. They are not published to the host. RabbitMQ is 3.13-management-alpine. Management UI is on 127.0.0.1:15672. AMQP stays on the network. Redis is redis:7-alpine with --save empty and --appendonly no, no host port, and no volume. Odoo UI is 127.0.0.1:8069. Grafana 127.0.0.1:3000. Prometheus 127.0.0.1:9090. Alertmanager 127.0.0.1:9093.", "ar": "خدمات Postgres هي ⁦postgres⁩ لـ ⁦order_db⁩ و⁦reporting-postgres⁩ و⁦notification-postgres⁩ و⁦odoo-db⁩، كلها ⁦postgres:16-alpine⁩، ولكل منها حجم مسمى. لا تُنشر إلى المضيف. RabbitMQ هو ⁦3.13-management-alpine⁩. واجهة الإدارة على ⁦127.0.0.1:15672⁩. AMQP يبقى على الشبكة. Redis هو ⁦redis:7-alpine⁩ مع حفظ فارغ و⁦--appendonly no⁩ وبلا منفذ مضيف وبلا حجم. واجهة أودو على ⁦127.0.0.1:8069⁩. Grafana على ⁦127.0.0.1:3000⁩. Prometheus على ⁦127.0.0.1:9090⁩. Alertmanager على ⁦127.0.0.1:9093⁩."}, {"type": "h3", "en": "Workers that are separate containers", "ar": "عمال في حاويات منفصلة"}, {"type": "ul", "items": [{"en": "order-migrate runs alembic upgrade head before order-service.", "ar": "order-migrate يشغّل alembic upgrade head قبل order-service."}, {"en": "order-outbox-publisher runs python -m order_service.infrastructure.messaging.outbox_publisher.", "ar": "order-outbox-publisher يشغّل python -m order_service.infrastructure.messaging.outbox_publisher."}, {"en": "order-inventory-consumer runs python -m order_service.infrastructure.messaging.consumer.", "ar": "order-inventory-consumer يشغّل python -m order_service.infrastructure.messaging.consumer."}, {"en": "reporting-consumer runs manage.py consume_events. notification-consumer runs python -m notification_service.consumer.", "ar": "reporting-consumer يشغّل manage.py consume_events. وnotification-consumer يشغّل python -m notification_service.consumer."}, {"en": "odoo-consumer runs python3 -m commerce_erp.consumer. odoo-publisher runs python3 -m commerce_erp.publisher.", "ar": "odoo-consumer يشغّل python3 -m commerce_erp.consumer. وodoo-publisher يشغّل python3 -m commerce_erp.publisher."}, {"en": "There is no saga-worker service in this file.", "ar": "لا توجد خدمة saga-worker في هذا الملف."}]}, {"type": "p", "en": "test_stack.py is a static test. It checks that the full stack does not use the host gateway upstream name, that published ports are localhost-only, that internal fulfillment is not a public route, that workers are separate services and the internal token is not on the frontend, and that built images are not tagged latest. It does not boot the stack.", "ar": "⁦test_stack.py⁩ اختبار ثابت. يتحقق أن المكدس الكامل لا يستخدم اسم منبع بوابة المضيف، وأن المنافذ المنشورة محلية فقط، وأن التنفيذ الداخلي ليس مساراً عاماً، وأن العمال خدمات منفصلة وأن الرمز الداخلي ليس على الواجهة، وأن الصور المبنية ليست بوسوم ⁦latest⁩. لا يشغّل المكدس."}, {"type": "diagram", "id": "compose", "en": "Compose public door and private data", "ar": "باب Compose العام والبيانات الخاصة", "note": {"en": "Only the listed host ports are published, and they are bound to 127.0.0.1. Databases have no host port.", "ar": "المنافذ المذكورة فقط تُنشر، وهي مربوطة بـ 127.0.0.1. قواعد البيانات بلا منفذ مضيف."}, "svg": "\u003csvg class=\"arch\" viewBox=\"0 0 538 192\" role=\"img\">\u003cdefs>\u003cmarker id=\"arrow-compose\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#0e4c5c\"/>\u003c/marker>\u003c/defs>\u003cline x1=\"126\" y1=\"58.0\" x2=\"170\" y2=\"38.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-compose)\"/>\u003ctext data-en=\"public API\" data-ar=\"واجهة عامة\" x=\"148.0\" y=\"44.0\" text-anchor=\"middle\">public API\u003c/text>\u003cline x1=\"126\" y1=\"58.0\" x2=\"170\" y2=\"88.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-compose)\"/>\u003ctext data-en=\"learning UI\" data-ar=\"واجهة تعليم\" x=\"148.0\" y=\"69.0\" text-anchor=\"middle\">learning UI\u003c/text>\u003cline x1=\"126\" y1=\"58.0\" x2=\"170\" y2=\"138.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-compose)\"/>\u003ctext data-en=\"dashboards\" data-ar=\"لوحات\" x=\"148.0\" y=\"94.0\" text-anchor=\"middle\">dashboards\u003c/text>\u003cline x1=\"290\" y1=\"38.0\" x2=\"360\" y2=\"58.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-compose)\"/>\u003ctext data-en=\"not published\" data-ar=\"غير منشورة\" x=\"325.0\" y=\"44.0\" text-anchor=\"middle\">not published\u003c/text>\u003crect x=\"16\" y=\"40\" width=\"110\" height=\"36\" rx=\"8\" fill=\"#e7f3ec\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"127.0.0.1\" data-ar=\"127.0.0.1\" x=\"71.0\" y=\"62.0\" text-anchor=\"middle\">127.0.0.1\u003c/text>\u003crect x=\"170\" y=\"20\" width=\"120\" height=\"36\" rx=\"8\" fill=\"#e5f2f4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"gateway :8080\" data-ar=\"البوابة :8080\" x=\"230.0\" y=\"42.0\" text-anchor=\"middle\">gateway :8080\u003c/text>\u003crect x=\"170\" y=\"70\" width=\"120\" height=\"36\" rx=\"8\" fill=\"#fffdf8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Odoo :8069\" data-ar=\"أودو :8069\" x=\"230.0\" y=\"92.0\" text-anchor=\"middle\">Odoo :8069\u003c/text>\u003crect x=\"170\" y=\"120\" width=\"130\" height=\"36\" rx=\"8\" fill=\"#eef0f8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Grafana :3000\" data-ar=\"غرافانا :3000\" x=\"235.0\" y=\"142.0\" text-anchor=\"middle\">Grafana :3000\u003c/text>\u003crect x=\"360\" y=\"40\" width=\"150\" height=\"36\" rx=\"8\" fill=\"#fbf1e4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Postgres x4\" data-ar=\"أربع بوستجريس\" x=\"435.0\" y=\"62.0\" text-anchor=\"middle\">Postgres x4\u003c/text>\u003crect x=\"360\" y=\"100\" width=\"150\" height=\"36\" rx=\"8\" fill=\"#f3eee4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"RabbitMQ\" data-ar=\"رابت\" x=\"435.0\" y=\"122.0\" text-anchor=\"middle\">RabbitMQ\u003c/text>\u003c/svg>"}, {"type": "code", "text": "bash deploy/compose/up.sh\n# stop without deleting volumes:\ndocker compose -f deploy/compose/docker-compose.yml down"}]}, {"id": "kind", "title": {"en": "Kubernetes on kind", "ar": "كوبرنيتس على kind"}, "blocks": [{"type": "p", "en": "kind is a second packaging of the same images, not a production cluster. deploy/kind/kind-config.yaml creates one control-plane node named commerce and maps container port 30080 to host 127.0.0.1:8080. Postgres, Redis, and RabbitMQ are not mapped to the host. apply.sh refuses to run without Docker, kind, and kubectl. If the cluster already exists it is not deleted. Images are built, loaded with kind load docker-image, then ConfigMaps are applied from the observability and gateway files, create-secrets.sh runs, then kubectl apply -k deploy/kind.", "ar": "kind تغليف ثانٍ لنفس الصور، وليس عنقود إنتاج. ⁦deploy/kind/kind-config.yaml⁩ ينشئ عقدة control-plane واحدة باسم ⁦commerce⁩ ويربط منفذ الحاوية 30080 بالمضيف ⁦127.0.0.1:8080⁩. Postgres وRedis وRabbitMQ لا تُربط بالمضيف. ⁦apply.sh⁩ يرفض العمل بدون Docker وkind وkubectl. إذا كان العنقود موجوداً لا يُحذف. تُبنى الصور وتُحمَّل بـ ⁦kind load docker-image⁩ ثم تُطبَّق ConfigMaps من ملفات المراقبة والبوابة، ثم ⁦create-secrets.sh⁩، ثم ⁦kubectl apply -k deploy/kind⁩."}, {"type": "p", "en": "kustomization.yaml includes namespace, configmap, storage, rbac, the data services, order, retention, reporting, notification, odoo, frontend, gateway, observability, ingress, and metrics-server. It does not include secrets.example.yaml, traefik-gateway.yaml, or traefik-ingress.yaml as Kubernetes resources. Those Traefik files are mounted by apply.sh into ConfigMaps gateway-config and ingress-config. A manifest that exists on disk is not applied unless this chain names it.", "ar": "⁦kustomization.yaml⁩ يضم فضاء الأسماء وConfigMap والتخزين وRBAC وخدمات البيانات والطلبات والاحتفاظ والتقارير والإشعارات وأودو والواجهة والبوابة والمراقبة وIngress وخادم المقاييس. لا يضم ⁦secrets.example.yaml⁩ ولا ⁦traefik-gateway.yaml⁩ ولا ⁦traefik-ingress.yaml⁩ كموارد Kubernetes. ملفا Traefik يركّبهما ⁦apply.sh⁩ داخل ConfigMaps باسم ⁦gateway-config⁩ و⁦ingress-config⁩. البيان الموجود على القرص لا يُطبَّق إلا إذا سمّته هذه السلسلة."}, {"type": "h3", "en": "Workloads that the manifests actually declare", "ar": "الأحمال التي تعلنها البيانات فعلاً"}, {"type": "ul", "items": [{"en": "Deployments, not StatefulSets: four Postgres deployments, RabbitMQ, Redis, order API (replicas 2), outbox publisher, inventory consumer, reporting, notification, Odoo and its workers, frontend, jwt-check, gateway, and the observability deployments.", "ar": "نشر Deployments لا StatefulSets: أربعة نشرات Postgres وRabbitMQ وRedis وواجهة الطلبات (نسختان) وناشر الصندوق ومستهلِك المخزون والتقارير والإشعارات وأودو وعماله والواجهة وjwt-check والبوابة ونشرات المراقبة."}, {"en": "One CronJob, order-retention, schedule 30 3 * * * UTC, concurrency Forbid, active deadline 600 seconds, command python -m order_service.infrastructure.database.retention. It is not a backup.", "ar": "مهمة مجدولة واحدة order-retention بجدول 30 3 * * * بتوقيت UTC، والتزامن Forbid، والمهلة النشطة 600 ثانية، والأمر python -m order_service.infrastructure.database.retention. ليست نسخاً احتياطياً."}, {"en": "One HPA, order-service, min 2 max 4, CPU 70 percent. It does not watch queue depth. A stuck consumer does not add pods through this object. metrics-server must be Ready or the count stays at the Deployment value.", "ar": "مقياس أفقي واحد order-service، الحد الأدنى 2 والأقصى 4، والمعالج 70 بالمئة. لا يراقب عمق الطابور. المستهلِك المتوقف لا يضيف حجيرات عبر هذا الكائن. يجب أن يكون metrics-server جاهزاً وإلا يبقى العدد عند قيمة النشر."}, {"en": "Ingress class traefik and Ingress public send path / to Service gateway port 80. The ingress controller config does not load dynamic.yaml. Route rules stay in the gateway file provider.", "ar": "صنف Ingress المسمى traefik وIngress المسمى public يرسلان المسار / إلى خدمة gateway على المنفذ 80. إعداد متحكم الدخول لا يحمّل dynamic.yaml. قواعد التوجيه تبقى في مزود ملفات البوابة."}, {"en": "Storage is a local StorageClass plus PersistentVolumes and claims for the databases and a few observability disks. Redis has no volume claim. test_manifests.py asserts that.", "ar": "التخزين صنف محلي مع PersistentVolumes ومطالبات لقواعد البيانات وبعض أقراص المراقبة. Redis بلا مطالبة حجم. test_manifests.py يؤكد ذلك."}, {"en": "Readiness for the order API is GET /health/ready, which needs order_db. Liveness and startup use GET /health/live, which answers even when Postgres is down.", "ar": "الجاهزية لواجهة الطلبات هي GET /health/ready وتحتاج order_db. الحياة والإقلاع يستخدمان GET /health/live الذي يجيب حتى لو كان Postgres متوقفاً."}]}, {"type": "diagram", "id": "kind", "en": "Kind exposure path", "ar": "مسار التعريض في kind", "note": {"en": "Host port 8080 reaches the ingress controller, which forwards to the gateway. The gateway still applies dynamic.yaml.", "ar": "منفذ المضيف 8080 يصل إلى متحكم الدخول، الذي يحوّل إلى البوابة. البوابة ما زالت تطبّق dynamic.yaml."}, "svg": "\u003csvg class=\"arch\" viewBox=\"0 0 678 142\" role=\"img\">\u003cdefs>\u003cmarker id=\"arrow-kind\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#0e4c5c\"/>\u003c/marker>\u003c/defs>\u003cline x1=\"136\" y1=\"58.0\" x2=\"180\" y2=\"58.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-kind)\"/>\u003ctext data-en=\"30080\" data-ar=\"30080\" x=\"158.0\" y=\"54.0\" text-anchor=\"middle\">30080\u003c/text>\u003cline x1=\"320\" y1=\"58.0\" x2=\"360\" y2=\"58.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-kind)\"/>\u003ctext data-en=\"path /\" data-ar=\"المسار /\" x=\"340.0\" y=\"54.0\" text-anchor=\"middle\">path /\u003c/text>\u003cline x1=\"480\" y1=\"58.0\" x2=\"520\" y2=\"34.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-kind)\"/>\u003ctext data-en=\"file routes\" data-ar=\"مسارات الملف\" x=\"500.0\" y=\"42.0\" text-anchor=\"middle\">file routes\u003c/text>\u003cline x1=\"585.0\" y1=\"52\" x2=\"585.0\" y2=\"70\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-kind)\"/>\u003ctext data-en=\"Service DNS\" data-ar=\"أسماء الخدمات\" x=\"585.0\" y=\"57.0\" text-anchor=\"middle\">Service DNS\u003c/text>\u003crect x=\"16\" y=\"40\" width=\"120\" height=\"36\" rx=\"8\" fill=\"#e7f3ec\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"127.0.0.1:8080\" data-ar=\"127.0.0.1:8080\" x=\"76.0\" y=\"62.0\" text-anchor=\"middle\">127.0.0.1:8080\u003c/text>\u003crect x=\"180\" y=\"40\" width=\"140\" height=\"36\" rx=\"8\" fill=\"#e5f2f4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Ingress public\" data-ar=\"دخول public\" x=\"250.0\" y=\"62.0\" text-anchor=\"middle\">Ingress public\u003c/text>\u003crect x=\"360\" y=\"40\" width=\"120\" height=\"36\" rx=\"8\" fill=\"#e5f2f4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"gateway\" data-ar=\"البوابة\" x=\"420.0\" y=\"62.0\" text-anchor=\"middle\">gateway\u003c/text>\u003crect x=\"520\" y=\"16\" width=\"130\" height=\"36\" rx=\"8\" fill=\"#fffdf8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"order-service\" data-ar=\"خدمة الطلبات\" x=\"585.0\" y=\"38.0\" text-anchor=\"middle\">order-service\u003c/text>\u003crect x=\"520\" y=\"70\" width=\"130\" height=\"36\" rx=\"8\" fill=\"#fbf1e4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"ClusterIP data\" data-ar=\"بيانات داخلية\" x=\"585.0\" y=\"92.0\" text-anchor=\"middle\">ClusterIP data\u003c/text>\u003c/svg>"}, {"type": "p", "en": "test_manifests.py is static. It checks that Postgres is not published, that Ingress does not publish internal routes or data stores, HPA bounds, retention limits, database hosts as Service names, that the example secret has no private key, that apply.sh does not delete a cluster, and that Redis has no volume claim. It does not create a cluster.", "ar": "⁦test_manifests.py⁩ اختبار ثابت. يتحقق أن Postgres غير منشور، وأن Ingress لا ينشر المسارات الداخلية أو مخازن البيانات، وحدود المقياس الأفقي، وحدود الاحتفاظ، وأن مضيفات قواعد البيانات أسماء خدمات، وأن السر المثال بلا مفتاح خاص، وأن ⁦apply.sh⁩ لا يحذف عنقوداً، وأن Redis بلا مطالبة حجم. لا ينشئ عنقوداً."}, {"type": "callout", "tone": "warn", "label": {"en": "Compose and kind are not the same", "ar": "Compose وkind ليسا الشيء نفسه"}, "en": "Compose runs one replica of the order API. kind starts at 2, with an HPA up to 4. Compose publishes RabbitMQ management, Odoo, Grafana, and Prometheus on localhost. kind publishes only host port 8080. Both inject the laptop database passwords from the manifests or Compose file. Those are local placeholders, not shared-environment credentials, and this page does not repeat them. The saga worker is absent from both packaging files.", "ar": "Compose يشغّل نسخة واحدة من واجهة الطلبات. kind يبدأ بنسختين مع مقياس أفقي حتى 4. Compose ينشر إدارة RabbitMQ وأودو وGrafana وPrometheus على المضيف المحلي. kind ينشر منفذ المضيف 8080 فقط. كلاهما يحقن كلمات قواعد البيانات المحلية من البيانات أو ملف Compose. هذه عناصر نائبة محلية وليست بيانات بيئة مشتركة، وهذه الصفحة لا تعيدها. عامل الساجا غائب عن ملفي التغليف."}]}, {"id": "observability", "title": {"en": "Observability", "ar": "المراقبة"}, "blocks": [{"type": "p", "en": "Prometheus scrapes application /metrics directly. The OpenTelemetry collector in deploy/observability/otel/collector.yaml has a traces pipeline only: OTLP gRPC 4317 and HTTP 4318, batched, exported to tempo:4317. A collector outage does not hide the Prometheus error rate. Order-service tracing exports only when OTEL_EXPORTER_OTLP_ENDPOINT is set. If it is empty or the collector is down, spans are dropped and the order still commits. X-Correlation-Id is not the trace id. The envelope can carry both correlation_id and traceparent.", "ar": "Prometheus يسحب ⁦/metrics⁩ من التطبيقات مباشرة. مجمّع OpenTelemetry في ⁦deploy/observability/otel/collector.yaml⁩ فيه خط آثار فقط: OTLP عبر gRPC على 4317 وHTTP على 4318، على دفعات، ويُصدَّر إلى ⁦tempo:4317⁩. تعطل المجمّع لا يخفي معدل أخطاء Prometheus. تتبع خدمة الطلبات يُصدَّر فقط إذا ضُبط ⁦OTEL_EXPORTER_OTLP_ENDPOINT⁩. إذا كان فارغاً أو المجمّع متوقفاً تُسقط الآثار والطلب ما زال يُثبَّت. ⁦X-Correlation-Id⁩ ليس معرف الأثر. الظرف يمكن أن يحمل ⁦correlation_id⁩ و⁦traceparent⁩ معاً."}, {"type": "p", "en": "Grafana provisioning loads the Prometheus datasource as default and Tempo. tracesToLogsV2 points at the Prometheus datasource uid, which is not a log store. Dashboards are file-provisioned from /var/lib/grafana/dashboards, folder Commerce, UI updates disabled. apply.sh and the Compose grafana service mount the six JSON files, so these dashboards are the ones the stack is configured to load: Platform overview, Dependencies, Order path, Outbox and broker, Payment, and Reporting lag.", "ar": "تجهيز Grafana يحمّل مصدر Prometheus كافتراضي وTempo. ⁦tracesToLogsV2⁩ يشير إلى معرف مصدر Prometheus، وهو ليس مخزن سجلات. اللوحات تُجهَّز من ملفات ⁦/var/lib/grafana/dashboards⁩ في مجلد Commerce وتحديث الواجهة معطّل. ⁦apply.sh⁩ وخدمة grafana في Compose يركّبان ملفات JSON الستة، فهذه اللوحات هي التي ضُبط المكدس لتحميلها: نظرة المنصة، والاعتماديات، ومسار الطلب، والصندوق والوسيط، والدفع، وتأخر التقارير."}, {"type": "h3", "en": "How to look at a concrete problem", "ar": "كيف تنظر إلى مشكلة محددة"}, {"type": "table", "headers": [{"en": "Question", "ar": "السؤال"}, {"en": "Start here", "ar": "ابدأ هنا"}, {"en": "What the signal can show", "ar": "ماذا يمكن أن يُظهر"}, {"en": "What it cannot show", "ar": "ماذا لا يُظهر"}], "rows": [[{"en": "An order create feels slow or failing", "ar": "إنشاء الطلب بطيء أو يفشل"}, {"en": "Order path dashboard: requests, errors, latency, orders_created", "ar": "لوحة مسار الطلب: الطلبات والأخطاء والكمون والطلبات المنشأة"}, {"en": "HTTP rate on the order service and whether creates increment", "ar": "معدل HTTP على خدمة الطلبات وهل يزيد عداد الإنشاء"}, {"en": "It does not prove the reporting row exists", "ar": "لا يثبت أن صف التقارير موجود"}], [{"en": "The broker or outbox looks stuck", "ar": "الوسيط أو الصندوق يبدو عالقاً"}, {"en": "Outbox and broker: pending, failed rows, oldest pending age, DLQ depth, queue depth", "ar": "الصندوق والوسيط: المعلق والفاشل وعمر الأقدم وعمق DLQ وعمق الطابور"}, {"en": "Pending age over 60s is alert OutboxStale. failed rows are OutboxFailed, which is not the consumer DLQ.", "ar": "عمر المعلق فوق 60 ثانية هو تنبيه OutboxStale. الصفوف الفاشلة هي OutboxFailed وليست DLQ المستهلِك."}, {"en": "A published outbox row can still be unapplied by a consumer", "ar": "صف منشور يمكن أن يبقى غير مطبَّق عند مستهلِك"}], [{"en": "Payment", "ar": "الدفع"}, {"en": "Payment dashboard, gauge payment_circuit_state", "ar": "لوحة الدفع ومقياس payment_circuit_state"}, {"en": "0 closed, 2 open. The alert fires when the gauge stays at 2.", "ar": "0 مغلق و2 مفتوح. التنبيه يطلق إذا بقي المقياس عند 2."}, {"en": "No payment provider is wired. The gauge stays 0 until the saga worker sets it.", "ar": "لا يوجد مزود دفع موصول. المقياس يبقى 0 حتى يضبطه عامل الساجا."}], [{"en": "Reporting looks behind", "ar": "التقارير تبدو متأخرة"}, {"en": "Reporting lag dashboard and recording rule projection_lag_versions", "ar": "لوحة تأخر التقارير وقاعدة التسجيل projection_lag_versions"}, {"en": "Difference of orders_max_version and projection_max_version, plus q.reporting.projection depth", "ar": "فرق orders_max_version وprojection_max_version مع عمق q.reporting.projection"}, {"en": "Reporting does not read order_db. The gap is two gauges, not a join.", "ar": "التقارير لا تقرأ order_db. الفجوة مقياسان وليست ربطاً."}]]}, {"type": "p", "en": "Alertmanager has one receiver, a webhook to http://alert-webhook:8080/hook, grouped by alertname. deploy/observability/webhook/hook.py reads the Alertmanager JSON and prints one JSON line per alert to stdout. It does not send email and does not call out of the process. RabbitMQ plugins enabled in the mounted file are rabbitmq_management and rabbitmq_prometheus. Prometheus scrapes rabbitmq:15692 for coarse metrics and queue families queue_coarse_metrics and queue_consumer_count.", "ar": "Alertmanager له مستقبِل واحد، خطاف إلى ⁦http://alert-webhook:8080/hook⁩، مجمّع حسب ⁦alertname⁩. ⁦deploy/observability/webhook/hook.py⁩ يقرأ JSON من Alertmanager ويطبع سطراً JSON لكل تنبيه إلى المخرج القياسي. لا يرسل بريداً ولا يتصل خارج العملية. إضافات RabbitMQ في الملف المركّب هي ⁦rabbitmq_management⁩ و⁦rabbitmq_prometheus⁩. Prometheus يسحب ⁦rabbitmq:15692⁩ للمقاييس الخشنة وعائلات ⁦queue_coarse_metrics⁩ و⁦queue_consumer_count⁩."}, {"type": "p", "en": "Tempo stores traces locally with block retention 24h. End-to-end tracing is configured for the order path when the OTLP endpoint is set, and reporting continues traceparent on a consumed message. Do not read that as a guarantee that every service, the gateway, and Odoo appear in one trace. Gateway access logs are JSON and keep X-Correlation-Id while dropping Authorization.", "ar": "Tempo يخزن الآثار محلياً مع إبقاء الكتل 24 ساعة. التتبع من الطرف إلى الطرف مُعد لمسار الطلب عندما يُضبط طرف OTLP، والتقارير تكمل traceparent على الرسالة المستهلكة. لا تقرأ ذلك كضمان أن كل خدمة والبوابة وأودو تظهر في أثر واحد. سجلات وصول البوابة JSON وتُبقي X-Correlation-Id وتُسقط Authorization."}, {"type": "diagram", "id": "stores", "en": "Databases and Redis", "ar": "قواعد البيانات وريديس", "note": {"en": "Four Postgres servers. Redis is not a fifth database. Only three of the four databases have a dump script.", "ar": "أربعة خوادم Postgres. ريديس ليست قاعدة خامسة. ثلاث فقط من القواعد الأربع لها سكربت نسخ."}, "svg": "\u003csvg class=\"arch\" viewBox=\"0 0 358 236\" role=\"img\">\u003cdefs>\u003cmarker id=\"arrow-stores\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#0e4c5c\"/>\u003c/marker>\u003c/defs>\u003cline x1=\"136\" y1=\"58.0\" x2=\"180\" y2=\"24.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-stores)\"/>\u003ctext data-en=\"writes\" data-ar=\"يكتب\" x=\"158.0\" y=\"37.0\" text-anchor=\"middle\">writes\u003c/text>\u003cline x1=\"136\" y1=\"58.0\" x2=\"180\" y2=\"64.0\" stroke=\"#0e4c5c\" stroke-width=\"1.4\" marker-end=\"url(#arrow-stores)\"/>\u003ctext data-en=\"cache\" data-ar=\"ذاكرة\" x=\"158.0\" y=\"57.0\" text-anchor=\"middle\">cache\u003c/text>\u003crect x=\"16\" y=\"40\" width=\"120\" height=\"36\" rx=\"8\" fill=\"#fffdf8\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Order service\" data-ar=\"خدمة الطلبات\" x=\"76.0\" y=\"62.0\" text-anchor=\"middle\">Order service\u003c/text>\u003crect x=\"180\" y=\"8\" width=\"120\" height=\"32\" rx=\"8\" fill=\"#fbf1e4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"order_db\" data-ar=\"order_db\" x=\"240.0\" y=\"28.0\" text-anchor=\"middle\">order_db\u003c/text>\u003crect x=\"180\" y=\"48\" width=\"120\" height=\"32\" rx=\"8\" fill=\"#f3eee4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"Redis cache\" data-ar=\"ذاكرة ريديس\" x=\"240.0\" y=\"68.0\" text-anchor=\"middle\">Redis cache\u003c/text>\u003crect x=\"180\" y=\"88\" width=\"130\" height=\"32\" rx=\"8\" fill=\"#fbf1e4\" stroke=\"#1c1915\" stroke-width=\"1\"/>\u003ctext data-en=\"reporting_db\" data-ar=\"reporting_db\" x=\"245.0\" y=\"108.0\" text-anchor=\"middle\">reporting_db\u003c/text>\u003crect x=\"180\" y=\"128\" width=\"150\" height=\"32\" rx=\"8\" fill=\"#fbf1e4\" stroke=\"#
